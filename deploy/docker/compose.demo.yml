# Disposable Demo Mode stack. It never shares a project name, network, or
# volume with compose.yml, and it publishes the server on the loopback
# interface only, because Demo Mode signs every visitor in as the Owner.
#
#   make demo        build and start, seeded with the kitchen-sink scenario
#   make demo-reset  restore the scenario through the reset API
#   make demo-down   stop and delete every demo volume
name: tilecast-demo

services:
  server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: tilecast/server:demo
    environment:
      TILECAST_ENV: demo
      TILECAST_DEMO_SCENARIO: ${TILECAST_DEMO_SCENARIO:-kitchen-sink}
      TILECAST_DEMO_RESET_ON_START: ${TILECAST_DEMO_RESET_ON_START:-true}
      TILECAST_HTTP_ADDR: :8080
      TILECAST_PUBLIC_URL: http://localhost:${TILECAST_DEMO_PORT:-18080}
      # The database is reachable only on this project's private network.
      TILECAST_DATABASE_URL: postgres://tilecast@postgres:5432/tilecast_demo?sslmode=disable
      TILECAST_MDNS_ENABLED: "false"
      TILECAST_MEDIA_ROOT: /data/media
      TILECAST_FFMPEG_PATH: /usr/bin/ffmpeg
      TILECAST_FFPROBE_PATH: /usr/bin/ffprobe
      TILECAST_MEDIA_RESERVED_FREE_BYTES: "1"
      TILECAST_UPDATE_ROOT: /data/updates
      TILECAST_BACKUP_ROOT: /data/backups
      TILECAST_LOG_LEVEL: ${TILECAST_LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${TILECAST_DEMO_PORT:-18080}:8080"
    volumes:
      - demo_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tilecast_demo
      POSTGRES_USER: tilecast
      # Sample data on a private network with no published port, so there is
      # no password to keep. Never copy this to compose.yml.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - demo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tilecast -d tilecast_demo"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  demo_data:
  demo_postgres:
