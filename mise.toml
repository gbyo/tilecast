# Tilecast contributor tooling. Runtime selection only: the versions below
# match CI and the Go module files. They deliberately do not follow the
# Docker builder images (node:26, golang:1.26), which drifted ahead and
# must not be silently bumped here. Rust is pinned by
# apps/edge/rust-toolchain.toml and Java must stay 17 for the Android
# build; both are checked by make doctor.
[tools]
node = "22"
go = "1.25.7"
java = "17"
