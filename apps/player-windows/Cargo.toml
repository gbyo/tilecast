[package]
name = "tilecast-windows"
description = "Tilecast Player for Windows: the native Player Core host for Windows 10/11 PCs and tablets."
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
player-core.workspace = true
player-cas.workspace = true
player-client.workspace = true
player-state.workspace = true
player-types.workspace = true
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
clap.workspace = true
futures-util.workspace = true
image.workspace = true
jiff.workspace = true
mdns-sd.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { workspace = true, features = ["v4"] }
zip.workspace = true

[target.'cfg(windows)'.dependencies]
webview2-com.workspace = true
windows-window.workspace = true
windows-collections = "0.3.2"
windows-core.workspace = true
windows = { workspace = true, features = [
    "Foundation",
    "Foundation_Collections",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Management_Deployment",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Recovery",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
test-util = []

[dev-dependencies]
bytes.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
