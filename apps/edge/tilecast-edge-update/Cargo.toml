[package]
name = "tilecast-edge-update"
description = "The narrow root helper for Tilecast Edge updates (M10): stage, activate, confirm and roll back signed releases."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
# The systemd integration test only: crash injection through
# TILECAST_UPDATE_CRASH_AT. A release build must not enable it
# (build-edge-release.sh checks the binary).
integration-test = []

[dependencies]
async-trait.workspace = true
base64.workspace = true
clap.workspace = true
edge-ipc.workspace = true
edge-platform.workspace = true
edge-protocol.workspace = true
edge-release = { workspace = true, features = ["install"] }
rustix = { workspace = true, features = ["fs", "process", "net", "time"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "net", "time", "process", "io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
zbus.workspace = true

[dev-dependencies]
edge-release = { workspace = true, features = ["install", "test-util"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }

[lints]
workspace = true
