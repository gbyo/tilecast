[Service]
Environment=HOME=/var/cache/tilecast-renderer-selftest/home
Environment=XDG_CONFIG_HOME=/var/cache/tilecast-renderer-selftest/home/.config
Environment=WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1

ExecStart=
ExecStart=/opt/tilecast-edge/current/bin/tilecast-renderer-wpe --platform=headless --socket=/var/cache/tilecast-edge-selftest/runtime/edge.sock --media-socket=/var/cache/tilecast-edge-selftest/runtime/media.sock --runtime-dir=/opt/tilecast-edge/current/share/tilecast/renderer-web --gst-plugin-dir=/opt/tilecast-edge/current/lib/gstreamer-1.0
