# Tilecast Edge state directory. systemd also creates it from
# StateDirectory= when tilecast-edge.service starts; this entry makes it
# exist earlier, for the one-time `tilecastd import-legacy` step.
d /var/lib/tilecast-edge 0700 tilecast tilecast -
# Remote web helper data (docs/tilecast-edge-remote-web-threat-review.md §4,
# §8). Persistent website profiles per cookie policy. The service's own
# StateDirectory/CacheDirectory also create them; these entries make the
# ownership and modes explicit for the installer. /run/tilecast-web is not
# listed here: the helper unit owns it through RuntimeDirectory=, so a
# helper restart gets a fresh runtime directory and no stale frame socket
# or capability survives it.
d /var/lib/tilecast-web 0700 tilecast-web tilecast-web -
d /var/cache/tilecast-web 0700 tilecast-web tilecast-web -
