# The fixed Tilecast account (docs/tilecast-edge.md §4.1). On a machine migrated from the
# Electron player this account usually exists already as the kiosk login;
# systemd-sysusers leaves an existing account unchanged.
u tilecast - "Tilecast" /var/lib/tilecast-edge
m tilecast video
m tilecast render
m tilecast input
