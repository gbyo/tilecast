# The fixed Tilecast account (docs/tilecast-edge.md §4.1). On a machine migrated from the
# Electron player this account usually exists already as the kiosk login;
# systemd-sysusers leaves an existing account unchanged.
u tilecast - "Tilecast" /var/lib/tilecast-edge
m tilecast video
m tilecast render
m tilecast input
# Display control devices (udev/70-tilecast-display.rules). tilecastd joins
# this group through its unit; the account is deliberately not a member.
g tilecast-display -
# The isolated remote web helper (docs/tilecast-edge-remote-web-threat-review.md
# §3): a system account with no login shell, homed at its own state
# directory. The u line creates the tilecast-web group implicitly; that group
# has no sysusers members. Only tilecast-renderer.service joins it through
# SupplementaryGroups=, so only the trusted renderer can reach the helper's
# sockets. The helper's own groups are render (GPU render nodes) and audio
# (unmuted pages) and nothing else.
u tilecast-web - "Tilecast remote web" /var/lib/tilecast-web /usr/sbin/nologin
m tilecast-web render
m tilecast-web audio
