[package]
name = "tilecast-airplay"
description = "The Tilecast Edge AirPlay supervisor: starts the release's UxPlay for one single-screen session, for tilecastd only."
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
clap.workspace = true
edge-ipc.workspace = true
edge-platform.workspace = true
edge-protocol.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "net", "time", "process", "io-util", "sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true
zbus.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process", "io-util", "net"] }

[lints]
workspace = true
