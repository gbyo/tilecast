[package]
name = "webview-host"
description = "The native WebView Player host shared by the Windows and macOS Players: Player Core composition, Runtime projection, and the renderer port. No OS APIs."
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
player-core.workspace = true
player-cas.workspace = true
player-client.workspace = true
player-state.workspace = true
player-types.workspace = true
plugin-native-registry = { path = "../../packages/plugin-native-registry" }
anyhow.workspace = true
async-trait.workspace = true
image.workspace = true
jiff.workspace = true
mdns-sd.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }

# Shared integration scenarios for the platform crates (`testing`).
bytes = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[features]
test-util = ["dep:bytes", "dep:http-body-util", "dep:hyper", "dep:hyper-util", "dep:tempfile"]

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
