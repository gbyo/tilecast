[package]
name = "player-client"
description = "Portable native Player HTTP/WebSocket client with installation identity verification."
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
player-types.workspace = true
futures-util.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(target_os = "android")'.dependencies]
# Platform TrustManager decisions for Rust networking on Android. Linux and
# macOS keep the static root configuration below.
rustls-platform-verifier.workspace = true

[dev-dependencies]
player-types = { workspace = true, features = ["test-util"] }
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true
tempfile.workspace = true
uuid = { workspace = true, features = ["v4"] }

[lints]
workspace = true
