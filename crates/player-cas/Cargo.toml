[package]
name = "player-cas"
description = "Native Tilecast Player content-addressed store: verified immutable blobs, resumable partials, pins, eviction and source fallback."
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
player-types.workspace = true
player-state.workspace = true
futures-util.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "sync", "rt", "time"] }
tracing.workspace = true

[dev-dependencies]
player-types = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }

[lints]
workspace = true
