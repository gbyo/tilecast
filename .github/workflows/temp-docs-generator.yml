name: Temporary docs generator

on:
  push:
    branches:
      - docs/operator-guide-expansion

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate content reference
        run: npm run generate:content-reference --workspace @tilecast/docs
      - name: Format docs
        run: npx prettier --write apps/docs
      - name: Commit generated docs
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/docs
          git commit -m "docs: generate and format operator reference"
          git push origin HEAD:docs/operator-guide-expansion
