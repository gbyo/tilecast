name: Temporary docs formatter

on:
  push:
    branches:
      - docs/edge-and-product-coverage

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed docs
        run: |
          npx prettier --write             apps/docs/astro.config.mjs             apps/docs/src/content/docs/edge.mdx             apps/docs/src/content/docs/edge/capabilities.mdx             apps/docs/src/content/docs/operations/plugins.mdx             apps/docs/src/content/docs/operations/snapshot-history.mdx             apps/docs/src/content/docs/players.md             apps/docs/src/content/docs/players/install-linux.mdx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/docs
          git commit -m "docs: format expanded guide"
          git push origin HEAD:docs/edge-and-product-coverage
