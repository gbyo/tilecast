name: Vega CSS format helper

on:
  push:
    branches:
      - codex/studio-vega-theme-scope-fix

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/studio-vega-theme-scope-fix
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/dashboard/src/styles/shadcn.css
      - name: Commit formatting
        run: |
          if git diff --quiet -- apps/dashboard/src/styles/shadcn.css; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/dashboard/src/styles/shadcn.css
          git commit -m "style: format Vega theme bridge"
          git push origin HEAD:codex/studio-vega-theme-scope-fix
