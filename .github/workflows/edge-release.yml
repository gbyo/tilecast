name: Tilecast Edge Release

# Builds signed Tilecast Edge releases, one per architecture: the private
# WPE WebKit build, the renderer, the Rust binaries and the Player Runtime,
# on the pinned Debian 13 builder (apps/edge/release/Dockerfile.builder).
# Each architecture builds natively on its own runner; emulation is never
# ARM64 support. It uploads the artifacts and their build provenance
# attestation. Publishing a GitHub release is a separate, human step.
#
# WPE WebKit arrives in three tiers: the published immutable prebuild
# (wpe-prebuild.yml), the best-effort CI cache, then a from-scratch
# compile. A missing prebuild slows a release but never blocks it.
on:
  workflow_dispatch:
    inputs:
      verify_reproducible:
        description: Build the tree a second time and require identical file digests
        required: false
        default: true
        type: boolean
      channel:
        description: Update channel in the signed envelope; beta for a GitHub prerelease
        required: false
        default: stable
        type: choice
        options:
          - stable
          - beta

permissions:
  contents: read

concurrency:
  group: edge-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Fetch prebuilt WPE WebKit
        id: wpe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/edge-release-cache"
          echo "key=$(python3 apps/edge/release/inputs.py wpe-key)" >> "$GITHUB_OUTPUT"
          tag=$(python3 apps/edge/release/inputs.py wpe-tag '${{ matrix.arch }}')
          tar=$(python3 apps/edge/release/inputs.py wpe-tar '${{ matrix.arch }}')
          if gh release download "$tag" --pattern "$tar" --dir "$RUNNER_TEMP/edge-release-cache"; then
            echo "prebuilt WPE WebKit $tag restored"
          else
            echo "no prebuilt WPE WebKit $tag; falling back to the CI cache or a from-scratch compile" >&2
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build --workspace @tilecast/player-runtime

      - name: Require signing secrets
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.TILECAST_UPDATE_MANIFEST_PRIVATE_KEY_PEM }}
          UPDATE_PUBLIC_KEY: ${{ secrets.TILECAST_UPDATE_MANIFEST_PUBLIC_KEY_PEM }}
        run: |
          set -euo pipefail
          for name in UPDATE_PRIVATE_KEY UPDATE_PUBLIC_KEY; do
            if [ -z "${!name}" ]; then
              echo "Required signing secret for $name is missing." >&2
              exit 1
            fi
          done

      - name: Materialize ephemeral signing files
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.TILECAST_UPDATE_MANIFEST_PRIVATE_KEY_PEM }}
          UPDATE_PUBLIC_KEY: ${{ secrets.TILECAST_UPDATE_MANIFEST_PUBLIC_KEY_PEM }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/tilecast-signing"
          printf '%s' "$UPDATE_PRIVATE_KEY" > "$RUNNER_TEMP/tilecast-signing/update-private.pem"
          printf '%s' "$UPDATE_PUBLIC_KEY" > "$RUNNER_TEMP/tilecast-signing/update-public.pem"
          chmod 600 "$RUNNER_TEMP/tilecast-signing/"*
          # The public key the screens trust must be the one in the repository.
          test "$(openssl pkey -pubin -in "$RUNNER_TEMP/tilecast-signing/update-public.pem" -outform DER | base64 -w0)" = \
               "$(openssl pkey -pubin -in apps/edge/release/tilecast-update-key.pem -outform DER | base64 -w0)"

      - name: Build the release builder image
        run: docker build -t tilecast-edge-release-builder -f apps/edge/release/Dockerfile.builder apps/edge/release

      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/edge-release-cache/wpe-*.tar
          # The architecture is part of the key: a WPE build for the other
          # architecture must never be restored into this build. The inputs
          # key ignores comments and whitespace, as the builder itself does.
          key: edge-wpe-${{ matrix.arch }}-${{ steps.wpe.outputs.key }}

      - name: Build, sign and package
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/edge-release-cache" "$RUNNER_TEMP/edge-release"
          docker run --rm -v "$PWD:/src" -v "$RUNNER_TEMP/edge-release-cache:/cache" \
            -v "$RUNNER_TEMP/edge-release:/out" -v "$RUNNER_TEMP/tilecast-signing:/keys:ro" \
            -e TILECAST_UPDATE_MANIFEST_PRIVATE_KEY=/keys/update-private.pem \
            -e TILECAST_UPDATE_MANIFEST_PUBLIC_KEY_FILE=/keys/update-public.pem \
            -e TILECAST_EDGE_CHANNEL="$CHANNEL" \
            tilecast-edge-release-builder /src/apps/edge/release/build-edge-release.sh

      - name: Rebuild and compare every file digest
        if: ${{ inputs.verify_reproducible }}
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/edge-release-again"
          docker run --rm -v "$PWD:/src" -v "$RUNNER_TEMP/edge-release-cache:/cache" \
            -v "$RUNNER_TEMP/edge-release-again:/out" -e TILECAST_EDGE_CHANNEL="$CHANNEL" \
            tilecast-edge-release-builder bash -c 'rm -rf /cache/cargo /cache/renderer && /src/apps/edge/release/build-edge-release.sh'
          jq -S '.files' "$RUNNER_TEMP/edge-release/tree/tilecast-edge-release.json" > "$RUNNER_TEMP/first.json"
          jq -S '.files' "$RUNNER_TEMP/edge-release-again/tree/tilecast-edge-release.json" > "$RUNNER_TEMP/second.json"
          diff -u "$RUNNER_TEMP/first.json" "$RUNNER_TEMP/second.json"

      - name: Remove ephemeral signing files
        if: always()
        run: rm -rf "$RUNNER_TEMP/tilecast-signing"

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ runner.temp }}/edge-release/tilecast-edge-*.tar.zst
            ${{ runner.temp }}/edge-release/tilecast-edge-*.json

      - uses: actions/upload-artifact@v7
        with:
          name: tilecast-edge-release-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/edge-release/tilecast-edge-*
            ${{ runner.temp }}/edge-release/SHA256SUMS
          if-no-files-found: error
