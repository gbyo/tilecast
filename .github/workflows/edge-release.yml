name: Tilecast Edge Release

# Builds signed Tilecast Edge release artifacts, one per architecture: the
# private WPE WebKit build, the renderer, the Rust binaries and the Player
# Runtime, on the pinned Debian 13 builder (apps/edge/release/
# Dockerfile.builder). Each architecture builds natively on its own runner;
# emulation is never ARM64 support. It uploads the artifacts and their build
# provenance attestation as temporary Actions artifacts. It never publishes:
# the coordinated release (release.yml) calls it, assembles every platform
# into one draft GitHub release, verifies it, and publishes it once.
#
# Run on its own (workflow_dispatch) it is a release-candidate build check: it
# builds whatever version the checkout carries, or stamps release_version when
# one is given, and publishes nothing.
#
# WPE WebKit arrives in three tiers: the immutable GHCR prebuild
# (wpe-prebuild.yml), the best-effort CI cache, then a from-scratch compile. A
# missing or rejected prebuild slows a release but never blocks it.
on:
  workflow_call:
    inputs:
      release_version:
        description: Coordinated release version to stamp, for example 0.26.0-beta.1
        required: true
        type: string
      channel:
        description: Update channel in the signed envelope
        required: true
        type: string
      arches:
        description: JSON list of architectures to build
        required: false
        default: '["x86_64","aarch64"]'
        type: string
      verify_reproducible:
        description: Build the tree a second time and require identical file digests
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      release_version:
        description: Optional coordinated release version to stamp; the checkout's own version when empty
        required: false
        default: ""
        type: string
      verify_reproducible:
        description: Build the tree a second time and require identical file digests
        required: false
        default: true
        type: boolean
      channel:
        description: Update channel in the signed envelope; beta for a GitHub prerelease
        required: false
        default: stable
        type: choice
        options:
          - stable
          - beta

permissions:
  contents: read

concurrency:
  group: edge-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: true
      matrix:
        arch: ${{ fromJSON(inputs.arches || '["x86_64","aarch64"]') }}
    # Native builds on native runners; emulation is never ARM64 support.
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Stamp the release version
        if: inputs.release_version != ''
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: python3 scripts/release/stamp_version.py --version "$RELEASE_VERSION"

      - uses: oras-project/setup-oras@v2
        with:
          version: 1.3.4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch prebuilt WPE WebKit
        id: wpe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/edge-release-cache"
          echo "key=$(python3 apps/edge/release/inputs.py wpe-key)" >> "$GITHUB_OUTPUT"
          # Exit 1 is "no prebuild", 2 is "a prebuild that failed a check". Both
          # fall back to the CI cache and then to compiling WebKit.
          if apps/edge/release/fetch-wpe-prebuild.sh '${{ matrix.arch }}' "$RUNNER_TEMP/edge-release-cache"; then
            echo "prebuilt WPE WebKit restored from GHCR"
          else
            echo "no usable prebuilt WPE WebKit; falling back to the CI cache or a from-scratch compile" >&2
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build --workspace @tilecast/player-runtime

      - name: Require signing secrets
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.TILECAST_UPDATE_MANIFEST_PRIVATE_KEY_PEM }}
          UPDATE_PUBLIC_KEY: ${{ secrets.TILECAST_UPDATE_MANIFEST_PUBLIC_KEY_PEM }}
        run: |
          set -euo pipefail
          for name in UPDATE_PRIVATE_KEY UPDATE_PUBLIC_KEY; do
            if [ -z "${!name}" ]; then
              echo "Required signing secret for $name is missing." >&2
              exit 1
            fi
          done

      - name: Materialize ephemeral signing files
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.TILECAST_UPDATE_MANIFEST_PRIVATE_KEY_PEM }}
          UPDATE_PUBLIC_KEY: ${{ secrets.TILECAST_UPDATE_MANIFEST_PUBLIC_KEY_PEM }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/tilecast-signing"
          printf '%s' "$UPDATE_PRIVATE_KEY" > "$RUNNER_TEMP/tilecast-signing/update-private.pem"
          printf '%s' "$UPDATE_PUBLIC_KEY" > "$RUNNER_TEMP/tilecast-signing/update-public.pem"
          chmod 600 "$RUNNER_TEMP/tilecast-signing/"*
          # The public key the screens trust must be the one in the repository.
          test "$(openssl pkey -pubin -in "$RUNNER_TEMP/tilecast-signing/update-public.pem" -outform DER | base64 -w0)" = \
               "$(openssl pkey -pubin -in apps/edge/release/tilecast-update-key.pem -outform DER | base64 -w0)"

      - name: Build the release builder image
        run: docker build -t tilecast-edge-release-builder -f apps/edge/release/Dockerfile.builder apps/edge/release

      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/edge-release-cache/wpe-*.tar
          # The architecture is part of the key: a WPE build for the other
          # architecture must never be restored into this build. The inputs
          # key ignores comments and whitespace, as the builder itself does.
          key: edge-wpe-${{ matrix.arch }}-${{ steps.wpe.outputs.key }}

      - name: Build, sign and package
        env:
          CHANNEL: ${{ inputs.channel || 'stable' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/edge-release-cache" "$RUNNER_TEMP/edge-release"
          docker run --rm -v "$PWD:/src" -v "$RUNNER_TEMP/edge-release-cache:/cache" \
            -v "$RUNNER_TEMP/edge-release:/out" -v "$RUNNER_TEMP/tilecast-signing:/keys:ro" \
            -e TILECAST_UPDATE_MANIFEST_PRIVATE_KEY=/keys/update-private.pem \
            -e TILECAST_UPDATE_MANIFEST_PUBLIC_KEY_FILE=/keys/update-public.pem \
            -e TILECAST_EDGE_CHANNEL="$CHANNEL" \
            tilecast-edge-release-builder /src/apps/edge/release/build-edge-release.sh

      - name: The release reports the stamped version
        if: inputs.release_version != ''
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/edge-release"
          test "$(jq -er .versionName "$out/tree/tilecast-edge-release.json")" = "$RELEASE_VERSION"
          test "$(jq -er .versionName "$out/tilecast-edge-update-${{ matrix.arch }}.json")" = "$RELEASE_VERSION"
          test "$(jq -er .versionCode "$out/tilecast-edge-update-${{ matrix.arch }}.json")" = "$(python3 scripts/release/release_version.py code "$RELEASE_VERSION")"

      - name: Require user namespaces for the sandbox check
        # The kernel check that Ubuntu 24.04 runners apply to unconfined
        # programs also applies to WebKit's bubblewrap sandbox in the check
        # below.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: The release closes over its runtime libraries
        # A clean Debian 13 with only the operating system baseline
        # (apps/edge/release/system-baseline.txt) and no WPE package, which
        # the builder cannot show: it has the -dev packages that hide a
        # missing library. Every ELF file in the tree must resolve. Failing
        # this fails the release.
        run: apps/edge/release/run-closure-check.sh "$RUNNER_TEMP/edge-release/tree"

      - name: The release passes its self-test under the production sandbox
        # Real systemd, the release's own units and WebKit's bubblewrap
        # sandbox on, nothing that disables it.
        run: apps/edge/release/run-sandbox-check.sh "$RUNNER_TEMP/edge-release/tree"

      - name: Rebuild and compare every file digest
        if: ${{ inputs.verify_reproducible }}
        env:
          CHANNEL: ${{ inputs.channel || 'stable' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/edge-release-again"
          docker run --rm -v "$PWD:/src" -v "$RUNNER_TEMP/edge-release-cache:/cache" \
            -v "$RUNNER_TEMP/edge-release-again:/out" -e TILECAST_EDGE_CHANNEL="$CHANNEL" \
            tilecast-edge-release-builder bash -c 'rm -rf /cache/cargo /cache/renderer && /src/apps/edge/release/build-edge-release.sh'
          jq -S '.files' "$RUNNER_TEMP/edge-release/tree/tilecast-edge-release.json" > "$RUNNER_TEMP/first.json"
          jq -S '.files' "$RUNNER_TEMP/edge-release-again/tree/tilecast-edge-release.json" > "$RUNNER_TEMP/second.json"
          diff -u "$RUNNER_TEMP/first.json" "$RUNNER_TEMP/second.json"

      - name: Remove ephemeral signing files
        if: always()
        run: rm -rf "$RUNNER_TEMP/tilecast-signing"

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ runner.temp }}/edge-release/tilecast-edge-*.tar.zst
            ${{ runner.temp }}/edge-release/tilecast-edge-*.json

      - uses: actions/upload-artifact@v7
        with:
          name: tilecast-edge-release-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/edge-release/tilecast-edge-*
            ${{ runner.temp }}/edge-release/SHA256SUMS
          if-no-files-found: error
