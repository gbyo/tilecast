name: validate-data-sources

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label used by this validation job.
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  validate:
    name: Data Sources
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data-sources:check
