name: validate-data-sources

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Data Sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data-sources:check
