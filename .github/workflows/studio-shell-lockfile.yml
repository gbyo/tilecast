name: Studio shell lockfile helper

on:
  push:
    branches:
      - codex/studio-base-vega-shell

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/studio-base-vega-shell
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Refresh npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh npm lockfile for Studio shell"
          git push origin HEAD:codex/studio-base-vega-shell
