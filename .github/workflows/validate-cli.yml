name: CLI and MCP validation
on:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    name: CLI and MCP
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: |
            apps/cli/go.sum
            packages/api-client/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install contract generator dependencies
        working-directory: .
        run: npm ci
      - name: Verify generated API contracts
        working-directory: .
        run: make generated-check
      - run: go vet ./... github.com/tilecast/tilecast/packages/api-client/...
      - run: go test -coverprofile=coverage.out ./... github.com/tilecast/tilecast/packages/api-client/...
      - run: go build ./cmd/tilecast
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: cli-coverage
          path: apps/cli/coverage.out
