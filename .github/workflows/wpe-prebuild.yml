name: Tilecast WPE Prebuild

# Compiles the pinned WPE WebKit once per (version, builder inputs,
# architecture) and publishes the deterministic tar to GitHub Packages as an
# immutable OCI artifact, ghcr.io/gbyo/tilecast-wpe, so Edge releases pull
# WebKit instead of recompiling it (~2h). The artifact is a single tar layer
# under a Tilecast artifact type; it is not a runnable container image. It
# replaces the architecture-specific GitHub Releases this workflow used to
# create (docs/release-process.md).
#
# The Edge release workflow falls back to the CI cache and then to a
# from-scratch compile, so a missing prebuild slows a release but never blocks
# it. The prebuild carries a GitHub build provenance attestation for the tar,
# and fetch-wpe-prebuild.sh verifies it before the release uses the bytes.
on:
  push:
    branches:
      - main
    paths:
      - apps/edge/release/Dockerfile.builder
      - apps/edge/release/build-wpe.sh
      - apps/edge/release/build-edge-release.sh
      - apps/edge/release/inputs.py
      - apps/edge/release/prebuild-wpe.sh
      - apps/edge/release/publish-wpe-prebuild.sh
      - apps/edge/release/fetch-wpe-prebuild.sh
      - .github/workflows/wpe-prebuild.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prebuild:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    concurrency:
      group: wpe-prebuild-${{ matrix.arch }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: oras-project/setup-oras@v2
        with:
          version: 1.3.4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the prebuild reference
        id: prebuild
        run: |
          set -euo pipefail
          echo "ref=$(python3 apps/edge/release/inputs.py wpe-ref '${{ matrix.arch }}')" >> "$GITHUB_OUTPUT"
          echo "tar=$(python3 apps/edge/release/inputs.py wpe-tar '${{ matrix.arch }}')" >> "$GITHUB_OUTPUT"

      - name: Skip when the prebuild already exists
        id: exists
        run: |
          set -euo pipefail
          if oras manifest fetch --descriptor '${{ steps.prebuild.outputs.ref }}' >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the release builder image
        if: steps.exists.outputs.published != 'true'
        run: docker build -t tilecast-edge-release-builder -f apps/edge/release/Dockerfile.builder apps/edge/release

      - name: Compile WPE WebKit and pack the tar
        if: steps.exists.outputs.published != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wpe-prebuild"
          docker run --rm -v "$PWD:/src" -v "$RUNNER_TEMP/wpe-prebuild:/out" \
            tilecast-edge-release-builder /src/apps/edge/release/prebuild-wpe.sh "/out/${{ steps.prebuild.outputs.tar }}"

      - uses: actions/attest-build-provenance@v4
        if: steps.exists.outputs.published != 'true'
        with:
          subject-path: |
            ${{ runner.temp }}/wpe-prebuild/${{ steps.prebuild.outputs.tar }}

      - name: Publish the immutable prebuild
        id: publish
        if: steps.exists.outputs.published != 'true'
        run: apps/edge/release/publish-wpe-prebuild.sh "$RUNNER_TEMP/wpe-prebuild/${{ steps.prebuild.outputs.tar }}" '${{ matrix.arch }}'

      # Provenance for the registry object as well, stored beside it. The
      # release build verifies the tar's own attestation above.
      - uses: actions/attest-build-provenance@v4
        if: steps.exists.outputs.published != 'true' && steps.publish.outputs.digest != ''
        with:
          subject-name: ghcr.io/gbyo/tilecast-wpe
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
