name: validate-plugins

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label used by this validation job.
        type: string
        default: ubuntu-latest

permissions:
  contents: read
  checks: write

jobs:
  validate:
    name: Plugin conformance
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check plugins and generated files
        run: npm run plugins:check
      - name: Test the plugin SDK and pluginctl
        run: npm test --workspace @tilecast/plugin-sdk
      - name: Lint the composed OpenAPI contract
        run: npm run openapi:lint
      - name: Check OpenAPI backward compatibility
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA" || true
          fi
          npm run openapi:compat
