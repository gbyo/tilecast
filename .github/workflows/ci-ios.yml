name: ci-ios

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: iOS CI
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Validate runner
        run: |
          xcodebuild -version
          echo "DERIVED_DATA=$RUNNER_TEMP/DerivedData" >> "$GITHUB_ENV"
