name: Studio shell format helper

on:
  push:
    branches:
      - codex/studio-base-vega-shell

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/studio-base-vega-shell
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format Studio shell files
        run: |
          npx prettier --write             apps/dashboard/src/components/AppSidebar.tsx             apps/dashboard/src/components/ui/button.tsx             apps/dashboard/src/components/ui/collapsible.tsx             apps/dashboard/src/components/ui/dropdown-menu.tsx             apps/dashboard/src/components/ui/input.tsx             apps/dashboard/src/components/ui/separator.tsx             apps/dashboard/src/components/ui/sheet.tsx             apps/dashboard/src/components/ui/sidebar.tsx             apps/dashboard/src/components/ui/skeleton.tsx             apps/dashboard/src/components/ui/tooltip.tsx             apps/dashboard/src/hooks/use-mobile.ts             apps/dashboard/src/pages/Dashboard.test.tsx             apps/dashboard/src/pages/Dashboard.tsx             apps/dashboard/src/styles/shadcn-vega.css             apps/dashboard/src/styles/shadcn.css             apps/dashboard/tsconfig.app.json             apps/dashboard/tsconfig.json
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/dashboard
          git commit -m "style: format Studio Base UI shell"
          git push origin HEAD:codex/studio-base-vega-shell
