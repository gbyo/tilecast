name: validate-player-core

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Shared Player Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The shared crates build and test on every host OS and CPU the
        # native players ship on; OS-specific code must fail here, loudly.
        os:
          [
            ubuntu-latest,
            ubuntu-24.04-arm,
            macos-latest,
            windows-latest,
            windows-11-arm,
          ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: player-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: python3 scripts/ci/check-player-architecture.py
      - run: bash scripts/ci/cargo-player.sh fmt --check
      - run: bash scripts/ci/cargo-player.sh clippy --all-targets --all-features -- -D warnings
      - run: bash scripts/ci/cargo-player.sh test --all-features
      - run: bash scripts/ci/cargo-player.sh doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
