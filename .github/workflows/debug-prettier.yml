name: Debug Prettier

on:
  push:
    branches:
      - gibby/fix-layout-preview-popup-ci

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Show Prettier diff
        run: |
          npx prettier --write apps/dashboard/src/pages/LayoutPreviewPage.tsx
          git diff -- apps/dashboard/src/pages/LayoutPreviewPage.tsx
