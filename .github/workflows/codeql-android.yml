name: Android CodeQL

on:
  # Every relevant pull request, including one stacked on another PR's branch.
  pull_request:
    paths:
      - "apps/player-android/**"
      - ".github/workflows/codeql-android.yml"
  push:
    branches: [main]
    paths:
      - "apps/player-android/**"
      - ".github/workflows/codeql-android.yml"
  schedule:
    - cron: "43 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  packages: read
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect Android changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            apps/player-android \
            .github/workflows/codeql-android.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Java
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Android SDK
        if: steps.changes.outputs.changed == 'true'
        uses: android-actions/setup-android@v4
      - name: Set up Node
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Build shared Player Runtime
        if: steps.changes.outputs.changed == 'true'
        run: npm ci && npm run build --workspace @tilecast/player-runtime
      # The Gradle build compiles the native Player Core host with cargo-ndk.
      - name: Set up Rust
        if: steps.changes.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-ndk and Android targets
        if: steps.changes.outputs.changed == 'true'
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Restore pinned NDK
        if: steps.changes.outputs.changed == 'true'
        id: ndk-cache
        uses: actions/cache@v6
        with:
          # Must match tilecastNdkVersion in app/build.gradle.kts.
          path: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
          key: android-ndk-29.0.14206865
      - name: Install pinned NDK
        if: steps.changes.outputs.changed == 'true' && steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "ndk;29.0.14206865"
      - name: Initialize CodeQL
        if: steps.changes.outputs.changed == 'true'
        uses: github/codeql-action/init@v4.38.2
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Build Android player
        if: steps.changes.outputs.changed == 'true'
        working-directory: apps/player-android
        # CodeQL must see compiler execution; cached outputs bypass it.
        run: ./gradlew --no-build-cache clean assembleDebug
      - name: Analyze
        if: steps.changes.outputs.changed == 'true'
        uses: github/codeql-action/analyze@v4.38.2
        with:
          category: "/language:java-kotlin"
      - name: Create unaffected result
        if: steps.changes.outputs.changed == 'false'
        run: |
          cat > unaffected.sarif <<'EOF'
          {
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "version": "2.1.0",
            "runs": [{
              "tool": {"driver": {"name": "CodeQL", "version": "0.0.0", "rules": []}},
              "results": []
            }]
          }
          EOF
      - name: Upload unaffected result
        if: steps.changes.outputs.changed == 'false'
        uses: github/codeql-action/upload-sarif@v4.38.2
        with:
          sarif_file: unaffected.sarif
          category: "/language:java-kotlin"
