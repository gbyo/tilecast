name: Tilecast Server Image Release

# The Server container image of a coordinated release. It never creates a
# GitHub release and is not triggered by a tag: release.yml calls it twice.
#
#   stage: build    build the container once, publish only the immutable
#                   version tag (X.Y.Z or X.Y.Z-beta.N) and report its digest D.
#   stage: promote  point the moving aliases at D, after the GitHub release
#                   that records D has been published.
#
# Staged so a failure can never leave an alias pointing at an unreleased build:
#   1. build and publish only the immutable version tag;
#   2. resolve and verify the published digest D;
#   3. (release.yml) assemble, verify and publish the one GitHub release, which
#      records D in tilecast-release.json and its notes;
#   4. create the aliases from D, never from the mutable version tag.
# If alias promotion fails after the release is published, the aliases stay on
# the previous release; rerunning the coordinated release recovers D from the
# published release and resumes at promotion instead of rebuilding.
#
# Aliases (release.yml decides which a release may move, so none moves
# backwards): stable and latest name the newest Stable release; beta names the
# newest release of either kind. Only this workflow moves them. server-image.yml
# publishes Development images from main and never touches them.
on:
  workflow_call:
    inputs:
      stage:
        description: build or promote
        required: true
        type: string
      version:
        description: Release version without the leading v, for example 0.26.0-beta.1
        required: true
        type: string
      channel:
        description: stable or beta
        required: true
        type: string
      existing_digest:
        description: build only. The digest an earlier run recorded; the image is not rebuilt
        required: false
        default: ""
        type: string
      digest:
        description: promote only. The verified digest the aliases will name
        required: false
        default: ""
        type: string
      aliases:
        description: promote only. JSON list of the aliases to move
        required: false
        default: "[]"
        type: string
    outputs:
      digest:
        description: The verified digest of the published version tag
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gbyo/tilecast-server

jobs:
  build:
    if: inputs.stage == 'build'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.verify.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A version tag is immutable. A run resumes from the digest an earlier
      # run recorded; failing that, from a tag an interrupted run published
      # for this very commit. A tag from any other commit is never reused.
      - name: Resolve an image that is already published
        id: existing
        env:
          RECORDED_DIGEST: ${{ inputs.existing_digest }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          image="$REGISTRY/$IMAGE_NAME"
          digest=""
          if [ -n "$RECORDED_DIGEST" ]; then
            if ! [[ "$RECORDED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "The recorded digest has an unexpected shape: $RECORDED_DIGEST" >&2
              exit 1
            fi
            docker buildx imagetools inspect "$image@$RECORDED_DIGEST" >/dev/null
            digest="$RECORDED_DIGEST"
            echo "Resuming with the recorded image $digest."
          elif raw="$(docker buildx imagetools inspect --raw "$image:$RELEASE_VERSION" 2>/dev/null)"; then
            revision="$(printf '%s' "$raw" | jq -r '.annotations["org.opencontainers.image.revision"] // ""')"
            published="$(printf '%s' "$raw" | jq -r '.annotations["org.opencontainers.image.version"] // ""')"
            if [ "$revision" != "$GITHUB_SHA" ] || [ "$published" != "$RELEASE_VERSION" ]; then
              echo "$image:$RELEASE_VERSION already exists from another build (commit '${revision:-unknown}')." >&2
              echo "A version tag is immutable. Delete that package version or choose a new version." >&2
              exit 1
            fi
            digest="$(docker buildx imagetools inspect "$image:$RELEASE_VERSION" --format '{{json .Manifest}}' | jq -er .digest)"
            echo "Adopting the image an interrupted run published for this commit: $digest."
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        if: steps.existing.outputs.digest == ''
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.version }}
          labels: |
            org.opencontainers.image.title=Tilecast Server
            org.opencontainers.image.description=Self-hosted Tilecast server and Studio dashboard
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          annotations: |
            org.opencontainers.image.title=Tilecast Server
            org.opencontainers.image.description=Self-hosted Tilecast server and Studio dashboard
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      # Stage 1: publish only the immutable versioned tag. No alias moves.
      - name: Build and publish the versioned image once
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION_NUMBER=${{ inputs.version }}
            VERSION_CHANNEL=${{ inputs.channel }}
            VERSION_COMMIT=${{ github.sha }}
            VERSION_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # Stage 2: resolve and verify the published digest. The digest becomes a
      # step output so promotion consumes exactly what was verified.
      - name: Verify the published versioned image
        id: verify
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
        run: |
          set -euo pipefail
          image="$REGISTRY/$IMAGE_NAME"
          manifest="$(docker buildx imagetools inspect "$image:$RELEASE_VERSION" --format '{{json .Manifest}}')"
          test -n "$manifest"
          digest="$(printf '%s' "$manifest" | jq -er .digest)"
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Verified digest has an unexpected shape: ${digest:-<empty>}." >&2
            exit 1
          fi
          if [ -n "$EXISTING_DIGEST" ] && [ "$digest" != "$EXISTING_DIGEST" ]; then
            echo "The version tag names $digest, not the recorded $EXISTING_DIGEST." >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Versioned image verified at $digest."

  promote:
    if: inputs.stage == 'promote'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Stage 4: point the aliases at the verified digest. No rebuild: this is
      # a registry-native tag operation, so an alias can only ever name the
      # already-verified, already-released artifact.
      - uses: actions/checkout@v7

      - name: Promote the verified digest to its aliases
        env:
          PROMOTE_DIGEST: ${{ inputs.digest }}
          ALIASES: ${{ inputs.aliases }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: scripts/release/promote-server-aliases.sh
