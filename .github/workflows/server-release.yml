name: Tilecast Server Release

# Stable server releases from server-vX.Y.Z tags. The tag is the
# authoritative Stable version: no source-version-bump commit is needed.
#
# Cutting a release:
#   git switch main
#   git pull --ff-only
#   git tag server-vX.Y.Z
#   git push origin server-vX.Y.Z
#
# The release is staged so a failure can never leave the Stable aliases
# pointing at an unreleased build:
#   1. build the container once and publish only the immutable X.Y.Z tag;
#   2. resolve and verify the published digest D; the GitHub Release records D;
#   3. create the GitHub Release;
#   4. create stable and latest from D, never from the mutable version tag.
# If alias promotion fails after the GitHub Release exists, Stable stays on
# the previous release; rerunning the workflow recovers D from the existing
# release and resumes at promotion instead of rebuilding.
#
# Only this workflow may move stable or latest; server-image.yml publishes
# Development images from main and never touches them.
on:
  push:
    tags:
      - "server-v*"

permissions:
  contents: read
  checks: write

# One global Stable-release lock across all tags. Per-tag groups would let
# two different Stable releases race the shared stable/latest aliases: both
# could pass the increasing-version check before either release exists, and
# the older one could finish last and move Stable backwards.
concurrency:
  group: tilecast-server-stable-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gbyo/tilecast-server

jobs:
  # The Stable shipping bundle: everything packaged into or materially
  # required by the server image. The release cannot publish until all of
  # it passes. Android, Linux Player, and Edge validation are deliberately
  # excluded: they ship separately and must not gate a server release.
  server_ci:
    uses: ./.github/workflows/ci-server.yml

  dashboard_ci:
    uses: ./.github/workflows/ci-dashboard.yml

  container_ci:
    uses: ./.github/workflows/validate-container.yml

  browser_ci:
    uses: ./.github/workflows/validate-browser.yml

  plugins_ci:
    uses: ./.github/workflows/validate-plugins.yml

  widgets_ci:
    uses: ./.github/workflows/validate-widgets.yml

  sources_ci:
    uses: ./.github/workflows/validate-data-sources.yml

  contracts_ci:
    uses: ./.github/workflows/validate-cli.yml

  release:
    needs:
      [
        server_ci,
        dashboard_ci,
        container_ci,
        browser_ci,
        plugins_ci,
        widgets_ci,
        sources_ci,
        contracts_ci,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve and validate release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          if ! [[ "$tag" =~ ^server-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use server-v<major>.<minor>.<patch> with no suffix." >&2
            exit 1
          fi
          version="${tag#server-v}"

          notes="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$tag" \
            -f target_commitish="$GITHUB_SHA" \
            --jq .body)"
          if [ -z "$notes" ]; then
            notes="Tilecast Server $version"
          fi
          printf '%s\n' "$notes" > "$RUNNER_TEMP/tilecast-release-notes.md"

          exists=false
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exists=true
            echo "Release $tag already exists; this run resumes at alias promotion."
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "exists=$exists"
          } >> "$GITHUB_OUTPUT"

      # The release tag must point at a commit that is part of main, not an
      # unmerged side branch. Checking the reverse direction would require
      # the tag to contain the newest main commit at this instant, so a
      # valid release could fail merely because another PR merged after the
      # tag was pushed. Main is free to advance after tagging.
      - name: Reject a stable release tag outside main
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "Release tag points at a commit on main."
            exit 0
          fi
          echo "This stable release tag is not on main; it carries commits main does not contain:" >&2
          git log --oneline --no-decorate refs/remotes/origin/main..HEAD >&2
          echo >&2
          echo "Merge the release commit to main and retag from current main." >&2
          exit 1

      # Under the global lock this guarantees an older queued release can
      # never move Stable backwards: versions must strictly increase across
      # published stable releases.
      - name: Reject a non-increasing stable version
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          to_number() {
            IFS='.' read -r major minor patch <<<"$1"
            echo $((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))
          }
          current="$(to_number "$RELEASE_VERSION")"
          previous=0
          while IFS= read -r release_tag; do
            candidate_version="${release_tag#server-v}"
            if ! [[ "$candidate_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              continue
            fi
            candidate="$(to_number "$candidate_version")"
            if [ "$candidate" -gt "$previous" ]; then
              previous="$candidate"
            fi
          done < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName | select(startswith("server-v"))')
          if [ "$current" -le "$previous" ]; then
            echo "Stable version $RELEASE_VERSION must be greater than the latest published stable version." >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.title=Tilecast Server
            org.opencontainers.image.description=Self-hosted Tilecast server and Studio dashboard
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          annotations: |
            org.opencontainers.image.title=Tilecast Server
            org.opencontainers.image.description=Self-hosted Tilecast server and Studio dashboard
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      # Stage 1: publish only the immutable versioned tag. The Stable
      # aliases do not move until the GitHub Release exists.
      - name: Build and publish the versioned image once
        if: steps.release.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION_NUMBER=${{ steps.release.outputs.version }}
            VERSION_CHANNEL=stable
            VERSION_COMMIT=${{ github.sha }}
            VERSION_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # Stage 2: resolve and verify the published digest. The digest becomes
      # a step output so promotion consumes exactly what was verified, and
      # the GitHub Release records it for resumed runs.
      - name: Verify the published versioned image
        id: verify
        if: steps.release.outputs.exists != 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          image="$REGISTRY/$IMAGE_NAME"
          manifest="$(docker buildx imagetools inspect "$image:$RELEASE_VERSION" --format '{{json .Manifest}}')"
          test -n "$manifest"
          digest="$(printf '%s' "$manifest" | jq -er .digest)"
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Verified digest has an unexpected shape: ${digest:-<empty>}." >&2
            exit 1
          fi
          {
            printf '\n## Server image\n\n'
            printf -- '- `ghcr.io/gbyo/tilecast-server:%s`\n' "$RELEASE_VERSION"
            printf -- '- `ghcr.io/gbyo/tilecast-server:stable`\n'
            printf -- '- `ghcr.io/gbyo/tilecast-server:latest`\n'
            printf -- '- digest: `%s`\n' "$digest"
          } >> "$RUNNER_TEMP/tilecast-release-notes.md"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Versioned image verified at $digest."

      # Stage 3: the GitHub Release is the commit point. Only after it
      # exists may the Stable aliases move.
      - name: Publish Tilecast Server GitHub Release
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Tilecast Server $RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/tilecast-release-notes.md"

      # Resolve the single digest promotion may consume. Fresh runs use the
      # digest verified above; resumed runs recover the digest recorded in
      # the existing release notes and confirm it still exists. There is no
      # mutable tag resolution between verification and promotion, and a
      # resumed run never guesses from the version tag.
      - name: Resolve the digest to promote
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_EXISTS: ${{ steps.release.outputs.exists }}
          VERIFIED_DIGEST: ${{ steps.verify.outputs.digest }}
        run: |
          set -euo pipefail
          image="$REGISTRY/$IMAGE_NAME"
          if [ "$RELEASE_EXISTS" = "true" ]; then
            body="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
            digest="$(printf '%s' "$body" | grep -o '^- digest: `sha256:[0-9a-f]\{64\}`$' | head -1 | grep -o 'sha256:[0-9a-f]\{64\}' || true)"
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Existing release $RELEASE_TAG records no valid image digest; refusing to guess from the version tag." >&2
              exit 1
            fi
            docker buildx imagetools inspect "$image@$digest" >/dev/null
            echo "Resumed run: promoting the digest recorded by $RELEASE_TAG: $digest."
          else
            digest="$VERIFIED_DIGEST"
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Verified digest has an unexpected shape: ${digest:-<empty>}." >&2
              exit 1
            fi
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Stage 4: point the Stable aliases at the verified digest. No
      # rebuild: this is a registry-native tag operation, so the aliases
      # can only ever name the already-verified, already-released artifact.
      - name: Promote the verified digest to the Stable aliases
        env:
          PROMOTE_DIGEST: ${{ steps.promote.outputs.digest }}
        run: |
          set -euo pipefail
          image="$REGISTRY/$IMAGE_NAME"
          source="$image@$PROMOTE_DIGEST"
          docker buildx imagetools create \
            --tag "$image:stable" \
            --tag "$image:latest" \
            "$source"
          expected="$(docker buildx imagetools inspect "$source" --format '{{json .Manifest}}')"
          stable_manifest="$(docker buildx imagetools inspect "$image:stable" --format '{{json .Manifest}}')"
          latest_manifest="$(docker buildx imagetools inspect "$image:latest" --format '{{json .Manifest}}')"
          test -n "$expected"
          test "$stable_manifest" = "$expected"
          test "$latest_manifest" = "$expected"
          echo "stable and latest now name $PROMOTE_DIGEST."
