name: Tilecast Server Release

# Stable server releases from server-vX.Y.Z tags. The tag is the
# authoritative Stable version: no source-version-bump commit is needed.
#
# Cutting a release:
#   git switch main
#   git pull --ff-only
#   git tag server-vX.Y.Z
#   git push origin server-vX.Y.Z
#
# The release is staged so a failure can never leave the Stable aliases
# pointing at an unreleased build:
#   1. build the container once and publish only the immutable X.Y.Z tag;
#   2. verify the published versioned artifact and record its digest;
#   3. create the GitHub Release;
#   4. promote that exact digest to stable and latest without rebuilding.
# If alias promotion fails after the GitHub Release exists, Stable stays on
# the previous release; rerunning the workflow resumes at promotion instead
# of rebuilding the already-released versioned image.
#
# Only this workflow may move stable or latest; server-image.yml publishes
# Development images from main and never touches them.
on:
  push:
    tags:
      - "server-v*"

permissions:
  contents: read
  checks: write

concurrency:
  group: server-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gbyo/tilecast-server

jobs:
  # The Stable shipping bundle: everything packaged into or materially
  # required by the server image. The release cannot publish until all of
  # it passes. Android, Linux Player, and Edge validation are deliberately
  # excluded: they ship separately and must not gate a server release.
  server_ci:
    uses: ./.github/workflows/ci-server.yml

  dashboard_ci:
    uses: ./.github/workflows/ci-dashboard.yml

  container_ci:
    uses: ./.github/workflows/validate-container.yml

  browser_ci:
    uses: ./.github/workflows/validate-browser.yml

  plugins_ci:
    uses: ./.github/workflows/validate-plugins.yml

  widgets_ci:
    uses: ./.github/workflows/validate-widgets.yml

  sources_ci:
    uses: ./.github/workflows/validate-data-sources.yml

  contracts_ci:
    uses: ./.github/workflows/validate-cli.yml

  release:
    needs:
      [
        server_ci,
        dashboard_ci,
        container_ci,
        browser_ci,
        plugins_ci,
        widgets_ci,
        sources_ci,
        contracts_ci,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve and validate release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          if ! [[ "$tag" =~ ^server-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use server-v<major>.<minor>.<patch> with no suffix." >&2
            exit 1
          fi
          version="${tag#server-v}"

          notes="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$tag" \
            -f target_commitish="$GITHUB_SHA" \
            --jq .body)"
          if [ -z "$notes" ]; then
            notes="Tilecast Server $version"
          fi
          printf '%s\n' "$notes" > "$RUNNER_TEMP/tilecast-release-notes.md"

          exists=false
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exists=true
            echo "Release $tag already exists; this run resumes at alias promotion."
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "exists=$exists"
          } >> "$GITHUB_OUTPUT"

      # A stable tag cut from a diverged branch would silently ship a server
      # missing merged fixes, and every install that upgrades to it would
      # inherit the regression. A stable release must contain all of main;
      # hotfixes go through main and a new tag.
      - name: Reject a stable release that does not contain main
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if git merge-base --is-ancestor refs/remotes/origin/main HEAD; then
            echo "Release commit contains all of main."
            exit 0
          fi
          echo "This stable release does not contain the following commits already merged to main:" >&2
          git log --oneline --no-decorate HEAD..refs/remotes/origin/main >&2
          echo >&2
          echo "Retag from current main." >&2
          exit 1

      - name: Reject a non-increasing stable version
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          to_number() {
            IFS='.' read -r major minor patch <<<"$1"
            echo $((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))
          }
          current="$(to_number "$RELEASE_VERSION")"
          previous=0
          while IFS= read -r release_tag; do
            candidate_version="${release_tag#server-v}"
            if ! [[ "$candidate_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              continue
            fi
            candidate="$(to_number "$candidate_version")"
            if [ "$candidate" -gt "$previous" ]; then
              previous="$candidate"
            fi
          done < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName | select(startswith("server-v"))')
          if [ "$current" -le "$previous" ]; then
            echo "Stable version $RELEASE_VERSION must be greater than the latest published stable version." >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.title=Tilecast Server
            org.opencontainers.image.description=Self-hosted Tilecast server and Studio dashboard
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          annotations: |
            org.opencontainers.image.title=Tilecast Server
            org.opencontainers.image.description=Self-hosted Tilecast server and Studio dashboard
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      # Stage 1: publish only the immutable versioned tag. The Stable
      # aliases do not move until the GitHub Release exists.
      - name: Build and publish the versioned image once
        if: steps.release.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION_NUMBER=${{ steps.release.outputs.version }}
            VERSION_CHANNEL=stable
            VERSION_COMMIT=${{ github.sha }}
            VERSION_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # Stage 2: verify the published versioned artifact before the release.
      - name: Verify the published versioned image
        if: steps.release.outputs.exists != 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          image="$REGISTRY/$IMAGE_NAME"
          manifest="$(docker buildx imagetools inspect "$image:$RELEASE_VERSION" --format '{{json .Manifest}}')"
          test -n "$manifest"
          digest="$(printf '%s' "$manifest" | jq -er .digest)"
          {
            printf '\n## Server image\n\n'
            printf -- '- `ghcr.io/gbyo/tilecast-server:%s`\n' "$RELEASE_VERSION"
            printf -- '- `ghcr.io/gbyo/tilecast-server:stable`\n'
            printf -- '- `ghcr.io/gbyo/tilecast-server:latest`\n'
            printf -- '- digest: `%s`\n' "$digest"
          } >> "$RUNNER_TEMP/tilecast-release-notes.md"
          echo "Versioned image verified at $digest."

      # Stage 3: the GitHub Release is the commit point. Only after it
      # exists may the Stable aliases move.
      - name: Publish Tilecast Server GitHub Release
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Tilecast Server $RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/tilecast-release-notes.md"

      # Stage 4: point the Stable aliases at the exact versioned digest.
      # No rebuild: this is a registry-native tag operation, so the aliases
      # can only ever name the already-verified, already-released artifact.
      - name: Promote the versioned digest to the Stable aliases
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          image="$REGISTRY/$IMAGE_NAME"
          docker buildx imagetools create \
            --tag "$image:stable" \
            --tag "$image:latest" \
            "$image:$RELEASE_VERSION"
          version_manifest="$(docker buildx imagetools inspect "$image:$RELEASE_VERSION" --format '{{json .Manifest}}')"
          stable_manifest="$(docker buildx imagetools inspect "$image:stable" --format '{{json .Manifest}}')"
          latest_manifest="$(docker buildx imagetools inspect "$image:latest" --format '{{json .Manifest}}')"
          test -n "$version_manifest"
          test "$stable_manifest" = "$version_manifest"
          test "$latest_manifest" = "$version_manifest"
          echo "stable and latest now name $(printf '%s' "$version_manifest" | jq -r .digest)."
