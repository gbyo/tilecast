name: Tilecast Server Release

# Stable server releases from server-vX.Y.Z tags. A successful run builds
# the release image once and publishes the versioned, stable, and latest
# tags for that exact artifact, then creates the GitHub Release. Only this
# workflow may move stable or latest; server-image.yml publishes Development
# images from main and never touches them.
#
# Cutting a release:
#   1. Merge a change that sets const Version in
#      apps/server/internal/version/version.go to the release version.
#   2. Tag that commit: git tag server-vX.Y.Z && git push origin server-vX.Y.Z
#   3. This workflow validates, builds, publishes, and creates the release.
on:
  push:
    tags:
      - "server-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example server-v0.11.0
        required: true
      release_notes:
        description: Optional public release summary; generated when omitted
        required: false
        default: ""
      allow_behind_main:
        description: Publish a stable tag that does not contain all of main (hotfix from an older base)
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: server-release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gbyo/tilecast-server

jobs:
  # A Stable release cannot ship without the same server and container
  # validation that guards main: unit and PostgreSQL integration tests plus
  # the Compose configuration and image build.
  server_ci:
    uses: ./.github/workflows/ci-server.yml

  container_ci:
    uses: ./.github/workflows/validate-container.yml

  release:
    needs: [server_ci, container_ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve and validate release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_TAG: ${{ inputs.tag }}
          MANUAL_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
            notes=""
          else
            tag="$MANUAL_TAG"
            notes="$MANUAL_NOTES"
          fi

          if ! [[ "$tag" =~ ^server-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use server-v<major>.<minor>.<patch> with no suffix." >&2
            exit 1
          fi

          version="${tag#server-v}"
          source_version="$(sed -n 's/^const Version = "\(.*\)"$/\1/p' apps/server/internal/version/version.go)"
          if [ "$version" != "$source_version" ]; then
            echo "Tag version $version does not match source version $source_version in internal/version/version.go." >&2
            exit 1
          fi

          if [ -z "$notes" ]; then
            notes="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$tag" \
              -f target_commitish="$GITHUB_SHA" \
              --jq .body)"
          fi
          if [ -z "$notes" ]; then
            notes="Tilecast Server $version"
          fi

          printf '%s\n' "$notes" > "$RUNNER_TEMP/tilecast-release-notes.md"
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      # A stable tag cut from a diverged branch would silently ship a server
      # missing merged fixes, and every pinned install that upgrades to it
      # would inherit the regression. A stable release must contain main
      # unless a human explicitly publishes a hotfix from an older base.
      - name: Reject a stable release that does not contain main
        env:
          ALLOW_BEHIND_MAIN: ${{ inputs.allow_behind_main }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if git merge-base --is-ancestor refs/remotes/origin/main HEAD; then
            echo "Release commit contains all of main."
            exit 0
          fi
          echo "This stable release does not contain the following commits already merged to main:" >&2
          git log --oneline --no-decorate HEAD..refs/remotes/origin/main >&2
          if [ "${ALLOW_BEHIND_MAIN:-false}" = "true" ]; then
            echo "allow_behind_main was set; publishing anyway." >&2
            exit 0
          fi
          echo >&2
          echo "Retag from current main, or re-run this workflow with allow_behind_main for a deliberate hotfix." >&2
          exit 1

      - name: Reject a non-increasing stable version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          to_number() {
            IFS='.' read -r major minor patch <<<"$1"
            echo $((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))
          }
          current="$(to_number "$RELEASE_VERSION")"
          previous=0
          while IFS= read -r release_tag; do
            candidate_version="${release_tag#server-v}"
            if ! [[ "$candidate_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              continue
            fi
            candidate="$(to_number "$candidate_version")"
            if [ "$candidate" -gt "$previous" ]; then
              previous="$candidate"
            fi
          done < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName | select(startswith("server-v"))')
          if [ "$current" -le "$previous" ]; then
            echo "Stable version $RELEASE_VERSION must be greater than the latest published stable version." >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=stable
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Tilecast Server
            org.opencontainers.image.description=Self-hosted Tilecast server and Studio dashboard
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          annotations: |
            org.opencontainers.image.title=Tilecast Server
            org.opencontainers.image.description=Self-hosted Tilecast server and Studio dashboard
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: Build and publish the release image once
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION_CHANNEL=stable
            VERSION_COMMIT=${{ github.sha }}
            VERSION_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Verify the release contract
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          image="$REGISTRY/$IMAGE_NAME"
          version_manifest="$(docker buildx imagetools inspect "$image:$RELEASE_VERSION" --format '{{json .Manifest}}')"
          stable_manifest="$(docker buildx imagetools inspect "$image:stable" --format '{{json .Manifest}}')"
          latest_manifest="$(docker buildx imagetools inspect "$image:latest" --format '{{json .Manifest}}')"
          test -n "$version_manifest"
          test "$stable_manifest" = "$version_manifest"
          test "$latest_manifest" = "$version_manifest"
          digest="$(printf '%s' "$version_manifest" | jq -er .digest)"
          {
            printf '\n## Server image\n\n'
            printf -- '- `ghcr.io/gbyo/tilecast-server:%s`\n' "$RELEASE_VERSION"
            printf -- '- `ghcr.io/gbyo/tilecast-server:stable`\n'
            printf -- '- `ghcr.io/gbyo/tilecast-server:latest`\n'
            printf -- '- digest: `%s`\n' "$digest"
          } >> "$RUNNER_TEMP/tilecast-release-notes.md"
          echo "Versioned, stable, and latest tags share manifest $digest."

      - name: Publish Tilecast Server GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Tilecast Server $RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/tilecast-release-notes.md"
