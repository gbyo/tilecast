name: One-shot server release gate repair

on:
  push:
    branches:
      - fix/server-release-gates

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/server-release-gates
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/cli/go.mod
      - run: npm ci
      - name: Format release contract
        run: npx prettier --write scripts/ci/contracts/server-release.test.mjs
      - name: Regenerate API contracts
        run: make generate
      - name: Commit generated fixes and remove helper
        run: |
          set -euo pipefail
          rm .github/workflows/fix-server-release-gates.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Refresh release formatting and generated API contracts"
          git push origin HEAD:fix/server-release-gates
