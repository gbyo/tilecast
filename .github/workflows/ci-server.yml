name: Server CI

on:
  push:
    branches: [main]
    paths:
      - "apps/server/**"
      - "plugins/**"
      - "packages/plugin-sdk/go/**"
      - "go.work"
      - ".github/workflows/ci-server.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tilecast_test
          POSTGRES_USER: tilecast
          POSTGRES_PASSWORD: tilecast_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tilecast -d tilecast_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: |
            apps/server/go.sum
            plugins/go.sum
            packages/plugin-sdk/go/go.sum
      - working-directory: apps/server
        run: go vet ./... github.com/tilecast/tilecast/plugins/... github.com/tilecast/tilecast/packages/plugin-sdk/go/...
      - name: Test
        working-directory: apps/server
        run: go test -json -p 1 ./... github.com/tilecast/tilecast/plugins/... github.com/tilecast/tilecast/packages/plugin-sdk/go/... > test-results.json
        env:
          TEST_DATABASE_URL: postgres://tilecast:tilecast_test_password@localhost:5432/tilecast_test?sslmode=disable
      - name: Test Reporter
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3.0.0
        with:
          name: Server tests
          path: apps/server/test-results.json
          reporter: golang-json
          fail-on-empty: false
      - working-directory: apps/server
        run: go build ./cmd/tilecast
