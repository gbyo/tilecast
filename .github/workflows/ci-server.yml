name: ci-server

on:
  workflow_call:
    inputs:
      race:
        type: boolean
        default: false

permissions:
  contents: read
  checks: write

jobs:
  validate:
    name: Server CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tilecast_test
          POSTGRES_USER: tilecast
          POSTGRES_PASSWORD: tilecast_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tilecast -d tilecast_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: |
            apps/server/go.sum
            apps/cli/go.sum
            plugins/go.sum
            packages/plugin-sdk/go/go.sum
      # go.work puts the bundled plugins and the plugin SDK in the same build.
      - working-directory: apps/server
        run: go vet ./... github.com/tilecast/tilecast/plugins/... github.com/tilecast/tilecast/packages/plugin-sdk/go/... github.com/tilecast/tilecast/widgets/... github.com/tilecast/tilecast/data-sources/...
      - name: Test
        working-directory: apps/server
        run: go test ${{ inputs.race && '-race' || '' }} -json -coverprofile=coverage.out -p 1 ./... github.com/tilecast/tilecast/plugins/... github.com/tilecast/tilecast/packages/plugin-sdk/go/... github.com/tilecast/tilecast/widgets/... github.com/tilecast/tilecast/data-sources/... > test-results.json
        env:
          TEST_DATABASE_URL: postgres://tilecast:tilecast_test_password@localhost:5432/tilecast_test?sslmode=disable
      - name: Test Reporter
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3.0.0
        with:
          name: Server tests
          path: apps/server/test-results.json
          reporter: golang-json
          fail-on-empty: false
      - working-directory: apps/server
        run: go build ./cmd/tilecast-server
      - name: Coverage summary
        if: ${{ !cancelled() }}
        working-directory: apps/server
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: server-coverage
          path: apps/server/coverage.out
