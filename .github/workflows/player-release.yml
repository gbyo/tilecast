name: Tilecast Android Player Release

# Builds the signed Tilecast Player for Android (Android TV, Google TV and Fire
# TV) APK and its Tilecast-signed update manifest. It uploads them as a
# temporary Actions artifact. It never publishes: the coordinated release
# (release.yml) calls it and publishes every platform together, so the
# separate player-vX.Y.Z release train this workflow used to start no longer
# exists. Releases already published under player-v* tags stay as they are and
# stay importable by the server.
#
# Run on its own (workflow_dispatch) it is a release-candidate build check that
# builds whatever version the checkout carries, or stamps release_version when
# one is given, and publishes nothing.
on:
  workflow_call:
    inputs:
      release_version:
        description: Coordinated release version to stamp, for example 0.26.0-beta.1
        required: true
        type: string
      channel:
        description: Update channel in the signed manifest
        required: true
        type: string
      release_notes:
        description: Public release summary recorded in the signed manifest
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      release_version:
        description: Optional coordinated release version to stamp; the checkout's own version when empty
        required: false
        default: ""
        type: string
      channel:
        description: Update channel in the signed manifest
        required: true
        default: stable
        type: choice
        options: [stable, beta]
      release_notes:
        description: Optional public release summary
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Stamp the release version
        if: inputs.release_version != ''
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: python3 scripts/release/stamp_version.py --version "$RELEASE_VERSION"

      - name: Resolve the version being built
        id: release
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' apps/player-android/app/build.gradle.kts | head -1)"
          if [ -z "$version" ]; then
            echo "Could not read versionName from build.gradle.kts." >&2
            exit 1
          fi
          notes="$RELEASE_NOTES"
          if [ -z "$notes" ]; then
            notes="Tilecast Player for Android $version"
          fi
          printf '%s\n' "$notes" > "$RUNNER_TEMP/tilecast-release-notes.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.TILECAST_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TILECAST_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TILECAST_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TILECAST_ANDROID_KEY_PASSWORD }}
          UPDATE_PRIVATE_KEY: ${{ secrets.TILECAST_UPDATE_MANIFEST_PRIVATE_KEY_PEM }}
          UPDATE_PUBLIC_KEY: ${{ secrets.TILECAST_UPDATE_MANIFEST_PUBLIC_KEY_PEM }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD UPDATE_PRIVATE_KEY UPDATE_PUBLIC_KEY; do
            if [ -z "${!name}" ]; then
              echo "Required signing secret for $name is missing." >&2
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Materialize ephemeral signing files
        env:
          KEYSTORE_B64: ${{ secrets.TILECAST_ANDROID_KEYSTORE_BASE64 }}
          UPDATE_PRIVATE_KEY: ${{ secrets.TILECAST_UPDATE_MANIFEST_PRIVATE_KEY_PEM }}
          UPDATE_PUBLIC_KEY: ${{ secrets.TILECAST_UPDATE_MANIFEST_PUBLIC_KEY_PEM }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/tilecast-signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/tilecast-signing/player.jks"
          printf '%s' "$UPDATE_PRIVATE_KEY" > "$RUNNER_TEMP/tilecast-signing/update-private.pem"
          printf '%s' "$UPDATE_PUBLIC_KEY" > "$RUNNER_TEMP/tilecast-signing/update-public.pem"
          chmod 600 "$RUNNER_TEMP/tilecast-signing/"*
          # The public key the screens trust must be the one in the repository.
          test "$(openssl pkey -pubin -in "$RUNNER_TEMP/tilecast-signing/update-public.pem" -outform DER | base64 -w0)" = \
               "$(openssl pkey -pubin -in apps/edge/release/tilecast-update-key.pem -outform DER | base64 -w0)"

      - name: Build shared Player Runtime
        run: |
          npm ci
          npm run build --workspace @tilecast/player-runtime

      # The release build compiles the native Player Core host with cargo-ndk.
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk*
            target
          key: player-android-rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-cargo-ndk-4.1.2
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Restore pinned NDK
        id: ndk-cache
        uses: actions/cache@v6
        with:
          # Must match tilecastNdkVersion in app/build.gradle.kts.
          path: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
          key: android-ndk-29.0.14206865
      - name: Install pinned NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "ndk;29.0.14206865"

      - name: Build, sign, verify, and create release assets
        env:
          TILECAST_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/tilecast-signing/player.jks
          TILECAST_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TILECAST_ANDROID_KEYSTORE_PASSWORD }}
          TILECAST_ANDROID_KEY_ALIAS: ${{ secrets.TILECAST_ANDROID_KEY_ALIAS }}
          TILECAST_ANDROID_KEY_PASSWORD: ${{ secrets.TILECAST_ANDROID_KEY_PASSWORD }}
          TILECAST_UPDATE_MANIFEST_PRIVATE_KEY: ${{ runner.temp }}/tilecast-signing/update-private.pem
          TILECAST_UPDATE_MANIFEST_PUBLIC_KEY_FILE: ${{ runner.temp }}/tilecast-signing/update-public.pem
          TILECAST_RELEASE_CHANNEL: ${{ inputs.channel }}
          TILECAST_RELEASE_OUTPUT: ${{ runner.temp }}/tilecast-player-release
          ANDROID_BUILD_TOOLS_VERSION: 35.0.0
        run: |
          set -euo pipefail
          TILECAST_RELEASE_NOTES="$(cat "$RUNNER_TEMP/tilecast-release-notes.md")"
          export TILECAST_RELEASE_NOTES
          scripts/build-player-release.sh

      - name: Remove ephemeral signing files
        if: always()
        run: rm -rf "$RUNNER_TEMP/tilecast-signing"

      - name: Verify permanent Android signing certificate
        env:
          ANDROID_BUILD_TOOLS_VERSION: 35.0.0
          EXPECTED_CERT_SHA256: e718f5807d11c45c54477ab57c067516ddb1ed8a74194b4f46f882db16905733
        run: |
          set -euo pipefail

          apk="$RUNNER_TEMP/tilecast-player-release/tilecast-player.apk"
          apksigner="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION/apksigner"

          if [ ! -x "$apksigner" ]; then
            echo "Could not find pinned apksigner at $apksigner." >&2
            exit 1
          fi

          verify_output="$("$apksigner" verify --verbose --print-certs "$apk" 2>&1)"
          printf '%s\n' "$verify_output"
          actual="$(printf '%s\n' "$verify_output" | bash scripts/extract-apksigner-sha256.sh)"

          echo "Expected certificate: $EXPECTED_CERT_SHA256"
          echo "Actual certificate:   ${actual:-<empty>}"

          if ! [[ "$actual" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Could not parse a valid Android signing certificate digest." >&2
            exit 1
          fi
          if [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
            echo "Android signing certificate changed unexpectedly." >&2
            exit 1
          fi

      - name: Verify release contract
        env:
          STAMPED_VERSION: ${{ inputs.release_version }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/tilecast-player-release"
          test "$(find "$output" -maxdepth 1 -type f | wc -l)" -eq 3
          test -f "$output/tilecast-player.apk"
          test -f "$output/tilecast-player-update.json"
          test -f "$output/tilecast-player-update.json.sig"
          test "$(jq -r .versionName "$output/tilecast-player-update.json")" = "$RELEASE_VERSION"
          test "$(jq -r .channel "$output/tilecast-player-update.json")" = "$RELEASE_CHANNEL"
          test "$(jq -r .apkSizeBytes "$output/tilecast-player-update.json")" = \
            "$(wc -c < "$output/tilecast-player.apk" | tr -d ' ')"
          test "$(jq -r .apkSha256 "$output/tilecast-player-update.json")" = \
            "$(sha256sum "$output/tilecast-player.apk" | awk '{print $1}')"
          # A coordinated release carries the shared version code, so a Beta
          # can update to the next Beta or to Stable.
          if [ -n "$STAMPED_VERSION" ]; then
            test "$(jq -r .versionCode "$output/tilecast-player-update.json")" = \
              "$(python3 scripts/release/release_version.py code "$RELEASE_VERSION")"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: tilecast-android-release
          path: |
            ${{ runner.temp }}/tilecast-player-release/tilecast-player.apk
            ${{ runner.temp }}/tilecast-player-release/tilecast-player-update.json
            ${{ runner.temp }}/tilecast-player-release/tilecast-player-update.json.sig
          if-no-files-found: error
