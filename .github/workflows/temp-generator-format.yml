name: Temporary generator formatter

on:
  push:
    branches:
      - docs/operator-guide-expansion

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/docs/scripts/generate-content-reference.mjs
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/docs/scripts/generate-content-reference.mjs
          git commit -m "docs: format content reference generator"
          git push origin HEAD:docs/operator-guide-expansion
