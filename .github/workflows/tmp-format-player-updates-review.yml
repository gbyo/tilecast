name: Temporary Player Updates formatter

on:
  workflow_dispatch:
  push:
    branches:
      - fix/player-updates-review-followup

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/player-updates-review-followup
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --workspace @tilecast/dashboard --include-workspace-root
      - name: Format changed Player Updates files
        run: |
          npx prettier --write --ignore-unknown --             apps/dashboard/src/settings/player-updates/DeployUpdateModel.ts             apps/dashboard/src/settings/player-updates/DeployUpdateSheet.tsx             apps/dashboard/src/settings/player-updates/DeployUpdateStages.tsx             apps/dashboard/src/settings/player-updates/PlayerUpdatesPanel.tsx             apps/dashboard/src/settings/player-updates/UpdateDeploymentDetail.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             apps/dashboard/src/settings/player-updates/DeployUpdateModel.ts             apps/dashboard/src/settings/player-updates/DeployUpdateSheet.tsx             apps/dashboard/src/settings/player-updates/DeployUpdateStages.tsx             apps/dashboard/src/settings/player-updates/PlayerUpdatesPanel.tsx             apps/dashboard/src/settings/player-updates/UpdateDeploymentDetail.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format Player Updates follow-up"
          git push origin HEAD:fix/player-updates-review-followup
