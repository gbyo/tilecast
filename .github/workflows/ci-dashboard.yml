name: ci-dashboard

on:
  workflow_call:

permissions:
  contents: read
  checks: write

jobs:
  validate:
    name: Dashboard CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - name: Test
        working-directory: apps/dashboard
        run: |
          mkdir -p test-results
          npm run coverage -- --reporter=default --reporter=junit --outputFile=test-results/vitest.xml
      - name: Test Reporter
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3.0.0
        with:
          name: Dashboard tests
          path: apps/dashboard/test-results/vitest.xml
          reporter: java-junit
          fail-on-empty: false
      - run: npm run build

      # The Official Tilecast Plugin Conformance checks that need no build:
      # manifests, generated files, boundaries, migrations, OpenAPI fragments,
      # and the SDK's own tests. The Go, Studio, and runtime suites run in their
      # own jobs above.
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: node scripts/ci/coverage-summary.mjs apps/dashboard/coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: dashboard-coverage
          path: apps/dashboard/coverage
