name: Dashboard CI

on:
  push:
    branches: [main]
    paths:
      - "apps/dashboard/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci-dashboard.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore ESLint cache
        uses: actions/cache@v4
        with:
          path: apps/dashboard/.cache/eslint
          key: eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/dashboard/eslint.config.js', 'apps/dashboard/tsconfig*.json') }}
          restore-keys: |
            eslint-${{ runner.os }}-
      - run: npm run format:check
      - run: npm run lint
      - name: Test
        working-directory: apps/dashboard
        run: |
          mkdir -p test-results
          npm test -- --reporter=default --reporter=junit --outputFile=test-results/vitest.xml
      - name: Test Reporter
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3.0.0
        with:
          name: Dashboard tests
          path: apps/dashboard/test-results/vitest.xml
          reporter: java-junit
          fail-on-empty: false
      - run: npm run build
