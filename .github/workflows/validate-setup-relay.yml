name: validate-setup-relay

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Setup relay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/setup-relay
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/setup-relay/package-lock.json
      # The relay is not a root workspace; it has its own lockfile.
      - run: npm ci
      - name: Generated binding types are current
        run: |
          npx wrangler types --include-runtime=false
          git diff --exit-code -- worker-configuration.d.ts
      - run: npm run typecheck
      - run: npm test
      - name: Build the Worker without a deploy
        run: npm run check
