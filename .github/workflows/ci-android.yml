name: ci-android

on:
  workflow_call:

permissions:
  contents: read
  checks: write

jobs:
  validate:
    name: Android CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Test, lint, and assemble
        working-directory: apps/player-android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Test Reporter
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3.0.0
        with:
          name: Android tests
          path: apps/player-android/app/build/test-results/testDebugUnitTest/*.xml
          reporter: java-junit
          fail-on-empty: false
