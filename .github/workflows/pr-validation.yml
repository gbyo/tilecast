name: Pull request validation

on:
  # Every pull request, whatever its base, so a PR stacked on another PR's
  # branch gets the same validation as one against main. The change detector
  # diffs the PR's own base and head.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.paths.outputs.android }}
      ios: ${{ steps.paths.outputs.ios }}
      linux: ${{ steps.paths.outputs.linux }}
      linux_release_contract: ${{ steps.paths.outputs.linux_release_contract }}
      server: ${{ steps.paths.outputs.server }}
      dashboard: ${{ steps.paths.outputs.dashboard }}
      container: ${{ steps.paths.outputs.container }}
      docs: ${{ steps.paths.outputs.docs }}
      e2e: ${{ steps.paths.outputs.e2e }}
      plugins: ${{ steps.paths.outputs.plugins }}
      widgets: ${{ steps.paths.outputs.widgets }}
      cli: ${{ steps.paths.outputs.cli }}
      sources: ${{ steps.paths.outputs.sources }}
      ci: ${{ steps.paths.outputs.ci }}
      player_core: ${{ steps.paths.outputs.player_core }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate affected-area graph
        run: node --test scripts/ci/affected.test.mjs
      - name: Classify changed paths
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/ci/affected.mjs --full --github-output
          else
            node scripts/ci/affected.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --github-output
          fi

  ci_contract:
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    uses: ./.github/workflows/validate-ci-contract.yml

  player_core_ci:
    needs: changes
    if: needs.changes.outputs.player_core == 'true'
    uses: ./.github/workflows/validate-player-core.yml

  android_ci:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    uses: ./.github/workflows/ci-android.yml

  ios_ci:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    uses: ./.github/workflows/ci-ios.yml

  server_ci:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    uses: ./.github/workflows/ci-server.yml

  dashboard_ci:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    # React Doctor comments on the pull request; existing test reporting keeps
    # `checks: write`. Fork and Dependabot pull requests get a read-only token.
    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/ci-dashboard.yml

  linux_player_ci:
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    uses: ./.github/workflows/validate-linux.yml
    with:
      release_contract: ${{ github.event_name != 'pull_request' || needs.changes.outputs.linux_release_contract == 'true' }}

  plugins_ci:
    needs: changes
    if: needs.changes.outputs.plugins == 'true'
    uses: ./.github/workflows/validate-plugins.yml

  widgets_ci:
    needs: changes
    if: needs.changes.outputs.widgets == 'true'
    uses: ./.github/workflows/validate-widgets.yml

  container_ci:
    needs: changes
    if: needs.changes.outputs.container == 'true' && needs.changes.outputs.e2e != 'true'
    uses: ./.github/workflows/validate-container.yml

  e2e_ci:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    uses: ./.github/workflows/validate-browser.yml

  docs_ci:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/validate-docs.yml

  cli_ci:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    uses: ./.github/workflows/validate-cli.yml

  sources_ci:
    needs: changes
    if: needs.changes.outputs.sources == 'true'
    uses: ./.github/workflows/validate-data-sources.yml

  required:
    name: Required PR validation
    if: always()
    needs:
      - changes
      - ci_contract
      - player_core_ci
      - android_ci
      - ios_ci
      - linux_player_ci
      - server_ci
      - dashboard_ci
      - container_ci
      - e2e_ci
      - docs_ci
      - plugins_ci
      - widgets_ci
      - cli_ci
      - sources_ci
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected job to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CI_CONTRACT_SELECTED: ${{ needs.changes.outputs.ci == 'true' }}
          CI_CONTRACT_RESULT: ${{ needs.ci_contract.result }}
          PLAYER_CORE_CI_SELECTED: ${{ needs.changes.outputs.player_core == 'true' }}
          PLAYER_CORE_CI_RESULT: ${{ needs.player_core_ci.result }}
          ANDROID_CI_SELECTED: ${{ needs.changes.outputs.android == 'true' }}
          ANDROID_CI_RESULT: ${{ needs.android_ci.result }}
          IOS_CI_SELECTED: ${{ needs.changes.outputs.ios == 'true' }}
          IOS_CI_RESULT: ${{ needs.ios_ci.result }}
          LINUX_PLAYER_CI_SELECTED: ${{ needs.changes.outputs.linux == 'true' }}
          LINUX_PLAYER_CI_RESULT: ${{ needs.linux_player_ci.result }}
          SERVER_CI_SELECTED: ${{ needs.changes.outputs.server == 'true' }}
          SERVER_CI_RESULT: ${{ needs.server_ci.result }}
          DASHBOARD_CI_SELECTED: ${{ needs.changes.outputs.dashboard == 'true' }}
          DASHBOARD_CI_RESULT: ${{ needs.dashboard_ci.result }}
          CONTAINER_CI_SELECTED: ${{ needs.changes.outputs.container == 'true' && needs.changes.outputs.e2e != 'true' }}
          CONTAINER_CI_RESULT: ${{ needs.container_ci.result }}
          E2E_CI_SELECTED: ${{ needs.changes.outputs.e2e == 'true' }}
          E2E_CI_RESULT: ${{ needs.e2e_ci.result }}
          DOCS_CI_SELECTED: ${{ needs.changes.outputs.docs == 'true' }}
          DOCS_CI_RESULT: ${{ needs.docs_ci.result }}
          PLUGINS_CI_SELECTED: ${{ needs.changes.outputs.plugins == 'true' }}
          PLUGINS_CI_RESULT: ${{ needs.plugins_ci.result }}
          WIDGETS_CI_SELECTED: ${{ needs.changes.outputs.widgets == 'true' }}
          WIDGETS_CI_RESULT: ${{ needs.widgets_ci.result }}
          CLI_CI_SELECTED: ${{ needs.changes.outputs.cli == 'true' }}
          CLI_CI_RESULT: ${{ needs.cli_ci.result }}
          SOURCES_CI_SELECTED: ${{ needs.changes.outputs.sources == 'true' }}
          SOURCES_CI_RESULT: ${{ needs.sources_ci.result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error title=Required validation failed::Changed-area detection was $CHANGES_RESULT"
            exit 1
          fi
          check() {
            local job="$1"
            local selected="$2"
            local result="$3"
            if [ "$result" = "success" ]; then
              return 0
            fi
            if [ "$selected" = "false" ] && [ "$result" = "skipped" ]; then
              return 0
            fi
            echo "::error title=Required validation failed::$job was $result (selected=$selected)"
            return 1
          }
          check ci_contract "$CI_CONTRACT_SELECTED" "$CI_CONTRACT_RESULT"
          check player_core_ci "$PLAYER_CORE_CI_SELECTED" "$PLAYER_CORE_CI_RESULT"
          check android_ci "$ANDROID_CI_SELECTED" "$ANDROID_CI_RESULT"
          check ios_ci "$IOS_CI_SELECTED" "$IOS_CI_RESULT"
          check linux_player_ci "$LINUX_PLAYER_CI_SELECTED" "$LINUX_PLAYER_CI_RESULT"
          check server_ci "$SERVER_CI_SELECTED" "$SERVER_CI_RESULT"
          check dashboard_ci "$DASHBOARD_CI_SELECTED" "$DASHBOARD_CI_RESULT"
          check container_ci "$CONTAINER_CI_SELECTED" "$CONTAINER_CI_RESULT"
          check e2e_ci "$E2E_CI_SELECTED" "$E2E_CI_RESULT"
          check docs_ci "$DOCS_CI_SELECTED" "$DOCS_CI_RESULT"
          check plugins_ci "$PLUGINS_CI_SELECTED" "$PLUGINS_CI_RESULT"
          check widgets_ci "$WIDGETS_CI_SELECTED" "$WIDGETS_CI_RESULT"
          check cli_ci "$CLI_CI_SELECTED" "$CLI_CI_RESULT"
          check sources_ci "$SOURCES_CI_SELECTED" "$SOURCES_CI_RESULT"
