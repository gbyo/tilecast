name: Pull request validation

on:
  # Every pull request, whatever its base, so a PR stacked on another PR's
  # branch gets the same validation as one against main. The change detector
  # diffs the PR's own base and head.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.paths.outputs.android }}
      linux: ${{ steps.paths.outputs.linux }}
      server: ${{ steps.paths.outputs.server }}
      dashboard: ${{ steps.paths.outputs.dashboard }}
      container: ${{ steps.paths.outputs.container }}
      docs: ${{ steps.paths.outputs.docs }}
      e2e: ${{ steps.paths.outputs.e2e }}
      plugins: ${{ steps.paths.outputs.plugins }}
      widgets: ${{ steps.paths.outputs.widgets }}
      cli: ${{ steps.paths.outputs.cli }}
      sources: ${{ steps.paths.outputs.sources }}
      ci: ${{ steps.paths.outputs.ci }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test scripts/ci/*.test.mjs
      - name: Classify changed paths
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/ci/affected.mjs --full --github-output
          else
            node scripts/ci/affected.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --github-output
          fi

  ci_contract:
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    uses: ./.github/workflows/validate-ci-contract.yml

  android_ci:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    uses: ./.github/workflows/ci-android.yml

  server_ci:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    uses: ./.github/workflows/ci-server.yml

  dashboard_ci:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    uses: ./.github/workflows/ci-dashboard.yml

  linux_player_ci:
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    uses: ./.github/workflows/validate-linux.yml

  plugins_ci:
    needs: changes
    if: needs.changes.outputs.plugins == 'true'
    uses: ./.github/workflows/validate-plugins.yml

  widgets_ci:
    needs: changes
    if: needs.changes.outputs.widgets == 'true'
    uses: ./.github/workflows/validate-widgets.yml

  container_ci:
    needs: changes
    if: needs.changes.outputs.container == 'true' && needs.changes.outputs.e2e != 'true'
    uses: ./.github/workflows/validate-container.yml

  e2e_ci:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    uses: ./.github/workflows/validate-browser.yml

  docs_ci:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/validate-docs.yml

  cli_ci:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    uses: ./.github/workflows/validate-cli.yml

  sources_ci:
    needs: changes
    if: needs.changes.outputs.sources == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data-sources:check

  required:
    name: Required PR validation
    if: always()
    needs:
      - changes
      - ci_contract
      - android_ci
      - linux_player_ci
      - server_ci
      - dashboard_ci
      - container_ci
      - e2e_ci
      - docs_ci
      - plugins_ci
      - widgets_ci
      - cli_ci
      - sources_ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Require every selected job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
          SELECTIONS: >-
            {"ci_contract": ${{ needs.changes.outputs.ci == 'true' }},
             "android_ci": ${{ needs.changes.outputs.android == 'true' }},
             "linux_player_ci": ${{ needs.changes.outputs.linux == 'true' }},
             "server_ci": ${{ needs.changes.outputs.server == 'true' }},
             "dashboard_ci": ${{ needs.changes.outputs.dashboard == 'true' }},
             "container_ci": ${{ needs.changes.outputs.container == 'true' && needs.changes.outputs.e2e != 'true' }},
             "e2e_ci": ${{ needs.changes.outputs.e2e == 'true' }},
             "docs_ci": ${{ needs.changes.outputs.docs == 'true' }},
             "plugins_ci": ${{ needs.changes.outputs.plugins == 'true' }},
             "widgets_ci": ${{ needs.changes.outputs.widgets == 'true' }},
             "cli_ci": ${{ needs.changes.outputs.cli == 'true' }},
             "sources_ci": ${{ needs.changes.outputs.sources == 'true' }}}
        run: node scripts/ci/required.mjs
