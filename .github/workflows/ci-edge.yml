name: Edge CI

# Tilecast Edge is developed as a stack of pull requests whose bases are other
# Edge branches, so this workflow runs for pull requests against any base.
# (Pull request validation runs only for pull requests against main.)
on:
  pull_request:
    paths:
      - "apps/edge/**"
      - "packages/edge-protocol/**"
      - "packages/player-runtime/**"
      - "packages/api-schema/activity/**"
      - "apps/player-linux/**"
      - "apps/server/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci-edge.yml"
  push:
    branches: [main]
    paths:
      - "apps/edge/**"
      - "packages/edge-protocol/**"
      - ".github/workflows/ci-edge.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/edge
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - run: rustup show active-toolchain
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/edge/target
          key: edge-rust-${{ runner.os }}-${{ hashFiles('apps/edge/Cargo.lock', 'apps/edge/rust-toolchain.toml') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  wpe:
    name: WPE headless end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @tilecast/player-runtime
      - name: Build the WPE development images
        run: |
          set -euo pipefail
          docker build -t tilecast-wpe-dev -f apps/edge/renderer-wpe/ci/Dockerfile apps/edge/renderer-wpe/ci
          docker build -t tilecast-edge-dev -f apps/edge/renderer-wpe/ci/Dockerfile.edge apps/edge/renderer-wpe/ci
      - name: Record engine versions
        run: |
          docker run --rm tilecast-wpe-dev sh -c \
            'pkg-config --modversion wpe-webkit-2.0 wpe-platform-2.0 gstreamer-1.0' | tee edge-engine-versions.txt
      - name: Renderer unit tests and headless scenarios
        run: |
          mkdir -p "$RUNNER_TEMP/edge-target"
          docker run --rm -v "$PWD:/src" -v "$RUNNER_TEMP/edge-target:/target" \
            tilecast-edge-dev /src/apps/edge/renderer-wpe/ci/run-e2e.sh all
      - name: Session bridge with PipeWire and WirePlumber
        run: |
          docker run --rm -v "$PWD:/src" -v "$RUNNER_TEMP/edge-target:/target" \
            tilecast-edge-dev /src/apps/edge/session-bridge/ci/run-e2e.sh
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: edge-wpe-engine-versions
          path: edge-engine-versions.txt
          if-no-files-found: ignore

  runtime:
    name: Player Runtime and Electron host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace @tilecast/player-runtime
      - run: npm test --workspace @tilecast/player-runtime
      - run: npm run build --workspace @tilecast/player-runtime
      - run: npm test --workspace @gibsonmb71/tilecast-player-linux
      - run: npm run build --workspace @gibsonmb71/tilecast-player-linux
      - name: The sandboxed preload requires only electron
        run: |
          set -euo pipefail
          required=$(grep -o 'require("[^"]*")' apps/player-linux/dist/preload.js | sort -u)
          echo "$required"
          test "$required" = 'require("electron")'

  conformance:
    name: Electron and WPE conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @gibsonmb71/tilecast-player-linux
      - name: Build the engine images
        run: |
          set -euo pipefail
          docker build -t tilecast-wpe-dev -f apps/edge/renderer-wpe/ci/Dockerfile apps/edge/renderer-wpe/ci
          docker build -t tilecast-edge-dev -f apps/edge/renderer-wpe/ci/Dockerfile.edge apps/edge/renderer-wpe/ci
          docker build -t tilecast-conformance-electron apps/player-linux/conformance
      - name: WPE WebKit headless
        run: |
          mkdir -p "$RUNNER_TEMP/conformance" "$RUNNER_TEMP/edge-target"
          docker run --rm -v "$PWD:/src" -v "$RUNNER_TEMP/conformance:/results" \
            -v "$RUNNER_TEMP/edge-target:/target" tilecast-edge-dev \
            /src/apps/edge/renderer-wpe/ci/run-conformance.sh
      - name: Electron (Chromium)
        run: |
          docker run --rm -v "$PWD:/src" -v "$RUNNER_TEMP/conformance:/results" \
            tilecast-conformance-electron \
            node /src/packages/player-runtime/conformance/run.mjs --engine electron --out /results
      - name: Compare the engines
        run: |
          node packages/player-runtime/conformance/compare.mjs \
            --a "$RUNNER_TEMP/conformance/electron" --b "$RUNNER_TEMP/conformance/wpe" \
            --report "$RUNNER_TEMP/conformance/report"
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: player-runtime-conformance
          path: |
            ${{ runner.temp }}/conformance/report/**
            ${{ runner.temp }}/conformance/wpe-engine-versions.txt
            ${{ runner.temp }}/conformance/*/summary.json
            ${{ runner.temp }}/conformance/*/*/result.json
          if-no-files-found: ignore

  server_e2e:
    name: Real server end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @tilecast/player-runtime
      - name: Build the real-server image
        run: |
          set -euo pipefail
          docker build -t tilecast-wpe-dev -f apps/edge/renderer-wpe/ci/Dockerfile apps/edge/renderer-wpe/ci
          docker build -t tilecast-edge-dev -f apps/edge/renderer-wpe/ci/Dockerfile.edge apps/edge/renderer-wpe/ci
          docker build -t tilecast-edge-e2e -f apps/edge/ci/Dockerfile.e2e apps/edge/ci
      - name: Real server, tilecastd and the WPE renderer
        run: |
          mkdir -p "$RUNNER_TEMP/edge-target"
          docker run --rm -v "$PWD:/src" -v "$RUNNER_TEMP/edge-target:/target" \
            tilecast-edge-e2e /src/apps/edge/ci/run-e2e-server.sh

  migration:
    name: Migration under systemd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @tilecast/player-runtime
      - name: Build the systemd migration image
        run: |
          set -euo pipefail
          docker build -t tilecast-wpe-dev -f apps/edge/renderer-wpe/ci/Dockerfile apps/edge/renderer-wpe/ci
          docker build -t tilecast-edge-dev -f apps/edge/renderer-wpe/ci/Dockerfile.edge apps/edge/renderer-wpe/ci
          docker build -t tilecast-edge-e2e -f apps/edge/ci/Dockerfile.e2e apps/edge/ci
          docker build -t tilecast-edge-migrate-e2e -f apps/edge/ci/Dockerfile.migrate apps/edge/ci
      - name: Install, import failure, crash, power loss and acceptance
        run: |
          mkdir -p "$RUNNER_TEMP/edge-target"
          apps/edge/ci/run-migrate-e2e.sh "$RUNNER_TEMP/edge-target"

  activity_parity:
    name: Proof of play, Electron and Edge side by side
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @tilecast/player-runtime
      - run: npm run build --workspace @gibsonmb71/tilecast-player-linux
      - name: Build the parity image
        run: |
          set -euo pipefail
          docker build -t tilecast-wpe-dev -f apps/edge/renderer-wpe/ci/Dockerfile apps/edge/renderer-wpe/ci
          docker build -t tilecast-edge-dev -f apps/edge/renderer-wpe/ci/Dockerfile.edge apps/edge/renderer-wpe/ci
          docker build -t tilecast-edge-e2e -f apps/edge/ci/Dockerfile.e2e apps/edge/ci
          docker build -t tilecast-edge-parity -f apps/edge/ci/Dockerfile.parity apps/edge/ci
      - name: One real server, the Electron player and Edge
        run: |
          mkdir -p "$RUNNER_TEMP/edge-target"
          docker run --rm -v "$PWD:/src" -v "$RUNNER_TEMP/edge-target:/target" \
            tilecast-edge-parity /src/apps/edge/ci/run-activity-parity.sh

  required:
    name: Required Edge validation
    if: always()
    needs:
      [rust, wpe, runtime, conformance, server_e2e, migration, activity_parity]
    runs-on: ubuntu-latest
    env:
      RESULTS: ${{ join(needs.*.result, ',') }}
    steps:
      - name: Require every Edge job to pass
        run: |
          if [[ ",$RESULTS," == *,failure,* || ",$RESULTS," == *,cancelled,* || ",$RESULTS," == *,skipped,* ]]; then
            echo "One or more Edge validation jobs did not pass: $RESULTS" >&2
            exit 1
          fi
          echo "All Edge validation jobs passed: $RESULTS"
