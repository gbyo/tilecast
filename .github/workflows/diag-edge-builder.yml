name: Diagnose Edge builder image (temporary)

# Temporary. Measures real package download speed from the Debian snapshot
# archive on each runner architecture and reports it as annotations. Remove
# before merging.
on:
  workflow_dispatch:
  push:
    branches: [gibby/fervent-curie-bgfpmu]
    paths: [.github/workflows/diag-edge-builder.yml]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Retry a package that returned 504
        run: |
          set -u
          dpkg_arch="$(dpkg --print-architecture)"
          url="http://snapshot.debian.org/archive/debian/20260920T000000Z/pool/main/c/curl/curl_8.14.1-2+deb13u5_${dpkg_arch}.deb"
          out=""
          for i in 1 2 3 4 5 6; do
            r=$(curl -sS -L -m 120 -o /dev/null -w '%{http_code}/%{time_total}s' "$url" 2>&1 | tail -n 1)
            out="$out try$i=$r"
            case "$r" in 200*) break ;; esac
            sleep 20
          done
          echo "::notice title=curl package retries::$out"
