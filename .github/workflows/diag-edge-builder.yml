name: Diagnose Edge builder image (temporary)

# Temporary. Measures real package download speed from the Debian snapshot
# archive on each runner architecture and reports it as annotations. Remove
# before merging.
on:
  workflow_dispatch:
  push:
    branches: [gibby/fervent-curie-bgfpmu]
    paths: [.github/workflows/diag-edge-builder.yml]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Download real packages from the pinned snapshot
        run: |
          set -u
          dpkg_arch="$(dpkg --print-architecture)"
          base="http://snapshot.debian.org/archive/debian/20260920T000000Z/pool/main"
          for pkg in "z/z3/libz3-4_4.13.3-1_${dpkg_arch}.deb" "c/curl/curl_8.14.1-2+deb13u5_${dpkg_arch}.deb"; do
            r=$(curl -sS -L -m 120 -o /dev/null -w '%{http_code} %{size_download}B %{time_total}s %{speed_download}B/s' "$base/$pkg" 2>&1 | tail -n 1)
            echo "::notice title=${pkg##*/}::$r"
          done
