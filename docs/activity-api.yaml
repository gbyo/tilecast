openapi: 3.1.0
info:
  title: Tilecast Activity API
  version: 1.0.0
paths:
  /api/v1/player/activity-events:
    post:
      summary: Upload a bounded batch of append-only Player activity events
      security: [{ playerCredential: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { $ref: "#/components/schemas/PlayerActivityEvent" }
      responses:
        "202":
          description: Events accepted or idempotently acknowledged
  /api/v1/activity/overview:
    get:
      summary: Read the derived operational overview
      description:
        Range-scoped totals in `cards`, plus a `fleet` object measured as of now
        rather than over the range. `fleet.online` counts reachability; the
        healthy, impaired, offline, and unmeasured counts partition the measured
        fleet, which covers only enabled, paired, non-archived screens holding an
        unrevoked credential.
      parameters:
        [
          { $ref: "#/components/parameters/From" },
          { $ref: "#/components/parameters/To" },
        ]
      responses: { "200": { description: Activity overview } }
  /api/v1/activity/incidents:
    get:
      summary: List operational incidents
      description:
        Grouped operational problems rather than one row per bad event. Reading
        this endpoint also sweeps current state, so a screen that stopped
        reporting opens a connectivity incident even though it sends no event.
      parameters:
        - name: status
          in: query
          description:
            Defaults to `active` (open, acknowledged). A recovered incident is
            history, not active work, and is returned by `all` or `recovered`.
          schema:
            {
              type: string,
              enum:
                [active, all, open, acknowledged, recovered, resolved, ignored],
            }
        - name: type
          in: query
          schema:
            {
              type: string,
              enum: [connectivity, playback, storage, safe_mode, update],
            }
        - name: screen
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Incidents, most severe first }
        "422": { description: Unsupported filter }
  /api/v1/activity/incidents/analytics:
    get:
      summary: Read incident analytics
      description:
        Mean and median time to recover are null rather than zero when nothing
        recovered in the range, because zero would read as instant recovery.
      parameters:
        [
          { $ref: "#/components/parameters/From" },
          { $ref: "#/components/parameters/To" },
        ]
      responses: { "200": { description: Incident totals and breakdowns } }
  /api/v1/activity/incidents/{incidentId}:
    get:
      summary: Read one incident with its evidence and timeline
      parameters:
        - name: incidentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Incident detail }
        "404": { description: Incident was not found }
    patch:
      summary: Acknowledge, assign, note, resolve, ignore, or reopen an incident
      description:
        Owner or Administrator, with CSRF protection. Every applied action is
        appended to the incident timeline and the audit log.
      parameters:
        - name: incidentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentAction" }
      responses:
        "200": { description: The updated incident }
        "403": { description: Insufficient role }
        "409": { description: The action does not apply to the current status }
        "422": { description: Unknown action or invalid assignee }
  /api/v1/player/telemetry:
    post:
      summary: Upload one bounded telemetry sample
      security: [{ playerCredential: [] }]
      description:
        Gauges are latest values; `interval` counters are deltas since the
        player's previous sample. The server keeps one snapshot row per screen
        and five-minute rollups. Raw high-frequency samples are never stored.
        Threshold events are emitted by the server, which owns the hysteresis
        and cooldowns so a restarted player cannot re-announce conditions it
        was already in.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TelemetrySample" }
      responses:
        "202": { description: Sample accepted }
        "422": { description: observedAt outside the accepted reporting window }
  /api/v1/activity/screens/{screenId}/telemetry:
    get:
      summary: Read a screen's telemetry snapshot, conditions and rollups
      description:
        Owner or Administrator. `snapshot` is absent when the player has never
        reported, which is different from reporting zeroes.
      parameters:
        - name: screenId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
      responses:
        "200": { description: Snapshot, active conditions and rollups }
        "403": { description: Insufficient role }
  /api/v1/activity/compliance:
    get:
      summary: Read expected-versus-actual playback compliance
      description:
        Measured against expected windows materialized when each selection
        became effective, not against current configuration. Takeover and
        cancelled time is excluded from the denominator and reported
        separately. `compliancePercent` is null when nothing measurable was
        expected, because zero would claim every expected play was missed.
      parameters:
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - name: dimension
          in: query
          schema:
            type: string
            enum:
              [screen, location, group, presentation, schedule, date, reason]
            default: screen
        - { name: screen, in: query, schema: { type: string, format: uuid } }
        - { name: schedule, in: query, schema: { type: string } }
      responses:
        "200": { description: Compliance totals and the requested breakdown }
        "422": { description: Unsupported dimension or range }
  /api/v1/activity/screens/{screenId}/timeline:
    get:
      summary: Read one screen's merged diagnostic timeline
      description:
        State intervals, playback sessions, reported events, incident lifecycle
        and administrative changes in one order, plus the screen's current
        status and health classification.
      parameters:
        - name: screenId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - name: domain
          in: query
          schema:
            type: string
            enum:
              [
                playback,
                connectivity,
                reliability,
                scheduling,
                commands,
                updates,
                takeovers,
                manifest,
                state,
                incidents,
                audit,
              ]
      responses:
        "200": { description: Merged timeline with current status }
        "422": { description: Unsupported domain or range }
  /api/v1/activity/uptime:
    get:
      summary: Read fleet uptime for the System overview graphs
      description:
        Derived from recorded screen-state intervals. An open healthy interval is
        clipped to the last heartbeat plus the gap grace period, so a player that
        stopped reporting counts as down. Time before a screen's first recorded
        interval is reported as unmeasured rather than as downtime.
      parameters:
        - name: window
          in: query
          schema: { type: string, enum: [24h, 7d, 30d], default: 24h }
      responses:
        "200":
          description: Fleet totals, one bucket per interval, and per-screen strips
        "422": { description: Unsupported window }
  /api/v1/activity/proof-of-play:
    get:
      summary: List Player-confirmed playback sessions
      parameters:
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { $ref: "#/components/parameters/Cursor" }
        - name: sessionType
          in: query
          description: Root presentation intervals are screen wall clock; the rest are content exposure.
          schema:
            {
              type: string,
              enum: [presentation, content, layout_placement, playlist_item],
            }
        - name: terminalReason
          in: query
          description: A contract terminal reason, or `unexpected` for every reason that is not an expected ending.
          schema: { type: string }
        - { $ref: "#/components/parameters/Limit" }
        - { name: screen, in: query, schema: { type: string, format: uuid } }
        - { name: group, in: query, schema: { type: string, format: uuid } }
        - { name: result, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        { "200": { description: Stable page of proof-of-play sessions } }
  /api/v1/activity/proof-of-play/summary:
    get:
      summary: Summarize proof of play by screen, content, presentation, or schedule
      description:
        Root and child durations are totalled separately, and the rate reported
        is session completion, not scheduled-playback coverage.
      responses:
        { "200": { description: Aggregated proof-of-play session outcomes } }
  /api/v1/activity/proof-of-play/export.csv:
    get:
      summary: Export proof of play as CSV
      responses: { "200": { description: CSV export } }
  /api/v1/activity/screen-events:
    get:
      summary: List technical screen events
      responses: { "200": { description: Stable page of screen events } }
  /api/v1/activity/audit:
    get:
      summary: List authenticated administrative changes
      responses: { "200": { description: Stable page of audit records } }
  /api/v1/activity/audit/export.csv:
    get:
      summary: Export audit records as CSV
      responses: { "200": { description: CSV export } }
  /api/v1/activity/screens/{screenId}:
    get:
      summary: Read the Activity section for one screen
      parameters:
        - name: screenId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses: { "200": { description: Screen Activity summary } }
  /api/v1/activity/retention:
    get:
      summary: Read Activity retention settings
      responses: { "200": { description: Retention settings } }
    patch:
      summary: Update bounded Activity retention settings
      responses: { "200": { description: Updated retention settings } }
components:
  securitySchemes:
    playerCredential:
      type: http
      scheme: bearer
  parameters:
    From: { name: from, in: query, schema: { type: string, format: date-time } }
    To: { name: to, in: query, schema: { type: string, format: date-time } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Limit:
      {
        name: limit,
        in: query,
        schema: { type: integer, minimum: 1, maximum: 250, default: 50 },
      }
  schemas:
    IncidentAction:
      type: object
      required: [action]
      additionalProperties: false
      properties:
        action:
          {
            type: string,
            enum: [acknowledge, assign, note, resolve, ignore, reopen],
          }
        assigneeId: { type: string, format: uuid }
        reason: { type: string, maxLength: 240 }
        notes: { type: string, maxLength: 4000 }
    TelemetrySample:
      type: object
      required: [observedAt, interval]
      additionalProperties: false
      properties:
        observedAt: { type: string, format: date-time }
        currentItemId: { type: string }
        lastMeaningfulProgressAt: { type: string, format: date-time }
        serverRoundTripMs: { type: integer, minimum: 0 }
        rendererState: { type: string }
        interval:
          type: object
          additionalProperties: false
          properties:
            seconds: { type: integer, minimum: 0, maximum: 300 }
            connectedSeconds: { type: integer, minimum: 0 }
            disconnectedSeconds: { type: integer, minimum: 0 }
            healthyPlaybackSeconds: { type: integer, minimum: 0 }
            stalledPlaybackSeconds: { type: integer, minimum: 0 }
            blackOutputSeconds: { type: integer, minimum: 0 }
            droppedFrames: { type: integer, minimum: 0 }
            frameChangeCount: { type: integer, minimum: 0 }
            downloadedBytes: { type: integer, minimum: 0 }
            cacheHits: { type: integer, minimum: 0 }
            cacheMisses: { type: integer, minimum: 0 }
            thermalSeconds:
              type: object
              additionalProperties: { type: number, minimum: 0 }
    PlayerActivityEvent:
      type: object
      required: [id, sequence, eventType, occurredAt]
      properties:
        id: { type: string, format: uuid }
        sequence: { type: integer, format: int64, minimum: 1 }
        eventType: { type: string }
        category: { type: string }
        severity:
          { type: string, enum: [debug, info, warning, error, critical] }
        occurredAt: { type: string, format: date-time }
        elapsedRealtimeMs: { type: integer, format: int64, minimum: 0 }
        playerTimezone: { type: string }
        manifestVersion: { type: integer, format: int64 }
        presentationType: { type: string }
        presentationId: { type: string }
        presentationRevision: { type: string }
        contentType: { type: string }
        contentId: { type: string }
        playlistItemId: { type: string }
        layoutPlacementId: { type: string }
        activitySessionId: { type: string }
        result:
          {
            type: string,
            enum:
              [
                playing,
                completed,
                partial,
                skipped,
                failed,
                unknown,
                recovered,
                success,
              ],
          }
        durationMs: { type: integer, format: int64, minimum: 0 }
        expectedDurationMs: { type: integer, format: int64, minimum: 0 }
        failureCode: { type: string }
        failureMessage: { type: string, maxLength: 240 }
        trigger: { type: string }
        scheduleId: { type: string }
        takeoverId: { type: string }
        sourceId: { type: string }
        selectedRecordId: { type: string }
        selectionDate: { type: string, format: date }
        sourceCachedAt: { type: string, format: date-time }
        sourceRevision: { type: string }
        snapshotHash: { type: string }
        metadata: { type: object, additionalProperties: true }
        priority: { type: integer, minimum: 0, maximum: 9 }
