        "200": { description: Login background selection }
        "401": { description: Dashboard authentication required }
    put:
      operationId: putLoginBackground
      description: >-
        Select the login background image asset. Requires an Owner or
        Administrator in an enrolled dashboard session.
        Cookie-authenticated unsafe requests require X-CSRF-Token.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetId]
              properties:
                assetId: { type: string, format: uuid }
      responses:
        "200": { description: Login background selected }
        "400": { description: Invalid request body }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
        "409": { description: Setup is not complete }
        "422": { description: Asset is not a valid image asset }
