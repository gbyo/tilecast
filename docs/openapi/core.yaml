      properties:
        revision: { type: string }
        compilerVersion: { type: string }
        widgets:
          type: array
          items: { $ref: "#/components/schemas/ContentWidgetDefinition" }
        dataSources:
          type: array
          items: { $ref: "#/components/schemas/ContentDataSourceDefinition" }
        fingerprint: { type: string }
    PublicationHistoryItem:
      type: object
