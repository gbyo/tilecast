    PlayerManifest:
      type: object
      additionalProperties: false
      required:
        [
          schemaVersion,
          manifestVersion,
          screenId,
          generatedAt,
          mode,
          playlist,
          assets,
        ]
      properties:
        schemaVersion:
          type: integer
          enum: [11, 12, 13, 14, 15, 16, 17]
          description: The Server selects a version from the Player's reported presentation capabilities. New versions do not change responses for older Players.
        manifestVersion: { type: integer, format: int64, minimum: 1 }
        screenId: { type: string, format: uuid }
        generatedAt: { type: string, format: date-time }
        mode: { type: string, const: presentation }
        playlist:
          {
            oneOf:
              [{ type: "null" }, { type: object, additionalProperties: true }],
          }
        layout:
          {
            oneOf:
              [{ type: "null" }, { type: object, additionalProperties: true }],
          }
        layouts:
          { type: array, items: { type: object, additionalProperties: true } }
        assets:
          { type: array, items: { type: object, additionalProperties: true } }
        canvas:
          oneOf:
            - { type: "null" }
            - {
                type: object,
                required: [width, height],
                properties:
                  { width: { type: integer }, height: { type: integer } },
              }
        viewport:
          oneOf:
            - { type: "null" }
            - {
                type: object,
                required: [x, y, width, height, rotation, order],
                properties:
                  {
                    x: { type: integer },
                    y: { type: integer },
                    width: { type: integer },
                    height: { type: integer },
                    rotation: { type: integer },
                    order: { type: integer },
                  },
              }
        schedules:
          type: array
          items: { $ref: "#/components/schemas/ManifestSchedule" }
        widgets:
          { type: array, items: { type: object, additionalProperties: true } }
        dataSources:
          { type: array, items: { type: object, additionalProperties: true } }
        presentationOverride:
          {
            oneOf:
              [
                { type: "null" },
                { $ref: "#/components/schemas/PresentationOverride" },
              ],
          }
    PresentationOverride:
      type: object
      additionalProperties: false
      description: >-
        Active Quick Present session. The stopped timestamp and reason
        appear once the session ends.
      required:
        [
          id,
          targetType,
          targetId,
          targetName,
          contentType,
          contentId,
          contentName,
          durationSeconds,
          startedAt,
          afterAction,
          wakeDisplay,
        ]
      properties:
        id: { type: string, format: uuid }
        targetType: { type: string, enum: [screen, group] }
        targetId: { type: string, format: uuid }
        targetName: { type: string }
        contentType: { type: string, enum: [playlist, layout, asset] }
        contentId: { type: string, format: uuid }
        contentName: { type: string }
        durationSeconds: { type: integer, minimum: 0 }
        startedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        afterAction: { type: string, enum: [resume] }
        wakeDisplay: { type: boolean }
        stoppedAt: { type: string, format: date-time }
        stopReason: { type: string }
    PresentationOverrideInput:
      type: object
      additionalProperties: false
      required:
        [
          targetType,
          targetId,
          contentType,
          contentId,
          durationMinutes,
          afterAction,
          wakeDisplay,
        ]
      properties:
        targetType: { type: string, enum: [screen, group] }
        targetId: { type: string, format: uuid }
        contentType: { type: string, enum: [playlist, layout, asset] }
        contentId: { type: string, format: uuid }
        durationMinutes: { type: integer, enum: [0, 5, 15, 30, 60] }
        afterAction: { type: string, enum: [resume] }
        wakeDisplay: { type: boolean }
