    post:
      operationId: previewSchedule
      description: >-
        Preview schedule. Requires an authenticated dashboard user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [screenId]
              properties:
                screenId: { type: string, format: uuid }
                timestamp: { type: string, format: date-time }
                proposedSchedule: { $ref: "#/components/schemas/ScheduleInput" }
      responses:
        "200":
          description: >-
            Production resolution result, conflicts, fallback, and next
            transition
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SchedulePreview" }
        "403": { description: Scheduling access required }
  /api/v1/schedules/preflight:
    post:
      operationId: preflightSchedule
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Read-only inspection of a proposed schedule. Requires an
        authenticated user with the read scope; every role may call it, and
        the targets must be inside the caller's screen scope. The server
        expands every targeted screen and Display Group, finds the draft's
        next occurrence in its own timezone, and evaluates precedence on each
        screen at that instant with the same resolver Players use. A draft
        that is disabled is simulated as enabled; draftEnabled reports its
        real state. Counts describe the whole target set; the screens and
        competitors lists are bounded. Pass scheduleId when editing a saved
        schedule so its stored copy does not compete with the draft.
        A scoped account sees a competing schedule's name and ID only when all
        of that schedule's targets are inside its scope; other competitors keep
        their counts and reasons but carry no name and a placeholder ID.
        The result describes the next occurrence only, never every future
        occurrence. Use previewSchedule to inspect one exact screen at an
        exact time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [proposedSchedule]
              properties:
                scheduleId: { type: string, format: uuid }
                proposedSchedule: { $ref: "#/components/schemas/ScheduleInput" }
      responses:
        "200":
          description: Aggregated next-occurrence precedence result
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SchedulePreflight" }
        "400": { description: Malformed body or an unknown field }
        "401": { description: Authentication required }
        "403": { description: Scope or target scope requirement not met }
        "404":
          {
            description: "A referenced Playlist, Layout, or target was not found",
          }
        "409": { description: The presentation conflicts with a target }
        "422": { description: Schedule or target validation failed }
  /api/v1/assets/websites:
