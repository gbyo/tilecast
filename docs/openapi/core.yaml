      operationId: revokeScreenCredential
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires the Owner or Administrator role with the admin scope.
        Cookie requests additionally require the X-CSRF-Token header.
        Permanently revokes a screen's device credential.
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 1000 }
      responses:
        "204": { description: Credential permanently revoked }
        "401": { description: Dashboard authentication required }
        "403": { description: Owner or Administrator required }
  /api/v1/uploads:
