    AirplaySession:
      type: object
      additionalProperties: false
      description: >-
        Temporary AirPlay Present session. The PIN appears only while the
        session is preparing, waiting, or active, and only when the
        server issued one. Null audio and network ids mean no audio
        screen and no Presentation Network, respectively.
      required:
        [
          id,
          provider,
          status,
          targetType,
          targetId,
          gatewayScreenId,
          audioScreenId,
          receiverName,
          expiresAt,
          createdAt,
          endReason,
          transport,
          videoProfile,
          audioMode,
          presentationNetworkId,
          presentationNetworkName,
          screenCount,
          readyCount,
          connectedCount,
          failedCount,
          screens,
        ]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, enum: [airplay] }
        status:
          {
            type: string,
            enum:
              [preparing, waiting, active, stopping, ended, expired, failed],
          }
        targetType: { type: string, enum: [screen, group] }
        targetId: { type: string, format: uuid }
        gatewayScreenId: { type: string, format: uuid }
        audioScreenId: { type: [string, "null"], format: uuid }
        receiverName: { type: string }
        pin: { type: string }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        endedAt: { type: [string, "null"], format: date-time }
        endReason: { type: string }
        transport: { type: string, enum: [auto, unicast, multicast] }
        videoProfile: { type: string }
        audioMode: { type: string, enum: [gateway_only, none] }
        presentationNetworkId: { type: [string, "null"], format: uuid }
        presentationNetworkName: { type: string }
        screenCount: { type: integer, minimum: 0 }
        readyCount: { type: integer, minimum: 0 }
        connectedCount: { type: integer, minimum: 0 }
        failedCount: { type: integer, minimum: 0 }
        screens:
          type: array
          items: { $ref: "#/components/schemas/AirplaySessionScreenState" }
