      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [cancelled] }
    PlayerReleaseDeleteResult:
      type: object
      additionalProperties: false
      required: [id, deleted]
      properties:
        id: { type: string, format: uuid }
        deleted: { type: boolean }
    GitHubClientConfigured:
      type: object
      additionalProperties: false
      required: [configured]
      properties:
        configured: { type: boolean }
    PlayerUpdateMetadata:
      type: object
      required: [releaseId, platform, versionCode, versionName]
      properties:
        releaseId: { type: string, format: uuid }
        artifactId: { type: string, description: The artifact's asset name. }
        platform: { type: string, x-extensible-enum: [android, linux, windows] }
        versionCode: { type: integer }
        versionName: { type: string }
        playerFamily: { $ref: "#/components/schemas/PlayerFamily" }
        architecture:
          enum: [x86_64, aarch64]
          description: Tilecast Edge and Windows Player only.
        artifactSizeBytes:
          { type: integer, description: Every family but Android. }
        artifactSha256:
          {
            type: string,
            pattern: "^[a-f0-9]{64}$",
            description: Every family but Android.,
          }
        artifactPath:
          type: string
          description: "`/api/v1/player/updates/{releaseId}/artifact` for every family but Android."
        signedManifest:
          type: string
          format: byte
          description: >-
            Tilecast Edge and Windows Player only: the exact bytes of the
            signed update envelope, base64. The screen verifies the signature
            and every field against this answer and its `install_player_update`
            command before it downloads.
        manifestSignature:
          type: string
          description: Tilecast Edge and Windows Player only. The envelope's base64 Ed25519 signature text.
        stateSchemaVersion:
          type: integer
          description: Tilecast Edge only. The state database schema the release migrates to.
        applicationId: { type: string, description: Android only. }
        minimumSdk: { type: integer, description: Android only. }
        apkSizeBytes: { type: integer, description: Android only. }
        apkSha256: { type: string, description: Android only. }
        signingCertificateSha256: { type: string, description: Android only. }
        apkPath: { type: string, description: Android only. }
    PlayerHeartbeat:
      type: object
      description: >-
        The Player status document. Only the release family fields are
        described here; the remaining fields are the existing heartbeat
        contract and are additive.
      properties:
        playerFamily:
          type: string
          description: >-
            `android`, `electron-linux`, `edge`, `windows` or `browser`. The server keeps
            only these values; another value is recorded as absent.
        playerArchitecture:
          type: string
          description: >-
            `x86_64` or `aarch64`, kept only with `playerFamily: edge` or
            `playerFamily: windows`. An Edge or Windows screen without a
            known architecture is `incompatible` for its family's deployments.
        browser:
          $ref: "#/components/schemas/BrowserPlayerStatus"
    MultiFactorVerifyRequest:
      type: object
      additionalProperties: false
      required: [challengeToken, code]
      properties:
        challengeToken: { type: string }
        code:
          type: string
          description: >-
            An authenticator code or a recovery code. The server decides which
            by shape; six digits are never matched against recovery codes.
    ChallengeTokenRequest:
      type: object
      additionalProperties: false
      required: [challengeToken]
      properties:
        challengeToken: { type: string }
    AccountRole:
      type: string
      enum: [owner, administrator, editor, contributor, viewer]
    AuthUser:
      type: object
      additionalProperties: false
      required: [id, name, username, role, active, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        username: { type: string }
        role: { $ref: "#/components/schemas/AccountRole" }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: string, format: date-time }
    MultiFactorMethod:
      type: string
      enum: [totp, passkey, recovery_code]
    SessionCreated:
      type: object
      additionalProperties: false
      required: [user, csrfToken, authMethod, mfaEnrollmentRequired]
      properties:
        user: { $ref: "#/components/schemas/AuthUser" }
        csrfToken: { type: string }
        authMethod: { $ref: "#/components/schemas/AuthMethod" }
        mfaEnrollmentRequired: { type: boolean }
    LoginChallenge:
      type: object
      additionalProperties: false
      required: [mfaRequired, challengeToken, methods]
      properties:
        mfaRequired: { type: boolean, enum: [true] }
        challengeToken: { type: string }
        methods:
          type: array
          items: { $ref: "#/components/schemas/MultiFactorMethod" }
    LoginResult:
      oneOf:
        - { $ref: "#/components/schemas/SessionCreated" }
        - { $ref: "#/components/schemas/LoginChallenge" }
      description: >-
        Either a signed-in session or a multi-factor challenge. A challenge
        sets no session cookie; no cookie exists until the factor verifies.
    PasskeyAssertionChallenge:
      type: object
      additionalProperties: false
      required: [challengeToken, options]
      properties:
        challengeToken: { type: string }
        options:
          additionalProperties: true
          type: object
          description: >-
            WebAuthn public-key assertion options for
            navigator.credentials.get(), serialized with base64url binary
            fields. Consumed by the platform authenticator rather than field
            by field.
    AuthenticatorCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, description: The six-digit authenticator code. }
    PasswordConfirmation:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          description: >-
            The account password, reverified so a borrowed session cannot
            weaken sign-in security on its own.
    PasskeyRenameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, maxLength: 60 }
    AuthMethod:
      type: string
      enum: [password, totp, passkey, recovery_code, demo]
    MFAPolicy:
      type: string
      enum: [none, administrators, all]
    PasskeySummary:
      type: object
      additionalProperties: false
      required: [id, name, credentialId, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        credentialId: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
    SecurityStatus:
      type: object
      additionalProperties: false
      required:
        [
          relyingPartyId,
          userHandle,
          totpEnrolled,
          passkeys,
          recoveryCodesRemaining,
          enrolled,
          passkeysAvailable,
          passkeysUnavailableReason,
          required,
          policy,
          authMethod,
        ]
      properties:
        relyingPartyId: { type: string }
        userHandle: { type: string }
        totpEnrolled: { type: boolean }
        totpConfirmedAt: { type: string, format: date-time }
        passkeys:
          type: array
          items: { $ref: "#/components/schemas/PasskeySummary" }
        recoveryCodesRemaining: { type: integer, minimum: 0 }
        enrolled: { type: boolean }
        passkeysAvailable: { type: boolean }
        passkeysUnavailableReason: { type: string }
        required: { type: boolean }
        policy: { $ref: "#/components/schemas/MFAPolicy" }
        authMethod: { $ref: "#/components/schemas/AuthMethod" }
    TOTPEnrollment:
      type: object
      additionalProperties: false
      required: [provisioningUri, secret]
      properties:
        provisioningUri: { type: string }
        secret: { type: string }
    RecoveryCodes:
      type: object
      additionalProperties: false
      required: [codes]
      properties:
        codes:
          type: array
          minItems: 10
          maxItems: 10
          items: { type: string }
    WebAuthnCredential:
      type: object
      description: >-
        A PublicKeyCredential from navigator.credentials.create(), serialized
        with base64url binary fields. Parsed by the WebAuthn library rather
        than field by field.
      required: [id, rawId, type, response]
      properties:
        id: { type: string }
        rawId: { type: string, description: base64url }
        type: { type: string, enum: [public-key] }
        authenticatorAttachment:
          { type: string, enum: [platform, cross-platform] }
        clientExtensionResults: { type: object, additionalProperties: true }
        response:
          type: object
          required: [clientDataJSON, attestationObject]
          properties:
            clientDataJSON: { type: string, description: base64url }
            attestationObject: { type: string, description: base64url }
            transports: { type: array, items: { type: string } }
    WebAuthnAssertion:
      type: object
      description: >-
        A PublicKeyCredential from navigator.credentials.get(), serialized with
        base64url binary fields.
      required: [id, rawId, type, response]
      properties:
        id: { type: string }
        rawId: { type: string, description: base64url }
        type: { type: string, enum: [public-key] }
        authenticatorAttachment:
          { type: string, enum: [platform, cross-platform] }
        clientExtensionResults: { type: object, additionalProperties: true }
        response:
          type: object
          required: [clientDataJSON, authenticatorData, signature]
          properties:
            clientDataJSON: { type: string, description: base64url }
            authenticatorData: { type: string, description: base64url }
            signature: { type: string, description: base64url }
            userHandle: { type: string, description: base64url }
    PlaylistTagRuleInput:
      type: object
      additionalProperties: false
      required: [enabled, match, imageDurationMs, tagIds]
      properties:
        enabled: { type: boolean }
        match: { type: string, enum: [any, all] }
        imageDurationMs: { type: integer, minimum: 1000, maximum: 86400000 }
        tagIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, format: uuid }
    PlaylistItemInput:
      type: object
      additionalProperties: false
      # Exactly one of assetId and layoutId; a Layout also needs durationMs.
      # Equivalent to excluding the other field in each branch, written
      # without "not", which the Swift OpenAPI generator cannot translate.
      oneOf:
        - required: [assetId]
        - required: [layoutId]
      dependentRequired:
        layoutId: [durationMs]
      properties:
        assetId: { type: string, format: uuid }
        layoutId:
          {
            type: string,
            format: uuid,
            description: Published Layout to play fullscreen for durationMs,
          }
        durationMs: { type: integer, minimum: 1 }
        fitMode:
          { type: string, enum: [contain, cover, stretch], default: contain }
        transition:
          { type: string, enum: [none, fade, crossfade], default: none }
        audioEnabled: { type: boolean, default: true }
        volume: { type: number, minimum: 0, maximum: 1, default: 1 }
        videoStartOffsetMs: { type: integer, minimum: 0 }
        videoEndOffsetMs: { type: integer, minimum: 1 }
        deliveryPolicy:
          {
            type: string,
            enum: [download, stream, automatic],
            default: download,
          }
        usePlayerDefaults:
          type: boolean
          default: false
          description: >-
            Resolve playback defaults from the effective Player configuration
            on Android and Linux at runtime.
    PlaylistBulkItemInput:
      type: object
      additionalProperties: false
      # Exactly one of transition and durationMs: an object with both
      # matches both branches, which oneOf refuses.
      oneOf:
        - required: [transition]
        - required: [durationMs]
      properties:
        itemIds:
          type: array
          uniqueItems: true
          description: Omit or send an empty array to update every item in a static playlist.
          items: { type: string, format: uuid }
        transition: { type: string, enum: [none, fade, crossfade] }
        durationMs:
          {
            type: integer,
            minimum: 1,
            description: Fixed duration applied to image items.,
          }
    PlaylistItem:
      type: object
      additionalProperties: false
      required:
        [
          id,
          assetId,
          position,
          fitMode,
          transition,
          audioEnabled,
          volume,
          deliveryPolicy,
          usePlayerDefaults,
          assetName,
          assetType,
          assetStatus,
          thumbnailUrl,
          createdAt,
          updatedAt,
          dynamic,
        ]
      properties:
        id: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        layoutId:
          {
            type: string,
            format: uuid,
            description: Fullscreen Layout played for durationMs,
          }
        position: { type: integer, minimum: 0 }
        durationMs: { type: integer, format: int64, minimum: 1 }
        fitMode: { type: string, enum: [contain, cover, stretch] }
        transition: { type: string, enum: [none, fade, crossfade] }
        audioEnabled: { type: boolean }
        volume: { type: number, minimum: 0, maximum: 1 }
        videoStartOffsetMs: { type: integer, format: int64, minimum: 0 }
        videoEndOffsetMs: { type: integer, format: int64, minimum: 1 }
        deliveryPolicy: { type: string, enum: [download, stream, automatic] }
        usePlayerDefaults: { type: boolean }
        assetName: { type: string }
        assetType: { type: string, enum: [image, video, widget, layout] }
        widgetProvider: { type: string }
        assetStatus:
          type: string
          description: >-
            Media lifecycle status (uploading through deleted); `draft`
            when the item points at a Layout with no published revision.
        assetDurationSeconds: { type: number, minimum: 0 }
        thumbnailUrl: { type: string }
        variantId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        availableFrom: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        dynamic: { type: boolean }
    PlaylistPreviewItem:
      type: object
      additionalProperties: false
      required: [id, name, type]
      description: >-
        Compact visual metadata returned with playlist list rows. Playback
        configuration is omitted; the playlist detail read stays the
        source of truth for it.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [image, video, widget, layout] }
        thumbnailUrl: { type: string }
    PlaylistLayoutUsage:
      type: object
      additionalProperties: false
      required: [id, name, published]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        published: { type: boolean }
    PlaylistUsageItem:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    PlaylistUsage:
      type: object
      additionalProperties: false
      description: >-
        Screens, schedules, and campaigns that play a playlist. Populated
        on the detail read only, and shaped like the Layout usage read so
        one panel renders both.
      required: [screens, schedules, campaigns]
      properties:
        screens:
          type: array
          items: { $ref: "#/components/schemas/PlaylistUsageItem" }
        schedules:
          type: array
          items: { $ref: "#/components/schemas/PlaylistUsageItem" }
        campaigns:
          type: array
          items: { $ref: "#/components/schemas/PlaylistUsageItem" }
    PlaylistTagRule:
      type: object
      additionalProperties: false
      required: [match, imageDurationMs, tags]
      properties:
        match: { type: string, enum: [any, all] }
        imageDurationMs: { type: integer, minimum: 0 }
        tags:
          type: array
          items: { $ref: "#/components/schemas/ContentTag" }
    Playlist:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          description,
          revision,
          hasUnpublishedChanges,
          createdAt,
          updatedAt,
          items,
          itemCount,
          warnings,
          layoutUsage,
          sourceType,
          usage,
          dataSourceIds,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        revision: { type: integer, format: int64 }
        draftRevision: { type: integer, format: int64 }
        publishedRevision: { type: integer, format: int64 }
        hasUnpublishedChanges: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/PlaylistItem" }
        itemCount: { type: integer, minimum: 0 }
        warnings:
          type: array
          items: { type: string }
        layoutUsage:
          type: array
          items: { $ref: "#/components/schemas/PlaylistLayoutUsage" }
        usage:
          oneOf:
            - { $ref: "#/components/schemas/PlaylistUsage" }
            - { type: "null" }
          description: >-
            Null on list rows; populated on the detail read only.
        previewItems:
          type: array
          description: >-
            Compact visual metadata returned by playlist list requests.
          items: { $ref: "#/components/schemas/PlaylistPreviewItem" }
        dataSourceIds:
          type: [array, "null"]
          description: >-
            Data Sources reached through this playlist's items. Only IDs;
            null on list rows and populated on the detail read only.
          items: { type: string, format: uuid }
        sourceType: { type: string, enum: [static, tag] }
        tagRule: { $ref: "#/components/schemas/PlaylistTagRule" }
    PlaylistList:
      type: object
      additionalProperties: false
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Playlist" }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
    PlaylistRevision:
      type: object
      additionalProperties: false
      required:
        [
          revision,
          name,
          itemCount,
          sourceType,
          createdAt,
          isCurrent,
          restorable,
          missingReferences,
        ]
      properties:
        revision: { type: integer, format: int64, minimum: 1 }
        name: { type: string }
        itemCount: { type: integer, minimum: 0 }
        sourceType: { type: string }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, format: uuid }
        authorName: { type: string }
        isCurrent: { type: boolean }
        restorable: { type: boolean }
        missingReferences: { type: integer, minimum: 0 }
    ScreenAssignmentGroup:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    ScreenAssignmentSchedule:
      type: object
      additionalProperties: false
      required: [id, name, playlistName, presentationType, priority, enabled]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        playlistName: { type: string }
        presentationType: { type: string, enum: [playlist, layout] }
        priority: { type: integer }
        enabled: { type: boolean }
    PlaybackPlanError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    PlaybackPlan:
      type: object
      additionalProperties: false
      required: [screenId, at, evaluatedAt, basis]
      description: Exactly one of current and historical is present. Historical evidence never includes current resource names, capability profiles, or synchronization state.
      properties:
        screenId: { type: string, format: uuid }
        at: { type: string, format: date-time }
        evaluatedAt: { type: string, format: date-time }
        basis:
          type: string
          enum:
            [
              current_configuration,
              recorded_expectation,
              historical_expectation_unavailable,
            ]
        current: { $ref: "#/components/schemas/PlaybackPlanCurrent" }
        historical: { $ref: "#/components/schemas/PlaybackPlanHistorical" }
    PlaybackPlanCurrent:
      type: object
      additionalProperties: false
      required: [candidates, synchronization, capabilities]
      properties:
        selected: { $ref: "#/components/schemas/PlaybackPlanSelection" }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/PlaybackPlanCandidate" }
        nextEvaluationAt:
          type: string
          format: date-time
          description: Next reevaluation boundary, not a guarantee that selected content changes.
        synchronization:
          { $ref: "#/components/schemas/PlaybackPlanSynchronization" }
        capabilities: { $ref: "#/components/schemas/PlaybackPlanCapabilities" }
    PlaybackPlanSelection:
      type: object
      additionalProperties: false
      required: [source, contentType, contentId, reason]
      properties:
        source:
          {
            type: string,
            enum: [takeover, quick_present, schedule, assignment],
          }
        contentType: { type: string, enum: [playlist, layout, asset] }
        contentId: { type: string, format: uuid }
        name:
          {
            type: string,
            description: "Current selected content name; absent for a missing resource.",
          }
        scheduleName:
          {
            type: string,
            description: "Current selected schedule name, when a schedule selects the content.",
          }
        selectionId: { type: string, format: uuid }
        revision:
          type: integer
          format: int64
          description: Current playlist or published Layout revision; absent for assets, missing resources, and unpublished Layouts.
        reason: { $ref: "#/components/schemas/PlaybackPlanSelectionReason" }
    PlaybackPlanSelectionReason:
      type: string
      enum:
        [
          active_takeover,
          active_quick_present,
          assigned_fallback,
          schedule_highest_precedence,
          schedule_disabled,
          schedule_not_active,
          schedule_lower_priority,
          schedule_less_specific,
          schedule_earlier_start,
          schedule_stable_id_tiebreak,
          no_active_takeover,
          no_active_quick_present,
          no_assignment,
        ]
    PlaybackPlanCandidate:
      type: object
      additionalProperties: false
      required: [source, status, reason]
      properties:
        source:
          {
            type: string,
            enum: [takeover, quick_present, schedule, assignment],
          }
        id: { type: string, format: uuid }
        status: { type: string, enum: [selected, superseded, inactive] }
        reason: { $ref: "#/components/schemas/PlaybackPlanSelectionReason" }
        scheduleReason:
          { $ref: "#/components/schemas/PlaybackPlanSelectionReason" }
        name:
          {
            type: string,
            description: "Current schedule candidate name, when available.",
          }
        schedule: { $ref: "#/components/schemas/PlaybackPlanScheduleCandidate" }
    PlaybackPlanScheduleCandidate:
      type: object
      additionalProperties: false
      required: [scheduleId, status, reason, priority, specificity]
      description: Scheduling authority evidence remains available when a temporary presentation supersedes the schedule.
      properties:
        scheduleId: { type: string, format: uuid }
        status: { type: string, enum: [selected, superseded, inactive] }
        reason: { $ref: "#/components/schemas/PlaybackPlanSelectionReason" }
        priority: { type: integer }
        specificity: { type: integer }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
    PlaybackPlanSynchronization:
      type: object
      additionalProperties: false
      required: [status, manifestVersion]
      description: Latest reported manifest synchronization; not content readiness or proof of playback.
      properties:
        status:
          {
            type: string,
            enum: [not_reported, current, preparing, out_of_date],
          }
        manifestVersion: { type: integer, format: int64 }
        activeManifestVersion: { type: integer, format: int64 }
        pendingManifestVersion: { type: integer, format: int64 }
    PlaybackPlanCapabilities:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status:
          {
            type: string,
            enum: [supported, blocked, unknown, not_applicable, unavailable],
          }
        reason:
          {
            type: string,
            enum:
              [
                no_selected_content,
                selected_content_not_found,
                selected_content_not_published,
                presentation_requirements_invalid,
                reported_requirements_supported,
                player_capabilities_not_reported,
                no_widget_presentation_requirements,
                manifest_v13_capabilities_not_reported,
                widget_requirements_unsupported,
              ],
          }
        evidence:
          { $ref: "#/components/schemas/PlaybackPlanCapabilityEvidence" }
    PlaybackPlanCapabilityEvidence:
      type: object
      additionalProperties: false
      required:
        [
          screenId,
          status,
          reason,
          reported,
          schemaVersions,
          nativeCapabilities,
          webRuntimeVersion,
          requiresManifestV13,
          widgets,
        ]
      description: Widget presentation requirements and reported support. No Data Source configuration or content payload is returned. Media decoder, network, readiness, and actual rendering behavior are outside this evidence.
      properties:
        screenId: { type: string, format: uuid }
        status:
          { type: string, enum: [supported, blocked, unknown, not_applicable] }
        reason:
          {
            type: string,
            enum:
              [
                reported_requirements_supported,
                player_capabilities_not_reported,
                no_widget_presentation_requirements,
                manifest_v13_capabilities_not_reported,
                widget_requirements_unsupported,
              ],
          }
        reported: { type: boolean }
        schemaVersions:
          type: array
          items: { type: integer }
        nativeCapabilities:
          type: object
          additionalProperties: { type: integer }
        webRuntimeVersion: { type: integer }
        requiresManifestV13: { type: boolean }
        widgets:
          type: array
          items: { $ref: "#/components/schemas/PlaybackPlanWidgetCapabilities" }
    PlaybackPlanWidgetCapabilities:
      type: object
      additionalProperties: false
      required: [assetId, name, status, reason]
      properties:
        assetId: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [supported, blocked, unknown] }
        reason:
          {
            type: string,
            enum:
              [
                player_capabilities_not_reported,
                component_capabilities_not_reported,
                no_presentation_requirements,
                presentation_requirements_unsupported,
                reported_requirements_supported,
              ],
          }
        selectedRenderer: { type: string, enum: [component, compatibility] }
        component:
          { $ref: "#/components/schemas/PlaybackPlanPresentationRequirements" }
        compatibility:
          { $ref: "#/components/schemas/PlaybackPlanPresentationRequirements" }
    PlaybackPlanPresentationRequirements:
      type: object
      additionalProperties: false
      required: [schemaVersion, capabilities, supported]
      properties:
        schemaVersion: { type: integer }
        capabilities:
          type: object
          additionalProperties: { type: integer }
        supported:
          type: [boolean, "null"]
          description: Null until the Player reports its presentation profile.
    PlaybackPlanHistorical:
      type: object
      additionalProperties: false
      properties:
        expectation:
          { $ref: "#/components/schemas/PlaybackPlanRecordedExpectation" }
    PlaybackPlanRecordedExpectation:
      type: object
      additionalProperties: false
      required:
        [
          windowId,
          presentationType,
          presentationId,
          presentationRevision,
          source,
          timezone,
          start,
        ]
      properties:
        windowId: { type: string, format: uuid }
        presentationType: { type: string }
        presentationId: { type: string }
        presentationRevision: { type: string }
        manifestVersion: { type: integer, format: int64 }
        scheduleId: { type: string }
        source: { type: string }
        timezone: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        supersededAt: { type: string, format: date-time }
        supersededReason: { type: string }
        contentType: { type: string }
        contentId: { type: string }
    ScreenPlaylistAssignment:
      type: object
      additionalProperties: false
      required:
        [
          screenId,
          manifestVersion,
          synchronizationStatus,
          groups,
          relevantSchedules,
          clockSkewWarningSeconds,
          playbackDisabled,
        ]
      properties:
        screenId: { type: string, format: uuid }
        playlistId: { type: string, format: uuid }
        playlistName: { type: string }
        playlistRevision: { type: integer, format: int64, minimum: 1 }
        layoutId: { type: string, format: uuid }
        layoutName: { type: string }
        layoutRevision: { type: integer, format: int64, minimum: 1 }
        presentationType: { type: string, enum: [playlist, layout] }
        manifestVersion: { type: integer, format: int64, minimum: 0 }
        playerActiveManifestVersion:
          { type: integer, format: int64, minimum: 0 }
        playerPendingManifestVersion:
          { type: integer, format: int64, minimum: 0 }
        synchronizationStatus:
          {
            type: string,
            enum: [not_reported, current, preparing, out_of_date],
          }
        downloadQueueCount: { type: integer, minimum: 0 }
        downloadedBytes: { type: integer, format: int64, minimum: 0 }
        requiredBytes: { type: integer, format: int64, minimum: 0 }
        cacheUsedBytes: { type: integer, format: int64, minimum: 0 }
        cacheLimitBytes: { type: integer, format: int64, minimum: 0 }
        currentItemId: { type: string, format: uuid }
        currentAssetId: { type: string, format: uuid }
        playbackState: { type: string }
        lastSynchronizationError: { type: string }
        lastPlaybackError: { type: string }
        currentScheduleId: { type: string, format: uuid }
        currentPlaylistId: { type: string, format: uuid }
        selectionSource:
          {
            type: string,
            enum: [takeover, quick_present, schedule, direct_fallback, none],
          }
        nextTransitionAt: { type: string, format: date-time }
        deviceClockOffsetSeconds: { type: integer, format: int64 }
        scheduleEvaluationError: { type: string }
        scheduleManifestVersion: { type: integer, format: int64, minimum: 0 }
        groups:
          type: array
          items: { $ref: "#/components/schemas/ScreenAssignmentGroup" }
        relevantSchedules:
          type: array
          items: { $ref: "#/components/schemas/ScreenAssignmentSchedule" }
        clockSkewWarningSeconds: { type: integer, minimum: 0 }
        currentWebsiteAssetId: { type: string, format: uuid }
        websiteState: { type: string }
        websiteLoadStartedAt: { type: string, format: date-time }
        websiteLoadCompletedAt: { type: string, format: date-time }
        websiteFailureCategory: { type: string }
        websiteBlockedNavigationCount: { type: integer, minimum: 0 }
        websiteCurrentHost: { type: string }
        websiteFallbackShown: { type: boolean }
        websiteRendererRecoveryCount: { type: integer, minimum: 0 }
        activeTakeoverId: { type: string, format: uuid }
        takeoverState: { type: string }
        takeoverPreparationProgress: { type: integer, minimum: 0 }
        playbackDisabled: { type: boolean }
        lastCommandId: { type: string, format: uuid }
        lastCommandState: { type: string }
        lastCommandResult: { type: string }
        lastCommandCompletedAt: { type: string, format: date-time }
        activeConfigRevision: { type: integer, format: int64, minimum: 0 }
        configurationError: { type: string }
    PowerAssistResult:
      type: string
      enum:
        [untested, confirmed_working, partially_working, failed, unsupported]
    PowerAssistInput:
      type: object
      additionalProperties: false
      description: >-
        Omitted results default to untested; every provided result must use
        a supported state.
      properties:
        deviceSleep: { $ref: "#/components/schemas/PowerAssistResult" }
        tvStandby: { $ref: "#/components/schemas/PowerAssistResult" }
        deviceWake: { $ref: "#/components/schemas/PowerAssistResult" }
        tvWake: { $ref: "#/components/schemas/PowerAssistResult" }
        inputSelection: { $ref: "#/components/schemas/PowerAssistResult" }
        tilecastStartup: { $ref: "#/components/schemas/PowerAssistResult" }
    PowerAssistConfirmation:
      type: object
      additionalProperties: false
      required: [screenId, lastTestedAt]
      properties:
        screenId: { type: string, format: uuid }
        lastTestedAt: { type: string, format: date-time }
    PlaylistRevisionList:
      type: object
      additionalProperties: false
      required: [items, kept]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PlaylistRevision" }
        kept: { type: integer, minimum: 1 }
    PlaylistRestoreResult:
      type: object
      additionalProperties: false
      description: >-
        A restore is a new edit, not a rewind of history: the state it
        replaced stays in the history. Skipped items are never
        resurrected and never silently dropped.
      required: [playlist, restoredFrom, newRevision, skippedItems]
      properties:
        playlist: { $ref: "#/components/schemas/Playlist" }
        restoredFrom: { type: integer, format: int64, minimum: 1 }
        newRevision: { type: integer, format: int64, minimum: 1 }
        skippedItems: { type: integer, minimum: 0 }
    LayoutPrimitiveBinding:
      type: object
      additionalProperties: false
      required: [dataSourceId, field]
      properties:
        dataSourceId: { type: string, format: uuid }
        field: { type: string, minLength: 1 }
        prefix: { type: string, maxLength: 500 }
        suffix: { type: string, maxLength: 500 }
        fallbackText: { type: string, maxLength: 500 }
        hideWhenEmpty: { type: boolean }
        format:
          {
            type: string,
            enum: [text, date-short, date-long, number, integer, currency],
          }
    LayoutPrimitive:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [text, rectangle, circle, line, group] }
        text: { type: string, maxLength: 4000 }
        fontFamily:
          {
            type: string,
            enum: [Inter, Roboto, Source Sans 3, Noto Sans],
            description: Only bundled fonts are accepted for text primitives,
          }
        fontSize: { type: number, minimum: 8, maximum: 600 }
        fontWeight: { type: integer, enum: [400, 500, 600, 700, 800] }
        textAlign: { type: string, enum: [left, center, right] }
        verticalAlign: { type: string, enum: [top, center, bottom] }
        color: { type: string }
        backgroundColor: { type: string }
        lineHeight: { type: number }
        letterSpacing: { type: number }
        padding: { type: number }
        borderWidth: { type: number }
        borderColor: { type: string }
        cornerRadius: { type: number }
        maximumLines: { type: integer, minimum: 1 }
        overflow: { type: string, enum: [clip, ellipsis] }
        autoFit: { type: boolean }
        minimumFontSize: { type: number }
        fillColor: { type: string }
        strokeColor: { type: string }
        strokeWidth: { type: number }
        binding: { $ref: "#/components/schemas/LayoutPrimitiveBinding" }
    LayoutPlayback:
      type: object
      additionalProperties: false
      properties:
        fit: { type: string, enum: [contain, cover, stretch] }
        muted: { type: boolean }
        loop: { type: boolean }
        fallback: { type: string, enum: [hide, background, previous] }
        cornerRadius: { type: number, minimum: 0, maximum: 1000 }
    LayoutPlacementOverrides:
      type: object
      additionalProperties: false
      deprecated: true
      description: >-
        Legacy Widget placement override bag. The listed values are accepted
        for saved-document compatibility but are ignored by Studio and Player.
      properties:
        fit: { type: string, enum: [contain, cover, stretch] }
        alignment: { type: string, enum: [left, center, right] }
        foregroundColor: { type: string }
        backgroundColor: { type: string }
        fallbackVisibility: { type: string, enum: [show, hide] }
        muted: { type: boolean }
    LayoutPlacement:
      type: object
      additionalProperties: false
      required:
        [id, type, name, x, y, width, height, layer, opacity, visible, locked]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [widget, asset, playlistZone, primitive] }
        name: { type: string }
        x: { type: number }
        y: { type: number }
        width: { type: number }
        height: { type: number }
        layer: { type: integer, minimum: 0, maximum: 999 }
        opacity: { type: number, minimum: 0, maximum: 1 }
        visible: { type: boolean }
        locked: { type: boolean }
        groupId: { type: string, format: uuid }
        widgetId: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        variantId: { type: string, format: uuid }
        playlistId: { type: string, format: uuid }
        overrides: { $ref: "#/components/schemas/LayoutPlacementOverrides" }
        primitive: { $ref: "#/components/schemas/LayoutPrimitive" }
        playback: { $ref: "#/components/schemas/LayoutPlayback" }
    LayoutCanvas:
      type: object
      additionalProperties: false
      required: [width, height, orientation, backgroundColor, safeAreaPercent]
      properties:
        width: { type: integer, minimum: 320, maximum: 7680 }
        height: { type: integer, minimum: 320, maximum: 7680 }
        orientation: { type: string, enum: [landscape, portrait, custom] }
        backgroundColor: { type: string }
        backgroundAssetId: { type: string, format: uuid }
        backgroundVariantId: { type: string, format: uuid }
        safeAreaPercent: { type: number, minimum: 0, maximum: 20 }
    LayoutDocument:
      type: object
      additionalProperties: false
      required: [schemaVersion, canvas, placements]
      properties:
        schemaVersion:
          {
            type: integer,
            enum: [2],
            description: Only schema version 2 is accepted.,
          }
        canvas: { $ref: "#/components/schemas/LayoutCanvas" }
        placements:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/LayoutPlacement" }
    LayoutDependency:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type: { type: string, enum: [widget, asset, playlist, data_source] }
        id: { type: string, format: uuid }
    LayoutUsageItem:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    LayoutUsage:
      type: object
      additionalProperties: false
      required: [screens, schedules, campaigns]
      properties:
        screens:
          type: array
          items: { $ref: "#/components/schemas/LayoutUsageItem" }
        schedules:
          type: array
          items: { $ref: "#/components/schemas/LayoutUsageItem" }
        campaigns:
          type: array
          items: { $ref: "#/components/schemas/LayoutUsageItem" }
    Layout:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          description,
          orientation,
          canvasWidth,
          canvasHeight,
          draft,
          draftRevision,
          hasUnpublishedChanges,
          createdAt,
          updatedAt,
          dependencies,
          usage,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        orientation: { type: string, enum: [landscape, portrait, custom] }
        canvasWidth: { type: integer, minimum: 320, maximum: 7680 }
        canvasHeight: { type: integer, minimum: 320, maximum: 7680 }
        draft: { $ref: "#/components/schemas/LayoutDocument" }
        draftRevision: { type: integer, format: int64 }
        publishedRevisionId: { type: string, format: uuid }
        publishedRevision: { type: integer, format: int64 }
        publishedAt: { type: string, format: date-time }
        hasUnpublishedChanges: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        previewImageUrl: { type: string }
        previewCaptureVersion: { type: integer, minimum: 1 }
        dependencies:
          type: array
          items: { $ref: "#/components/schemas/LayoutDependency" }
        usage: { $ref: "#/components/schemas/LayoutUsage" }
    LayoutSummary:
      type: object
      additionalProperties: false
      description: >-
        Compact Layout row returned by the Layout list. The editable
        draft, dependency list, and usage breakdown require the detail
        read.
      required:
        [
          id,
          name,
          description,
          orientation,
          canvasWidth,
          canvasHeight,
          draftRevision,
          hasUnpublishedChanges,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        orientation: { type: string, enum: [landscape, portrait, custom] }
        canvasWidth: { type: integer, minimum: 320, maximum: 7680 }
        canvasHeight: { type: integer, minimum: 320, maximum: 7680 }
        draftRevision: { type: integer, format: int64 }
        publishedRevisionId: { type: string, format: uuid }
        publishedRevision: { type: integer, format: int64 }
        publishedAt: { type: string, format: date-time }
        hasUnpublishedChanges: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        previewImageUrl: { type: string }
        previewCaptureVersion: { type: integer, minimum: 1 }
    LayoutList:
      type: object
      additionalProperties: false
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LayoutSummary" }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
    LayoutRevision:
      type: object
      additionalProperties: false
      required: [id, layoutId, revision, document, documentSha256, publishedAt]
      properties:
        id: { type: string, format: uuid }
        layoutId: { type: string, format: uuid }
        revision: { type: integer, format: int64, minimum: 1 }
        document: { $ref: "#/components/schemas/LayoutDocument" }
        documentSha256: { type: string }
        publishedBy: { type: string, format: uuid }
        publishedAt: { type: string, format: date-time }
    LayoutRevisionList:
      type: object
      additionalProperties: false
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LayoutRevision" }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
    PresentationReference:
      type: object
      additionalProperties: false
      oneOf:
        - required: [playlistId]
          properties:
            playlistId: { type: string, format: uuid }
        - required: [layoutId]
          properties:
            layoutId: { type: string, format: uuid }
    SchedulePreview:
      type: object
      additionalProperties: false
      required: [screenId, at, applicableSchedules, conflicts]
      properties:
        screenId: { type: string, format: uuid }
        at: { type: string, format: date-time }
        winningSchedule: { $ref: "#/components/schemas/Schedule" }
        winningPlaylistId: { type: string, format: uuid }
        directFallbackPlaylistId: { type: string, format: uuid }
        applicableSchedules:
          type: array
          items: { $ref: "#/components/schemas/Schedule" }
        nextTransition: { type: string, format: date-time }
        conflicts: { type: array, items: { type: string } }
    SchedulePreflight:
      type: object
      additionalProperties: false
      required:
        - draftEnabled
        - running
        - targetScreenCount
        - winningScreenCount
        - losingScreenCount
        - unsupportedScreenCount
        - competitors
        - competitorsTruncated
        - screens
        - screensTruncated
        - issues
      properties:
        draftEnabled: { type: boolean }
        checkedAt:
          type: string
          format: date-time
          description: >-
            The instant evaluated. Absent when the draft never runs again.
        running:
          type: boolean
          description: >-
            True when checkedAt is the current time inside an occurrence that
            has already started.
        targetScreenCount: { type: integer, minimum: 0 }
        winningScreenCount: { type: integer, minimum: 0 }
        losingScreenCount: { type: integer, minimum: 0 }
        unsupportedScreenCount: { type: integer, minimum: 0 }
        competitors:
          type: array
          items: { $ref: "#/components/schemas/SchedulePreflightCompetitor" }
        competitorsTruncated: { type: boolean }
        screens:
          type: array
          description: >-
            Screens where the draft does not win, bounded. Wins are counted
            in winningScreenCount, never listed.
          items: { $ref: "#/components/schemas/SchedulePreflightScreen" }
        screensTruncated: { type: boolean }
        issues:
          type: array
          items: { $ref: "#/components/schemas/SchedulePreflightIssue" }
    SchedulePreflightIssue:
      type: object
      additionalProperties: false
      required: [code, severity]
      properties:
        code:
          type: string
          enum: [display_control_unsupported, no_upcoming_run]
        severity: { type: string, enum: [blocking, warning] }
        screenCount: { type: integer, minimum: 1 }
    SchedulePreflightScreen:
      type: object
      additionalProperties: false
      required: [screenId, name, outcome]
      properties:
        screenId: { type: string, format: uuid }
        name: { type: string }
        outcome: { type: string, enum: [superseded, unsupported] }
        reason: { $ref: "#/components/schemas/PlaybackPlanSelectionReason" }
        winnerScheduleId: { type: string, format: uuid }
        winnerName: { type: string }
    SchedulePreflightCompetitor:
      type: object
      additionalProperties: false
      required:
        - scheduleId
        - name
        - priority
        - presentationType
        - affectedScreenCount
        - outranksDraftScreenCount
        - reason
      properties:
        scheduleId: { type: string, format: uuid }
        name: { type: string }
        priority: { type: integer }
        presentationType:
          type: string
          enum: [playlist, layout, display_control]
        affectedScreenCount: { type: integer, minimum: 1 }
        outranksDraftScreenCount: { type: integer, minimum: 0 }
        reason: { $ref: "#/components/schemas/PlaybackPlanSelectionReason" }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    LocationInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        addressLine1: { type: string, maxLength: 240 }
        addressLine2: { type: string, maxLength: 240 }
        city: { type: string, maxLength: 120 }
        state: { type: string, maxLength: 120 }
        postalCode: { type: string, maxLength: 40 }
        country: { type: string, maxLength: 120 }
        latitude: { type: [number, "null"], minimum: -90, maximum: 90 }
        longitude: { type: [number, "null"], minimum: -180, maximum: 180 }
    PlaylistDetailsInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 180 }
        description: { type: string, maxLength: 2000 }
    PlaylistItemOrderRequest:
      type: object
      additionalProperties: false
      required: [itemIds]
      properties:
        itemIds:
          type: array
          items: { type: string, format: uuid }
          description: Every item of the playlist, in the new order.
    ScreenGroupInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        presentationGatewayScreenId: { type: [string, "null"], format: uuid }
        clearPresentationGateway: { type: boolean }
    ScreenGroupMemberInput:
      type: object
      additionalProperties: false
      required: [screenId]
      properties:
        screenId: { type: string, format: uuid }
    PolicyUpdate:
      type: object
      additionalProperties: false
      required: [revision, values]
      properties:
        revision:
          type: integer
          format: int64
          description: Revision the caller last read; a stale value fails with 409.
        priority:
          type: integer
          description: Group policies only. Higher priority wins between groups.
        values:
          type: object
          additionalProperties: true
          description: Registry setting keys to values. Validated against the closed typed settings registry.
    ContentFolderInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        parentId: { type: [string, "null"], format: uuid }
        name: { type: string, minLength: 1 }
        description: { type: string }
    ContentCollectionInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
    ContentTagInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        color: { type: string }
    WebsiteInput:
      type: object
      additionalProperties: false
      required: [name, url]
      description: >-
        Omitted optional settings take the organization website defaults;
        javascriptEnabled and domStorageEnabled are distinguished from false by
        presence.
      properties:
        name: { type: string, minLength: 1, maxLength: 180 }
        description: { type: string, maxLength: 2000 }
        url: { type: string, minLength: 1, maxLength: 2048 }
        allowedHosts:
          type: array
          items: { type: string }
        javascriptEnabled: { type: boolean }
        domStorageEnabled: { type: boolean }
        cookiePolicy:
          { type: string, enum: [disabled, first_party, first_and_third_party] }
        reloadPolicy:
          { type: string, enum: [load_once, on_each_activation, interval] }
        refreshIntervalSeconds: { type: integer, minimum: 1 }
        loadTimeoutSeconds: { type: integer }
        zoomPercent: { type: integer }
        scrollX: { type: integer }
        scrollY: { type: integer }
        customUserAgent: { type: string }
        backgroundColor: { type: string }
        failureBehavior:
          {
            type: string,
            enum: [last_success, placeholder, fallback_image, skip],
          }
        fallbackImageAssetId: { type: [string, "null"], format: uuid }
    GitHubDevicePollRequest:
      type: object
      additionalProperties: false
      required: [flowId]
      properties:
        flowId: { type: string }
    PlayerCommandResultRequest:
      type: object
      additionalProperties: false
      required: [success]
      properties:
        success: { type: boolean }
        code: { type: string, maxLength: 80 }
        message: { type: string, maxLength: 240 }
    PlayerEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [pairingSessionId, enrollmentToken]
      properties:
        pairingSessionId: { type: string, format: uuid }
        enrollmentToken: { type: string }
    PairingSessionCreateRequest:
      type: object
      additionalProperties: false
      required: [installationId, metadata]
      properties:
        installationId:
          type: string
          description: Installation identity the Player read from the server.
        metadata: { $ref: "#/components/schemas/DeviceMetadata" }
    PlayerCommandRequest:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { $ref: "#/components/schemas/PlayerCommandType" }
        payload:
          type: object
          additionalProperties: true
          description: Per-type command arguments validated at queue time.
        idempotencyKey: { type: [string, "null"], format: uuid }
    UpdateDeploymentRequest:
      type: object
      additionalProperties: false
      required: [releaseId, name, mode]
      properties:
        releaseId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 180 }
        mode: { $ref: "#/components/schemas/UpdateDeploymentMode" }
        maintenanceWindowStart:
          type: [string, "null"]
          format: date-time
          description: Required and in the future when mode is maintenance_window.
        screenIds:
          type: array
          items: { type: string, format: uuid }
        groupIds:
          type: array
          items: { type: string, format: uuid }
        canarySize: { type: integer, minimum: 0, maximum: 50 }
