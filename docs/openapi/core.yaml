        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
  /api/v1/system/backups/jobs/{id}:
    get:
      operationId: getBackupJob
      description: >-
        Read a backup job. Requires an Owner with the admin scope.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
      responses:
        "200":
          description: Backup job
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/BackupJob" }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
        "404": { description: Backup job not found }
  /api/v1/system/backups/{id}/verify:
    post:
      operationId: verifyBackup
      description: >-
        Verify a system backup. Requires an Owner with the admin scope.
        Cookie-authenticated unsafe requests require X-CSRF-Token.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "202":
          description: Backup verification started
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/BackupJob" }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
        "404": { description: Backup not found }
  /api/v1/system/backups/{id}/plan:
    get:
      operationId: getRestorePlan
      description: >-
        Read the restore plan for a system backup. Requires an Owner with
        the admin scope.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
      responses:
        "200":
          description: Restore plan
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/BackupRestorePlan" }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
        "404": { description: Backup not found }
        "422": { description: Backup archive unreadable }
  /api/v1/system/backups/{id}/restore:
    post:
      operationId: restoreBackup
      description: >-
        Restore a system backup, confirming identity mismatch explicitly
        when the archive names another installation. Requires an Owner with
        the admin scope. Cookie-authenticated unsafe requests require
        X-CSRF-Token.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: false
        description: >-
          May be omitted entirely when the archive names this
          installation; only identity mismatches need confirmation.
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmIdentityMismatch: { type: boolean }
      responses:
        "202":
          description: Restore job started
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/BackupJob" }
        "400": { description: Invalid request body }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
        "404": { description: Backup not found }
  /api/v1/system/backups/{id}/download:
    get:
      operationId: downloadBackup
      description: >-
        Download a system backup archive. Requires an Owner with the admin
        scope.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
      responses:
        "200":
          description: Backup archive download
          content:
            application/x-tar:
              schema: { type: string, format: binary }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
        "404": { description: Backup not found }
  /api/v1/system/backups/{id}:
    delete:
      operationId: deleteBackup
      description: >-
        Delete a system backup. The last complete backup is protected until
        confirmed again. Requires an Owner with the write scope.
        Cookie-authenticated unsafe requests require X-CSRF-Token.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - { $ref: "#/components/parameters/CSRFToken" }
        - in: query
          name: force
          schema: { type: boolean }
          description: >-
            Confirm again when deleting the last complete backup.
      responses:
        "200":
          description: Backup deleted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [deleted]
                    properties:
                      deleted: { type: boolean, enum: [true] }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
        "404": { description: Backup not found }
        "409": { description: Job active or last complete backup }
        "422": { description: Archive incomplete }
