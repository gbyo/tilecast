          warnings,
          reversible,
          undoWindowMinutes,
        ]
      properties:
        action: { $ref: "#/components/schemas/BulkAction" }
        screens:
          type: array
          items: { $ref: "#/components/schemas/BulkScreenChange" }
        changeCount: { type: integer, minimum: 0 }
        unchangedCount: { type: integer, minimum: 0 }
        blockedCount: { type: integer, minimum: 0 }
        groupAddedCount: { type: integer, minimum: 0 }
        warnings:
          type: array
          items: { type: string }
        reversible: { type: boolean }
        undoWindowMinutes: { type: integer, minimum: 0 }
    BulkOperation:
      type: object
      additionalProperties: false
      required:
        [
          id,
          action,
          screenCount,
          appliedCount,
          skippedCount,
          failedCount,
          results,
          reversible,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        action: { $ref: "#/components/schemas/BulkAction" }
        screenCount: { type: integer, minimum: 0 }
        appliedCount: { type: integer, minimum: 0 }
        skippedCount: { type: integer, minimum: 0 }
        failedCount: { type: integer, minimum: 0 }
        results:
          type: array
          items: { $ref: "#/components/schemas/BulkScreenChange" }
        reversible: { type: boolean }
        undoExpiresAt: { type: string, format: date-time }
        undoneAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    SettingsExportOrganization:
      type: object
      additionalProperties: false
      description: >-
        Organization document as carried by settings exports. Definitions
        are stripped on export; the settings read carries them instead.
      required: [schemaVersion, revision, values, updatedAt]
      properties:
        schemaVersion: { type: integer, minimum: 1 }
        revision: { type: integer, format: int64, minimum: 0 }
        values: { type: object, additionalProperties: true }
        updatedAt: { type: string, format: date-time }
    SettingsExport:
      type: object
      additionalProperties: false
      required:
        [
          schemaVersion,
          exportedAt,
          tilecastVersion,
          organization,
          groupPolicies,
        ]
      properties:
        schemaVersion:
          { type: integer, enum: [1], description: Only version 1 is accepted. }
        exportedAt: { type: string, format: date-time }
        tilecastVersion: { type: string }
        organization:
          { $ref: "#/components/schemas/SettingsExportOrganization" }
        groupPolicies:
          type: array
          items: { type: object, additionalProperties: true }
        screenPolicies:
          type: array
          items: { type: object, additionalProperties: true }
    SettingsImportPreview:
      type: object
      additionalProperties: false
      required:
        [
          valid,
          changedKeys,
          groupPolicyCount,
          screenPolicyCount,
          requiresConfirmation,
        ]
      properties:
        valid: { type: boolean, enum: [true] }
        changedKeys:
          type: array
          items: { type: string }
        groupPolicyCount: { type: integer, minimum: 0 }
        screenPolicyCount: { type: integer, minimum: 0 }
        requiresConfirmation: { type: boolean, enum: [true] }
    MaintenanceResult:
      type: object
      additionalProperties: false
      required: [action, status]
      properties:
        action: { type: string }
        status: { type: string, enum: [accepted] }
    BackupComponent:
      type: object
      additionalProperties: false
      required: [name, fileCount, totalBytes]
      properties:
        name: { type: string }
        fileCount: { type: integer, minimum: 0 }
        totalBytes: { type: integer, minimum: 0 }
    BackupArchive:
      type: object
      additionalProperties: false
      required:
        [
          id,
          fileName,
          kind,
          status,
          sizeBytes,
          archiveSha256,
          tilecastVersion,
          schemaVersion,
          installationId,
          organizationName,
          components,
          verification,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string }
        kind: { type: string }
        status: { type: string }
        sizeBytes: { type: integer, minimum: 0 }
        archiveSha256: { type: string }
        tilecastVersion: { type: string }
        schemaVersion: { type: integer, minimum: 1 }
        installationId: { type: string }
        organizationName: { type: string }
        components:
          type: array
          items: { $ref: "#/components/schemas/BackupComponent" }
        verification: { type: string }
        verifiedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    BackupJob:
      type: object
      additionalProperties: false
      required: [id, kind, trigger, status, phase, progressPercent, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [backup, verify, restore] }
        trigger: { type: string }
        archiveId: { type: string, format: uuid }
        status: { type: string }
        phase: { type: string }
        progressPercent: { type: integer, minimum: 0, maximum: 100 }
        errorCode: { type: string }
        errorMessage: { type: string }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
    BackupScheduleState:
      type: object
      additionalProperties: false
      properties:
        lastRunAt: { type: string, format: date-time }
        nextRunAt: { type: string, format: date-time }
    BackupList:
      type: object
      additionalProperties: false
      required: [backups, currentJob, recentJobs, lastSuccessful, schedule]
      properties:
        backups:
          type: array
          items: { $ref: "#/components/schemas/BackupArchive" }
        currentJob:
          oneOf:
            - { $ref: "#/components/schemas/BackupJob" }
            - { type: "null" }
          description: Null when no job is active or known.
        recentJobs:
          type: array
          items: { $ref: "#/components/schemas/BackupJob" }
        lastSuccessful:
          oneOf:
            - { $ref: "#/components/schemas/BackupArchive" }
            - { type: "null" }
          description: Null when no backup has completed yet.
        schedule: { $ref: "#/components/schemas/BackupScheduleState" }
    BackupWorkerStatus:
      type: object
      additionalProperties: false
      description: >-
        Live in-memory worker heartbeat for the active job. Unlike the
        stored BackupJob, it carries no trigger, archive link, timestamps,
        or error detail.
      required: [jobId, kind, status, phase, progressPercent]
      properties:
        jobId: { type: string, format: uuid }
        kind: { type: string }
        status: { type: string }
        phase: { type: string }
        progressPercent: { type: integer, minimum: 0, maximum: 100 }
    BackupRestorePlan:
      type: object
      additionalProperties: false
      required:
        [
          archive,
          organizationName,
          installationId,
          tilecastVersion,
          schemaVersion,
          createdAt,
          sizeBytes,
          components,
          identityMismatch,
          currentInstallationId,
        ]
      properties:
        archive: { $ref: "#/components/schemas/BackupArchive" }
        organizationName: { type: string }
        installationId: { type: string }
        tilecastVersion: { type: string }
        serverChannel: { type: string }
        buildCommit: { type: string }
        buildDate: { type: string }
        schemaVersion: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        sizeBytes: { type: integer, minimum: 0 }
        components:
          type: array
          items: { $ref: "#/components/schemas/BackupComponent" }
        identityMismatch: { type: boolean }
        currentInstallationId: { type: string }
    SystemHealth:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status: { type: string, enum: [ok] }
        service: { type: string, enum: [tilecast-server] }
    MediaDiagnostics:
      type: object
      additionalProperties: false
      required:
        [
          availableStorageBytes,
          maximumUploadBytes,
          workerCount,
          ffmpegAvailable,
          ffprobeAvailable,
        ]
      properties:
        availableStorageBytes: { type: integer, minimum: 0 }
        maximumUploadBytes: { type: integer, minimum: 1 }
        workerCount: { type: integer, minimum: 1 }
        ffmpegAvailable: { type: boolean }
        ffprobeAvailable: { type: boolean }
    SnapshotUsage:
      type: object
      additionalProperties: false
      required: [totalBytes, count, note]
      properties:
        totalBytes: { type: integer, minimum: 0 }
        count: { type: integer, minimum: 0 }
        note: { type: string }
    ScreenSnapshot:
      type: object
      additionalProperties: false
      required: [id, screenId, capturedAt, width, height, fileSize, trigger]
      properties:
        id: { type: string, format: uuid }
        screenId: { type: string, format: uuid }
        capturedAt: { type: string, format: date-time }
        width: { type: integer, minimum: 0 }
        height: { type: integer, minimum: 0 }
        fileSize: { type: integer, minimum: 0 }
        playerVersion: { type: string }
        trigger: { type: string, enum: [scheduled, manual] }
    ScreenSnapshotList:
      type: object
      additionalProperties: false
      required: [items, enabled, retentionDays, maxPerScreen, proofNote]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ScreenSnapshot" }
        enabled: { type: boolean }
        retentionDays: { type: integer, minimum: 0 }
        maxPerScreen: { type: integer, minimum: 0 }
        proofNote: { type: string }
    PreviewSession:
      type: object
      additionalProperties: false
      required: [active, captureIntervalSeconds, captureNow]
      properties:
        active: { type: boolean }
        expiresAt: { type: string, format: date-time }
        captureIntervalSeconds: { type: integer, minimum: 0 }
        captureNow: { type: boolean }
    ScreenPreviewMetadata:
      type: object
      additionalProperties: false
      required: [screenId, status, imageAvailable, updatedAt]
      properties:
        screenId: { type: string, format: uuid }
        status:
          {
            type: string,
            enum: [unavailable, capture_error, available, loading],
          }
        leaseExpiresAt: { type: string, format: date-time }
        capturedAt: { type: string, format: date-time }
        playerVersion: { type: string }
        width: { type: integer, minimum: 0 }
        height: { type: integer, minimum: 0 }
        fileSize: { type: integer, minimum: 0 }
        captureFailureStatus: { type: string }
        imageAvailable: { type: boolean }
        updatedAt: { type: string, format: date-time }
    LiveStreamSession:
      type: object
      additionalProperties: false
      required:
        [
          id,
          screenId,
          active,
          expiresAt,
          frameIntervalMillis,
          maxWidth,
          maxHeight,
          maxFrameBytes,
        ]
      properties:
        id: { type: string, format: uuid }
        screenId: { type: string, format: uuid }
        active: { type: boolean }
        expiresAt: { type: string, format: date-time }
        frameIntervalMillis: { type: integer, minimum: 0 }
        maxWidth: { type: integer, minimum: 0 }
        maxHeight: { type: integer, minimum: 0 }
        maxFrameBytes: { type: integer, minimum: 0 }
    SystemStatus:
      type: object
      additionalProperties: false
      required:
        [
          tilecastVersion,
          channel,
          buildCommit,
          buildDate,
          uptimeSeconds,
          goVersion,
          database,
          media,
          activeProcessingJobs,
          pendingCommands,
          connectedScreens,
          serverTimezone,
          deployment,
        ]
      properties:
        tilecastVersion: { type: string }
        channel: { type: string, enum: [stable, development] }
        buildCommit: { type: string }
        buildDate: { type: string }
        uptimeSeconds: { type: integer, minimum: 0 }
        goVersion: { type: string }
        database:
          type: object
          additionalProperties: false
          required: [status, migrationVersion, postgresVersion]
          properties:
            status: { type: string }
            migrationVersion: { type: string }
            postgresVersion: { type: string }
        media:
          additionalProperties: true
          type: object
          description: >-
            Media diagnostics bag when storage is healthy, a degraded
            marker otherwise.
        activeProcessingJobs: { type: integer, minimum: 0 }
        pendingCommands: { type: integer, minimum: 0 }
        connectedScreens: { type: integer, minimum: 0 }
        serverTimezone: { type: string }
        deployment:
          additionalProperties: true
          type: object
          description: Deployment capability markers.
    Takeover:
      type: object
      additionalProperties: false
      description: >-
        Compact takeover row returned by the takeover list, with live
        per-state screen counts. The per-screen breakdown requires the
        detail read.
      required:
        [
          id,
          name,
          description,
          playlistId,
          playlistName,
          status,
          expiresAt,
          affectedCount,
          activeCount,
          preparingCount,
          failedCount,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        playlistId: { type: string, format: uuid }
        playlistName: { type: string }
        status: { type: string, enum: [active, expired, cancelled] }
        activatedAt: { type: [string, "null"], format: date-time }
        expiresAt: { type: string, format: date-time }
        cancelledAt: { type: [string, "null"], format: date-time }
        cancellationReason: { type: string }
        affectedCount: { type: integer, minimum: 0 }
        activeCount: { type: integer, minimum: 0 }
        preparingCount: { type: integer, minimum: 0 }
        failedCount: { type: integer, minimum: 0 }
    TakeoverList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Takeover" }
        total: { type: integer, minimum: 0 }
    TakeoverScreenState:
      type: object
      additionalProperties: false
      required: [screenId, screenName, manifestVersion, state, lastUpdatedAt]
      properties:
        screenId: { type: string, format: uuid }
        screenName: { type: string }
        manifestVersion: { type: integer, format: int64 }
        state: { type: string }
        lastUpdatedAt: { type: string, format: date-time }
        failureCode: { type: [string, "null"] }
        failureMessage: { type: [string, "null"] }
        preparedAt: { type: [string, "null"], format: date-time }
        activatedAt: { type: [string, "null"], format: date-time }
        restoredAt: { type: [string, "null"], format: date-time }
    TakeoverDetail:
      type: object
      additionalProperties: false
      description: >-
        Takeover detail with the per-screen rollout states. Unlike the
        list row, the detail carries no aggregate counts.
      required:
        [
          id,
          name,
          description,
          status,
          playlistId,
          playlistName,
          expiresAt,
          screens,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        status: { type: string, enum: [active, expired, cancelled] }
        playlistId: { type: string, format: uuid }
        playlistName: { type: string }
        activatedAt: { type: [string, "null"], format: date-time }
        expiresAt: { type: string, format: date-time }
        cancelledAt: { type: [string, "null"], format: date-time }
        cancellationReason: { type: string }
        screens:
          type: array
          items: { $ref: "#/components/schemas/TakeoverScreenState" }
    TakeoverActivation:
      type: object
      additionalProperties: false
      required: [id, status, affectedCount, expiresAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [active] }
        affectedCount: { type: integer, minimum: 0 }
        expiresAt: { type: string, format: date-time }
    TakeoverCancellation:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [cancelled] }
    NotificationStatus:
      type: object
      additionalProperties: false
      required:
        [
          emailConfigured,
          emailUnavailableReason,
          pendingCount,
          recentFailureCount,
          hasDeliveryHistory,
        ]
      properties:
        emailConfigured: { type: boolean }
        emailUnavailableReason: { type: string }
        pendingCount: { type: integer, minimum: 0 }
        recentFailureCount: { type: integer, minimum: 0 }
        hasDeliveryHistory: { type: boolean }
    NotificationCategory:
      type: string
      enum: [incident, content_health, backup, update]
    NotificationDelivery:
      type: object
      additionalProperties: false
      required:
        [
          id,
          eventKey,
          category,
          severity,
          channel,
          target,
          subject,
          status,
          attempts,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        eventKey: { type: string }
        category: { $ref: "#/components/schemas/NotificationCategory" }
        severity: { type: string, enum: [info, warning, error, critical] }
        channel: { type: string, enum: [email, webhook] }
        target: { type: string }
        subject: { type: string }
        status: { type: string, enum: [pending, sent, failed, cancelled] }
        attempts: { type: integer, minimum: 0 }
        lastError: { type: string }
        createdAt: { type: string, format: date-time }
        sentAt: { type: string, format: date-time }
    NotificationWebhook:
      type: object
      additionalProperties: false
      required: [id, name, url, enabled, categories, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        url: { type: string, format: uri }
        enabled: { type: boolean }
        categories:
          type: array
          items: { $ref: "#/components/schemas/NotificationCategory" }
        lastAttemptAt: { type: string, format: date-time }
        lastSuccessAt: { type: string, format: date-time }
        lastError: { type: string }
        createdAt: { type: string, format: date-time }
    NotificationWebhookCreated:
      type: object
      additionalProperties: false
      description: >-
        The signing secret is returned exactly once. There is no
        endpoint that reads it back.
      required: [webhook, signingSecret, secretNotice]
      properties:
        webhook: { $ref: "#/components/schemas/NotificationWebhook" }
        signingSecret: { type: string }
        secretNotice: { type: string }
    PluginRequirement:
      type: object
      required: [kind, label]
      properties:
        kind:
          {
            type: string,
            enum: [platform, hardware, region, network, provider, player],
          }
        label: { type: string }
        description: { type: string }
    PluginAttention:
      type: object
      required: [code, message]
      properties:
        code:
          {
            type: string,
            examples:
              [
                no_compatible_player,
                no_alert_rules,
                poll_failing,
                data_without_installation,
              ],
          }
        message: { type: string }
    CatalogPlugin:
      type: object
      required:
        [
          id,
          version,
          name,
          description,
          category,
          icon,
          managementPath,
          instanceNounSingular,
          instanceNounPlural,
          requirements,
          capabilities,
          installed,
          installable,
          configured,
          active,
          instanceCount,
          attention,
        ]
      properties:
        id: { type: string, pattern: "^[a-z][a-z0-9_]{0,79}$" }
        version:
          {
            type: integer,
            minimum: 1,
            description: Definition contract version compiled into this release,
          }
        name: { type: string }
        description: { type: string }
        category:
          { type: string, enum: [Display, Automation, Workflow, Hardware] }
        icon:
          {
            type: string,
            description: Bounded icon identifier; unknown values render a generic icon,
          }
        managementPath:
          {
            type: string,
            description: "Studio route; a navigation hint, not an authorization boundary",
          }
        instanceNounSingular: { type: string }
        instanceNounPlural: { type: string }
        requirements:
          {
            type: array,
            items: { $ref: "#/components/schemas/PluginRequirement" },
          }
        capabilities: { type: array, items: { type: string } }
        documentation: { type: string }
        installed: { type: boolean }
        installable: { type: boolean }
        configured: { type: boolean }
        active: { type: boolean }
        instanceCount: { type: integer, minimum: 0 }
        attention:
          {
            type: array,
            items: { $ref: "#/components/schemas/PluginAttention" },
          }
    PluginAutomationOperation:
      type: object
      required: [operationId, method, path, risk, cliPath, mcpAction]
      properties:
        operationId: { type: string }
        method: { type: string, enum: [get, post, put, patch, delete] }
        path: { type: string }
        risk:
          {
            type: string,
            enum: [read, routine, sensitive, high-impact, security-critical],
          }
        cliPath: { type: array, items: { type: string } }
        mcpAction: { type: string }
        input: { type: string, enum: [fields, document] }
        description: { type: string }
    PluginAutomationExclusion:
      type: object
      required: [operationId, reason]
      properties:
        operationId: { type: string }
        reason: { type: string }
    PluginAutomation:
      type: object
      required: [apiVersion, plugin, operations, exclusions]
      properties:
        apiVersion: { type: integer, const: 1 }
        plugin: { type: string, pattern: "^[a-z][a-z0-9_]{0,79}$" }
        operations:
          {
            type: array,
            items: { $ref: "#/components/schemas/PluginAutomationOperation" },
          }
        exclusions:
          {
            type: array,
            items: { $ref: "#/components/schemas/PluginAutomationExclusion" },
          }
    PluginCatalog:
      type: object
      required: [items, unsupportedInstallations]
      properties:
        items:
          { type: array, items: { $ref: "#/components/schemas/CatalogPlugin" } }
        unsupportedInstallations:
          type: array
          description: Installation rows naming plugins this release does not know. Preserved and inert.
          items:
            type: object
            required: [pluginId, installedAt]
            properties:
              pluginId: { type: string }
              installedAt: { type: string, format: date-time }
    PluginStoreSource:
      type: object
      required: [kind]
      description: Where a store entry comes from. "included" entries are compiled into the release; "marketplace" entries come from the official catalog and carry its catalog ID; "custom" entries come from a bound repository and carry its URL. Clients must tolerate values they do not know.
      properties:
        kind:
          type: string
          x-extensible-enum: [included, marketplace, custom]
        catalogId: { type: string }
        repository: { type: string }
    PluginStoreCustom:
      type: object
      required:
        [
          version,
          name,
          publisherId,
          publisherName,
          tilecastRange,
          digest,
          compatible,
          installed,
        ]
      description: "One custom-repository package joined with this installation's state. Exactly one of plugin, marketplace, and custom is present on a store entry. Carries no update flag: freshness needs a live re-resolution through an update check."
      properties:
        version: { type: string }
        name: { type: string }
        description: { type: string }
        publisherId: { type: string }
        publisherName: { type: string }
        license: { type: string }
        tilecastRange: { type: string }
        digest:
          {
            type: string,
            description: "Last verified artifact digest as sha256 colon hex.",
          }
        compatible: { type: boolean }
        installed: { type: boolean }
        installedVersion: { type: string }
    PluginStoreMarketplace:
      type: object
      required:
        [
          version,
          name,
          publisherId,
          publisherName,
          tilecastRange,
          digest,
          repository,
          compatible,
          installed,
          updateAvailable,
        ]
      description: One marketplace listing joined with this installation's state. Exactly one of plugin, marketplace, and custom is present on a store entry.
      properties:
        version: { type: string }
        name: { type: string }
        description: { type: string }
        publisherId: { type: string }
        publisherName: { type: string }
        license: { type: string }
        tilecastRange: { type: string }
        digest:
          {
            type: string,
            description: "Pinned artifact digest as sha256 colon hex.",
          }
        repository:
          {
            type: string,
            format: uri,
            description: "Public source repository as a github.com https URL with an owner and name.",
          }
        documentation: { type: string, format: uri }
        issues: { type: string, format: uri }
        categories: { type: array, items: { type: string } }
        featured: { type: boolean }
        compatible: { type: boolean }
        installed: { type: boolean }
        installedVersion: { type: string }
        updateAvailable: { type: boolean }
    PluginMarketplaceStatus:
      type: object
      required: [stale]
      description: The cached catalog behind marketplace entries. Fetch failures keep serving the last valid cache and record the error here.
      properties:
        lastFetchedAt: { type: string, format: date-time }
        stale: { type: boolean }
        error: { type: string }
    PluginStoreEntry:
      type: object
      required: [packageId, source]
      description: One normalized plugin-store row. The package identity and provenance every source shares, plus the source-owned detail. Exactly one of plugin, marketplace, and custom is present.
      properties:
        packageId: { type: string, pattern: "^[a-z][a-z0-9_.:-]{0,127}$" }
        source: { $ref: "#/components/schemas/PluginStoreSource" }
        plugin: { $ref: "#/components/schemas/CatalogPlugin" }
        marketplace: { $ref: "#/components/schemas/PluginStoreMarketplace" }
        custom: { $ref: "#/components/schemas/PluginStoreCustom" }
    PluginStore:
      type: object
      required: [items, unsupportedInstallations, marketplace]
      properties:
        items:
          {
            type: array,
            items: { $ref: "#/components/schemas/PluginStoreEntry" },
          }
        marketplace: { $ref: "#/components/schemas/PluginMarketplaceStatus" }
        unsupportedInstallations:
          type: array
          description: Installation rows naming plugins this release does not know. Preserved and inert.
          items:
            type: object
            required: [pluginId, installedAt]
            properties:
              pluginId: { type: string }
              installedAt: { type: string, format: date-time }
    PackageManifestSummary:
      type: object
      required:
        [name, description, publisherId, publisherName, license, tilecastRange]
      description: The human-readable face of an installed or resolved package manifest.
      properties:
        name: { type: string }
        description: { type: string }
        publisherId: { type: string }
        publisherName: { type: string }
        license: { type: string }
        tilecastRange: { type: string }
    PackageContribution:
      type: object
      required: [kind, id, path]
      description: "One activated contribution: its kind, its package-qualified identity, and its path inside the package."
      properties:
        kind: { type: string, x-extensible-enum: [plugin, widget, dataSource] }
        id: { type: string }
        path: { type: string }
    PackageSourceBinding:
      type: object
      required:
        [owner, name, repositoryUrl, resolvedDigest, resolvedAt, addedAt]
      description: The custom repository binding behind an installed custom package.
      properties:
        owner: { type: string }
        name: { type: string }
        repositoryUrl: { type: string, format: uri }
        resolvedDigest:
          {
            type: string,
            description: "Last verified artifact digest as sha256 colon hex.",
          }
        resolvedAt: { type: string, format: date-time }
        addedAt: { type: string, format: date-time }
    InstalledPackage:
      type: object
      required:
        [
          packageId,
          version,
          manifest,
          digest,
          sourceKind,
          sourceReference,
          registryReference,
          trust,
          installedAt,
          installedBy,
          activatedAt,
          hasRollback,
          contributions,
        ]
      description: One installed extension package with its contributions and, for custom packages, the repository binding.
      properties:
        packageId: { type: string }
        version: { type: string }
        manifest: { $ref: "#/components/schemas/PackageManifestSummary" }
        digest:
          {
            type: string,
            description: "Pinned artifact digest as sha256 colon hex.",
          }
        sourceKind: { type: string, x-extensible-enum: [custom, marketplace] }
        sourceReference: { type: string }
        registryReference: { type: string }
        signerIdentity: { type: string }
        trust:
          { type: string, x-extensible-enum: [verified, unsigned_development] }
        installedAt: { type: string, format: date-time }
        installedBy: { type: [string, "null"], format: uuid }
        activatedAt: { type: string, format: date-time }
        hasRollback: { type: boolean }
        contributions:
          type: array
          items: { $ref: "#/components/schemas/PackageContribution" }
        source: { $ref: "#/components/schemas/PackageSourceBinding" }
    GitHubInstallReview:
      type: object
      required:
        [
          packageId,
          version,
          manifest,
          compatible,
          contributions,
          digest,
          registry,
          releaseTag,
          owner,
          repo,
          repositoryUrl,
          trust,
          installed,
        ]
      description: "The install review for a resolved repository: identity, version, provenance, and installed state. Resolving persists nothing."
      properties:
        packageId: { type: string }
        version: { type: string }
        manifest: { $ref: "#/components/schemas/PackageManifestSummary" }
        compatible: { type: boolean }
        contributions:
          type: array
          items:
            type: object
            required: [type, path]
            properties:
              type: { type: string }
              path: { type: string }
              id:
                type: string
                description: Package-qualified contribution ID read from the artifact's nested manifest. Present on update checks, which read the artifact; absent when the review resolved only the published manifest.
        digest:
          {
            type: string,
            description: "Pinned artifact digest as sha256 colon hex.",
          }
        registry: { type: string }
        releaseTag: { type: string }
        releaseName: { type: string }
        publishedAt: { type: string, format: date-time }
        owner: { type: string }
        repo: { type: string }
        repositoryUrl: { type: string, format: uri }
        signer: { type: string }
        trust:
          { type: string, x-extensible-enum: [verified, unsigned_development] }
        installed: { type: boolean }
        installedVersion: { type: string }
    PackageUpdateCheck:
      type: object
      required: [installed, available, upToDate, lastChecked]
      description: The latest artifact for an installed package, resolved without activating anything. latest is present when available.
      properties:
        installed: { $ref: "#/components/schemas/InstalledPackage" }
        available: { type: boolean }
        upToDate: { type: boolean }
        lastChecked: { type: string, format: date-time }
        latest: { $ref: "#/components/schemas/GitHubInstallReview" }
    PluginInUseError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: { type: string, const: plugin_in_use }
            message: { type: string }
            details:
              type: object
              required: [pluginId, resources]
              properties:
                pluginId: { type: string }
                resources:
                  type: array
                  items:
                    type: object
                    required: [kind, count, label]
                    properties:
                      kind: { type: string }
                      count: { type: integer, minimum: 1 }
                      label: { type: string }
    PackageInUseDetails:
      type: object
      required: [packageId, resources]
      description: The package and the contributed content that blocks the operation.
      properties:
        packageId: { type: string }
        resources:
          type: array
          items:
            type: object
            required: [kind, count, label, resolution]
            properties:
              kind: { type: string }
              count: { type: integer, minimum: 1 }
              label: { type: string }
              resolution: { type: string }
    PackageInUseError:
      type: object
      required: [error]
      description: A removal, update, or rollback blocked by contributed content the operation would strand. The operation deletes installation state only, never content, so the operator deletes the listed content first.
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: { type: string, const: package_in_use }
            message: { type: string }
            details: { $ref: "#/components/schemas/PackageInUseDetails" }
    PackageUpdateConflictError:
      type: object
      required: [error]
      description: A 409 from applying a package update. Only package_in_use carries details, listing the content the update would strand.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                [
                  update_check_expired,
                  package_mismatch,
                  contribution_collision,
                  source_conflict,
                  package_in_use,
                ]
            message: { type: string }
            details: { $ref: "#/components/schemas/PackageInUseDetails" }
    PackageRollbackConflictError:
      type: object
      required: [error]
      description: A 409 from restoring the previous package activation. Only package_in_use carries details, listing the content the rollback would strand.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, enum: [no_rollback, package_in_use] }
            message: { type: string }
            details: { $ref: "#/components/schemas/PackageInUseDetails" }
    PresentationNetworkSecurity:
      type: string
      enum: [wpa_psk, wpa_eap_peap_mschapv2]
      description: WPA2/WPA3 Personal PSK or WPA2-Enterprise PEAP/MSCHAPv2.
    PresentationNetworkAuth:
      type: object
      additionalProperties: false
      properties:
        identity: { type: string, maxLength: 253 }
        anonymousIdentity: { type: string, maxLength: 253 }
        caCertificatePem:
          type: string
          maxLength: 32768
          description: Public CA certificate chain for Enterprise server validation.
        domainSuffixMatch:
          type: string
          maxLength: 253
          description: Expected RADIUS server domain; requires caCertificatePem.
    PresentationNetwork:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          ssid,
          hidden,
          security,
          securityLabel,
          auth,
          credentialSet,
          configRevision,
          assignedScreens,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        ssid: { type: string, minLength: 1, maxLength: 32 }
        hidden: { type: boolean }
        security: { $ref: "#/components/schemas/PresentationNetworkSecurity" }
        securityLabel: { type: string }
        auth: { $ref: "#/components/schemas/PresentationNetworkAuth" }
        credentialSet:
          type: boolean
          description: True means a credential exists; its value is never returned.
        secretUpdatedAt: { type: string, format: date-time }
        configRevision: { type: integer, format: int64, minimum: 1 }
        assignedScreens: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PresentationNetworkSecret:
      type: string
      format: password
      minLength: 1
      maxLength: 128
      writeOnly: true
      description: >-
        WPA PSK/passphrase or Enterprise password. Write-only; never returned
        by Studio, logged, audited, or placed in a player command.
    PresentationNetworkCreateInput:
      type: object
      additionalProperties: false
      required: [name, ssid, hidden, security, secret]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        ssid: { type: string, minLength: 1, maxLength: 32 }
        hidden: { type: boolean, default: false }
        security: { $ref: "#/components/schemas/PresentationNetworkSecurity" }
        secret: { $ref: "#/components/schemas/PresentationNetworkSecret" }
        identity: { type: string, maxLength: 253 }
        anonymousIdentity: { type: string, maxLength: 253 }
        caCertificatePem: { type: string, maxLength: 32768 }
        domainSuffixMatch: { type: string, maxLength: 253 }
    PresentationNetworkUpdateInput:
      type: object
      additionalProperties: false
      required: [name, ssid, hidden, security]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        ssid: { type: string, minLength: 1, maxLength: 32 }
        hidden: { type: boolean }
        security: { $ref: "#/components/schemas/PresentationNetworkSecurity" }
        secret: { $ref: "#/components/schemas/PresentationNetworkSecret" }
        identity: { type: string, maxLength: 253 }
        anonymousIdentity: { type: string, maxLength: 253 }
        caCertificatePem: { type: string, maxLength: 32768 }
        domainSuffixMatch: { type: string, maxLength: 253 }
    PresentationNetworkAssignment:
      type: object
      additionalProperties: false
      required: [screenId, screenName, platform]
      properties:
        screenId: { type: string, format: uuid }
        screenName: { type: string }
        platform: { type: string }
        presentationNetworkId: { type: string, format: uuid }
        presentationNetworkName: { type: string }
        assignedAt: { type: string, format: date-time }
    PresentationNetworkListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required:
            [
              items,
              credentialsAvailable,
              credentialsUnavailableReason,
              supportedSecurity,
            ]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/PresentationNetwork" }
            credentialsAvailable: { type: boolean }
            credentialsUnavailableReason: { type: string }
            supportedSecurity:
              type: array
              items:
                type: object
                required: [value, label, enterprise]
                properties:
                  value:
                    { $ref: "#/components/schemas/PresentationNetworkSecurity" }
                  label: { type: string }
                  enterprise: { type: boolean }
    PresentationNetworkResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/PresentationNetwork" }
    PresentationNetworkDetailResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [network, assignments]
          properties:
            network: { $ref: "#/components/schemas/PresentationNetwork" }
            assignments:
              type: array
              items:
                { $ref: "#/components/schemas/PresentationNetworkAssignment" }
    PresentationNetworkAssignmentsInput:
      type: object
      additionalProperties: false
      required: [screenIds]
      properties:
        screenIds:
          type: array
          maxItems: 500
          items: { type: string, format: uuid }
    PresentationNetworkAssignmentsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [assignments]
          properties:
            assignments:
              type: array
              items:
                { $ref: "#/components/schemas/PresentationNetworkAssignment" }
    ScreenPresentationNetworkInput:
      type: object
      additionalProperties: false
      required: [presentationNetworkId]
      properties:
        presentationNetworkId: { type: string, format: uuid }
    PresentationNetworkAssignmentResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/PresentationNetworkAssignment" }
    PresentationNetworkReadinessStatus:
      type: string
      enum:
        [
          not_applicable,
          network_manager_unavailable,
          helper_missing,
          helper_unhealthy,
          unsupported,
          wifi_adapter_unavailable,
          unassigned,
          reporting_pending,
          connected,
          failed,
          configuration_pending,
          ready,
        ]
    PresentationNetworkReadiness:
      type: object
      additionalProperties: false
      required:
        [screenId, platform, applicable, status, detail, credentialsAvailable]
      properties:
        screenId: { type: string, format: uuid }
        platform: { type: string }
        presentationNetworkId: { type: string, format: uuid }
        presentationNetworkName: { type: string }
        assignedAt: { type: string, format: date-time }
        applicable: { type: boolean }
        status:
          { $ref: "#/components/schemas/PresentationNetworkReadinessStatus" }
        detail: { type: string }
        helperState:
          { type: string, enum: [ok, missing, unhealthy, unsupported] }
        networkManagerAvailable: { type: boolean }
        wifiAdapterPresent: { type: boolean }
        radioEnabled: { type: boolean }
        reportedState:
          {
            type: string,
            enum:
              [
                unsupported,
                unassigned,
                pending,
                provisioned,
                joining,
                connected,
                failed,
              ],
          }
        installedNetworkId: { type: string, format: uuid }
        installedRevision: { type: integer, format: int64 }
        activeNetworkId: { type: string, format: uuid }
        lastConnectedAt: { type: string, format: date-time }
        lastFailureAt: { type: string, format: date-time }
        lastFailureCode: { type: string }
        limitation: { type: string }
        wiredInterfaceAvailable: { type: boolean }
        wiredIpv4: { type: string, format: ipv4 }
        credentialsAvailable: { type: boolean }
    PresentationNetworkReadinessResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/PresentationNetworkReadiness" }
    PresentationNetworkTestInput:
      type: object
      additionalProperties: false
      required: [screenId]
      properties:
        screenId: { type: string, format: uuid }
    PresentationNetworkTestResult:
      type: object
      required: [commandId, screenId, timeoutSeconds]
      properties:
        commandId: { type: string, format: uuid }
        screenId: { type: string, format: uuid }
        timeoutSeconds: { type: integer, minimum: 15, maximum: 180 }
    PresentationNetworkTestResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/PresentationNetworkTestResult" }
    PresentationNetworkProvisioningMaterial:
      type: object
      additionalProperties: false
      required:
        [
          presentationNetworkId,
          name,
          ssid,
          hidden,
          security,
          auth,
          configRevision,
          profileName,
          secret,
        ]
      properties:
        presentationNetworkId: { type: string, format: uuid }
        name: { type: string }
        ssid: { type: string }
        hidden: { type: boolean }
        security: { $ref: "#/components/schemas/PresentationNetworkSecurity" }
        auth: { $ref: "#/components/schemas/PresentationNetworkAuth" }
        configRevision: { type: integer, format: int64, minimum: 1 }
        profileName: { type: string }
        secret:
          type: string
          format: password
          readOnly: true
          description: Plaintext credential returned only to the authenticated player over a no-store response.
    PresentationNetworkProvisioningResponse:
      type: object
      required: [data]
      properties:
        data:
          {
            $ref: "#/components/schemas/PresentationNetworkProvisioningMaterial",
          }
    PresentationNetworkError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    SubmitContentRequest:
      type: object
      additionalProperties: false
      properties:
        requestedPublicationAt: { type: string, format: date-time }
        expectedRevision: { type: integer, format: int64, minimum: 1 }
    ReviewDecisionRequest:
      type: object
      additionalProperties: false
      properties:
        note: { type: string, maxLength: 4000 }
    ChangesRequest:
      type: object
      additionalProperties: false
      required: [note]
      properties:
        note: { type: string, minLength: 1, maxLength: 4000 }
    SchedulePublicationRequest:
      type: object
      additionalProperties: false
      required: [requestedPublicationAt]
      properties:
        requestedPublicationAt: { type: string, format: date-time }
    ContentSubmission:
      type: object
      required:
        [
          id,
          contentType,
          contentId,
          workingRevision,
          snapshot,
          snapshotSha256,
          submittedAt,
          status,
          reviewRequired,
          allowSelfApproval,
          newerWorkingDraft,
          affectedScreenCount,
          affectedLocationCount,
        ]
      properties:
        id: { type: string, format: uuid }
        contentType: { type: string, enum: [playlist, layout, campaign] }
        contentId: { type: string, format: uuid }
        contentName: { type: string }
        workingRevision: { type: integer, format: int64, minimum: 1 }
        snapshot: { type: object, additionalProperties: true }
        snapshotSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        submittedBy: { type: string, format: uuid }
        submitterName: { type: string }
        submittedAt: { type: string, format: date-time }
        basedPublishedRevision: { type: integer, format: int64 }
        basedPublishedRevisionId: { type: string, format: uuid }
        status:
          type: string
          enum:
            [
              in_review,
              changes_requested,
              approved,
              scheduled,
              published,
              superseded,
              publication_failed,
            ]
        reviewRequired: { type: boolean }
        allowSelfApproval: { type: boolean }
        reviewNote: { type: string }
        reviewedBy: { type: string, format: uuid }
        reviewerName: { type: string }
        reviewedAt: { type: string, format: date-time }
        requestedPublicationAt: { type: string, format: date-time }
        publicationFailureReason: { type: string }
        publishedAt: { type: string, format: date-time }
        newerWorkingDraft: { type: boolean }
        currentPublishedRevision: { type: integer, format: int64 }
        affectedScreenCount: { type: integer, minimum: 0 }
        affectedLocationCount: { type: integer, minimum: 0 }
    ContentSubmissionList:
      type: object
      required: [policy, allowSelfApproval, autoPublishOnApproval, items]
      properties:
        policy: { type: string, enum: ["off", contributors, everyone] }
        allowSelfApproval: { type: boolean }
        autoPublishOnApproval: { type: boolean }
        items:
          type: array
          items: { $ref: "#/components/schemas/ContentSubmission" }
    ProviderCatalogEntry:
      type: object
      additionalProperties: false
      required: [id, role, label, group, description, capabilities, uiHints]
      properties:
        id: { type: string }
        role: { type: string, enum: [widget, data_source] }
        label: { type: string }
        group: { type: string }
        description: { type: string }
        presentationKind: { type: string, enum: [native, web] }
        capabilities:
          type: object
          additionalProperties: { type: boolean }
        requiredCapabilities:
          type: object
          additionalProperties: { type: integer, minimum: 1 }
        uiHints:
          type: object
          additionalProperties: { type: string }
    ProviderCatalog:
      type: object
      additionalProperties: false
      required: [revision, providers]
      properties:
        revision: { type: integer, minimum: 1 }
        providers:
          type: array
          items: { $ref: "#/components/schemas/ProviderCatalogEntry" }
    ContentExtensionSource:
      description: >-
        Where the definition came from; an absent source means
        release-owned core.
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: { type: string, enum: [core] }
        - type: object
          additionalProperties: false
          required: [kind, pluginId]
          properties:
            kind: { type: string, enum: [plugin] }
            pluginId: { type: string }
        - type: object
          additionalProperties: false
          required: [kind, packageId, packageVersion, digest]
          properties:
            kind: { type: string, enum: [package] }
            packageId: { type: string }
            packageVersion: { type: string }
            digest: { type: string }
    ContentDefinitionSetup:
      type: object
      additionalProperties: false
      properties:
        eyebrow: { type: string }
        tip: { type: string }
        steps: { type: array, items: { type: string } }
        emptyState: { type: string }
    ContentDefinitionDeprecation:
      type: object
      additionalProperties: false
      required: [deprecated]
      properties:
        deprecated: { type: boolean }
        replacement: { type: string }
        message: { type: string }
    ContentDefinitionAvailability:
      type: object
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        reason: { type: string }
    ContentDefinitionSelectOption:
      type: object
      additionalProperties: false
      required: [value, label]
      properties:
        value: { type: string }
        label: { type: string }
        labelKey:
          type: string
          description: A Studio translation key in the definitions namespace for label. Optional; label is the fallback.
    ContentDefinitionField:
      type: object
      additionalProperties: false
      required: [key, label, control]
      properties:
        key: { type: string }
        label: { type: string }
        labelKey:
          type: string
          description: A Studio translation key in the definitions namespace for label. Optional; label is the literal fallback and stays the English source.
        description: { type: string }
        descriptionKey:
          type: string
          description: A Studio translation key in the definitions namespace for description. Optional; description is the literal fallback.
        control:
          {
            type: string,
            description: "The authoring control. New definitions and plugins can introduce control types, so clients must tolerate values they do not know.",
            x-extensible-enum:
              [
                text,
                multiline_text,
                number,
                integer,
                boolean,
                select,
                color,
                date,
                datetime,
                local_datetime,
                timezone,
                currency_code,
                url,
                data_source,
                data_source_field,
                media_asset,
                repeating_group,
                string_list,
              ],
          }
        required: { type: boolean }
        default: { description: Release-owned default value of any JSON type. }
        minimum: { type: number }
        maximum: { type: number }
        minLength: { type: integer, minimum: 0 }
        maxLength: { type: integer, minimum: 0 }
        options:
          type: array
          items: { $ref: "#/components/schemas/ContentDefinitionSelectOption" }
        acceptedDataSourceKinds: { type: array, items: { type: string } }
        requiredFields:
          type: object
          additionalProperties: { type: string }
        dataSourceFieldTypes: { type: array, items: { type: string } }
        mediaTypes: { type: array, items: { type: string } }
        maximumItems: { type: integer, minimum: 0 }
        itemFields:
          type: array
          items: { $ref: "#/components/schemas/ContentDefinitionField" }
        ui:
          additionalProperties: true
          type: object
          description: Release-owned authoring hints of any JSON shape.
    ContentDefinitionAuthoring:
      type: object
      additionalProperties: false
      description: Studio authoring capabilities. They never change validation, projection, or playback.
      required: [preview]
      properties:
        preview:
          type: object
          additionalProperties: false
          properties:
            time:
              type: boolean
              description: The rendered result depends on the current instant, so Studio offers preview-time controls.
            recommendedFrame:
              $ref: "#/components/schemas/ContentDefinitionFrame"
    ContentDefinitionFrame:
      type: object
      additionalProperties: false
      description: A pixel geometry. Studio opens the preview at a Widget's recommended frame, renders library thumbnails at it, and gives a new Layout placement its aspect ratio. It is an authoring hint only; it never reaches the Player and never changes validation or playback.
      required: [width, height]
      properties:
        width: { type: integer, minimum: 32, maximum: 3840 }
        height: { type: integer, minimum: 32, maximum: 3840 }
    ContentDefinitionConfigurationSchema:
      type: object
      additionalProperties: false
      required: [fields]
      properties:
        fields:
          type: array
          items: { $ref: "#/components/schemas/ContentDefinitionField" }
    ContentDefinitionOutputField:
      type: object
      additionalProperties: false
      required: [key, label, type]
