  /api/v1/schedules:
    get:
      operationId: listSchedules
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires an authenticated user with the read scope. Schedule list
        with optional search, facet filters, sort, and pagination. Every
        parameter is optional; a value outside its closed set is rejected with
        400. The reported total describes the filtered result, not the whole
        library. Every sort is deterministic, ending in the schedule id.
      parameters:
        - { in: query, name: search, required: false, schema: { type: string } }
        - in: query
          name: enabled
          required: false
          description: Only enabled or only disabled schedules.
          schema: { type: string, enum: ["true", "false"] }
        - in: query
          name: type
          required: false
          description: Only weekly or only one-time schedules.
          schema: { type: string, enum: [weekly, one_time] }
        - in: query
          name: presentationType
          required: false
          description: Only schedules that present this kind of content or action.
          schema: { type: string, enum: [playlist, layout, display_control] }
        - in: query
          name: sort
          required: false
          description: >-
            updated is most recently updated first (the default), name is
            case-insensitive A to Z, and priority is highest priority first,
            with the most recently updated first among equals.
          schema: { type: string, enum: [updated, name, priority] }
        - {
            in: query,
            name: page,
            required: false,
            schema: { type: integer, minimum: 1 },
          }
        - {
            in: query,
            name: pageSize,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 100 },
          }
      responses:
        "200":
          description: Paginated schedules
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ScheduleList" }
        "400": { description: A filter or sort value is not recognized }
        "401": { description: Dashboard authentication required }
    post:
      operationId: createSchedule
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires the Owner or Administrator role and an authenticated user with
        the write scope. Cookie requests also require CSRF.
        The request contains exactly one of playlistId, layoutId, or
        displayAction. Display Control actions use the closed typed command
        registry; display_probe is not schedulable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleInput" }
      responses:
        "201":
          description: Validated schedule created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Schedule" }
        "401": { description: Authentication required }
        "403":
          { description: "Role, scope, or cookie CSRF requirement not met" }
        "422": { description: Schedule or target validation failed }
  /api/v1/schedules/{id}:
    get:
      operationId: getSchedule
      description: >-
        Get schedule. Requires an authenticated dashboard user.
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
      responses:
        "200":
          description: Schedule and normalized targets
          content:
            application/json:
              schema:
                type: object
