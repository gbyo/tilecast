      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
      responses:
        "200": { description: Latest screen preview }
        "401": { description: Dashboard authentication required }
  /api/v1/screens/{id}/preview/image:
    get:
      operationId: getScreenPreviewImage
      description: >-
        Download a screen's latest preview image. Requires an enrolled
