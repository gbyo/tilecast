  /api/v1/player/assets/{assetId}/variants/{variantId}:
    parameters:
      - {
          in: path,
          name: assetId,
          required: true,
          schema: { type: string, format: uuid },
        }
      - {
          in: path,
          name: variantId,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      operationId: downloadPlayerVariant
      description: >-
        Download player variant. Requires an authenticated player credential.
      security: [{ deviceBearer: [] }]
      parameters:
        - {
            in: header,
            name: Range,
            schema: { type: string, example: bytes=0-1048575 },
          }
        - { in: header, name: If-Range, schema: { type: string } }
        - { in: header, name: If-None-Match, schema: { type: string } }
      responses:
        "200":
          description: Complete compatible variant
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: Requested byte range
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "304": { description: ETag matched }
        "401": { description: Device credential invalid or revoked }
        "403": { description: Screen disabled }
        "416": { description: Range not satisfiable }
    head:
      operationId: inspectPlayerVariant
      description: >-
        Inspect player variant. Requires an authenticated player credential.
      security: [{ deviceBearer: [] }]
      responses:
        {
          "200":
            {
              description: "ETag, Content-Length, MIME type, and Accept-Ranges",
            },
        }
  /api/v1/player/packages/{packageId}/widgets/{widgetId}:
    parameters:
      - {
          in: path,
