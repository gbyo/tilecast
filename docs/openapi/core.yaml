openapi: 3.1.0
info:
  title: Tilecast API
  version: 0.10.0
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
  description: >-
    Management authentication accepts either an enrolled dashboard session
    cookie or a bearer user grant (an OAuth access token or a personal
    access token), and both produce the same user principal with the live
    role and screen scope. Grants additionally carry a scope ceiling of
    read, write, or admin (admin implies write implies read): reads take
    read, mutations take write, and user, token, grant, backup, and
    security administration take admin. CSRF is cookie-only: unsafe
    browser requests require X-CSRF-Token, bearer requests never send it.
    Browser security ceremonies (MFA, passkeys, logout, OAuth approval)
    stay session-only.
paths:
  /healthz:
    get:
      operationId: health
      responses:
        "200": { description: Server process is running }
  /install.sh:
    get:
      operationId: installLinuxPlayerScript
      description: Public. Rate-limited Linux Player provisioning script with this server's URL embedded.
      responses:
        "200": { description: Shell installer }
  /install-airplay.sh:
    get:
      operationId: installAirPlayScript
      description: Public. Rate-limited AirPlay provisioning script with this server's URL embedded.
      responses:
        "200": { description: Shell installer }
  /install/tilecast-player.service:
    get:
      operationId: installLinuxPlayerService
      responses:
        "200": { description: Managed systemd user-service template }
  /readyz:
    get:
      operationId: ready
      responses:
        "200": { description: Server and database are ready }
        "503": { description: Database is unavailable }
  /api/v1/install/linux:
    get:
      operationId: installableLinuxPlayerRelease
      description: >-
        Public. Read the cached Linux player release metadata.
      responses:
        "200":
          { description: "Latest stable, verified, cached Linux Player release
              metadata" }
        "404": { description: No installable Linux Player release is cached }
  /api/v1/install/linux/artifact:
    get:
      operationId: installableLinuxPlayerArtifact
      description: >-
        Public. Download the verified Linux player AppImage.
      responses:
        "200": { description: Verified Linux Player AppImage }
        "404": { description: No installable Linux Player release is cached }
    head:
      operationId: headInstallableLinuxPlayerArtifact
      description: >-
        Public. Inspect the verified Linux player AppImage without downloading it.
      responses:
        "200": { description: Verified Linux Player AppImage metadata }
        "404": { description: No installable Linux Player release is cached }
  /api/v1/install/airplay/uxplay:
    get:
      operationId: installableUxPlayArtifact
      description: Public. Rate-limited, pinned UxPlay 1.73.6 source archive embedded in Tilecast Server.
      responses:
        "200": { description: Verified UxPlay 1.73.6 source archive }
    head:
      operationId: headInstallableUxPlayArtifact
      description: >-
        Public. Inspect the pinned UxPlay artifact without downloading it.
      responses:
        "200": { description: Verified UxPlay 1.73.6 source archive metadata }
  /api/v1/install/airplay/uxplay.sha256:
    get:
      operationId: installableUxPlayChecksum
      description: >-
        Public. Read the pinned UxPlay artifact checksum.
      responses:
        "200":
          { description: Pinned lowercase SHA-256 of the UxPlay source archive }
  /api/v1/auth/status:
    get:
      operationId: authStatus
      description: >-
        Public. Reports whether one-time setup is still required and, when a
        valid dashboard session cookie is present, the current user, their
        role, the CSRF token for unsafe browser requests, the auth method,
        and whether MFA enrollment is still pending. This is the current-user
        read for Studio and for future API clients.
      responses:
        "200":
          description: Installation state and, when authenticated, the current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthStatus" }
  /api/v1/demo:
    get:
      operationId: demoState
      description: >-
        Registered only when TILECAST_ENV is demo. Returns the seeded scenario
        and the state of each simulated player.
      responses:
        "200": { description: Demo scenario and simulated player state }
        "401": { description: Authentication required }
  /api/v1/demo/reset:
    post:
      operationId: resetDemo
      description: >-
        Registered only when TILECAST_ENV is demo. Replaces all data with a
        scenario and returns once its simulated players have connected.
        Requires the Owner role and X-CSRF-Token.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                scenario: { type: string, enum: [basic, kitchen-sink] }
      responses:
        "200":
          { description: "Scenario restored, with the new session CSRF token" }
        "403": { description: Owner role or CSRF token missing }
        "422": { description: Unknown scenario }
  /api/v1/auth/setup:
    post:
      operationId: initialSetup
      description: >-
        Public. Create the organization and initial Owner account during first-run setup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201": { description: Organization and owner created }
        "409": { description: Setup was already completed }
        "422": { description: Validation failed }
  /api/v1/auth/login:
    post:
      operationId: login
      description: >-
        Rate-limited. Exchange an enrolled account's credentials for a dashboard session.
      responses:
        "200":
          description: >-
            Signed in, or a multi-factor challenge when the account has a
            confirmed second factor. A challenge sets no session cookie.
        "401": { description: Invalid credentials }
  /api/v1/auth/mfa/verify:
    post:
      operationId: verifyMultiFactor
      description: Completes a pending sign-in with an authenticator or recovery code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MultiFactorVerifyRequest"
      responses:
        "200": { description: Signed in }
        "401": { description: Incorrect code or expired challenge }
        "429": { description: Too many incorrect codes }
  /api/v1/auth/mfa/passkey/options:
    post:
      operationId: multiFactorPasskeyOptions
      description: Exchanges a pending challenge for a WebAuthn assertion request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeTokenRequest"
      responses:
        "200":
          { description: Assertion options and a replacement challenge token }
        "401": { description: Expired challenge }
        "404": { description: No passkey is enrolled }
        "409": { description: Passkeys are unavailable on this installation }
  /api/v1/auth/passkey/login/options:
    post:
      operationId: passkeyLoginOptions
      description: Public. Starts a discoverable, username-free WebAuthn ceremony.
      responses:
        "200": { description: Assertion options and a challenge token }
        "409": { description: Passkeys are unavailable on this installation }
  /api/v1/auth/passkey/login:
    post:
      operationId: passkeyLogin
      description: >-
        Posts the raw WebAuthn assertion. A verified passkey satisfies
        multi-factor authentication on its own.
      parameters:
        - in: header
          name: X-MFA-Challenge
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnAssertion"
      responses:
        "200": { description: Signed in }
        "401": { description: The passkey could not be verified }
  /api/v1/me/security:
    get:
      operationId: securityStatus
      description: >-
        Security status. Requires an enrolled dashboard session.
      responses:
        "200": { description: "Enrolled factors, passkeys, and policy state" }
        "401": { description: Authentication required }
  /api/v1/me/security/totp:
    post:
      operationId: beginAuthenticatorEnrollment
      description: >-
        Begin authenticator enrollment. Requires an enrolled dashboard session.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        "200": { description: Provisioning URI and typed secret }
        "409": { description: An authenticator is already enrolled }
  /api/v1/me/security/totp/confirm:
    post:
      operationId: confirmAuthenticatorEnrollment
      description: >-
        Confirm authenticator enrollment. Requires an enrolled dashboard session.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthenticatorCodeRequest"
      responses:
        "200": { description: Updated security state }
        "401": { description: Incorrect code }
        "404": { description: No pending enrollment }
  /api/v1/me/security/totp/remove:
    post:
      operationId: removeAuthenticator
      description: Requires the account password in the body.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirmation"
      responses:
        "204": { description: Authenticator removed }
        "403": { description: The password was not correct }
        "409": { description: Policy requires a remaining factor }
  /api/v1/me/security/recovery-codes:
    post:
      operationId: generateRecoveryCodes
      description: >-
        Replaces every unused code. Requires the account password. The plain
        codes are returned exactly once.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirmation"
      responses:
        "201": { description: Ten new recovery codes }
        "403": { description: The password was not correct }
  /api/v1/me/security/passkeys/options:
    post:
      operationId: passkeyRegistrationOptions
      description: >-
        Passkey registration options. Requires an enrolled dashboard session.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        "200": { description: Creation options and a challenge token }
        "409": { description: Passkeys are unavailable on this installation }
  /api/v1/me/security/passkeys:
    post:
      operationId: registerPasskey
      description: >-
        The passkey is named from the authenticator's AAGUID; no name is
        accepted here. Use the rename endpoint to change it.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
        - in: header
          name: X-MFA-Challenge
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnCredential"
      responses:
        "201": { description: Passkey enrolled }
        "401": { description: The passkey could not be verified }
  /api/v1/me/security/passkeys/{id}:
    patch:
      operationId: renamePasskey
      description: >-
        Rename passkey. Requires an enrolled dashboard session.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyRenameRequest"
      responses:
        "204": { description: Passkey renamed }
        "404": { description: Passkey not found }
  /api/v1/me/security/passkeys/{id}/remove:
    post:
      operationId: removePasskey
      description: Requires the account password in the body.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirmation"
      responses:
        "204": { description: Passkey removed }
        "403": { description: The password was not correct }
        "409": { description: Policy requires a remaining factor }
  /api/v1/oauth/authorize:
    get:
      operationId: describeOAuthApproval
      description: >-
        Requires an enrolled dashboard session. Describes one loopback
        authorization request (client, scopes, redirect) for the approval
        screen. Stores nothing; approval revalidates the same parameters.
      parameters:
        - {
            in: query,
            name: client_id,
            required: true,
            schema: { type: string },
          }
        - {
            in: query,
            name: redirect_uri,
            required: true,
            schema: { type: string, format: uri },
          }
        - { in: query, name: scope, required: true, schema: { type: string } }
        - { in: query, name: state, required: false, schema: { type: string } }
        - {
            in: query,
            name: code_challenge,
            required: true,
            schema: { type: string },
          }
        - {
            in: query,
            name: code_challenge_method,
            required: false,
            schema: { type: string, enum: [S256] },
          }
      responses:
        "200": { description: Approval description }
        "400":
          description: >-
            Unknown client, redirect, scope, or challenge
        "401": { description: Dashboard authentication required }
  /api/v1/oauth/approve:
    post:
      operationId: approveOAuthRequest
      description: >-
        Browser ceremony: requires an enrolled dashboard session and the
        X-CSRF-Token header, and refuses bearer grants. Records the grant
        and returns the loopback redirect carrying the single-use
        authorization code.
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OAuthDecision" }
      responses:
        "200": { description: Loopback redirect carrying the code }
        "400":
          description: >-
            Unknown client, redirect, scope, or challenge
        "401": { description: Dashboard authentication required }
        "403": { description: CSRF token required }
  /api/v1/oauth/deny:
    post:
      operationId: denyOAuthRequest
      description: >-
        Requires an enrolled dashboard session and the X-CSRF-Token header.
        Records nothing and returns the loopback redirect carrying
        access_denied.
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OAuthDecision" }
      responses:
        "200": { description: Loopback redirect carrying access_denied }
        "400": { description: The authorization request is not valid }
        "401": { description: Dashboard authentication required }
        "403": { description: CSRF token required }
  /api/v1/oauth/token:
    post:
      operationId: issueOAuthTokens
      description: >-
        Public and rate-limited. Exchanges a single-use code with its PKCE
        verifier, or rotates a refresh token. PKCE is the client
        authentication for loopback clients. Reusing a rotated refresh token
        revokes the whole grant.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OAuthTokenRequest" }
      responses:
        "200": { description: Opaque access and refresh tokens }
        "400":
          description: >-
            Expired, used, mismatched, or revoked grant
        "429": { description: Too many authentication attempts }
  /api/v1/oauth/revoke:
    post:
      operationId: revokeOAuthCredential
      description: >-
        Public. Rate-limited. Revokes the grant behind a presented access or
        refresh credential. The credential itself is the authorization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "204": { description: Grant revoked }
        "400": { description: Unknown token }
        "429": { description: Too many authentication attempts }
  /api/v1/me/security/grants:
    get:
      operationId: listOAuthGrants
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires an authenticated user with the admin scope. Lists the
        caller's authorization grants newest first, revoked included.
      responses:
        "200": { description: Grant list }
        "401": { description: Dashboard authentication required }
  /api/v1/me/security/grants/{id}:
    delete:
      operationId: revokeOAuthGrant
      description: >-
        Requires an authenticated user with the admin scope. Cookie
        requests additionally require the X-CSRF-Token header. Revokes
        one of the caller's grants and every token under it. Personal
        access tokens are revoked through this same endpoint.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "204": { description: Grant revoked }
        "401": { description: Dashboard authentication required }
        "403": { description: CSRF token required }
        "404": { description: Grant unknown }
  /api/v1/me/security/pats:
    get:
      operationId: listPersonalAccessTokens
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires an authenticated user with the admin scope. Lists the
        caller's personal access tokens newest first with display metadata
        only — never secrets. Expired and revoked tokens stay listed until
        explicitly revoked. An optional search query filters by name,
        case-insensitively.
      parameters:
        - in: query
          name: search
          required: false
          schema: { type: string }
      responses:
        "200": { description: PAT list }
        "401": { description: Dashboard authentication required }
    post:
      operationId: createPersonalAccessToken
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires an authenticated user with the admin scope. Cookie
        requests additionally require the X-CSRF-Token header. Creates
        a named personal access token with a fixed lifetime of 7, 30, 90,
        or 365 days; there is no permanent token. The plaintext secret
        (tcp_ prefix) is returned exactly once in this response and is
        never shown or listed again. Only SHA-256 hashes are stored.
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes, expiresInDays]
              properties:
                name: { type: string, maxLength: 100 }
                scopes:
                  type: array
                  items: { type: string, enum: [read, write, admin] }
                expiresInDays: { type: integer, enum: [7, 30, 90, 365] }
      responses:
        "201": { description: PAT created with one-time secret }
        "400":
          description: >-
            Invalid name, scopes, or lifetime
        "401": { description: Dashboard authentication required }
        "403": { description: CSRF token required }
  /api/v1/content-folders/{id}:
    patch:
      operationId: updateContentFolder
      description: >-
        Rename, move, or redescribe a content folder. Requires a content
        author with the write scope. Cookie-authenticated unsafe requests
        require X-CSRF-Token.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                parentId: { type: [string, "null"], format: uuid }
      responses:
        "200": { description: Content folder updated }
        "400": { description: Invalid request body }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
    delete:
      operationId: deleteContentFolder
      description: >-
        Delete a content folder, moving its direct content to Unfiled and
        its child folders to the root. Requires a content manager with the
        write scope. Cookie-authenticated unsafe requests require
        X-CSRF-Token.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "200": { description: Content folder deleted }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
  /api/v1/content-collections/{id}:
    patch:
      operationId: updateContentCollection
      description: >-
        Rename or redescribe a content collection. Requires a content author
        with the write scope. Cookie-authenticated unsafe requests require
        X-CSRF-Token.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        "200": { description: Content collection updated }
        "400": { description: Invalid request body }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
    delete:
      operationId: deleteContentCollection
      description: >-
        Delete a content collection without deleting its content. Requires a
        content manager with the write scope. Cookie-authenticated unsafe
        requests require X-CSRF-Token.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "200": { description: Content collection deleted }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
  /api/v1/content-tags/{id}:
    patch:
      operationId: updateContentTag
      description: >-
        Rename or recolor a content tag. Requires a content author with the
        write scope. Cookie-authenticated unsafe requests require
        X-CSRF-Token.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                color: { type: string }
      responses:
        "200": { description: Content tag updated }
        "400": { description: Invalid request body }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
    delete:
      operationId: deleteContentTag
      description: >-
        Delete a content tag, removing only its relationships. A tag
        referenced by a tag-driven playlist is refused until the playlist
        rule changes. Requires a content manager with the write scope.
        Cookie-authenticated unsafe requests require X-CSRF-Token.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "200": { description: Content tag deleted }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
  /api/v1/playlists/{id}/duplicate:
    post:
      operationId: duplicatePlaylist
      description: >-
        Duplicate a playlist. Requires a content author with the write
        scope. Cookie-authenticated unsafe requests require X-CSRF-Token.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "201": { description: Playlist duplicated }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
  /api/v1/playlists/{id}/revisions:
    get:
      operationId: listPlaylistRevisions
      description: >-
        List a playlist's revisions. Requires an authenticated dashboard
        user with the read scope.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
      responses:
        "200": { description: Playlist revisions }
        "401": { description: Dashboard authentication required }
  /api/v1/playlists/{id}/revisions/{revision}/restore:
    post:
      operationId: restorePlaylistRevision
      description: >-
        Restore a playlist revision into a new draft revision. Requires a
        content manager. Cookie-authenticated unsafe requests require
        X-CSRF-Token.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - in: path
          name: revision
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "200": { description: Revision copied into a new draft revision }
        "400": { description: Revision invalid }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
  /api/v1/screens/{id}/commands/{commandId}/cancel:
    post:
      operationId: cancelPlayerCommand
      description: >-
        Cancel a pending player command. Requires an Owner or Administrator
        with the write scope. Cookie-authenticated unsafe requests require
        X-CSRF-Token.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - in: path
          name: commandId
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "200": { description: Command cancelled }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role or screen scope }
        "409": { description: Command already completed }
  /api/v1/data-sources/{id}/preview:
    get:
      operationId: previewSavedDataSource
      description: >-
        Preview a saved data source, optionally as of a preview date.
        Requires a content author with the read scope.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - in: query
          name: previewDate
          required: false
          schema: { type: string }
      responses:
        "200": { description: Data source preview }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
  /api/v1/screens/archive:
    get:
      operationId: listArchivedScreens
      description: >-
        List archived screens. Requires an authenticated dashboard user with
        the read scope.
      responses:
        "200": { description: Archived screens }
        "401": { description: Dashboard authentication required }
  /api/v1/settings/reset:
    post:
      operationId: resetSettings
      description: >-
        Reset settings to defaults, optionally scoped to one category at the
        current revision. Requires an Owner or Administrator with the admin
        scope. Cookie-authenticated unsafe requests require X-CSRF-Token.
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                revision: { type: integer }
                category: { type: string }
      responses:
        "200": { description: Settings reset }
        "400": { description: Invalid request body }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
  /api/v1/screens/bulk/preview:
    post:
      operationId: previewBulkOperation
      description: >-
        Preview a fleet bulk operation without applying it: per-screen
        current and next state, whether each screen changes, and why a
        screen is blocked. Requires an Owner or Administrator with the
        write scope. Preview is a read of what would change, so it needs
        no CSRF token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [screenIds, action]
              properties:
                screenIds:
                  type: array
                  items: { type: string, format: uuid }
                action: { type: string }
                playlistId: { type: string, format: uuid }
                layoutId: { type: string, format: uuid }
                enabled: { type: boolean }
                commandType: { type: string }
                commandPayload: { type: object }
      responses:
        "200": { description: Bulk operation preview }
        "400": { description: Invalid request body }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role or screen scope }
        "422": { description: Bulk operation invalid }
  /api/v1/screens/bulk/apply:
    post:
      operationId: applyBulkOperation
      description: >-
        Apply a fleet bulk operation, refusing with 409 when the fleet no
        longer matches the confirmed preview's expected change count.
        Requires an Owner or Administrator with the write scope.
        Cookie-authenticated unsafe requests require X-CSRF-Token.
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [screenIds, action]
              properties:
                screenIds:
                  type: array
                  items: { type: string, format: uuid }
                action: { type: string }
                playlistId: { type: string, format: uuid }
                layoutId: { type: string, format: uuid }
                enabled: { type: boolean }
                commandType: { type: string }
                commandPayload: { type: object }
                expectedChangeCount: { type: integer }
      responses:
        "200": { description: Bulk operation applied }
        "400": { description: Invalid request body }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role or screen scope }
        "409": { description: Fleet changed since the confirmed preview }
        "422": { description: Bulk operation invalid }
  /api/v1/screens/bulk/operations:
    get:
      operationId: listBulkOperations
      description: >-
        List recent fleet bulk operations. Requires an Owner or
        Administrator with the read scope.
      responses:
        "200": { description: Recent bulk operations }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
  /api/v1/screens/bulk/operations/{id}/undo:
    post:
      operationId: undoBulkOperation
      description: >-
        Reverse a reversible bulk operation inside its undo window. Requires
        an Owner or Administrator with the write scope.
        Cookie-authenticated unsafe requests require X-CSRF-Token.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "200": { description: Bulk operation reversed }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role or screen scope }
        "404": { description: Bulk operation not found }
        "409": { description: Operation not reversible or undo unavailable }
  /api/v1/system/health:
    get:
      operationId: getSystemHealth
      description: >-
        Read system health. Requires an Owner or Administrator with the read
        scope.
      responses:
        "200": { description: System health }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
  /api/v1/system/media-diagnostics:
    get:
      operationId: getMediaDiagnostics
      description: >-
        Read media pipeline diagnostics. Requires an Owner or Administrator
        with the read scope.
      responses:
        "200": { description: Media diagnostics }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
  /api/v1/system/snapshots/usage:
    get:
      operationId: getSnapshotUsage
      description: >-
        Read snapshot storage usage. Requires an Owner or Administrator with
        the read scope.
      responses:
        "200": { description: Snapshot storage usage }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
  /api/v1/screens/{id}/snapshots:
    get:
      operationId: listScreenSnapshots
      description: >-
        List a screen's snapshots. Requires an authenticated dashboard user
        with the read scope.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
      responses:
        "200": { description: Screen snapshots }
        "401": { description: Dashboard authentication required }
        "403": { description: Screen scope forbids this screen }
  /api/v1/screens/{id}/snapshots/{snapshotId}/image:
    get:
      operationId: getScreenSnapshotImage
      description: >-
        Download a screen snapshot image. Requires an authenticated
        dashboard user with the read scope.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - in: path
          name: snapshotId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Snapshot image }
        "401": { description: Dashboard authentication required }
        "403": { description: Screen scope forbids this screen }
        "404": { description: Snapshot not found }
  /api/v1/system/backups:
    get:
      operationId: listBackups
      description: >-
        List system backups. Requires an Owner with the admin scope.
      responses:
        "200": { description: System backups }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
    post:
      operationId: createBackup
      description: >-
        Start a system backup. Requires an Owner with the admin scope.
        Cookie-authenticated unsafe requests require X-CSRF-Token.
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "202": { description: Backup job started }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
        "409": { description: Backup already in progress }
  /api/v1/system/backups/jobs/current:
    get:
      operationId: getCurrentBackupJob
      description: >-
        Read the current backup job, if any. Requires an Owner with the
        admin scope.
      responses:
        "200": { description: Current backup job }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
  /api/v1/system/backups/jobs/{id}:
    get:
      operationId: getBackupJob
      description: >-
        Read a backup job. Requires an Owner with the admin scope.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
      responses:
        "200": { description: Backup job }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
        "404": { description: Backup job not found }
  /api/v1/system/backups/{id}/verify:
    post:
      operationId: verifyBackup
      description: >-
        Verify a system backup. Requires an Owner with the admin scope.
        Cookie-authenticated unsafe requests require X-CSRF-Token.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "202": { description: Backup verification started }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
        "404": { description: Backup not found }
  /api/v1/system/backups/{id}/plan:
    get:
      operationId: getRestorePlan
      description: >-
        Read the restore plan for a system backup. Requires an Owner with
        the admin scope.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
      responses:
        "200": { description: Restore plan }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
        "404": { description: Backup not found }
        "422": { description: Backup archive unreadable }
  /api/v1/system/backups/{id}/restore:
    post:
      operationId: restoreBackup
      description: >-
        Restore a system backup, confirming identity mismatch explicitly
        when the archive names another installation. Requires an Owner with
        the admin scope. Cookie-authenticated unsafe requests require
        X-CSRF-Token.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmIdentityMismatch: { type: boolean }
      responses:
        "202": { description: Restore job started }
        "400": { description: Invalid request body }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
        "404": { description: Backup not found }
  /api/v1/system/backups/{id}/download:
    get:
      operationId: downloadBackup
      description: >-
        Download a system backup archive. Requires an Owner with the admin
        scope.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
      responses:
        "200": { description: Backup archive download }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
        "404": { description: Backup not found }
  /api/v1/system/backups/{id}:
    delete:
      operationId: deleteBackup
      description: >-
        Delete a system backup. The last complete backup is protected until
        confirmed again. Requires an Owner with the write scope.
        Cookie-authenticated unsafe requests require X-CSRF-Token.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "200": { description: Backup deleted }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
        "404": { description: Backup not found }
        "409": { description: Job active or last complete backup }
        "422": { description: Archive incomplete }
  /api/v1/notifications/status:
    get:
      operationId: getNotificationStatus
      description: >-
        Read email notification status. Requires an authenticated dashboard
        user with the read scope.
      responses:
        "200": { description: Notification status }
        "401": { description: Dashboard authentication required }
  /api/v1/notifications/test:
    post:
      operationId: sendTestNotification
      description: >-
        Send a test notification to the caller's own address. Requires an
        authenticated dashboard user with the write scope.
        Cookie-authenticated unsafe requests require X-CSRF-Token.
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "200": { description: Test notification sent }
        "400": { description: No address or address invalid }
        "401": { description: Dashboard authentication required }
        "409": { description: Email not configured }
        "502": { description: Mail server rejected the message }
  /api/v1/notifications/deliveries:
    get:
      operationId: listNotificationDeliveries
      description: >-
        List notification deliveries. Requires an Owner or Administrator
        with the admin scope.
      responses:
        "200": { description: Notification deliveries }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
  /api/v1/notifications/webhooks:
    get:
      operationId: listNotificationWebhooks
      description: >-
        List notification webhooks. Requires an Owner or Administrator with
        the admin scope.
      responses:
        "200": { description: Notification webhooks }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
    post:
      operationId: createNotificationWebhook
      description: >-
        Create a notification webhook. Requires an Owner or Administrator
        with the admin scope. Cookie-authenticated unsafe requests require
        X-CSRF-Token.
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url]
              properties:
                name: { type: string }
                url: { type: string, format: uri }
                enabled: { type: boolean }
                categories:
                  type: array
                  items: { type: string }
      responses:
        "201": { description: Notification webhook created }
        "400": { description: Invalid webhook }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
  /api/v1/notifications/webhooks/{id}:
    put:
      operationId: updateNotificationWebhook
      description: >-
        Update a notification webhook. Requires an Owner or Administrator
        with the admin scope. Cookie-authenticated unsafe requests require
        X-CSRF-Token.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                url: { type: string, format: uri }
                enabled: { type: boolean }
                categories:
                  type: array
                  items: { type: string }
      responses:
        "200": { description: Notification webhook updated }
        "400": { description: Invalid webhook id or body }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
        "404": { description: Webhook not found }
    delete:
      operationId: deleteNotificationWebhook
      description: >-
        Delete a notification webhook. Requires an Owner or Administrator
        with the admin scope. Cookie-authenticated unsafe requests require
        X-CSRF-Token.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "204": { description: Notification webhook deleted }
        "400": { description: Webhook id invalid }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
        "404": { description: Webhook not found }
  /api/v1/notifications/webhooks/{id}/test:
    post:
      operationId: testNotificationWebhook
      description: >-
        Send a test delivery to a notification webhook. Requires an Owner or
        Administrator with the admin scope. Cookie-authenticated unsafe
        requests require X-CSRF-Token.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "200": { description: Test delivery accepted }
        "400": { description: Webhook id invalid }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
        "404": { description: Webhook missing or disabled }
        "502": { description: Receiver rejected the test }
  /api/v1/integration-tokens:
    get:
      operationId: listIntegrationTokens
      description: >-
        List integration tokens. Requires an Owner with the admin scope.
      responses:
        "200": { description: Integration tokens }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
    post:
      operationId: createIntegrationToken
      description: >-
        Mint an integration token: a standing inbound capability for data
        sources or activity reads. Requires an Owner with the admin scope.
        Cookie-authenticated unsafe requests require X-CSRF-Token.
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string }
                scopes:
                  type: array
                  items: { type: string }
                dataSourceIds:
                  type: array
                  items: { type: string, format: uuid }
                expiresAt: { type: string, format: date-time }
      responses:
        "201": { description: Integration token created with one-time secret }
        "400": { description: Invalid request body }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
        "422": { description: Token invalid }
  /api/v1/integration-tokens/{id}:
    delete:
      operationId: revokeIntegrationToken
      description: >-
        Revoke an integration token. Requires an Owner with the admin scope.
        Cookie-authenticated unsafe requests require X-CSRF-Token.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "204": { description: Integration token revoked }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
        "404": { description: Token missing or already revoked }
  /api/v1/integration/data-sources/{id}/rows:
    put:
      operationId: replaceDataSourceRows
      description: >-
        Replace every row of a manual table data source, at most 500 rows
        per write. An integration token authenticates this call with the
        data-source write scope.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                rows:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required: [values]
                    properties:
                      values:
                        type: object
                        additionalProperties: { type: string }
      responses:
        "200": { description: Rows replaced }
        "400": { description: Invalid request body }
        "401": { description: Integration authentication required }
        "403": { description: Insufficient scope }
        "404": { description: Data source not found }
        "422": { description: Rows invalid }
  /api/v1/integration/activity/fleet:
    get:
      operationId: getIntegrationFleetHealth
      description: >-
        Read fleet health for integrations. An integration token
        authenticates this call with the activity read scope.
      responses:
        "200": { description: Fleet health }
        "401": { description: Integration authentication required }
        "403": { description: Insufficient scope }
  /api/v1/integration/metrics:
    get:
      operationId: getIntegrationMetrics
      description: >-
        Read integration metrics. An integration token authenticates this
        call with the activity read scope.
      responses:
        "200": { description: Integration metrics }
        "401": { description: Integration authentication required }
        "403": { description: Insufficient scope }
  /api/v1/content-reviews:
    get:
      operationId: listContentReviews
      description: >-
        List content reviews, optionally filtered by state. Anyone who can
        author content can see where it stands. Requires an authenticated
        dashboard user with the read scope.
      parameters:
        - in: query
          name: state
          required: false
          schema: { type: string }
      responses:
        "200": { description: Content reviews }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
  /api/v1/content-reviews/{type}/{id}:
    post:
      operationId: decideContentReview
      description: >-
        Approve or reject a content review with an optional note. Requires a
        content manager. Cookie-authenticated unsafe requests require
        X-CSRF-Token.
      parameters:
        - in: path
          name: type
          required: true
          schema: { type: string, enum: [playlist, layout] }
        - { $ref: "#/components/parameters/ResourceID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties:
                approve: { type: boolean }
                note: { type: string }
                revision: { type: integer }
      responses:
        "200": { description: Content review decided }
        "400": { description: Invalid type or request body }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
        "404": { description: Review not found }
        "409": { description: Review invalid }
  /api/v1/content-health:
    get:
      operationId: getContentHealth
      description: >-
        Read content health. Requires an authenticated dashboard user with
        the read scope.
      responses:
        "200": { description: Content health report }
        "401": { description: Dashboard authentication required }
  /api/v1/player/telemetry:
    post:
      operationId: ingestPlayerTelemetry
      description: >-
        Ingest a player telemetry snapshot. Requires an authenticated player
        credential.
      security: [{ deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [observedAt]
              properties:
                observedAt: { type: string, format: date-time }
                currentItemId: { type: string }
                itemStartedAt: { type: string, format: date-time }
                lastMeaningfulProgressAt: { type: string, format: date-time }
                playbackStallDurationMs: { type: integer }
                stallReason: { type: string }
                rendererState: { type: string }
                rendererResponding: { type: boolean }
                expectedMotion: { type: boolean }
                serverRoundTripMs: { type: integer }
                downloadQueueCount: { type: integer }
                bytesRemaining: { type: integer }
                cacheUsedBytes: { type: integer }
                cacheLimitBytes: { type: integer }
                freeStorageBytes: { type: integer }
                processUptimeSeconds: { type: integer }
                deviceUptimeSeconds: { type: integer }
      responses:
        "202": { description: Telemetry accepted }
        "400": { description: Telemetry invalid }
        "401": { description: Credential invalid or revoked }
        "422": { description: Telemetry timestamp or interval invalid }
  /api/v1/player/activity-events:
    post:
      operationId: ingestPlayerActivityEvents
      description: >-
        Ingest a batch of 1 to 200 player activity events; the event shape
        follows docs/activity-event-contract.md. Requires an authenticated
        player credential.
      security: [{ deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [id, sequence, eventType, occurredAt]
                    properties:
                      id: { type: string, format: uuid }
                      sequence: { type: integer }
                      eventType: { type: string }
                      category: { type: string }
                      severity: { type: string }
                      occurredAt: { type: string, format: date-time }
                      elapsedRealtimeMs: { type: integer }
                      playerTimezone: { type: string }
                      manifestVersion: { type: integer }
                      presentationType: { type: string }
                      presentationId: { type: string }
                      presentationRevision: { type: string }
                      contentType: { type: string }
                      contentId: { type: string }
      responses:
        "202": { description: Activity events accepted }
        "400": { description: Activity batch invalid }
        "401": { description: Credential invalid or revoked }
        "422": { description: Activity batch or event invalid }
  /api/v1/activity/proof-of-play:
    get:
      operationId: listProofOfPlay
      description: >-
        List Player-confirmed proof-of-play records. Requires an
        authenticated dashboard user with the read scope.
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      parameters:
        - in: query
          name: from
          required: false
          schema: { type: string, format: date-time }
        - in: query
          name: to
          required: false
          schema: { type: string, format: date-time }
        - in: query
          name: page
          required: false
          schema: { type: integer, minimum: 1 }
        - in: query
          name: pageSize
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200": { description: Proof-of-play records }
        "401": { description: Dashboard authentication required }
        "422":
          description: >-
            Range, page, or proof filter invalid
  /api/v1/activity/proof-of-play/summary:
    get:
      operationId: getProofOfPlaySummary
      description: >-
        Summarize Player-confirmed proof of play by dimension. Requires an
        authenticated dashboard user with the read scope.
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      parameters:
        - in: query
          name: from
          required: false
          schema: { type: string, format: date-time }
        - in: query
          name: to
          required: false
          schema: { type: string, format: date-time }
      responses:
        "200": { description: Proof-of-play summary }
        "401": { description: Dashboard authentication required }
        "422": { description: Range or proof filter invalid }
  /api/v1/activity/proof-of-play/export.csv:
    get:
      operationId: exportProofOfPlay
      description: >-
        Export Player-confirmed proof of play as CSV. Requires an Owner or
        Administrator with the read scope.
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      parameters:
        - in: query
          name: from
          required: false
          schema: { type: string, format: date-time }
        - in: query
          name: to
          required: false
          schema: { type: string, format: date-time }
      responses:
        "200": { description: Proof-of-play CSV export }
        "401": { description: Dashboard authentication required }
        "403": { description: Exports require Owner or Administrator access }
        "422": { description: Range or proof filter invalid }
