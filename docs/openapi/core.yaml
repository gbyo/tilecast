  /api/v1/screens/bulk/preview:
    post:
      operationId: previewBulkOperation
      description: >-
        Preview a fleet bulk operation without applying it: per-screen
        current and next state, whether each screen changes, and why a
        screen is blocked. Requires an Owner or Administrator with the
        write scope. Preview is a read of what would change, so it needs
        no CSRF token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [screenIds, action]
              properties:
                screenIds:
                  type: array
                  items: { type: string, format: uuid }
                action: { type: string }
                playlistId: { type: string, format: uuid }
                layoutId: { type: string, format: uuid }
                enabled: { type: boolean }
                commandType: { type: string }
                commandPayload: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Bulk operation preview
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/BulkPreview" }
        "400": { description: Invalid request body }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role or screen scope }
        "422": { description: Bulk operation invalid }
  /api/v1/screens/bulk/apply:
    post:
      operationId: applyBulkOperation
      description: >-
        Apply a fleet bulk operation, refusing with 409 when the fleet no
        longer matches the confirmed preview's expected change count.
        Requires an Owner or Administrator with the write scope.
        Cookie-authenticated unsafe requests require X-CSRF-Token.
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [screenIds, action]
              properties:
                screenIds:
                  type: array
                  items: { type: string, format: uuid }
                action: { type: string }
                playlistId: { type: string, format: uuid }
                layoutId: { type: string, format: uuid }
                enabled: { type: boolean }
                commandType: { type: string }
                commandPayload: { type: object, additionalProperties: true }
                expectedChangeCount: { type: integer }
      responses:
        "200":
          description: Bulk operation applied
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/BulkOperation" }
        "400": { description: Invalid request body }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role or screen scope }
        "409": { description: Fleet changed since the confirmed preview }
        "422": { description: Bulk operation invalid }
  /api/v1/screens/bulk/operations:
    get:
