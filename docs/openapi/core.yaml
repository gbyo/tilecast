      operationId: getScreenTelemetry
      description: >-
        Read a screen's telemetry. Requires an Owner or Administrator with
        the read scope.
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - in: query
          name: from
          required: false
          schema: { type: string, format: date-time }
        - in: query
          name: to
          required: false
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Screen telemetry
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ScreenTelemetry" }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
  /api/v1/activity/incidents/analytics:
    get:
      operationId: getIncidentAnalytics
      description: >-
        Read incident analytics. Requires an authenticated dashboard user
        with the read scope.
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      parameters:
        - in: query
          name: from
          required: false
          schema: { type: string, format: date-time }
        - in: query
          name: to
          required: false
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Incident analytics
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/IncidentAnalytics" }
        "401": { description: Dashboard authentication required }
        "422": { description: Range invalid }
  /api/v1/activity/retention:
    get:
      operationId: getActivityRetention
      description: >-
        Read the activity retention policy. Requires an Owner or
        Administrator with the read scope.
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      responses:
        "200":
          description: Activity retention policy
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ActivityRetention" }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
    patch:
      operationId: updateActivityRetention
      description: >-
        Update the activity retention policy within deployment hard limits.
        Requires an Owner or Administrator with the write scope.
        Cookie-authenticated unsafe requests require X-CSRF-Token.
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rawEventDays: { type: integer, minimum: 7, maximum: 365 }
                playbackSessionDays:
                  { type: integer, minimum: 30, maximum: 2555 }
                screenStateDays: { type: integer, minimum: 30, maximum: 2555 }
                auditLogDays: { type: integer, minimum: 90, maximum: 3650 }
                diagnosticMetadataDays:
                  { type: integer, minimum: 7, maximum: 180 }
                telemetryRollupDays: { type: integer, minimum: 7, maximum: 400 }
      responses:
        "200":
          description: Activity retention policy updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ActivityRetention" }
        "400": { description: Retention values invalid }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
        "422": { description: Retention values exceed hard limits }
  /api/v1/player-releases/{id}:
    delete:
      operationId: deletePlayerRelease
      description: >-
        Delete a cached player release. Refused while the release is
        downloading. Requires an Owner with the admin scope.
        Cookie-authenticated unsafe requests require X-CSRF-Token.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "200":
          description: Player release deleted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    { $ref: "#/components/schemas/PlayerReleaseDeleteResult" }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
        "404": { description: Player release not found }
        "409": { description: Release is downloading }
  /api/v1/player-releases/github/configuration:
    post:
      operationId: configureGitHubReleases
      description: >-
        Configure the GitHub OAuth App used for player release device
        authorization. Requires an Owner with the admin scope.
        Cookie-authenticated unsafe requests require X-CSRF-Token.
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId]
              properties:
                clientId: { type: string }
      responses:
        "200":
          description: GitHub releases configured
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/GitHubClientConfigured" }
        "400": { description: Invalid request body }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
        "409": { description: Client ID environment-managed or connected }
        "422": { description: GitHub Client ID invalid }
        "503": { description: GitHub sign-in unavailable }
  /api/v1/install/presentation-network/helper:
    get:
      operationId: downloadPresentationNetworkHelper
      description: >-
        Public. Download the root-owned Presentation Network helper script
        with its SHA-256 ETag.
      responses:
        "200":
          description: Helper script download
          content:
            text/x-python:
              schema: { type: string }
    head:
      operationId: headPresentationNetworkHelper
      description: >-
        Public. Inspect the Presentation Network helper script without
        downloading it.
      responses:
        "200": { description: Helper script metadata }
  /api/v1/install/presentation-network/helper.sha256:
    get:
      operationId: getPresentationNetworkHelperChecksum
      description: >-
        Public. Read the hex digest of the Presentation Network helper
        script bytes.
      responses:
        "200":
          description: Helper script checksum
          content:
            text/plain:
              schema: { type: string }
  /api/v1/player/preview-session:
    get:
      operationId: getPlayerPreviewSession
      description: >-
        Read the screen's current preview session for uploading frames.
        Requires an authenticated player credential.
      security: [{ deviceBearer: [] }]
      responses:
        "200":
          description: Current preview session
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PreviewSession" }
        "401": { description: Credential invalid or revoked }
  /api/v1/player/preview:
    post:
      operationId: uploadPlayerPreview
      description: >-
        Upload a screen preview frame as multipart form data with the JPEG
        image part (at most 500 KB) and optional playerVersion,
        failureStatus, and RFC 3339 capturedAt fields. Requires an
        authenticated player credential.
      security: [{ deviceBearer: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image: { type: string, format: binary }
                playerVersion: { type: string }
                failureStatus: { type: string }
                capturedAt: { type: string, format: date-time }
      responses:
        "204": { description: Preview frame accepted }
        "400": { description: Preview image unreadable or malformed }
        "401": { description: Credential invalid or revoked }
        "413": { description: Preview image exceeded 500 KB }
        "422": { description: Preview timestamp or frame invalid }
  /api/v1/screens/{id}/preview-session:
    post:
      operationId: renewScreenPreview
      description: >-
        Renew a screen preview session, optionally forcing a fresh capture.
        Requires an enrolled dashboard session. Cookie-authenticated unsafe
        requests require X-CSRF-Token.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                forceCapture: { type: boolean }
      responses:
        "200":
          description: Preview session renewed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PreviewSession" }
        "400": { description: Invalid request body }
        "401": { description: Dashboard authentication required }
  /api/v1/screens/{id}/preview:
    get:
      operationId: getScreenPreview
      description: >-
        Read a screen's latest preview metadata. Requires an enrolled
        dashboard session.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
      responses:
        "200":
          description: Latest screen preview
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ScreenPreviewMetadata" }
        "401": { description: Dashboard authentication required }
  /api/v1/screens/{id}/preview/image:
    get:
      operationId: getScreenPreviewImage
      description: >-
        Download a screen's latest preview image. Requires an enrolled
        dashboard session.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
      responses:
        "200":
          description: Preview JPEG image
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { description: Dashboard authentication required }
        "404": { description: Screen or preview not found }
        "409": { description: Preview session expired }
  /api/v1/auth/background:
    get:
      operationId: getLoginBackgroundImage
      description: >-
        Public. Serve the configured login background image, redirecting to
        the default artwork when none is configured.
      responses:
        "200":
          description: Login background image
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "307": { description: Redirect to default artwork }
    head:
      operationId: headLoginBackgroundImage
      description: >-
        Public. Inspect the configured login background image without
        downloading it.
      responses:
        "200": { description: Login background image metadata }
        "307": { description: Redirect to default artwork }
  /api/v1/settings/login-background:
    get:
      operationId: getLoginBackground
      description: >-
        Read the login background selection. Requires an enrolled dashboard
        session.
      responses:
        "200":
          description: Login background selection
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/LoginBackground" }
        "401": { description: Dashboard authentication required }
    put:
      operationId: putLoginBackground
      description: >-
        Select the login background image asset. Requires an Owner or
        Administrator in an enrolled dashboard session.
        Cookie-authenticated unsafe requests require X-CSRF-Token.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetId]
              properties:
                assetId: { type: string, format: uuid }
      responses:
        "200":
          description: Login background selected
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/LoginBackground" }
        "400": { description: Invalid request body }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
        "409": { description: Setup is not complete }
        "422": { description: Asset is not a valid image asset }
    delete:
      operationId: deleteLoginBackground
      description: >-
        Clear the login background selection. Requires an Owner or
        Administrator in an enrolled dashboard session.
        Cookie-authenticated unsafe requests require X-CSRF-Token.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        "204": { description: Login background cleared }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
  /api/v1/screens/{id}/live-stream:
    post:
      operationId: startLiveStream
      description: >-
        Start a live MJPEG relay session for a screen. Requires an
        authenticated dashboard user with the write scope.
        Cookie-authenticated unsafe requests require X-CSRF-Token.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Live stream session started
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/LiveStreamSession" }
        "401": { description: Dashboard authentication required }
        "403": { description: Screen scope forbids this screen }
  /api/v1/screens/{id}/live-stream/{sessionId}/renew:
    post:
      operationId: renewLiveStream
      description: >-
        Renew a live MJPEG relay session. Requires an authenticated
        dashboard user with the write scope. Cookie-authenticated unsafe
        requests require X-CSRF-Token.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Live stream session renewed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/LiveStreamSession" }
        "401": { description: Dashboard authentication required }
        "403": { description: Screen scope forbids this screen }
        "404": { description: Live stream session not found }
  /api/v1/screens/{id}/live-stream/{sessionId}:
    delete:
      operationId: endLiveStream
      description: >-
        End a live MJPEG relay session. Requires an authenticated dashboard
        user with the write scope. Cookie-authenticated unsafe requests
        require X-CSRF-Token.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        "204": { description: Live stream session ended }
        "401": { description: Dashboard authentication required }
        "403": { description: Screen scope forbids this screen }
        "404": { description: Live stream session not found }
  /api/v1/screens/{id}/live-stream/{sessionId}/mjpeg:
    get:
      operationId: watchLiveStream
      description: >-
        Watch a live MJPEG relay session as a multipart stream. Requires an
        authenticated dashboard user with the read scope.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: MJPEG stream
          content:
            multipart/x-mixed-replace:
              schema: { type: string, format: binary }
        "401": { description: Dashboard authentication required }
        "403": { description: Screen scope forbids this screen }
        "404": { description: Live stream session not found }
  /api/v1/player/live-stream-session:
    get:
      operationId: getPlayerLiveStreamSession
      description: >-
        Read the screen's current live stream session, if any. Requires an
        authenticated player credential.
      security: [{ deviceBearer: [] }]
      responses:
        "200":
          description: Current live stream session
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/LiveStreamSession" }
        "401": { description: Credential invalid or revoked }
  /api/v1/airplay/sessions:
    post:
      operationId: createAirplaySession
      description: >-
        Start a temporary AirPlay Present session on a screen or screen
        group. Requires an Owner or Administrator with the write scope.
        Cookie-authenticated unsafe requests require X-CSRF-Token.
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetType, targetId]
              properties:
                targetType: { type: string, enum: [screen, group] }
                targetId: { type: string, format: uuid }
                durationMinutes:
                  type: integer
                  enum: [0, 15, 30, 60]
                  description: Zero runs until stopped.
                transport: { type: string, enum: [auto, unicast, multicast] }
                audioMode: { type: string, enum: [gateway_only, none] }
      responses:
        "202":
          description: AirPlay session accepted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AirplaySession" }
        "400": { description: Invalid request body }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role or screen scope }
        "409": { description: Selected displays already have an active session }
        "422":
          { description: "Target, duration, transport, or readiness invalid" }
  /api/v1/airplay/sessions/{id}:
    get:
      operationId: getAirplaySession
      description: >-
        Get an AirPlay Present session. Requires an authenticated dashboard
        user.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: AirPlay session
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AirplaySession" }
        "401": { description: Dashboard authentication required }
        "403": { description: Screen scope forbids this session }
        "404": { description: AirPlay session not found }
  /api/v1/airplay/sessions/{id}/stop:
    post:
      operationId: stopAirplaySession
      description: >-
        Stop an AirPlay Present session. Requires an Owner or Administrator
        with the write scope. Cookie-authenticated unsafe requests require
        X-CSRF-Token. The server commits the stop transition and required
        Player cleanup commands together. Retry if the server returns 503.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 120 }
      responses:
        "200":
          description: AirPlay session stopped
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AirplaySession" }
        "400": { description: Invalid request body }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role or screen scope }
        "404": { description: AirPlay session not found }
        "422": { description: Stop reason too long }
        "503":
          {
            description: Stop transition or required Player cleanup command could not be committed; retry the request,
          }
  /api/v1/users:
    get:
      operationId: listUsers
      description: >-
        List dashboard user accounts. Requires an Owner or Administrator
        with the admin scope.
      responses:
        "200":
          description: User accounts with MFA enrollment state
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ManagedUserList" }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
    post:
      operationId: createUser
      description: >-
        Create a dashboard user account. Requires an Owner or Administrator
        with the admin scope. Only an Owner may create Owner or
        Administrator accounts. Cookie-authenticated unsafe requests require
        X-CSRF-Token.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, username, password, role]
              properties:
                name: { type: string }
                username: { type: string }
                password: { type: string }
                role:
                  type: string
                  enum: [owner, administrator, editor, contributor, viewer]
                active: { type: boolean }
      responses:
        "201":
          description: User account created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "400": { description: Invalid request body }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
        "409": { description: Username already in use }
        "422":
          description: >-
            Name, username, password, or role invalid
  /api/v1/users/{id}:
    patch:
      operationId: updateUser
      description: >-
        Update a dashboard user account. Requires an Owner or Administrator
        with the admin scope. Cookie-authenticated unsafe requests require
        X-CSRF-Token.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                username: { type: string }
                password: { type: string }
                role:
                  type: string
                  enum: [owner, administrator, editor, contributor, viewer]
                active: { type: boolean }
      responses:
        "200":
          description: User account updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "400": { description: Invalid request body }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
        "404": { description: User not found }
        "409":
          { description: "Username in use, self-deactivation, or last Owner" }
        "422":
          description: >-
            Name, username, password, or role invalid
    delete:
      operationId: deleteUser
      description: >-
        Deactivate a dashboard user account. Requires an Owner or
        Administrator with the admin scope. Cookie-authenticated unsafe
        requests require X-CSRF-Token.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        "204": { description: User account deactivated }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
        "404": { description: User not found }
        "409": { description: Cannot deactivate self or the last Owner }
  /api/v1/users/{id}/security/reset:
    post:
      operationId: resetUserSecurity
      description: >-
        Owner/Administrator recovery path. Clears every factor, revokes the
        account's sessions, and records an audit entry.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        "204": { description: Factors cleared }
        "403": { description: Insufficient role }
        "404": { description: User not found }
  /api/v1/users/{id}/permanent:
    delete:
      operationId: permanentlyDeleteUser
      description: >-
        Permanently removes an inactive user account. Account-owned preferences,
        sessions, grants, and security credentials are removed; retained records
        keep their history with user attribution cleared.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        "204": { description: User permanently deleted }
        "403": { description: Insufficient role }
        "404": { description: User not found }
        "409": { description: "User is active, is the current user, or changed
              state" }
  /api/v1/users/{id}/screen-scopes:
    get:
      operationId: getUserScreenScopes
      description: >-
        Read which locations and sync groups an account may operate screens
        in. Requires an Owner or Administrator with the admin scope. An
        empty grant list means the whole fleet.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Screen scope grants
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ScreenScopeList" }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
        "404": { description: User not found }
    put:
      operationId: putUserScreenScopes
      description: >-
        Replace an account's screen scope grants. Requires an Owner or
        Administrator with the admin scope. Cookie-authenticated unsafe
        requests require X-CSRF-Token. An Owner cannot be scoped and
        nobody can change their own scope.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scopes]
              properties:
                scopes:
                  type: array
                  items: { $ref: "#/components/schemas/ScreenScope" }
      responses:
        "200":
          description: Screen scope grants replaced
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ScreenScopeList" }
        "400": { description: Invalid request body }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
        "404": { description: User not found }
        "422": { description: Scope invalid or account not scopable }
  /api/v1/auth/logout:
    post:
      operationId: logout
      description: >-
        Logout. Requires an enrolled dashboard session.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        "204": { description: Session revoked }
        "401": { description: Authentication required }
        "403": { description: CSRF verification failed }
  /api/v1/system/identity:
    get:
      operationId: installationIdentity
      description: >-
        Public. Safe installation identity for pairing and discovery: product,
        API version, installation ID, organization name, and whether pairing
        is enabled. Never includes secrets. Players read this before sending
        any stored credential.
      responses:
        "200":
          description: Safe Tilecast installation identity
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/InstallationIdentity" }
  /api/v1/content-folders:
    get:
      operationId: listContentFolders
      description: >-
        List content folders. Requires an authenticated dashboard user.
      responses:
        "200":
          description: Installation content folders with asset counts
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ContentFolder" }
    post:
      operationId: createContentFolder
      description: >-
        Create content folder. Requires an authenticated dashboard user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContentFolderInput" }
      responses:
        "201":
          description: Folder created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ContentFolder" }
        "422": { description: Validation failed }
  /api/v1/content-collections:
    get:
      operationId: listContentCollections
      description: >-
        List content collections. Requires an authenticated dashboard user.
      responses:
        "200":
          description: Installation collections with asset counts
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ContentCollection" }
    post:
      operationId: createContentCollection
      description: >-
        Create content collection. Requires an authenticated dashboard user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContentCollectionInput" }
      responses:
        "201":
          description: Collection created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ContentCollection" }
  /api/v1/content-tags:
    get:
      operationId: listContentTags
      description: >-
        List content tags. Requires an authenticated dashboard user.
      responses:
        "200":
          description: Installation tags with asset counts
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ContentTag" }
    post:
      operationId: createContentTag
      description: >-
        Create content tag. Requires an authenticated dashboard user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContentTagInput" }
      responses:
        "201":
          description: Tag created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ContentTag" }
  /api/v1/assets/bulk-organize:
    post:
      operationId: bulkOrganizeAssets
      description: >-
        Bulk organize assets. Requires an authenticated dashboard user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetIds]
              properties:
                assetIds:
                  {
                    type: array,
                    minItems: 1,
                    maxItems: 250,
                    uniqueItems: true,
                    items: { type: string, format: uuid },
                  }
                setFolder: { type: boolean }
                folderId: { type: string, format: uuid }
                addTagIds:
                  { type: array, items: { type: string, format: uuid } }
                removeTagIds:
                  { type: array, items: { type: string, format: uuid } }
                addCollectionIds:
                  { type: array, items: { type: string, format: uuid } }
                removeCollectionIds:
                  { type: array, items: { type: string, format: uuid } }
      responses:
        "200":
          description: All selected assets organized atomically
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/BulkAssetResult" }
        "404": { description: An asset or organization record was not found }
        "422": { description: Validation failed }
  /api/v1/player/pairing-sessions:
    post:
      operationId: createPairingSession
      description: >-
        Public. Start a pairing session and return the visible code with its private poll secret.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PairingSessionCreateRequest" }
      responses:
        "201":
          description: Pairing session created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PairingSessionCreated" }
        "409": { description: Installation identity mismatch }
        "429": { description: Pairing requests are rate limited }
  /api/v1/player/pairing-sessions/{id}:
    get:
      operationId: pollPairingSession
      description: >-
        Poll a pairing session; the private poll secret authenticates this call. Never use the visible pairing code to poll.
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            in: header,
            name: Authorization,
            required: true,
            schema: { type: string, pattern: "^Pairing " },
          }
      responses:
        "200":
          description: Pairing state or one-time enrollment result
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PairingSessionPoll" }
        "401": { description: Poll secret missing or invalid }
  /api/v1/player/browser/recover:
    post:
      operationId: recoverBrowserPlayer
      description: Exchange one slot recovery capability over same-origin HTTPS. Replace the binding epoch and issue an independent HttpOnly session. Rate limited; no-store.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrowserRecoveryRequest" }
      responses:
        "201":
          description: Browser session cookie issued; no bearer credential in the response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserSessionResponse" }
        "401": { description: Invalid or revoked recovery capability }
        "403": { description: Same-origin HTTPS required }
        "429": { description: Rate limited }
  /api/v1/player/browser/enroll:
    post:
      operationId: enrollBrowserPlayer
      description: Consume an ordinary approved pairing enrollment token and register a browser device key in one transaction. Issue an HttpOnly session instead of a permanent bearer credential.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrowserEnrollmentRequest" }
      responses:
        "201":
          description: Browser session cookie issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserSessionResponse" }
        "401": { description: Enrollment credential invalid }
        "403": { description: Same-origin HTTPS required }
        "409": { description: Token already consumed }
        "429": { description: Rate limited }
  /api/v1/player/browser/challenge:
    post:
      operationId: challengeBrowserPlayer
      description: Create one two-minute challenge for the current slot and binding. Rate limited; no-store.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrowserBindingRequest" }
      responses:
        "200":
          description: Single-use device-key challenge
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/BrowserChallenge" }
        "401": { description: Binding is invalid or replaced }
        "403": { description: Same-origin HTTPS required }
        "429": { description: Rate limited }
  /api/v1/player/browser/renew:
    post:
      operationId: renewBrowserPlayerSession
      description: Consume the challenge before verification. The signature covers the exact challenge message the Server issued. The Server rebuilds that message from the slot, binding and nonce and never accepts client-supplied signing text. Verify a P-256 SHA-256 WebCrypto P1363 signature. Issue a fresh HttpOnly session only for the active binding epoch.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrowserRenewalRequest" }
      responses:
        "200":
          description: Browser session cookie renewed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserSessionResponse" }
        "401": { description: "Challenge, signature, or binding is invalid" }
        "403": { description: Same-origin HTTPS required }
        "429": { description: Rate limited }
  /api/v1/player/browser/session:
    get:
      operationId: getBrowserPlayerSession
      security: [{ browserPlayerSession: [] }]
      description: Read the active Browser Player identity without exposing cookie material. Requires same-origin HTTPS fetch metadata; no-store.
      responses:
        "200":
          description: Active Browser Player identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserSessionResponse" }
        "401": { description: Browser session invalid or expired }
        "403": { description: Same-origin HTTPS required }
  /api/v1/player/browser/selection:
    get:
      operationId: getBrowserPlayerSelection
      security: [{ browserPlayerSession: [] }]
      description: Read the Server's current playback selection for this session's own Screen. No future offline schedule evaluation is delegated to the browser.
      responses:
        "200":
          description: Current Server selection
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PlaybackPlan" }
        "401": { description: Browser session invalid or expired }
        "403": { description: Same-origin HTTPS required }
  /api/v1/screens/browser:
    post:
      operationId: createBrowserPlayerSlot
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: Owner or Administrator creates an awaiting Browser Player Screen. The recovery secret is returned once. Requires same-origin HTTPS and the normal dashboard mutation boundary.
      parameters:
        - {
            in: header,
            name: X-CSRF-Token,
            required: false,
            schema: { type: string },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrowserScreenRequest" }
      responses:
        "201":
          description: Slot and one-time launch secret response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserLaunchResponse" }
        "403":
          {
            description: Administrative authorization or same-origin HTTPS required,
          }
  /api/v1/screens/{id}/browser:
    get:
      operationId: getBrowserPlayerSlot
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: Owner or Administrator reads slot metadata. This operation never returns the recovery secret.
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          description: Browser slot metadata
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/BrowserSlot" }
        "404": { description: Browser slot not found or outside user scope }
  /api/v1/screens/{id}/browser/recovery:
    put:
      operationId: setBrowserPlayerRecovery
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: Owner or Administrator regenerates the sole active recovery credential when enabled is true. False disables recovery. Existing sessions remain valid. Requires same-origin HTTPS and normal CSRF protection.
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            in: header,
            name: X-CSRF-Token,
            required: false,
            schema: { type: string },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: Recovery state and new secret when regenerated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserLaunchResponse" }
        "403":
          {
            description: Administrative authorization or same-origin HTTPS required,
          }
        "404": { description: Browser slot not found or outside user scope }
  /api/v1/player/enroll:
    post:
      operationId: enrollPlayer
      description: >-
        Redeem a one-time enrollment token for the permanent device credential, returned exactly once. The enrollment token authenticates this call.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlayerEnrollmentRequest" }
      responses:
        "201":
          description: Device credential returned exactly once
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/EnrollmentResult" }
        "409": { description: Enrollment token already used }
  /api/v1/player/heartbeat:
    post:
      operationId: playerHeartbeat
      security: [{ deviceBearer: [] }]
      description: >-
        Accepts the authenticated Player heartbeat. Optional Linux Display
        Control fields report detected providers, independent capabilities,
        display power observations, and policy state. They do not determine
        Player online status; command acknowledgement and display state
        confirmation remain separate.


        Players released with the retired Noise Meter plugin may still send a
        `noiseMeter` object. The server accepts it and ignores it, so the rest
        of the heartbeat is recorded.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlayerHeartbeat" }
      responses:
        "200":
          description:
            Heartbeat accepted. `data.ignoredFields` names optional playback
            identifiers that were malformed and therefore dropped.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/HeartbeatAccepted" }
        "400": { description: Heartbeat body rejected }
        "401": { description: Credential invalid or revoked }
        "403": { description: Screen disabled }
  /api/v1/player/liveness:
    post:
      operationId: playerLiveness
      security: [{ deviceBearer: [] }]
      description: >-
        Records authenticated Player contact for background liveness. This
        endpoint intentionally accepts no playback snapshot and cannot change
        the current manifest, content, version, cache policy, or playback
        state.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Liveness contact accepted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/LivenessAccepted" }
        "401": { description: Credential invalid or revoked }
        "403": { description: Screen disabled }
  /api/v1/player/socket:
    get:
      operationId: playerSocket
      description: >-
        Player socket. Requires an authenticated player credential.
      security: [{ deviceBearer: [] }]
      responses:
        "101": { description: Player WebSocket connected }
        "401": { description: Credential invalid or revoked }
  /api/v1/activity/overview:
    get:
      operationId: getActivityOverview
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires an authenticated user with the read scope. Fleet activity
        overview for a time window: summary cards, fleet health, and the
        warning-and-error timeline. from and to are RFC 3339 timestamps
        defaulting to the last 24 hours; an unparsable range fails with
        422 activity_range_invalid.
      parameters:
        - {
            in: query,
            name: from,
            required: false,
            schema: { type: string, format: date-time },
          }
        - {
            in: query,
            name: to,
            required: false,
            schema: { type: string, format: date-time },
          }
      responses:
        "200":
          description: Activity overview
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ActivityOverview" }
        "401": { description: Dashboard authentication required }
        "422": { description: activity_range_invalid }
  /api/v1/activity/uptime:
    get:
      operationId: getActivityUptime
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires an authenticated user with the read scope. Fleet uptime
        report with fleet totals, a bucketed series, and per-screen
        strips. window is one of 24h, 7d, or 30d and defaults to 24h; any
        other value fails with 422 uptime_window_invalid.
      parameters:
        - {
            in: query,
            name: window,
            required: false,
            schema: { type: string, enum: [24h, 7d, 30d] },
          }
      responses:
        "200":
          description: Uptime report
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/UptimeReport" }
        "401": { description: Dashboard authentication required }
        "422": { description: uptime_window_invalid }
  /api/v1/activity/compliance:
    get:
      operationId: getPlaybackCompliance
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires an authenticated user with the read scope.
        Expected-versus-actual playback compliance for a time window, cut
        by dimension (screen, location, group, presentation, schedule,
        date, or reason; defaults to screen). from and to are RFC 3339
        timestamps defaulting to the last 24 hours.
      parameters:
        - {
            in: query,
            name: from,
            required: false,
            schema: { type: string, format: date-time },
          }
        - {
            in: query,
            name: to,
            required: false,
            schema: { type: string, format: date-time },
          }
        - {
            in: query,
            name: dimension,
            required: false,
            schema:
              {
                type: string,
                enum:
                  [
                    screen,
                    location,
                    group,
                    presentation,
                    schedule,
                    date,
                    reason,
                  ],
              },
          }
      responses:
        "200":
          description: Playback compliance report
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ComplianceReport" }
        "401": { description: Dashboard authentication required }
        "422": { description: activity_range_invalid }
  /api/v1/activity/incidents:
    get:
      operationId: listIncidents
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires an authenticated user with the read scope. Incident list
        newest first, defaulting to active incidents. status accepts open,
        acknowledged, recovered, resolved, ignored, and all; severity
        accepts info, warning, error, and critical; type accepts
        connectivity, playback, storage, safe-mode, and update.
      parameters:
        - { in: query, name: status, required: false, schema: { type: string } }
        - {
            in: query,
            name: severity,
            required: false,
            schema: { type: string },
          }
        - { in: query, name: type, required: false, schema: { type: string } }
        - {
            in: query,
            name: screen,
            required: false,
            schema: { type: string, format: uuid },
          }
        - {
            in: query,
            name: group,
            required: false,
            schema: { type: string, format: uuid },
          }
        - {
            in: query,
            name: location,
            required: false,
            schema: { type: string, format: uuid },
          }
        - {
            in: query,
            name: assignee,
            required: false,
            schema: { type: string, format: uuid },
          }
        - {
            in: query,
            name: failureCode,
            required: false,
            schema: { type: string },
          }
        - { in: query, name: search, required: false, schema: { type: string } }
        - {
            in: query,
            name: from,
            required: false,
            schema: { type: string, format: date-time },
          }
        - {
            in: query,
            name: to,
            required: false,
            schema: { type: string, format: date-time },
          }
        - {
            in: query,
            name: dateBasis,
            required: false,
            schema: { type: string, enum: [opened, recovered, resolved] },
          }
      responses:
        "200":
          description: Incident list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/IncidentList" }
        "401": { description: Dashboard authentication required }
        "422": { description: incident_status_invalid }
  /api/v1/activity/incidents/{id}:
    get:
      operationId: getIncident
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires an authenticated user with the read scope. One incident
        with its timeline and affected screens.
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          description: Incident detail with timeline
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/IncidentDetail" }
        "401": { description: Dashboard authentication required }
        "404": { description: incident_not_found }
    patch:
      operationId: updateIncident
      description: >-
        Apply an operator action to an incident; every action is appended to
        the incident timeline with its actor. Requires an Owner or
        Administrator with the write scope. Cookie-authenticated unsafe
        requests require X-CSRF-Token.
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { $ref: "#/components/schemas/IncidentAction" }
                assignedTo: { type: string }
                reason: { type: string }
                notes: { type: string }
      responses:
        "200":
          description: Incident updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Incident" }
        "400": { description: Incident action invalid }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
        "404": { description: Incident not found }
        "422": { description: Assignee invalid }
  /api/v1/screens:
    get:
      operationId: listScreens
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires an authenticated user with the read scope. A scoped
        account sees only its own screens; the list and per-screen
        authorization use the same predicate. Status values are computed
        server-side, never stored.
      responses:
        "200":
          description: Computed screen status list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ScreenList" }
        "401": { description: Dashboard authentication required }
  /api/v1/screens/{id}:
    get:
      operationId: getScreen
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires an authenticated user with the read scope. A screen
        outside the caller's scope answers 404, indistinguishable from
        unknown.
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          description: Screen details
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Screen" }
        "401": { description: Dashboard authentication required }
        "404": { description: Screen unknown or outside caller scope }
    patch:
      operationId: updateScreen
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires the Owner or Administrator role with the write scope.
        Cookie requests additionally require the X-CSRF-Token header.
        Replaces a screen's details document.
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                locationId: { type: [string, "null"], format: uuid }
                roomName: { type: string, maxLength: 120 }
                roomNumber: { type: string, maxLength: 80 }
                mapPositionOverride:
                  oneOf:
                    - { $ref: "#/components/schemas/MapCoordinates" }
                    - { type: "null" }
                description: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: Screen updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Screen" }
        "401": { description: Dashboard authentication required }
        "403": { description: Owner or Administrator required }
  /api/v1/screens/{id}/player-history:
    get:
      operationId: listScreenPlayerHistory
      description: >-
        List screen player history. Requires an authenticated dashboard user.
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          description: Current and retired physical player records
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PlayerHistoryList" }
        "404": { description: Screen not found }
  /api/v1/screens/pairing/pending:
    get:
      operationId: listPendingPairings
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: Requires the Owner or Administrator role and the read scope. Pending pairing sessions awaiting approval or rejection.
      responses:
        "200":
          description: Pending pairing sessions
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PendingPairingList" }
        "401": { description: Dashboard authentication required }
        "403": { description: Owner or Administrator required }
  /api/v1/screens/pairing/resolve:
    post:
      operationId: resolvePairingCode
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires an authenticated user with the write scope. Resolves a
        visible six-character pairing code into its pending session.
        Unknown, expired, or consumed codes answer 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, minLength: 6, maxLength: 6 }
      responses:
        "200":
          description: Pending player metadata
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PairingRequest" }
        "401": { description: Dashboard authentication required }
        "404": { description: "Code invalid, missing, or expired" }
  /api/v1/screens/pairing/{id}/approve:
    post:
      operationId: approvePairing
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires the Owner or Administrator role with the admin scope.
        Cookie requests additionally require the X-CSRF-Token header.
        Approves a pending pairing session and creates the screen record.
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, roomName, roomNumber, description]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                locationId: { type: [string, "null"], format: uuid }
                roomName: { type: string, maxLength: 120 }
                roomNumber: { type: string, maxLength: 80 }
                description: { type: string, maxLength: 1000 }
                replaceExistingCredential:
                  type: boolean
                  default: false
                  description: Explicitly authorizes credential rotation after successful enrollment.
                replaceHardware:
                  type: boolean
                  default: false
                  description: Assigns the new player to an existing logical screen without changing its content or policy relationships.
                replacementScreenId:
                  {
                    type: [string, "null"],
                    format: uuid,
                    description: Required when replaceHardware is true.,
                  }
      responses:
        "200":
          description: Screen approved
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Screen" }
        "409": { description: "Pairing recovery confirmation required, hardware
              replacement conflict, or pairing state conflict" }
  /api/v1/locations:
    get:
      operationId: listLocations
      description: >-
        List locations. Requires an authenticated dashboard user.
      responses:
        "200":
          description: Reusable locations with assigned screen counts
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/LocationList" }
    post:
      operationId: createLocation
      description: >-
        Create location. Requires an authenticated dashboard user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationInput" }
      responses:
        "201":
          description: Location created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Location" }
        "403": { description: Owner or Administrator required }
        "409":
          { description: A case-insensitive matching location already exists }
  /api/v1/locations/{id}:
    patch:
      operationId: updateLocation
      description: >-
        Update location. Requires an authenticated dashboard user.
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationInput" }
      responses:
        "200":
          description: Location updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Location" }
        "409":
          { description: A case-insensitive matching location already exists }
    delete:
      operationId: deleteLocation
      description: >-
        Delete location. Requires an authenticated dashboard user.
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "204": { description: Location deleted }
        "409": { description: Location still has assigned screens }
  /api/v1/plugins:
    get:
      operationId: listPlugins
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: Every plugin the running release offers, joined with this installation's state. Readable by any signed-in account.
      responses:
        "200":
          description: Plugin catalog
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PluginCatalog" }
        "401": { description: Dashboard authentication required }
  /api/v1/plugins/{pluginId}/install:
    post:
      operationId: installPlugin
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: Requires the Owner or Administrator role and an authenticated user with the admin scope. Cookie requests also require CSRF. Records a release-owned plugin as installed. Idempotent. Never downloads or runs code.
      parameters:
        - { $ref: "#/components/parameters/PluginID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "201":
          description: Plugin installed by this request
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/CatalogPlugin" }
        "200":
          description: Plugin was already installed; same representation
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/CatalogPlugin" }
        "403": { description: Owner or Administrator and CSRF token required }
        "404":
          {
            description: plugin_not_found — the release does not define this plugin,
          }
        "409": { description: plugin_not_installable }
  /api/v1/plugins/{pluginId}/installation:
    delete:
      operationId: removePlugin
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: Requires the Owner or Administrator role and an authenticated user with the admin scope. Cookie requests also require CSRF. Deletes the installation record. Never deletes plugin data; refuses while plugin-owned resources remain. Idempotent for a plugin that is not installed. An installation row for a plugin this release does not know may also be removed; only the row is deleted.
      parameters:
        - { $ref: "#/components/parameters/PluginID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "204":
          description: >-
            Plugin removed, or was not installed
        "403": { description: Owner or Administrator and CSRF token required }
        "404": { description: plugin_not_found }
        "409":
          description: plugin_in_use — remaining resources are listed in error.details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginInUseError" }
  /api/v1/plugins/{pluginId}/automation:
    get:
      operationId: getPluginAutomation
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: A known, installed plugin's resolved automation document. Readable by any signed-in account. Operator clients dispatch generic commands on it without naming the plugin. Unknown plugins answer plugin_not_found, known-but-uninstalled ones plugin_not_installed, and plugins with no automation mapping plugin_automation_not_found.
      parameters:
        - { $ref: "#/components/parameters/PluginID" }
      responses:
        "200":
          description: Resolved automation document
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PluginAutomation" }
        "401": { description: Dashboard authentication required }
        "404":
          {
            description: plugin_not_found — the release does not define this plugin — or plugin_automation_not_found — it maps no operations into automation,
          }
        "409": { description: plugin_not_installed }
  /api/v1/plugins/dependency-graph:
    get:
      operationId: getDependencyGraph
      description: Requires an authenticated dashboard session. Returns the current content and delivery topology. Directed edges run from a dependency to the record that consumes it. Dependency Graph is a Studio system tool, not an installable plugin.
      responses:
        "200":
          description: Typed dependency nodes and directed consumer edges
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DependencyGraph" }
  /api/v1/plugin-store:
    get:
      operationId: listPluginStore
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: The normalized plugin store. Every plugin source Studio can browse, joined with this installation's state. Readable by any signed-in account. Release-owned entries always appear; marketplace entries join the release-owned entries; custom entries join from bound repositories.
      responses:
        "200":
          description: Plugin store
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PluginStore" }
        "401": { description: Dashboard authentication required }
  /api/v1/plugin-store/{packageId}:
    get:
      operationId: getPluginStoreEntry
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: One normalized plugin-store entry. Readable by any signed-in account. Unknown package IDs answer plugin_not_found.
      parameters:
        - { $ref: "#/components/parameters/PackageID" }
      responses:
        "200":
          description: Plugin store entry
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PluginStoreEntry" }
        "401": { description: Dashboard authentication required }
        "404":
          {
            description: plugin_not_found — no store entry carries this package ID,
          }
  /api/v1/plugin-store/marketplace/refresh:
    post:
      operationId: refreshMarketplaceCatalog
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Refresh the official Tilecast marketplace now and answer with its
        cache status. Requires the Owner or Administrator role with the admin
        scope. The previous cache keeps serving when the refresh fails.
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "200":
          description: Marketplace cache status
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [marketplace]
                    properties:
                      marketplace:
                        { $ref: "#/components/schemas/PluginMarketplaceStatus" }
        "401": { description: Dashboard authentication required }
        "403": { description: Owner or Administrator role required }
        "502":
          { description: marketplace_refresh_failed — the catalog fetch failed }
  /api/v1/plugin-store/resolve-github:
    post:
      operationId: resolveGitHubRepository
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires the Owner or Administrator role with the admin scope.
        Cookie requests additionally require the X-CSRF-Token header.
        Resolves a public GitHub repository URL to its install review:
        the published manifest, the pinned digest, provenance, and
        installed state. Persists nothing; installing re-resolves fresh.
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repository]
              properties:
                repository:
                  {
                    type: string,
                    format: uri,
                    description: "Public GitHub repository URL.",
                  }
      responses:
        "200":
          description: Install review
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/GitHubInstallReview" }
        "400": { description: invalid_repository — not a GitHub repository URL }
        "401": { description: Dashboard authentication required }
        "403": { description: Owner or Administrator role required }
        "404":
          { description: repository_not_found — GitHub has no such repository }
        "422":
          description: repository_private, no_published_release, manifest_not_found, manifest_invalid, release_tag_unusable, no_published_package, package_unsigned, artifact_invalid, package_mismatch, or package_incompatible
        "502":
          description: upstream_unavailable — GitHub, the registry, or Sigstore is unreachable
  /api/v1/plugin-store/{packageId}/resolve:
    post:
      operationId: resolveMarketplacePackage
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires the Owner or Administrator role with the admin scope.
        Cookie requests additionally require the X-CSRF-Token header.
        Resolves a cached marketplace listing to its install review:
        the pinned artifact verifies provenance, pulls by digest, and
        reads the published manifest, which is authoritative for
        capabilities. Installs nothing; installing re-resolves fresh.
      parameters:
        - { $ref: "#/components/parameters/PackageID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "200":
          description: Install review
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/GitHubInstallReview" }
        "401": { description: Dashboard authentication required }
        "403": { description: Owner or Administrator role required }
        "404":
          { description: plugin_not_found — no listing carries this package ID }
        "422":
          description: repository_not_supported, no_published_package, package_unsigned, artifact_invalid, package_mismatch, or package_incompatible
        "502":
          description: upstream_unavailable — the catalog, the registry, or Sigstore is unreachable
  /api/v1/plugin-store/{packageId}/install:
    post:
      operationId: installStorePackage
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires the Owner or Administrator role with the admin scope.
        Cookie requests additionally require the X-CSRF-Token header.
        Installs the store entry. A marketplace entry installs from its
        listing with an empty body; a custom entry installs when the body
        names its repository. The package ID must match the resolved
        manifest. Audited.
      parameters:
        - { $ref: "#/components/parameters/PackageID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                repository:
                  {
                    type: string,
                    format: uri,
                    description: "Custom repository URL. Omit for marketplace listings.",
                  }
      responses:
        "201":
          description: Package installed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/InstalledPackage" }
        "401": { description: Dashboard authentication required }
        "403": { description: Owner or Administrator role required }
        "404": { description: repository_not_found or plugin_not_found }
        "409":
          description: package_mismatch, package_installed, contribution_collision, or source_conflict
        "422":
          description: repository_private, no_published_release, manifest_not_found, manifest_invalid, release_tag_unusable, no_published_package, package_unsigned, artifact_invalid, package_incompatible, or namespace_violation
        "502":
          description: upstream_unavailable — GitHub, the registry, or Sigstore is unreachable
  /api/v1/packages:
    get:
      operationId: listPackages
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: Every installed extension package with its contributions and, for custom packages, the repository binding. Readable by any signed-in account.
      responses:
        "200":
          description: Installed packages
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/InstalledPackage" }
        "401": { description: Dashboard authentication required }
  /api/v1/packages/{packageId}:
    get:
      operationId: getPackage
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: One installed extension package. Readable by any signed-in account. Unknown package IDs answer package_not_installed.
      parameters:
        - { $ref: "#/components/parameters/PackageID" }
      responses:
        "200":
          description: Installed package
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/InstalledPackage" }
        "401": { description: Dashboard authentication required }
        "404": { description: package_not_installed }
    delete:
      operationId: removePackage
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires the Owner or Administrator role with the admin scope.
        Cookie requests additionally require the X-CSRF-Token header.
        Deletes the installation and its contribution rows. The custom
        source, when any, survives for reinstall. Audited.
      parameters:
        - { $ref: "#/components/parameters/PackageID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "204": { description: Package removed }
        "401": { description: Dashboard authentication required }
        "403": { description: Owner or Administrator role required }
        "404": { description: package_not_installed }
        "409":
          description: package_in_use — contributed content still exists; remaining resources are listed in error.details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageInUseError" }
  /api/v1/packages/{packageId}/update-check:
    post:
      operationId: checkPackageUpdate
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires the Owner or Administrator role with the admin scope.
        Cookie requests additionally require the X-CSRF-Token header.
        Resolves the latest artifact for an installed package without
        activating anything. A custom package re-resolves its repository;
        a marketplace package refreshes the catalog first.
      parameters:
        - { $ref: "#/components/parameters/PackageID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "200":
          description: Update check
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PackageUpdateCheck" }
        "401": { description: Dashboard authentication required }
        "403": { description: Owner or Administrator role required }
        "404": { description: package_not_installed }
        "422":
          description: repository_private, no_published_release, manifest_not_found, manifest_invalid, release_tag_unusable, no_published_package, package_unsigned, artifact_invalid, package_mismatch, or package_incompatible
        "502":
          description: upstream_unavailable — GitHub, the registry, or Sigstore is unreachable
  /api/v1/packages/{packageId}/update:
    post:
      operationId: applyPackageUpdate
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires the Owner or Administrator role with the admin scope.
        Cookie requests additionally require the X-CSRF-Token header.
        Activates the digest an update check approved. The check
        re-resolves fresh, so a stale digest answers update_check_expired
        instead of installing old bytes. Audited.
      parameters:
        - { $ref: "#/components/parameters/PackageID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [digest]
              properties:
                digest:
                  {
                    type: string,
                    description: "Pinned artifact digest as sha256 colon hex.",
                  }
      responses:
        "200":
          description: Update result
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [package, updated]
                    properties:
                      package: { $ref: "#/components/schemas/InstalledPackage" }
                      updated: { type: boolean }
        "400": { description: invalid_request — a digest is required }
        "401": { description: Dashboard authentication required }
        "403": { description: Owner or Administrator role required }
        "404": { description: package_not_installed }
        "409":
          description: update_check_expired, package_mismatch, contribution_collision, source_conflict, or package_in_use — the update drops a contribution persisted content still uses; remaining resources are listed in error.details
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/PackageUpdateConflictError" }
        "422":
          description: repository_private, no_published_release, manifest_not_found, manifest_invalid, release_tag_unusable, no_published_package, package_unsigned, artifact_invalid, package_incompatible, or namespace_violation
        "502":
          description: upstream_unavailable — GitHub, the registry, or Sigstore is unreachable
  /api/v1/packages/{packageId}/rollback:
    post:
      operationId: rollbackPackage
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires the Owner or Administrator role with the admin scope.
        Cookie requests additionally require the X-CSRF-Token header.
        Restores the previous activation. Audited.
      parameters:
        - { $ref: "#/components/parameters/PackageID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "200":
          description: Restored package
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/InstalledPackage" }
        "401": { description: Dashboard authentication required }
        "403": { description: Owner or Administrator role required }
        "404": { description: package_not_installed }
        "409":
          description: no_rollback — the package has no previous activation — or package_in_use — the rollback drops a contribution persisted content still uses; remaining resources are listed in error.details
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/PackageRollbackConflictError" }
  /api/v1/screens/pairing/{id}/reject:
    post:
      operationId: rejectPairing
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires the Owner or Administrator role with the admin scope.
        Cookie requests additionally require the X-CSRF-Token header.
        Rejects a pending pairing session with an optional reason.
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 1000 }
      responses:
        "204": { description: Pairing rejected }
  /api/v1/screens/{id}/disable:
    post:
      operationId: disableScreen
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires the Owner or Administrator role with the write scope.
        Cookie requests additionally require the X-CSRF-Token header.
        Disables a screen and disconnects its player.
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses: { "204": { description: Screen disabled and disconnected } }
  /api/v1/screens/{id}/enable:
    post:
      operationId: enableScreen
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires the Owner or Administrator role with the write scope.
        Cookie requests additionally require the X-CSRF-Token header.
        Re-enables a disabled screen.
      parameters:
        - {
            in: path,
