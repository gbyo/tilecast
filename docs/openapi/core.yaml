openapi: 3.1.0
info:
  title: Tilecast API
  version: 0.10.0
  license:
    name: AGPL-3.0-only
paths:
  /healthz:
    get:
      operationId: health
      responses:
        "200": { description: Server process is running }
  /install.sh:
    get:
      operationId: installLinuxPlayerScript
      description: Public, rate-limited Linux Player provisioning script with this server's URL embedded.
      responses:
        "200": { description: Shell installer }
  /install-airplay.sh:
    get:
      operationId: installAirPlayScript
      description: Public, rate-limited AirPlay provisioning script with this server's URL embedded.
      responses:
        "200": { description: Shell installer }
  /install/tilecast-player.service:
    get:
      operationId: installLinuxPlayerService
      responses:
        "200": { description: Managed systemd user-service template }
  /readyz:
    get:
      operationId: ready
      responses:
        "200": { description: Server and database are ready }
        "503": { description: Database is unavailable }
  /api/v1/install/linux:
    get:
      operationId: installableLinuxPlayerRelease
      responses:
        "200":
          { description: "Latest stable, verified, cached Linux Player release
              metadata" }
        "404": { description: No installable Linux Player release is cached }
  /api/v1/install/linux/artifact:
    get:
      operationId: installableLinuxPlayerArtifact
      responses:
        "200": { description: Verified Linux Player AppImage }
        "404": { description: No installable Linux Player release is cached }
    head:
      operationId: headInstallableLinuxPlayerArtifact
      responses:
        "200": { description: Verified Linux Player AppImage metadata }
        "404": { description: No installable Linux Player release is cached }
  /api/v1/install/airplay/uxplay:
    get:
      operationId: installableUxPlayArtifact
      description: Public, rate-limited, pinned UxPlay 1.73.6 source archive embedded in Tilecast Server.
      responses:
        "200": { description: Verified UxPlay 1.73.6 source archive }
    head:
      operationId: headInstallableUxPlayArtifact
      responses:
        "200": { description: Verified UxPlay 1.73.6 source archive metadata }
  /api/v1/install/airplay/uxplay.sha256:
    get:
      operationId: installableUxPlayChecksum
      responses:
        "200":
          { description: Pinned lowercase SHA-256 of the UxPlay source archive }
  /api/v1/auth/status:
    get:
      operationId: authStatus
      responses:
        "200": { description: Installation and session state }
  /api/v1/demo:
    get:
      operationId: demoState
      description: >-
        Registered only when TILECAST_ENV is demo. Returns the seeded scenario
        and the state of each simulated player.
      responses:
        "200": { description: Demo scenario and simulated player state }
        "401": { description: Authentication required }
  /api/v1/demo/reset:
    post:
      operationId: resetDemo
      description: >-
        Registered only when TILECAST_ENV is demo. Replaces all data with a
        scenario and returns once its simulated players have connected.
        Requires the Owner role and X-CSRF-Token.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                scenario: { type: string, enum: [basic, kitchen-sink] }
      responses:
        "200":
          { description: Scenario restored, with the new session CSRF token }
        "403": { description: Owner role or CSRF token missing }
        "422": { description: Unknown scenario }
  /api/v1/auth/setup:
    post:
      operationId: initialSetup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201": { description: Organization and owner created }
        "409": { description: Setup was already completed }
        "422": { description: Validation failed }
  /api/v1/auth/login:
    post:
      operationId: login
      responses:
        "200":
          description: >-
            Signed in, or a multi-factor challenge when the account has a
            confirmed second factor. A challenge sets no session cookie.
        "401": { description: Invalid credentials }
  /api/v1/auth/mfa/verify:
    post:
      operationId: verifyMultiFactor
      description: Completes a pending sign-in with an authenticator or recovery code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MultiFactorVerifyRequest"
      responses:
        "200": { description: Signed in }
        "401": { description: Incorrect code or expired challenge }
        "429": { description: Too many incorrect codes }
  /api/v1/auth/mfa/passkey/options:
    post:
      operationId: multiFactorPasskeyOptions
      description: Exchanges a pending challenge for a WebAuthn assertion request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeTokenRequest"
      responses:
        "200":
          { description: Assertion options and a replacement challenge token }
        "401": { description: Expired challenge }
        "404": { description: No passkey is enrolled }
        "409": { description: Passkeys are unavailable on this installation }
  /api/v1/auth/passkey/login/options:
    post:
      operationId: passkeyLoginOptions
      description: Starts a discoverable, username-free WebAuthn ceremony.
      responses:
        "200": { description: Assertion options and a challenge token }
        "409": { description: Passkeys are unavailable on this installation }
  /api/v1/auth/passkey/login:
    post:
      operationId: passkeyLogin
      description: >-
        Posts the raw WebAuthn assertion. A verified passkey satisfies
        multi-factor authentication on its own.
      parameters:
        - in: header
          name: X-MFA-Challenge
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnAssertion"
      responses:
        "200": { description: Signed in }
        "401": { description: The passkey could not be verified }
  /api/v1/me/security:
    get:
      operationId: securityStatus
      responses:
        "200": { description: "Enrolled factors, passkeys, and policy state" }
        "401": { description: Authentication required }
  /api/v1/me/security/totp:
    post:
      operationId: beginAuthenticatorEnrollment
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        "200": { description: Provisioning URI and typed secret }
        "409": { description: An authenticator is already enrolled }
  /api/v1/me/security/totp/confirm:
    post:
      operationId: confirmAuthenticatorEnrollment
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthenticatorCodeRequest"
      responses:
        "200": { description: Updated security state }
        "401": { description: Incorrect code }
        "404": { description: No pending enrollment }
  /api/v1/me/security/totp/remove:
    post:
      operationId: removeAuthenticator
      description: Requires the account password in the body.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirmation"
      responses:
        "204": { description: Authenticator removed }
        "403": { description: The password was not correct }
        "409": { description: Policy requires a remaining factor }
  /api/v1/me/security/recovery-codes:
    post:
      operationId: generateRecoveryCodes
      description: >-
        Replaces every unused code. Requires the account password. The plain
        codes are returned exactly once.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirmation"
      responses:
        "201": { description: Ten new recovery codes }
        "403": { description: The password was not correct }
  /api/v1/me/security/passkeys/options:
    post:
      operationId: passkeyRegistrationOptions
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        "200": { description: Creation options and a challenge token }
        "409": { description: Passkeys are unavailable on this installation }
  /api/v1/me/security/passkeys:
    post:
      operationId: registerPasskey
      description: >-
        The passkey is named from the authenticator's AAGUID; no name is
        accepted here. Use the rename endpoint to change it.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
        - in: header
          name: X-MFA-Challenge
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnCredential"
      responses:
        "201": { description: Passkey enrolled }
        "401": { description: The passkey could not be verified }
  /api/v1/me/security/passkeys/{id}:
    patch:
      operationId: renamePasskey
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyRenameRequest"
      responses:
        "204": { description: Passkey renamed }
        "404": { description: Passkey not found }
  /api/v1/me/security/passkeys/{id}/remove:
    post:
      operationId: removePasskey
      description: Requires the account password in the body.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirmation"
      responses:
        "204": { description: Passkey removed }
        "403": { description: The password was not correct }
        "409": { description: Policy requires a remaining factor }
  /api/v1/users/{id}/security/reset:
    post:
      operationId: resetUserSecurity
      description: >-
        Owner/Administrator recovery path. Clears every factor, revokes the
        account's sessions, and records an audit entry.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        "204": { description: Factors cleared }
        "403": { description: Insufficient role }
        "404": { description: User not found }
  /api/v1/users/{id}/permanent:
    delete:
      operationId: permanentlyDeleteUser
      description: >-
        Permanently removes an inactive user account. Account-owned preferences,
        sessions, grants, and security credentials are removed; retained records
        keep their history with user attribution cleared.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        "204": { description: User permanently deleted }
        "403": { description: Insufficient role }
        "404": { description: User not found }
        "409": { description: "User is active, is the current user, or changed
              state" }
  /api/v1/auth/logout:
    post:
      operationId: logout
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        "204": { description: Session revoked }
        "401": { description: Authentication required }
        "403": { description: CSRF verification failed }
  /api/v1/system/identity:
    get:
      operationId: installationIdentity
      responses:
        "200": { description: Safe Tilecast installation identity }
  /api/v1/content-folders:
    get:
      operationId: listContentFolders
      responses:
        "200": { description: Installation content folders with asset counts }
    post:
      operationId: createContentFolder
      responses:
        "201": { description: Folder created }
        "422": { description: Validation failed }
  /api/v1/content-collections:
    get:
      operationId: listContentCollections
      responses:
        "200": { description: Installation collections with asset counts }
    post:
      operationId: createContentCollection
      responses:
        "201": { description: Collection created }
  /api/v1/content-tags:
    get:
      operationId: listContentTags
      responses:
        "200": { description: Installation tags with asset counts }
    post:
      operationId: createContentTag
      responses:
        "201": { description: Tag created }
  /api/v1/assets/bulk-organize:
    post:
      operationId: bulkOrganizeAssets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetIds]
              properties:
                assetIds:
                  {
                    type: array,
                    minItems: 1,
                    maxItems: 250,
                    uniqueItems: true,
                    items: { type: string, format: uuid },
                  }
                setFolder: { type: boolean }
                folderId: { type: string, format: uuid }
                addTagIds:
                  { type: array, items: { type: string, format: uuid } }
                removeTagIds:
                  { type: array, items: { type: string, format: uuid } }
                addCollectionIds:
                  { type: array, items: { type: string, format: uuid } }
                removeCollectionIds:
                  { type: array, items: { type: string, format: uuid } }
      responses:
        "200": { description: All selected assets organized atomically }
        "404": { description: An asset or organization record was not found }
        "422": { description: Validation failed }
  /api/v1/player/pairing-sessions:
    post:
      operationId: createPairingSession
      responses:
        "201": { description: Pairing session created }
        "409": { description: Installation identity mismatch }
        "429": { description: Pairing requests are rate limited }
  /api/v1/player/pairing-sessions/{id}:
    get:
      operationId: pollPairingSession
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            in: header,
            name: Authorization,
            required: true,
            schema: { type: string, pattern: "^Pairing " },
          }
      responses:
        "200": { description: Pairing state or one-time enrollment result }
        "401": { description: Poll secret missing or invalid }
  /api/v1/player/enroll:
    post:
      operationId: enrollPlayer
      responses:
        "201": { description: Device credential returned exactly once }
        "409": { description: Enrollment token already used }
  /api/v1/player/heartbeat:
    post:
      operationId: playerHeartbeat
      security: [{ deviceBearer: [] }]
      description: >-
        Accepts the authenticated Player heartbeat. Optional Linux Display
        Control fields report detected providers, independent capabilities,
        display power observations, and policy state. They do not determine
        Player online status; command acknowledgement and display state
        confirmation remain separate.


        Players released with the retired Noise Meter plugin may still send a
        `noiseMeter` object. The server accepts it and ignores it, so the rest
        of the heartbeat is recorded.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlayerHeartbeat" }
      responses:
        "200":
          description:
            Heartbeat accepted. `data.ignoredFields` names optional playback
            identifiers that were malformed and therefore dropped.
        "400": { description: Heartbeat body rejected }
        "401": { description: Credential invalid or revoked }
        "403": { description: Screen disabled }
  /api/v1/player/liveness:
    post:
      operationId: playerLiveness
      security: [{ deviceBearer: [] }]
      description: >-
        Records authenticated Player contact for background liveness. This
        endpoint intentionally accepts no playback snapshot and cannot change
        the current manifest, content, version, cache policy, or playback
        state.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200": { description: Liveness contact accepted }
        "401": { description: Credential invalid or revoked }
        "403": { description: Screen disabled }
  /api/v1/player/socket:
    get:
      operationId: playerSocket
      security: [{ deviceBearer: [] }]
      responses:
        "101": { description: Player WebSocket connected }
        "401": { description: Credential invalid or revoked }
  /api/v1/screens:
    get:
      operationId: listScreens
      responses:
        "200": { description: Computed screen status list }
        "401": { description: Dashboard authentication required }
  /api/v1/screens/{id}:
    get:
      operationId: getScreen
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200": { description: Screen details }
    patch:
      operationId: updateScreen
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200": { description: Screen updated }
        "403": { description: Owner or Administrator required }
  /api/v1/screens/{id}/player-history:
    get:
      operationId: listScreenPlayerHistory
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200": { description: Current and retired physical player records }
        "404": { description: Screen not found }
  /api/v1/screens/pairing/resolve:
    post:
      operationId: resolvePairingCode
      responses:
        "200": { description: Pending player metadata }
        "404": { description: "Code invalid, missing, or expired" }
  /api/v1/screens/pairing/{id}/approve:
    post:
      operationId: approvePairing
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, roomName, roomNumber, description]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                locationId: { type: [string, "null"], format: uuid }
                roomName: { type: string, maxLength: 120 }
                roomNumber: { type: string, maxLength: 80 }
                description: { type: string, maxLength: 1000 }
                replaceExistingCredential:
                  type: boolean
                  default: false
                  description: Explicitly authorizes credential rotation after successful enrollment.
                replaceHardware:
                  type: boolean
                  default: false
                  description: Assigns the new player to an existing logical screen without changing its content or policy relationships.
                replacementScreenId:
                  {
                    type: [string, "null"],
                    format: uuid,
                    description: Required when replaceHardware is true.,
                  }
      responses:
        "200": { description: Screen approved }
        "409": { description: "Pairing recovery confirmation required, hardware
              replacement conflict, or pairing state conflict" }
  /api/v1/locations:
    get:
      operationId: listLocations
      responses:
        "200": { description: Reusable locations with assigned screen counts }
    post:
      operationId: createLocation
      responses:
        "201": { description: Location created }
        "403": { description: Owner or Administrator required }
        "409":
          { description: A case-insensitive matching location already exists }
  /api/v1/locations/{id}:
    patch:
      operationId: updateLocation
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200": { description: Location updated }
        "409":
          { description: A case-insensitive matching location already exists }
    delete:
      operationId: deleteLocation
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "204": { description: Location deleted }
        "409": { description: Location still has assigned screens }
  /api/v1/plugins:
    get:
      operationId: listPlugins
      description: Every plugin the running release offers, joined with this installation's state. Readable by any signed-in account.
      responses:
        "200":
          description: Plugin catalog
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PluginCatalog" }
  /api/v1/plugins/{pluginId}/install:
    post:
      operationId: installPlugin
      description: Records a release-owned plugin as installed. Idempotent. Never downloads or runs code.
      parameters:
        - { $ref: "#/components/parameters/PluginID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "201":
          description: Plugin installed by this request
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/CatalogPlugin" }
        "200":
          { description: Plugin was already installed; same representation }
        "403": { description: Owner or Administrator and CSRF token required }
        "404":
          {
            description: plugin_not_found — the release does not define this plugin,
          }
        "409": { description: plugin_not_installable }
  /api/v1/plugins/{pluginId}/installation:
    delete:
      operationId: removePlugin
      description: Deletes the installation record. Never deletes plugin data; refuses while plugin-owned resources remain. Idempotent for a plugin that is not installed. An installation row for a plugin this release does not know may also be removed; only the row is deleted.
      parameters:
        - { $ref: "#/components/parameters/PluginID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "204": { description: Plugin removed, or was not installed }
        "403": { description: Owner or Administrator and CSRF token required }
        "404": { description: plugin_not_found }
        "409":
          description: plugin_in_use — remaining resources are listed in error.details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginInUseError" }
  /api/v1/plugins/dependency-graph:
    get:
      operationId: getDependencyGraph
      description: Returns the current content and delivery topology. Directed edges run from a dependency to the record that consumes it. Dependency Graph is a Studio system tool, not an installable plugin.
      responses:
        "200":
          description: Typed dependency nodes and directed consumer edges
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DependencyGraph" }
  /api/v1/screens/pairing/{id}/reject:
    post:
      operationId: rejectPairing
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "204": { description: Pairing rejected }
  /api/v1/screens/{id}/disable:
    post:
      operationId: disableScreen
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses: { "204": { description: Screen disabled and disconnected } }
  /api/v1/screens/{id}/enable:
    post:
      operationId: enableScreen
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses: { "204": { description: Screen enabled } }
  /api/v1/screens/{id}/revoke:
    post:
      operationId: revokeScreenCredential
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses: { "204": { description: Credential permanently revoked } }
  /api/v1/uploads:
    post:
      operationId: createUploadSession
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUploadRequest" }
      responses:
        "201": { description: Resumable upload session created }
        "413": { description: Upload exceeds the configured maximum }
        "507": { description: Reserved free storage would be violated }
  /api/v1/uploads/{id}:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    head:
      operationId: inspectUploadSession
      responses:
        "204":
          description: Current upload state
          headers:
            Upload-Offset: { schema: { type: integer, format: int64 } }
            Upload-Length: { schema: { type: integer, format: int64 } }
            Upload-Status:
              { schema: { $ref: "#/components/schemas/UploadStatus" } }
            Upload-Expires: { schema: { type: string, format: date-time } }
    patch:
      operationId: appendUploadBytes
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - {
            in: header,
            name: Upload-Offset,
            required: true,
            schema: { type: integer, format: int64, minimum: 0 },
          }
      requestBody:
        required: true
        content:
          application/offset+octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204": { description: Chunk persisted and synchronized }
        "409": { description: Offset mismatch }
    delete:
      operationId: cancelUpload
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        { "204": { description: Upload cancelled and temporary data removed } }
  /api/v1/uploads/{id}/complete:
    post:
      operationId: completeUpload
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200": { description: Upload finalized or idempotent result returned }
        "409": { description: Upload is incomplete }
        "415": { description: Detected media type is unsupported }
  /api/v1/assets:
    get:
      operationId: listAssets
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - {
            in: query,
            name: pageSize,
            schema: { type: integer, minimum: 1, maximum: 100 },
          }
        - { in: query, name: search, schema: { type: string } }
        - {
            in: query,
            name: type,
            schema: { $ref: "#/components/schemas/AssetType" },
          }
        - {
            in: query,
            name: status,
            schema: { $ref: "#/components/schemas/AssetStatus" },
          }
        - {
            in: query,
            name: sort,
            schema: { type: string, enum: [newest, oldest, updated, name] },
          }
        - {
            in: query,
            name: archived,
            schema: { type: boolean, default: false },
            description: Return manually archived and automatically expired library content instead of active content,
          }
      responses: { "200": { description: Stable paginated media library } }
  /api/v1/assets/archive:
    post:
      operationId: archiveAssets
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [assetIds]
              properties:
                assetIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses:
        {
          "200": { description: Selected unused assets archived atomically },
          "409": { description: At least one asset is still in use },
        }
  /api/v1/assets/restore:
    post:
      operationId: restoreAssets
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [assetIds]
              properties:
                assetIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses: { "200": { description: Selected assets restored atomically } }
  /api/v1/assets/{id}:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    get:
      operationId: getAsset
      responses: { "200": { description: Trusted metadata and variants } }
    patch:
      operationId: updateAsset
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 180 }
                description: { type: string, maxLength: 2000 }
                availabilitySet: { type: boolean }
                availableFrom: { type: string, format: date-time }
                expiresAt: { type: string, format: date-time }
      responses:
        {
          "200": { description: Asset metadata updated },
          "403": { description: Viewer is read-only },
        }
    delete:
      operationId: deleteAsset
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        {
          "204":
            { description: Asset permanently soft-deleted and cleanup queued },
        }
  /api/v1/assets/{id}/retry:
    post:
      operationId: retryAssetProcessing
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        {
          "200": { description: Failed asset returned to the persistent queue },
        }
  /api/v1/assets/{id}/thumbnail:
    get:
      operationId: getAssetThumbnail
      parameters: [{ $ref: "#/components/parameters/ResourceID" }]
      responses: { "200": { description: Authenticated thumbnail or poster } }
  /api/v1/assets/{id}/preview:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    get:
      operationId: getAssetPlaybackPreview
      responses:
        {
          "200": { description: Player-compatible image or video bytes },
          "206": { description: Partial image or video bytes },
        }
    head:
      operationId: headAssetPlaybackPreview
      responses: { "200": { description: Preview headers } }
  /api/v1/player/assets/{assetId}/variants/{variantId}:
    parameters:
      - {
          in: path,
          name: assetId,
          required: true,
          schema: { type: string, format: uuid },
        }
      - {
          in: path,
          name: variantId,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      operationId: downloadPlayerVariant
      security: [{ deviceBearer: [] }]
      parameters:
        - {
            in: header,
            name: Range,
            schema: { type: string, example: bytes=0-1048575 },
          }
        - { in: header, name: If-Range, schema: { type: string } }
        - { in: header, name: If-None-Match, schema: { type: string } }
      responses:
        "200": { description: Complete compatible variant }
        "206": { description: Requested byte range }
        "304": { description: ETag matched }
        "401": { description: Device credential invalid or revoked }
        "403": { description: Screen disabled }
        "416": { description: Range not satisfiable }
    head:
      operationId: inspectPlayerVariant
      security: [{ deviceBearer: [] }]
      responses:
        {
          "200":
            {
              description: "ETag, Content-Length, MIME type, and Accept-Ranges",
            },
        }
  /api/v1/playlists:
    get:
      operationId: listPlaylists
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - {
            in: query,
            name: pageSize,
            schema: { type: integer, minimum: 1, maximum: 100 },
          }
      responses: { "200": { description: Paginated playlist list } }
    post:
      operationId: createPlaylist
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, description, sourceType]
              properties:
                name: { type: string, minLength: 1, maxLength: 180 }
                description: { type: string, maxLength: 2000 }
                sourceType:
                  {
                    type: string,
                    enum: [static, tag],
                    description: static creates a manually ordered timeline; tag creates an initially empty tag-driven playlist,
                  }
      responses:
        {
          "201": { description: Playlist created },
          "403": { description: Viewer is read-only },
        }
  /api/v1/playlists/{id}:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    get:
      {
        operationId: getPlaylist,
        responses: { "200": { description: Playlist and ordered items } },
      }
    patch:
      operationId: updatePlaylist
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        { "200": { description: Playlist updated and revision incremented } }
    delete:
      operationId: deletePlaylist
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        {
          "204": { description: Playlist soft-deleted },
          "409": { description: Playlist is assigned },
        }
  /api/v1/playlists/{id}/items:
    post:
      operationId: addPlaylistItem
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/PlaylistItemInput" } },
          }
      responses:
        {
          "201": { description: Ready asset added transactionally },
          "422": { description: Invalid or unavailable asset },
        }
  /api/v1/playlists/{id}/items/order:
    put:
      operationId: reorderPlaylistItems
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        { "200": { description: Complete item order replaced transactionally } }
  /api/v1/playlists/{id}/items/bulk:
    put:
      operationId: bulkUpdatePlaylistItems
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaylistBulkItemInput" }
      responses:
        {
          "200":
            {
              description: Selected static playlist items updated transactionally,
            },
          "409":
            {
              description: Tag-driven playlists do not support manual item updates,
            },
          "422": { description: Invalid bulk update or item selection },
        }
  /api/v1/playlists/{id}/tag-rule:
    put:
      operationId: setPlaylistTagRule
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaylistTagRuleInput" }
      responses:
        {
          "200": { description: Playlist source and tag rule updated },
          "422": { description: Invalid tag rule },
        }
  /api/v1/playlists/{id}/items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
      - {
          in: path,
          name: itemId,
          required: true,
          schema: { type: string, format: uuid },
        }
    patch:
      operationId: updatePlaylistItem
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses: { "200": { description: Playback settings updated } }
    delete:
      operationId: deletePlaylistItem
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        {
          "200":
            { description: Item removed and remaining positions normalized },
        }
  /api/v1/screens/{id}/playlist-assignment:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    get:
      {
        operationId: getPlaylistAssignment,
        responses:
          { "200": { description: "Assignment, manifest, download, playback, and
                  cache status" } },
      }
    put:
      operationId: assignPresentation
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PresentationReference" }
      responses:
        {
          "200": { description: Direct playlist or Layout assignment replaced },
          "403": { description: Owner or Administrator required },
        }
    delete:
      operationId: removePlaylistAssignment
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses: { "200": { description: Direct assignment removed } }
  /api/v1/player/manifest:
    get:
      operationId: getPlayerManifest
      security: [{ deviceBearer: [] }]
      parameters:
        [{ in: header, name: If-None-Match, schema: { type: string } }]
      responses:
        "200":
          description: Stable screen-specific manifest or no-assignment manifest
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ManifestResponse" } },
            }
        "304": { description: Manifest ETag matched }
        "401": { description: Device credential invalid or revoked }
        "403": { description: Screen disabled }
  /api/v1/player/span-panels/{id}:
    get:
      operationId: getPlayerSpanPanel
      security: [{ deviceBearer: [] }]
      responses:
        "200": { description: Authenticated prepared H.264 panel variant }
        "206": { description: Partial content range }
        "404": { description: Panel is unavailable or not ready }
    head:
      operationId: headPlayerSpanPanel
      security: [{ deviceBearer: [] }]
      responses: { "200": { description: Prepared panel exists } }
  /api/v1/screen-groups:
    get:
      operationId: listScreenGroups
      responses:
        {
          "200":
            {
              description: "Paginated Display Groups, assignments, and members",
            },
        }
    post:
      operationId: createScreenGroup
      parameters:
        [
          {
            in: header,
            name: X-CSRF-Token,
            required: true,
            schema: { type: string },
          },
        ]
      responses:
        {
          "201": { description: Display Group created in Mirror mode },
          "422": { description: Validation or configured limit failed },
        }
  /api/v1/screen-groups/{id}:
    get:
      operationId: getScreenGroup
      responses:
        {
          "200":
            { description: Display Group with assignment and screen members },
          "404": { description: Display Group not found },
        }
    patch:
      operationId: updateScreenGroup
      responses: { "200": { description: Display Group updated } }
    delete:
      operationId: deleteScreenGroup
      responses:
        { "204": { description: Display Group soft deleted; screens retained } }
  /api/v1/screen-groups/{id}/span:
    get:
      operationId: getSpanGeometryAndPreparation
      responses:
        {
          "200":
            { description: "Canvas, panel geometry, and preparation status" },
        }
    put:
      operationId: updateSpanGeometry
      parameters:
        [
          {
            in: header,
            name: X-CSRF-Token,
            required: true,
            schema: { type: string },
          },
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpanGeometryInput" }
      responses:
        "200":
          { description: Display Group updated and member manifests revised }
        "409": { description: Geometry conflicts with current membership }
        "422": { description: Canvas or panel validation failed }
  /api/v1/screen-groups/{id}/display-control/preview:
    get:
      operationId: previewDisplayGroupControl
      parameters:
        - in: query
          name: commandType
          required: true
          schema:
            type: string
            enum:
              [
                display_power_on,
                display_power_off,
                display_mute,
                display_unmute,
              ]
      responses:
        "200": { description: Capability coverage and apply fingerprint }
        "404": { description: Display Group not found }
        "422": { description: Unsupported group action }
  /api/v1/screen-groups/{id}/display-control:
    post:
      operationId: applyDisplayGroupControl
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [commandType, fingerprint]
              properties:
                commandType:
                  type: string
                  enum:
                    [
                      display_power_on,
                      display_power_off,
                      display_mute,
                      display_unmute,
                    ]
                fingerprint: { type: string, minLength: 64, maxLength: 64 }
      responses:
        "202": { description: Typed commands queued for eligible members }
        "409": { description: Capability preview is stale }
        "422": { description: Unsupported group action }
  /api/v1/screen-groups/{id}/screens:
    post:
      operationId: addScreenGroupMember
      responses:
        {
          "200": { description: Screen added and member manifests revised },
          "409": { description: Screen already belongs to a Display Group },
        }
  /api/v1/screen-groups/{id}/screens/{screenId}:
    delete:
      operationId: removeScreenGroupMember
      responses:
        { "204": { description: Screen removed and affected manifest revised } }
  /api/v1/screen-groups/{id}/playlist-assignment:
    put:
      operationId: assignSyncGroupPresentation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PresentationReference" }
      responses:
        {
          "200":
            {
              description: Group fallback assigned and member manifests revised,
            },
        }
    delete:
      operationId: unassignSyncGroupPlaylist
      responses:
        {
          "200":
            {
              description: Group fallback removed and member manifests revised,
            },
        }
  /api/v1/schedules:
    get:
      operationId: listSchedules
      responses: { "200": { description: Paginated schedules } }
    post:
      operationId: createSchedule
      description: >-
        The request contains exactly one of playlistId, layoutId, or
        displayAction. Display Control actions use the closed typed command
        registry; display_probe is not schedulable.
      responses:
        {
          "201": { description: Validated schedule created },
          "422": { description: Schedule or target validation failed },
        }
  /api/v1/schedules/{id}:
    get:
      operationId: getSchedule
      responses: { "200": { description: Schedule and normalized targets } }
    patch:
      operationId: updateSchedule
      responses:
        {
          "200":
            { description: Schedule updated and affected manifests revised },
        }
    delete:
      operationId: deleteSchedule
      responses: { "204": { description: Schedule soft deleted } }
  /api/v1/schedules/{id}/enable:
    post:
      operationId: enableSchedule
      responses: { "200": { description: Schedule enabled } }
  /api/v1/schedules/{id}/disable:
    post:
      operationId: disableSchedule
      responses: { "200": { description: Schedule disabled } }
  /api/v1/schedules/preview:
    post:
      operationId: previewSchedule
      responses:
        {
          "200":
            { description: "Production resolution result, conflicts, fallback,
                and next transition" },
          "403": { description: Scheduling access required },
        }
  /api/v1/assets/websites:
    post:
      operationId: createWebsiteAsset
      description: Creates configuration-only public website content without fetching the page.
      responses:
        {
          "201": { description: Website asset created },
          "422": { description: URL or website settings rejected },
        }
  /api/v1/assets/{id}/website:
    patch:
      operationId: updateWebsiteAsset
      responses:
        {
          "200":
            {
              description: Website configuration updated and affected manifests revised,
            },
          "422": { description: Website validation failed },
        }
  /api/v1/assets/{id}/website/diagnostics:
    get:
      operationId: websiteDiagnostics
      responses:
        { "200": { description: Safe categorized player website diagnostics } }
  /api/v1/widgets:
    post:
      operationId: createWidget
      description: Creates a reusable Widget or catalog App. An App recipe may atomically provision one hidden managed Data Source while preserving normal dependency and manifest behavior.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WidgetInput" }
      responses:
        "201": { description: Widget created }
        "422": { description: "Provider unknown, Data Source incompatible, or a
              selected field does not exist" }
  /api/v1/provider-catalog:
    get:
      operationId: providerCatalog
      responses:
        "200":
          description: Closed Widget and Data Source provider metadata
  /api/v1/content-definitions:
    get:
      operationId: contentDefinitions
      responses:
        "200":
          description: Authoritative release-owned Widget and Data Source definitions, schemas, templates, adapters, and capability requirements
  /api/v1/widgets/compile-preview:
    post:
      operationId: compileWidgetPreview
      responses:
        "200":
          description: Declarative presentation schema v1 document
        "400":
          description: Draft configuration cannot be compiled
  /api/v1/widgets/{id}:
    patch:
      operationId: updateWidget
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WidgetInput" }
      responses:
        "200": { description: Widget updated and affected manifests revised }
        "422": { description: Provider configuration rejected }
  /api/v1/widgets/{id}/preview-image:
    put:
      operationId: updateWidgetPreviewImage
      description: Stores the frozen image captured from the actual Widget editor render. Requires an editor-capable dashboard session and CSRF token. The server accepts only a 960 by 540 JPEG no larger than 500 KB; Widget configuration updates clear the prior snapshot so stale renders are never shown.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary, maxLength: 512000 }
      responses:
        "204": { description: Widget preview image stored }
        "404": { description: Widget not found }
        "413": { description: Preview image exceeds 500 KB }
        "422": { description: Preview is not a valid 960 by 540 JPEG }
  /api/v1/widgets/{id}/duplicate:
    post:
      operationId: duplicateWidget
      responses:
        "201": { description: Widget duplicated }
  /api/v1/data-sources:
    get:
      operationId: listDataSources
      responses:
        "200": { description: Paginated Data Source summaries }
    post:
      operationId: createDataSource
      description: Creates a reusable provider-neutral Data Source. Supported providers include calendar, structured feeds, Manual Table, Weather, Transit, CAP Alerts, and Air Quality. Data Sources are not assets and cannot be placed in playlists or Layouts.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DataSourceInput" }
      responses:
        "201": { description: Data Source created }
        "422": { description: Provider configuration rejected }
  /api/v1/data-sources/{id}:
    get:
      operationId: getDataSource
      responses:
        "200": { description: "Data Source detail including status, diagnostics,
              cached record count, typed fields, date-selection policy, and
              Widget and Layout-binding usage" }
        "404": { description: Data Source not found }
    patch:
      operationId: updateDataSource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DataSourceInput" }
      responses:
        "200":
          { description: Data Source updated and dependent manifests revised }
        "422": { description: Provider configuration rejected }
    delete:
      operationId: deleteDataSource
      responses:
        "204": { description: Data Source deleted }
        "409":
          {
            description: Data Source is in use by a Widget or Layout binding and cannot be deleted,
          }
  /api/v1/data-sources/{id}/duplicate:
    post:
      operationId: duplicateDataSource
      responses:
        "201": { description: Data Source duplicated }
  /api/v1/data-sources/{id}/diagnostics:
    get:
      operationId: dataSourceRefreshDiagnostics
      responses:
        "200": { description: Current bounded Data Source refresh diagnostics }
        "404": { description: Data Source refresh diagnostics unavailable }
  /api/v1/data-sources/{provider}/preview:
    post:
      operationId: previewDataSource
      description: Fetches and parses a candidate Data Source configuration under the safe fetch policy without saving raw data. A previewDate exercises date-aware selection.
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            {
              enum:
                [
                  calendar,
                  rss,
                  atom,
                  json,
                  csv,
                  manual,
                  weather,
                  transit,
                  cap_alerts,
                  air_quality,
                ],
            }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [configuration]
              properties:
                configuration: { type: object }
                previewDate: { type: string, format: date }
      responses:
        "200":
          { description: Sanitized real-data preview and typed diagnostics }
        "404": { description: Data Source provider not found }
        "422": { description: Validation or safe fetch failed }
  /api/v1/data-sources/{id}/inspect:
    get:
      operationId: inspectSavedDataSource
      description: Detects fields for a saved RSS, Atom, JSON, or CSV Source using its stored configuration, including uploaded CSV bytes that detail responses strip. Same response shape as the provider inspect route.
      responses:
        "200": { description: Detected fields for the saved Data Source }
        "404": { description: Data Source not found }
        "422":
          {
            description: "Provider does not support field detection, or the fetch failed",
          }
  /api/v1/data-sources/{provider}/inspect:
    post:
      operationId: inspectDataSource
      description: Reports the fields a candidate RSS, Atom, JSON, or CSV connection contains, with a few sample values per field, a suggested field mapping, and which record fields the Source can fill. Runs under the same safe fetch policy as preview and deliberately does not require a mapping, because the mapping is what it exists to produce.
      parameters:
        - in: path
          name: provider
          required: true
          schema: { enum: [rss, atom, json, csv] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [configuration]
              properties:
                configuration: { type: object }
      responses:
        "200":
          {
            description: "Detected fields, sample values, suggested mapping, and available record fields",
          }
        "404": { description: Provider does not support field detection }
        "422": { description: Validation or safe fetch failed }
  /api/v1/forms:
    get:
      operationId: listForms
      description: Returns every Form Data Source the current user can access, each with name, description, published revision number, the caller's effective capabilities, and the caller's own submission counts (drafts, submitted, changes requested). A global Owner sees all forms; everyone else sees forms they created or hold a grant on. Backs the Forms portal and operator navigation.
      responses:
        "200": { description: Accessible Form summaries under data.items }
    post:
      operationId: createForm
      description: Creates a Form Data Source (a Data Source provider). The server publishes the supplied draft schema as the form's first immutable revision and the creator becomes its manager. Requires the editor+ global role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, draftSchema]
              properties:
                name: { type: string }
                description: { type: string }
                draftSchema: { type: object }
      responses:
        "201":
          {
            description: Form Data Source created with its first published revision,
          }
        "422": { description: "Name, description, or schema rejected" }
  /api/v1/data-sources/{id}/form:
    get:
      operationId: getForm
      description: Returns the Form detail with draft schema, published revision, workflow, saved views, and the caller's granted capabilities. Each workflow state carries recordCount and a removable flag (false once any record or saved view references it) so the Workflow editor can lock keys/deletion. Non-managers receive the published schema as the visible draft schema so unpublished edits are never exposed.
      responses:
        "200": { description: Form detail }
        "403": { description: No access to this form }
        "404": { description: Form not found }
    patch:
      operationId: updateFormMetadata
      description: Updates only the parent Data Source name and description. An omitted description preserves the stored value; provider and configuration cannot be changed here. Requires the manage capability.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        "200": { description: Refreshed Form detail }
        "403": { description: Manage capability required }
        "422": { description: Name or description rejected }
  /api/v1/data-sources/{id}/form/draft:
    patch:
      operationId: updateFormDraft
      description: Replaces the editable draft schema without publishing. Existing submissions are untouched. Requires the manage capability.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schema]
              properties:
                schema: { type: object }
      responses:
        "200": { description: Refreshed Form detail with the saved draft }
        "403": { description: Manage capability required }
        "422": { description: Draft schema rejected }
  /api/v1/data-sources/{id}/form/publish:
    post:
      operationId: publishForm
      description: Snapshots the current draft into a new immutable revision after conservative compatibility checks (a previously published output field cannot be removed or change its output type). Existing submissions remain tied to their original revisions. Requires the manage capability.
      responses:
        "200": { description: The newly published revision }
        "403": { description: Manage capability required }
        "422":
          {
            description: Draft schema rejected or incompatible with the published revision,
          }
  /api/v1/data-sources/{id}/form/workflow:
    put:
      operationId: configureFormWorkflow
      description: Reconciles the form's bounded, script-free approval workflow in place. State keys referenced by existing records are immutable; transitions are replaced wholesale. Requires the manage capability.
      responses:
        "200": { description: Refreshed Form detail with the saved workflow }
        "403": { description: Manage capability required }
        "422": { description: Workflow rejected }
  /api/v1/data-sources/{id}/records:
    get:
      operationId: listFormRecords
      description: Returns a filtered, paginated page of a form's records. Callers with view_all, review, approve, or manage see every record; a submitter without those sees only their own submissions. `mine=true` scopes the page to the caller's own submissions even for privileged callers (the Forms portal's "your submissions"). Supports states, search, sort, mine, page, and pageSize query parameters.
      parameters:
        - {
            name: states,
            in: query,
            schema: { type: string },
            description: Comma-separated workflow state keys,
          }
        - {
            name: mine,
            in: query,
            schema: { type: boolean },
            description: Scope to the caller's own submissions,
          }
        - { name: search, in: query, schema: { type: string } }
        - {
            name: sort,
            in: query,
            schema: { type: string, enum: [newest, oldest, priority, updated] },
          }
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
      responses:
        "200":
          {
            description: "Paginated record page (items, total, page, pageSize)",
          }
        "403": { description: No visibility into this form's records }
    post:
      operationId: createFormRecord
      description: Creates a draft submission bound to the form's current published revision. Requires the submit capability. Image field values are never accepted here — they are set only by the attachment upload/remove endpoints — and a client-supplied image value is rejected. Display metadata dates are tri-state (omitted preserves, null clears, a value sets).
      responses:
        "201": { description: Draft record created }
        "403": { description: Submit capability required }
        "422": { description: Values rejected or no published revision }
  /api/v1/data-sources/{id}/records/{recordId}:
    get:
      operationId: getFormRecord
      description: Returns a record with its immutable revision schema, history, comments, attachments, and the server-calculated actions the caller may take (canEdit, canComment, canDelete, and availableTransitions with destination, label, required capability, and whether a note is required). Authorization is resolved server-side so clients never re-implement it. Visible only to a manager, reviewer/approver, view_all holder, or the record's own submitter.
      responses:
        "200": { description: Decorated record detail }
        "404": { description: Record not found or not visible to the caller }
    patch:
      operationId: updateFormRecord
      description: Edits a record's values and display metadata under optimistic concurrency (a version is required). Image field values are preserved server-side and cannot be changed here (a client-supplied image value is rejected); only the attachment endpoints modify them. Display dates are tri-state. A manager may edit any record; a submitter may edit their own record only while it is in a submitter-editable state.
      responses:
        "200": { description: Updated record }
        "409": { description: Version conflict }
        "422": { description: Values rejected }
    delete:
      operationId: deleteFormRecord
      description: Soft-deletes a record. Requires the manage capability.
      responses:
        "204": { description: Record deleted }
        "404": { description: Record not found or not visible to the caller }
  /api/v1/data-sources/{id}/records/{recordId}/transitions:
    post:
      operationId: transitionFormRecord
      description: Moves a record to a new workflow state, enforcing the configured transition, per-form capability and record ownership, optimistic concurrency (version), and required-field completeness (including required images, satisfied only by a bound attachment) before any submit transition or any transition into an output-eligible state. A note is recorded as a comment; a transition that requires a note (the default changes_requested path, derived from the workflow) is rejected with 422 when the note is empty. A 409 means the record changed; reload, preserving any unsent note.
      responses:
        "200": { description: Record after the transition }
        "409": { description: Version conflict }
        "422": { description: Illegal transition or incomplete required fields }
  /api/v1/data-sources/{id}/records/{recordId}/comments:
    post:
      operationId: addFormRecordComment
      description: Adds a reviewer or submitter comment. Available to a reviewer/approver or the record's own submitter.
      responses:
        "201": { description: Comment created }
        "404": { description: Record not found or not visible to the caller }
  /api/v1/data-sources/{id}/records/{recordId}/attachments:
    post:
      operationId: uploadFormRecordAttachment
      description: Uploads a base64-encoded image as a dedicated form attachment bound to an image field, returning the updated record detail with its incremented version. Uses optimistic concurrency — the request body must carry the record's current `version`, and a mismatch returns 409. Because image fields are single-valued, uploading to a field that already has an attachment replaces it. Authorization matches record editing. Form attachments are never exposed through the general Media library.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fieldKey, data, version]
              properties:
                fieldKey: { type: string }
                fileName: { type: string }
                contentType: { type: string }
                data: { type: string, description: base64-encoded image bytes }
                version:
                  { type: integer, description: The record's current version }
      responses:
        "201":
          { description: Updated record detail after the attachment change }
        "403": { description: Not permitted to edit this record }
        "409": { description: Record version conflict }
        "422": { description: "Not an image, unsupported type, or too large" }
  /api/v1/data-sources/{id}/records/{recordId}/attachments/{attachmentId}:
    delete:
      operationId: removeFormRecordAttachment
      description: Unbinds an attachment, clears the field value it backed, and soft-deletes the underlying asset. Uses optimistic concurrency — the record's current `version` is required as a query parameter and a mismatch returns 409. Authorization matches record editing. Returns the updated record detail.
      parameters:
        - {
            name: version,
            in: query,
            required: true,
            schema: { type: integer },
            description: The record's current version,
          }
      responses:
        "200": { description: Updated record detail after removal }
        "409": { description: Record version conflict }
        "404":
          {
            description: Attachment or record not found or not visible to the caller,
          }
  /api/v1/data-sources/{id}/records/{recordId}/attachments/{attachmentId}/content:
    get:
      operationId: serveFormRecordAttachment
      description: Streams a record's image attachment through this form-record-authorized endpoint (the only way to view a form attachment; they are never served from the Media library). Applies the same visibility rules as reading the record.
      responses:
        "200": { description: The attachment image bytes }
        "404":
          { description: "Attachment or record not found, not visible, or not
              yet servable" }
  /api/v1/approvals:
    get:
      operationId: listApprovals
      description: Returns a paginated page of records awaiting a review decision across every Form the user may review, approve, or manage. A record is pending when its current state has an outgoing transition requiring the review or approve capability. Paginated (page, pageSize) with a total rather than silently capped.
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
      responses:
        "200": { description: "Paginated approval page (items, total, page,
              pageSize)" }
  /api/v1/data-sources/{id}/views/preview:
    post:
      operationId: previewFormView
      description: Projects an unsaved, proposed saved view and returns the resulting typed dataset without persisting anything or altering the cached projection. Only output-eligible records in the view's included states are returned, so a preview never exposes unapproved records. Requires the manage capability.
      responses:
        "200":
          { description: The projected typed dataset for the proposed view }
        "403": { description: Manage capability required }
        "422": { description: Proposed view rejected }
  /api/v1/data-sources/{id}/outputs:
    get:
      operationId: getFormOutputs
      description: Returns the generated dataset for each saved view (dataset key, output fields and types, current record count, preview records) plus form-level projection status (last successful projection, next scheduled refresh/time-window boundary, using-cached/stale flag, projection error) and per-view Widget usage. Preview records come from the cached payload, so only output-eligible records appear. Available to view_all or manage.
      responses:
        "200": { description: Per-view datasets and projection status }
        "403": { description: view_all or manage required }
  /api/v1/data-sources/{id}/outputs/rebuild:
    post:
      operationId: rebuildFormOutputs
      description: Manually re-runs the form projection and returns the refreshed Outputs status. Invalidates affected manifests. Requires the manage capability and CSRF.
      responses:
        "200": { description: Refreshed Outputs status }
        "403": { description: Manage capability required }
  /api/v1/data-sources/{id}/access:
    get:
      operationId: listFormAccess
      description: Returns one entry per user with effective access to the form — the creator and all active global Owners as implicit, uneditable managers, followed by each granted user with their collapsed (non-redundant) capability set. Requires the manage capability.
      responses:
        "200": { description: Access entries under data.entries }
        "403": { description: Manage capability required }
  /api/v1/data-sources/{id}/access/{userId}:
    put:
      operationId: replaceFormGrants
      description: Atomically replaces one user's grants on the form with the supplied capabilities (submit, view_own, view_all, review, approve, manage), collapsing implied capabilities to a minimal set, in a single transaction with an audit entry. The form creator and global Owners cannot be edited here, and a manager cannot remove their own only management path. Requires the manage capability and CSRF.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [capabilities]
              properties:
                capabilities: { type: array, items: { type: string } }
      responses:
        "200": { description: Updated access entries under data.entries }
        "403": { description: Manage capability required }
        "422":
          { description: "Invalid capability, creator edit, or self-management
              removal" }
  /api/v1/data-sources/{id}/user-directory:
    get:
      operationId: searchFormUsers
      description: A bounded, manager-safe user directory for granting form access, returning only id, name, username, and global role for active users. Authorized to the form's managers (per-form), never the Owner/Admin-only user administration API.
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200": { description: Matching users under data.items }
        "403": { description: Manage capability required }
  /api/v1/layouts:
    get:
      operationId: listLayouts
      description: Layout summaries include hasUnpublishedChanges, computed by comparing the current draft document with the published document rather than by comparing their independent revision counters.
      responses:
        "200": { description: Paginated Layout summaries }
    post:
      operationId: createLayout
      responses:
        "201": { description: Layout and initial draft created }
        "422": { description: Layout details rejected }
  /api/v1/layouts/{id}:
    get:
      operationId: getLayout
      responses:
        "200":
          {
            description: "Layout metadata, editable draft, and published state",
          }
        "404": { description: Layout not found }
    patch:
      operationId: updateLayout
      responses:
        "200": { description: Layout metadata updated }
    delete:
      operationId: deleteLayout
      responses:
        "204": { description: Unused Layout deleted }
        "409": { description: Layout is assigned or scheduled }
  /api/v1/layouts/{id}/draft:
    put:
      operationId: saveLayoutDraft
      description: Saves a validated draft using expectedDraftRevision optimistic concurrency.
      responses:
        "200": { description: Draft saved with a new revision and ETag }
        "409": { description: Draft revision conflict }
        "422": { description: Layout document or dependency rejected }
  /api/v1/layouts/{id}/preview-image:
    get:
      operationId: getLayoutPreviewImage
      description: Serves the authenticated, frozen JPEG captured from the real Layout editor canvas.
      responses:
        "200": { description: Current Layout preview JPEG }
        "404": { description: Layout or preview image not found }
    put:
      operationId: updateLayoutPreviewImage
      description: Stores an aspect-preserving JPEG of at most 500 KB when draftRevision still matches the current Layout draft.
      parameters:
        - name: draftRevision
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "204": { description: Preview image stored }
        "409": { description: Draft revision conflict }
        "413": { description: Preview exceeds 500 KB }
        "422": { description: Invalid JPEG dimensions or canvas aspect ratio }
  /api/v1/layouts/{id}/publish:
    post:
      operationId: publishLayout
      responses:
        "201": { description: Immutable published revision created }
        "409": { description: Draft revision conflict }
  /api/v1/layouts/{id}/duplicate:
    post:
      operationId: duplicateLayout
      responses:
        "201": { description: Independent Layout draft created }
  /api/v1/layouts/{id}/revisions:
    get:
      operationId: listLayoutRevisions
      responses:
        "200": { description: Paginated immutable revision history }
  /api/v1/layouts/{id}/revisions/{revisionId}/restore:
    post:
      operationId: restoreLayoutRevision
      responses:
        "200": { description: Revision copied into a new draft revision }
        "409": { description: Draft revision conflict }
  /api/v1/content-submissions:
    get:
      operationId: listContentSubmissions
      description: Lists immutable Playlist, Layout, and Campaign submissions. A submission snapshot is not changed by later draft edits.
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum:
              [
                in_review,
                changes_requested,
                approved,
                scheduled,
                published,
                publication_failed,
                superseded,
              ]
      responses:
        "200":
          description: Submission list and current review policy
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ContentSubmissionList" }
  /api/v1/content-submissions/{id}:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    get:
      operationId: getContentSubmission
      responses:
        "200":
          description: Exact immutable submission snapshot
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ContentSubmission" }
        "404": { description: Submission not found }
  /api/v1/content-submissions/{type}/{id}:
    parameters:
      - name: type
        in: path
        required: true
        schema: { type: string, enum: [playlist, layout, campaign] }
      - { $ref: "#/components/parameters/ResourceID" }
    post:
      operationId: submitContentDraft
      description: Freezes the current working draft. expectedRevision is optional optimistic concurrency protection.
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitContentRequest" }
      responses:
        "201": { description: Immutable submission created }
        "409": { description: Active submission or working-draft conflict }
        "422": { description: Snapshot/readiness validation failed }
  /api/v1/content-submissions/{id}/approve:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    post:
      operationId: approveContentSubmission
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewDecisionRequest" }
      responses:
        "200": { description: Submission approved or automatically published }
        "409": { description: Submission is no longer actionable }
        "422": { description: Self-approval or review validation failed }
  /api/v1/content-submissions/{id}/request-changes:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    post:
      operationId: requestContentChanges
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangesRequest" }
      responses:
        "200": { description: Submission returned for changes }
        "422": { description: A non-empty note is required }
  /api/v1/content-submissions/{id}/publish:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    post:
      operationId: publishContentSubmission
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "201":
          {
            description: Exact submitted snapshot published and recorded in history,
          }
        "409": { description: Submission is not approved or is otherwise stale }
        "422": { description: Current readiness validation failed }
  /api/v1/content-submissions/{id}/schedule:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    post:
      operationId: scheduleContentPublication
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchedulePublicationRequest" }
      responses:
        "200": { description: Approved submission scheduled in PostgreSQL }
        "422":
          {
            description: Publication time is invalid or submission is not approved,
          }
  /api/v1/content-submissions/{id}/cancel-schedule:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    post:
      operationId: cancelContentPublicationSchedule
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "200": { description: Schedule cancelled; submission is approved again }
  /api/v1/content-history/{type}/{id}/publications:
    parameters:
      - name: type
        in: path
        required: true
        schema: { type: string, enum: [playlist, layout, campaign] }
      - { $ref: "#/components/parameters/ResourceID" }
    get:
      operationId: listPublicationHistory
      responses:
        "200":
          description: Immutable publication checkpoints, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          {
                            $ref: "#/components/schemas/PublicationHistoryItem",
                          }
  /api/v1/content-history/{type}/{id}/compare:
    parameters:
      - name: type
        in: path
        required: true
        schema: { type: string, enum: [playlist, layout, campaign] }
      - { $ref: "#/components/parameters/ResourceID" }
      - name: fromPublicationId
        in: query
        required: true
        schema: { type: string, format: uuid }
      - name: toPublicationId
        in: query
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: comparePublications
      responses:
        "200":
          description: Semantic publication differences
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required:
                      [fromPublicationId, toPublicationId, changed, changes]
                    properties:
                      fromPublicationId: { type: string, format: uuid }
                      toPublicationId: { type: string, format: uuid }
                      changed: { type: boolean }
                      changes:
                        type: array
                        items: { $ref: "#/components/schemas/SemanticChange" }
        "404": { description: Publication not found }
  /api/v1/content-history/{type}/{id}/publications/{publicationId}/restore-draft:
    parameters:
      - name: type
        in: path
        required: true
        schema: { type: string, enum: [playlist, layout, campaign] }
      - { $ref: "#/components/parameters/ResourceID" }
      - name: publicationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: restorePublicationAsDraft
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "200":
          {
            description: Historical snapshot copied to the working draft; live state is unchanged,
          }
        "422": { description: Historical snapshot no longer validates }
  /api/v1/content-history/{type}/{id}/publications/{publicationId}/rollback:
    parameters:
      - name: type
        in: path
        required: true
        schema: { type: string, enum: [playlist, layout, campaign] }
      - { $ref: "#/components/parameters/ResourceID" }
      - name: publicationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: rollbackPublication
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "201":
          { description: Historical snapshot published as a new publication }
        "202": { description: Rollback submitted for review }
        "409": { description: Review or concurrency conflict }
  /api/v1/campaigns:
    get:
      operationId: listCampaigns
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - {
            in: query,
            name: pageSize,
            schema: { type: integer, minimum: 1, maximum: 100 },
          }
      responses:
        "200":
          description: Campaign library
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [items, total, page, pageSize]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Campaign" }
                      total: { type: integer, minimum: 0 }
                      page: { type: integer }
                      pageSize: { type: integer }
    post:
      operationId: createCampaign
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignDetailsRequest" }
      responses:
        "201":
          description: Campaign draft created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Campaign" }
  /api/v1/campaigns/{id}:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    get:
      operationId: getCampaign
      responses:
        "200":
          description: Campaign draft and lifecycle state
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Campaign" }
    delete:
      operationId: archiveCampaign
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses: { "204": { description: Campaign archived } }
  /api/v1/campaigns/{id}/draft:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    patch:
      operationId: updateCampaignDraft
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignDraftRequest" }
      responses:
        "200":
          description: Campaign draft saved
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Campaign" }
        "409": { description: Draft revision conflict }
        "422": { description: Campaign shape invalid }
  /api/v1/campaigns/{id}/preflight:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    get:
      operationId: preflightCampaign
      responses:
        "200":
          description: Readiness, target, revision, and schedule preflight
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/CampaignPreflight" }
  /api/v1/campaigns/{id}/releases:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    get:
      operationId: listCampaignReleases
      responses:
        "200":
          description: Immutable Campaign release history
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/CampaignRelease" }
  /api/v1/campaigns/{id}/releases/{releaseId}/restore:
    parameters:
      - { $ref: "#/components/parameters/ResourceID" }
      - name: releaseId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: restoreCampaignRelease
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "200":
          description: Release copied into the working Campaign draft
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Campaign" }
  /api/v1/campaigns/{id}/publish:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    post:
      operationId: publishCampaign
      description: Publishes one immutable Campaign release by atomically materializing ordinary scheduler rows; Players do not receive a Campaign type.
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedDraftRevision]
              properties:
                expectedDraftRevision:
                  { type: integer, format: int64, minimum: 1 }
      responses:
        "201": { description: Campaign release published atomically }
        "202": { description: Campaign release submitted for review }
        "409": { description: Root revision or draft conflict }
        "422": { description: Preflight failed }
  /api/v1/takeovers:
    get:
      summary: List Takeovers
      responses:
        "200": { description: Takeover list }
    post:
      summary: Activate a Takeover
      responses:
        "201": { description: Takeover activated }
        "422": { description: "Invalid targets, playlist, or expiration" }
  /api/v1/takeovers/{id}:
    get:
      summary: Read Takeover and per-screen state
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200": { description: Takeover detail }
  /api/v1/takeovers/{id}/cancel:
    post:
      summary: Cancel an active Takeover
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200": { description: Takeover cancelled }
        "409": { description: Takeover already ended }
  /api/v1/presentation-networks:
    get:
      operationId: listPresentationNetworks
      summary: List Presentation Networks
      description: >-
        Owner and Administrator read. Responses include only redacted network
        metadata and credentialSet; encrypted credentials and plaintext secrets
        are never returned to Studio.
      responses:
        "200":
          description: Presentation Networks and supported authentication types
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationNetworkListResponse"
        "403": { description: Owner or Administrator access is required }
    post:
      operationId: createPresentationNetwork
      summary: Create a Presentation Network
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresentationNetworkCreateInput"
      responses:
        "201":
          description: Network created; the credential is accepted but not returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationNetworkResponse"
        "403": { description: Insufficient role or CSRF failure }
        "409":
          {
            description: Encryption key unavailable or network name already exists,
          }
        "422":
          {
            description: Network,
            authentication,
            or credential validation failed,
          }
  /api/v1/presentation-networks/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      operationId: getPresentationNetwork
      summary: Read a redacted Presentation Network and its assignments
      responses:
        "200":
          description: Network metadata and assigned Linux screens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationNetworkDetailResponse"
        "403": { description: Owner or Administrator access is required }
        "404": { description: Presentation Network not found }
    patch:
      operationId: updatePresentationNetwork
      summary: Update a Presentation Network
      description: >-
        The secret field is write-only. Omitting it retains the saved
        credential; providing a new value rotates it and increments
        configRevision. No response contains the secret or ciphertext.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresentationNetworkUpdateInput"
      responses:
        "200":
          description: Redacted network after the update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationNetworkResponse"
        "403": { description: Insufficient role or CSRF failure }
        "404": { description: Presentation Network not found }
        "409":
          {
            description: Encryption key unavailable or stored credential unreadable,
          }
        "422":
          {
            description: Network,
            authentication,
            or credential validation failed,
          }
    delete:
      operationId: deletePresentationNetwork
      summary: Delete a Presentation Network
      description: Assignments cascade and affected screens receive a durable configuration bump.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: Deleted redacted network
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationNetworkResponse"
        "403": { description: Insufficient role or CSRF failure }
        "404": { description: Presentation Network not found }
  /api/v1/presentation-networks/{id}/screens:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    put:
      operationId: replacePresentationNetworkAssignments
      summary: Replace the Linux screen assignments for a Presentation Network
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresentationNetworkAssignmentsInput"
      responses:
        "200":
          description: Exact assignment set after replacement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationNetworkAssignmentsResponse"
        "403":
          {
            description: Insufficient role,
            CSRF failure,
            or screen outside scope,
          }
        "404": { description: Presentation Network or screen not found }
        "422": { description: Screen is not Linux or assignment limit exceeded }
  /api/v1/presentation-networks/{id}/test:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    post:
      operationId: testPresentationNetwork
      summary: Queue a bounded Presentation Network connection test
      description: >-
        The selected assigned Linux player joins and leaves the network without
        starting AirPlay. The durable command contains only the network ID and
        timeout; credentials are fetched separately by the authenticated player.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresentationNetworkTestInput"
      responses:
        "202":
          description: Connection test command queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationNetworkTestResponse"
        "403":
          {
            description: Insufficient role,
            CSRF failure,
            or screen outside scope,
          }
        "404": { description: Presentation Network or screen not found }
        "409":
          {
            description: Encryption key unavailable or AirPlay is active on the screen,
          }
        "422": { description: Screen is not the assigned Linux player }
  /api/v1/screens/{id}/presentation-network:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      operationId: getScreenPresentationNetwork
      summary: Read a Linux screen's Presentation Network readiness
      description: >-
        Readiness is server-derived from the assignment and the player's
        reported helper, NetworkManager, Wi-Fi, revision, and connection facts.
      responses:
        "200":
          description: Assignment and operator-facing readiness state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationNetworkReadinessResponse"
        "403": { description: Screen is outside the caller's scope }
        "404": { description: Screen not found }
    put:
      operationId: assignScreenPresentationNetwork
      summary: Assign one Presentation Network to a Linux screen
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreenPresentationNetworkInput"
      responses:
        "200":
          description: Assignment after replacement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationNetworkAssignmentResponse"
        "403":
          {
            description: Insufficient role,
            CSRF failure,
            or screen outside scope,
          }
        "404": { description: Screen or Presentation Network not found }
        "422": { description: Screen is not Linux }
    delete:
      operationId: unassignScreenPresentationNetwork
      summary: Remove a screen's Presentation Network assignment
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: Screen assignment after removal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationNetworkAssignmentResponse"
        "403":
          {
            description: Insufficient role,
            CSRF failure,
            or screen outside scope,
          }
        "404": { description: Screen not found }
  /api/v1/player/presentation-network:
    get:
      operationId: getPlayerPresentationNetwork
      summary: Fetch the assigned network provisioning material
      description: >-
        Device-authenticated only. The server derives the assignment from the
        authenticated screen and accepts no network ID. The response is marked
        Cache-Control: no-store and contains the plaintext credential only for
        the player to build its temporary NetworkManager profile.
      security:
        - deviceBearer: []
      responses:
        "200":
          description: Assigned network and credential; never log or persist this response
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Pragma:
              schema: { type: string, const: no-cache }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationNetworkProvisioningResponse"
        "401":
          {
            description: Permanent player credential missing,
            invalid,
            or revoked,
          }
        "404": { description: Authenticated screen has no assignment }
        "409":
          {
            description: Stored credential cannot be decrypted with the configured key,
          }
        "503":
          { description: Presentation Network encryption key is not configured }
  /api/v1/presentation-overrides:
    get:
      operationId: listPresentationOverrides
      summary: List active Quick Present sessions
      responses:
        "200": { description: Active temporary presentation overrides }
    post:
      operationId: createPresentationOverride
      summary: Start Quick Present
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresentationOverrideInput"
      responses:
        "201": { description: Quick Present started }
        "409":
          {
            description: Destination conflicts with AirPlay or another temporary presentation,
          }
        "422": { description: Destination or content validation failed }
  /api/v1/presentation-overrides/{id}/stop:
    post:
      operationId: stopPresentationOverride
      summary: Stop Quick Present
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200": { description: Quick Present stopped }
        "404": { description: Quick Present is no longer active }
  /api/v1/alerts/nws:
    get:
      summary: Read the NWS monitor, rules, active matches, and poll health
      responses:
        "200": { description: NWS alert settings }
  /api/v1/alerts/nws/zones:
    get:
      summary: List official NWS counties and forecast zones for an area
      parameters:
        - {
            in: query,
            name: area,
            required: true,
            schema: { type: string, minLength: 2, maxLength: 2 },
          }
      responses:
        "200": { description: County and forecast-zone choices }
        "422": { description: Invalid state or territory }
        "502": { description: NWS zone catalog unavailable }
  /api/v1/alerts/nws/monitor:
    put:
      summary: Configure NWS area and zone monitoring
      responses:
        "200": { description: Monitor updated }
        "422": { description: "Invalid area, zone, or interval" }
  /api/v1/alerts/nws/poll:
    post:
      summary: Retrieve and apply active NWS alerts now
      responses:
        "200": { description: Poll completed }
        "502": { description: NWS retrieval failed }
  /api/v1/alerts/nws/rules:
    post:
      summary: Create an automatic NWS rule answering with a takeover or a ticker bar
      responses:
        "201": { description: Rule created }
        "422":
          { description: "Invalid rule, response mode, or ticker geometry" }
  /api/v1/alerts/nws/rules/{id}:
    parameters:
      - {
          in: path,
          name: id,
          required: true,
          schema: { type: string, format: uuid },
        }
    put:
      summary: Replace an automatic NWS rule
      responses:
        "200": { description: Rule updated }
        "422":
          { description: "Invalid rule, response mode, or ticker geometry" }
    delete:
      summary: Delete a rule, ending Takeovers it raised and withdrawing its ticker
      responses:
        "200": { description: Rule deleted }
  /api/v1/screens/{id}/commands:
    get:
      summary: List recent screen commands
      responses:
        "200": { description: Command history }
    post:
      summary: Queue a typed operational, Display Control, or bounded player-recovery command
      description: >-
        Display Control command types are display_power_on,
        display_power_off, display_set_input, display_set_volume,
        display_mute, display_unmute, display_set_brightness, and
        display_probe. They are capability-gated by the target Player.
      responses:
        "202": { description: Command queued }
        "429": { description: Pending command limit reached }
  /api/v1/player/commands:
    get:
      summary: Retrieve executable commands for the authenticated player
      responses:
        "200": { description: Stable command list }
  /api/v1/player/commands/{id}/acknowledge:
    post:
      summary: Acknowledge a player command
      responses:
        "200": { description: Command acknowledged }
  /api/v1/player/commands/{id}/result:
    post:
      summary: Report a safe command result
      responses:
        "200": { description: Result accepted idempotently }
        "409": { description: Command expired or cancelled }
  /api/v1/settings:
    get:
      {
        summary: Read typed organization settings,
        responses: { "200": { description: Settings document and registry } },
      }
    patch:
      {
        summary: Update settings with optimistic revision,
        responses:
          {
            "200": { description: Updated settings },
            "409": { description: Settings revision conflict },
            "422": { description: "Unknown, invalid, or hard-limit setting" },
          },
      }
  /api/v1/me/preferences:
    get:
      {
        summary: Read current user preferences,
        responses: { "200": { description: Preference document } },
      }
    patch:
      {
        summary: Update current user preferences,
        responses:
          {
            "200": { description: Updated preferences },
            "409": { description: Revision conflict },
          },
      }
  /api/v1/screen-groups/{id}/policy:
    get:
      {
        summary: Read group player policy,
        responses: { "200": { description: Group policy } },
      }
    put:
      {
        summary: Replace typed group policy,
        responses:
          {
            "200": { description: Updated policy },
            "409": { description: Revision conflict },
          },
      }
    delete:
      {
        summary: Reset group policy,
        responses: { "204": { description: Policy reset } },
      }
  /api/v1/screens/{id}/policy:
    get:
      {
        summary: Read screen player policy,
        responses: { "200": { description: Screen policy } },
      }
    put:
      {
        summary: Replace typed screen policy,
        responses: { "200": { description: Updated policy } },
      }
    delete:
      {
        summary: Reset screen policy,
        responses: { "204": { description: Policy reset } },
      }
  /api/v1/screens/{id}/effective-policy:
    get:
      {
        summary: Inspect effective values and inheritance sources,
        responses: { "200": { description: Effective policy } },
      }
  /api/v1/screens/{id}/reliability:
    get:
      { summary: "Read commissioning, zero-touch readiness, Android reliability,
          and Power Assist state", responses: { "200": { description: Capability and effective-state diagnostics }, "404": { description: Screen not found } } }
  /api/v1/screens/{id}/power-assist:
    put: { summary: "Store administrator-confirmed sleep, wake, CEC, input, and
          startup test results", responses: { "200": { description: Confirmation stored }, "422": { description: Invalid result state } } }
  /api/v1/player/config:
    get:
      {
        summary: Retrieve effective player configuration,
        responses:
          {
            "200": { description: Versioned player config },
            "304": { description: Not modified },
          },
      }
  /api/v1/system/status:
    get:
      {
        summary: Safe system diagnostics,
        responses: { "200": { description: Secret-free status } },
      }
  /api/v1/system/maintenance/{action}:
    post:
      {
        summary: Run a fixed safe maintenance action,
        responses:
          {
            "202": { description: Action accepted },
            "422": { description: Unsupported action },
          },
      }
  /api/v1/system/settings/export:
    get:
      {
        summary: Export non-secret settings,
        responses: { "200": { description: Versioned settings export } },
      }
  /api/v1/system/settings/import/preview:
    post:
      {
        summary: Validate settings import without applying,
        responses:
          {
            "200": { description: Import preview },
            "422": { description: Invalid import },
          },
      }
  /api/v1/system/settings/import/apply:
    post:
      {
        summary: Apply confirmed settings import,
        responses:
          {
            "200": { description: Import applied },
            "409": { description: Revision conflict },
          },
      }
  /api/v1/player-releases:
    get:
      summary: List fixed-repository Tilecast Player releases and verification state
      responses: { "200": { description: Release list } }
  /api/v1/player-releases/check:
    post:
      summary: Check Gibsonmb71/tilecast GitHub Releases
      responses:
        {
          "200": { description: Check completed },
          "502": { description: GitHub or verification failure },
        }
  /api/v1/player-releases/github/device:
    post:
      summary: Start Owner-authorized GitHub OAuth device flow
      responses:
        "201": { description: One-time user code and verification URL }
        "503": { description: GitHub OAuth client ID is not configured }
  /api/v1/player-releases/github/device/poll:
    post:
      summary: Poll an active GitHub OAuth device flow
      responses:
        "200": { description: "Pending, connected, denied, or expired state" }
        "410": { description: Device flow expired or was not found }
        "502": { description: GitHub authorization failure }
  /api/v1/player-releases/github:
    delete:
      summary: Remove a device-authorized GitHub credential from Tilecast Server
      responses:
        "204": { description: Local GitHub credential removed }
        "409": { description: Authentication is managed by environment token }
  /api/v1/player-releases/upload:
    post:
      summary: Upload and verify a signed Tilecast Player release bundle
      description: >-
        Accepts one release's three files as multipart files: the artifact, the
        signed update manifest and its signature. The file names select the
        family: `tilecast-player.apk` with `tilecast-player-update.json`
        (Android), `tilecast-player.AppImage` with
        `tilecast-player-update-linux.json` (Electron Linux), or
        `tilecast-edge-<version>-<arch>.tar.zst` with the signed envelope
        `tilecast-edge-update.json` (Tilecast Edge). Owner session plus CSRF or
        a configured release-publishing bearer token is required.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 3
                  maxItems: 3
                  items: { type: string, format: binary }
      responses:
        "201":
          description: Release fully verified and cached
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      platform: { enum: [android, linux] }
                      playerFamily:
                        { $ref: "#/components/schemas/PlayerFamily" }
                      architecture:
                        type: string
                        description: "`x86_64` or `aarch64` for Tilecast Edge; empty for the other families."
                      source: { enum: [upload, github] }
                      versionCode: { type: integer }
                      versionName: { type: string }
                      channel: { enum: [stable, beta] }
                      apkSizeBytes:
                        {
                          type: integer,
                          description: The artifact size,
                          for every family.,
                        }
                      duplicate: { type: boolean }
        "401": { description: Invalid publishing token }
        "413": { description: Upload exceeds configured limits }
        "422": { description: Missing file or verification failure }
  /api/v1/player-releases/{id}/cache:
    post:
      summary: Download and verify a signed Player APK into private cache
      responses:
        {
          "202": { description: Verification started },
          "409": { description: Release cannot be cached },
        }
  /api/v1/update-deployments:
    get:
      summary: List Player update deployments, narrowed to the caller's screen scope
      responses: { "200": { description: Deployment list } }
    post:
      summary: Create a deduplicated screen and group deployment with an optional canary cohort
      responses:
        {
          "201": { description: Deployment created },
          "403": { description: Targets outside the caller's screen scope },
          "422": { description: Invalid or unverified release/targets },
        }
  /api/v1/update-deployments/{id}:
    get:
      summary:
        Read the deployment header, release artifact size, and per-screen update
        state for the screens in the caller's scope
      responses:
        {
          "200": { description: Deployment detail },
          "404":
            {
              description: "Scoped callers only - unknown or reaching no screen in scope",
            },
        }
  /api/v1/update-deployments/{id}/cancel:
    post:
      summary: Cancel pending update work on every screen the deployment reaches
      responses:
        {
          "200": { description: Cancelled },
          "403": { description: Reaches screens outside the caller's scope },
          "404":
            {
              description: "Scoped callers only - unknown or reaching no screen in scope",
            },
          "409":
            {
              description: "Already complete, or unknown to an unscoped caller",
            },
        }
  /api/v1/update-deployments/{id}/screens/{screenId}/retry:
    post:
      summary: Retry a failed screen update idempotently
      responses:
        {
          "202": { description: Retry queued },
          "404": { description: Screen outside the caller's scope },
          "409": { description: Retry not allowed },
        }
  /api/v1/player/updates/{releaseId}:
    get:
      summary: Get targeted verified Player update metadata
      responses:
        "200":
          description: Update metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PlayerUpdateMetadata" }
        "404": { description: Not targeted }
  /api/v1/player/updates/{releaseId}/artifact:
    get:
      summary: Download or resume the authenticated cached release artifact
      description: >-
        The artifact of every family (the AppImage, the APK or the Tilecast
        Edge archive), with `Accept-Ranges: bytes`, a strong `ETag` of its
        SHA-256, and range requests. Only a screen targeted by an active
        deployment of the release may read it.
      responses:
        {
          "200": { description: Complete artifact },
          "206": { description: Artifact byte range },
          "403": { description: Screen is not targeted },
          "404": { description: Verified artifact unavailable },
          "416": { description: Invalid range },
        }
  /api/v1/player/updates/{releaseId}/apk:
    head:
      summary: Inspect authenticated APK range metadata
      responses:
        {
          "200": { description: APK metadata },
          "403": { description: Screen is not targeted },
        }
    get:
      summary: Download or resume authenticated cached APK
      responses:
        {
          "200": { description: Complete APK },
          "206": { description: APK byte range },
          "416": { description: Invalid range },
        }
  /api/v1/player/update-deployments/{deploymentId}/status:
    post:
      summary: Report bounded Player update preparation and installer status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [state]
              properties:
                state:
                  enum:
                    [
                      downloading,
                      downloaded,
                      verifying,
                      ready,
                      waiting_for_permission,
                      waiting_for_user,
                      installing,
                      reconnecting,
                      failed,
                      succeeded,
                    ]
                  description: >-
                    `succeeded` is accepted only for a Tilecast Edge release: it
                    is the screen's explicit confirmation that the provisional
                    release passed its health checks, and the only way an Edge
                    target settles. Other families settle from the heartbeat.
                downloadedBytes: { type: integer, minimum: 0 }
                permissionStatus: { type: string, maxLength: 64 }
                installerStatus:
                  type: string
                  maxLength: 64
                  description: >-
                    Tilecast Edge sends `provisional` with `reconnecting`,
                    `confirmed` with `succeeded`, and `rolled_back` with a
                    `failed` report of a release that was activated and then
                    rolled back.
                error:
                  type: string
                  maxLength: 240
                  description: A bounded reason code, never free text from a server response.
      responses:
        {
          "200": { description: Status accepted },
          "409": { description: Deployment cancelled or complete },
          "422":
            {
              description: Invalid status,
              or `succeeded` for a release that is not Tilecast Edge,
            },
        }
components:
  parameters:
    PluginID:
      in: path
      name: pluginId
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9_]{0,79}$" }
      description: Registry identifier such as countdown_bar.
    ResourceID:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    CSRFToken:
      in: header
      name: X-CSRF-Token
      required: true
      schema: { type: string }
  securitySchemes:
    deviceBearer:
      type: http
      scheme: bearer
      bearerFormat: Tilecast device credential
  schemas:
    PluginRequirement:
      type: object
      required: [kind, label]
      properties:
        kind:
          {
            type: string,
            enum: [platform, hardware, region, network, provider, player],
          }
        label: { type: string }
        description: { type: string }
    PluginAttention:
      type: object
      required: [code, message]
      properties:
        code:
          {
            type: string,
            examples:
              [
                no_compatible_player,
                no_alert_rules,
                poll_failing,
                data_without_installation,
              ],
          }
        message: { type: string }
    CatalogPlugin:
      type: object
      required:
        [
          id,
          version,
          name,
          description,
          category,
          icon,
          managementPath,
          instanceNounSingular,
          instanceNounPlural,
          requirements,
          capabilities,
          installed,
          installable,
          configured,
          active,
          instanceCount,
          attention,
        ]
      properties:
        id: { type: string, pattern: "^[a-z][a-z0-9_]{0,79}$" }
        version:
          {
            type: integer,
            minimum: 1,
            description: Definition contract version compiled into this release,
          }
        name: { type: string }
        description: { type: string }
        category:
          { type: string, enum: [Display, Automation, Workflow, Hardware] }
        icon:
          {
            type: string,
            description: Bounded icon identifier; unknown values render a generic icon,
          }
        managementPath:
          {
            type: string,
            description: Studio route; a navigation hint,
            not an authorization boundary,
          }
        instanceNounSingular: { type: string }
        instanceNounPlural: { type: string }
        requirements:
          {
            type: array,
            items: { $ref: "#/components/schemas/PluginRequirement" },
          }
        capabilities: { type: array, items: { type: string } }
        documentation: { type: string }
        installed: { type: boolean }
        installable: { type: boolean }
        configured: { type: boolean }
        active: { type: boolean }
        instanceCount: { type: integer, minimum: 0 }
        attention:
          {
            type: array,
            items: { $ref: "#/components/schemas/PluginAttention" },
          }
    PluginCatalog:
      type: object
      required: [items, unsupportedInstallations]
      properties:
        items:
          { type: array, items: { $ref: "#/components/schemas/CatalogPlugin" } }
        unsupportedInstallations:
          type: array
          description: Installation rows naming plugins this release does not know. Preserved and inert.
          items:
            type: object
            required: [pluginId, installedAt]
            properties:
              pluginId: { type: string }
              installedAt: { type: string, format: date-time }
    PluginInUseError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: { type: string, const: plugin_in_use }
            message: { type: string }
            details:
              type: object
              required: [pluginId, resources]
              properties:
                pluginId: { type: string }
                resources:
                  type: array
                  items:
                    type: object
                    required: [kind, count, label]
                    properties:
                      kind: { type: string }
                      count: { type: integer, minimum: 1 }
                      label: { type: string }
    PresentationNetworkSecurity:
      type: string
      enum: [wpa_psk, wpa_eap_peap_mschapv2]
      description: WPA2/WPA3 Personal PSK or WPA2-Enterprise PEAP/MSCHAPv2.
    PresentationNetworkAuth:
      type: object
      additionalProperties: false
      properties:
        identity: { type: string, maxLength: 253 }
        anonymousIdentity: { type: string, maxLength: 253 }
        caCertificatePem:
          type: string
          maxLength: 32768
          description: Public CA certificate chain for Enterprise server validation.
        domainSuffixMatch:
          type: string
          maxLength: 253
          description: Expected RADIUS server domain; requires caCertificatePem.
    PresentationNetwork:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          ssid,
          hidden,
          security,
          securityLabel,
          auth,
          credentialSet,
          configRevision,
          assignedScreens,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        ssid: { type: string, minLength: 1, maxLength: 32 }
        hidden: { type: boolean }
        security: { $ref: "#/components/schemas/PresentationNetworkSecurity" }
        securityLabel: { type: string }
        auth: { $ref: "#/components/schemas/PresentationNetworkAuth" }
        credentialSet:
          type: boolean
          description: True means a credential exists; its value is never returned.
        secretUpdatedAt: { type: string, format: date-time }
        configRevision: { type: integer, format: int64, minimum: 1 }
        assignedScreens: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PresentationNetworkSecret:
      type: string
      format: password
      minLength: 1
      maxLength: 128
      writeOnly: true
      description: >-
        WPA PSK/passphrase or Enterprise password. Write-only; never returned
        by Studio, logged, audited, or placed in a player command.
    PresentationNetworkCreateInput:
      type: object
      additionalProperties: false
      required: [name, ssid, hidden, security, secret]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        ssid: { type: string, minLength: 1, maxLength: 32 }
        hidden: { type: boolean, default: false }
        security: { $ref: "#/components/schemas/PresentationNetworkSecurity" }
        secret: { $ref: "#/components/schemas/PresentationNetworkSecret" }
        identity: { type: string, maxLength: 253 }
        anonymousIdentity: { type: string, maxLength: 253 }
        caCertificatePem: { type: string, maxLength: 32768 }
        domainSuffixMatch: { type: string, maxLength: 253 }
    PresentationNetworkUpdateInput:
      type: object
      additionalProperties: false
      required: [name, ssid, hidden, security]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        ssid: { type: string, minLength: 1, maxLength: 32 }
        hidden: { type: boolean }
        security: { $ref: "#/components/schemas/PresentationNetworkSecurity" }
        secret: { $ref: "#/components/schemas/PresentationNetworkSecret" }
        identity: { type: string, maxLength: 253 }
        anonymousIdentity: { type: string, maxLength: 253 }
        caCertificatePem: { type: string, maxLength: 32768 }
        domainSuffixMatch: { type: string, maxLength: 253 }
    PresentationNetworkAssignment:
      type: object
      additionalProperties: false
      required: [screenId, screenName, platform]
      properties:
        screenId: { type: string, format: uuid }
        screenName: { type: string }
        platform: { type: string }
        presentationNetworkId: { type: string, format: uuid }
        presentationNetworkName: { type: string }
        assignedAt: { type: string, format: date-time }
    PresentationNetworkListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required:
            [
              items,
              credentialsAvailable,
              credentialsUnavailableReason,
              supportedSecurity,
            ]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/PresentationNetwork" }
            credentialsAvailable: { type: boolean }
            credentialsUnavailableReason: { type: string }
            supportedSecurity:
              type: array
              items:
                type: object
                required: [value, label, enterprise]
                properties:
                  value:
                    { $ref: "#/components/schemas/PresentationNetworkSecurity" }
                  label: { type: string }
                  enterprise: { type: boolean }
    PresentationNetworkResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/PresentationNetwork" }
    PresentationNetworkDetailResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [network, assignments]
          properties:
            network: { $ref: "#/components/schemas/PresentationNetwork" }
            assignments:
              type: array
              items:
                { $ref: "#/components/schemas/PresentationNetworkAssignment" }
    PresentationNetworkAssignmentsInput:
      type: object
      additionalProperties: false
      required: [screenIds]
      properties:
        screenIds:
          type: array
          maxItems: 500
          items: { type: string, format: uuid }
    PresentationNetworkAssignmentsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [assignments]
          properties:
            assignments:
              type: array
              items:
                { $ref: "#/components/schemas/PresentationNetworkAssignment" }
    ScreenPresentationNetworkInput:
      type: object
      additionalProperties: false
      required: [presentationNetworkId]
      properties:
        presentationNetworkId: { type: string, format: uuid }
    PresentationNetworkAssignmentResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/PresentationNetworkAssignment" }
    PresentationNetworkReadinessStatus:
      type: string
      enum:
        [
          not_applicable,
          network_manager_unavailable,
          helper_missing,
          helper_unhealthy,
          unsupported,
          wifi_adapter_unavailable,
          unassigned,
          reporting_pending,
          connected,
          failed,
          configuration_pending,
          ready,
        ]
    PresentationNetworkReadiness:
      type: object
      additionalProperties: false
      required:
        [screenId, platform, applicable, status, detail, credentialsAvailable]
      properties:
        screenId: { type: string, format: uuid }
        platform: { type: string }
        presentationNetworkId: { type: string, format: uuid }
        presentationNetworkName: { type: string }
        assignedAt: { type: string, format: date-time }
        applicable: { type: boolean }
        status:
          { $ref: "#/components/schemas/PresentationNetworkReadinessStatus" }
        detail: { type: string }
        helperState:
          { type: string, enum: [ok, missing, unhealthy, unsupported] }
        networkManagerAvailable: { type: boolean }
        wifiAdapterPresent: { type: boolean }
        radioEnabled: { type: boolean }
        reportedState:
          {
            type: string,
            enum:
              [
                unsupported,
                unassigned,
                pending,
                provisioned,
                joining,
                connected,
                failed,
              ],
          }
        installedNetworkId: { type: string, format: uuid }
        installedRevision: { type: integer, format: int64 }
        activeNetworkId: { type: string, format: uuid }
        lastConnectedAt: { type: string, format: date-time }
        lastFailureAt: { type: string, format: date-time }
        lastFailureCode: { type: string }
        limitation: { type: string }
        wiredInterfaceAvailable: { type: boolean }
        wiredIpv4: { type: string, format: ipv4 }
        credentialsAvailable: { type: boolean }
    PresentationNetworkReadinessResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/PresentationNetworkReadiness" }
    PresentationNetworkTestInput:
      type: object
      additionalProperties: false
      required: [screenId]
      properties:
        screenId: { type: string, format: uuid }
    PresentationNetworkTestResult:
      type: object
      required: [commandId, screenId, timeoutSeconds]
      properties:
        commandId: { type: string, format: uuid }
        screenId: { type: string, format: uuid }
        timeoutSeconds: { type: integer, minimum: 15, maximum: 180 }
    PresentationNetworkTestResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/PresentationNetworkTestResult" }
    PresentationNetworkProvisioningMaterial:
      type: object
      additionalProperties: false
      required:
        [
          presentationNetworkId,
          name,
          ssid,
          hidden,
          security,
          auth,
          configRevision,
          profileName,
          secret,
        ]
      properties:
        presentationNetworkId: { type: string, format: uuid }
        name: { type: string }
        ssid: { type: string }
        hidden: { type: boolean }
        security: { $ref: "#/components/schemas/PresentationNetworkSecurity" }
        auth: { $ref: "#/components/schemas/PresentationNetworkAuth" }
        configRevision: { type: integer, format: int64, minimum: 1 }
        profileName: { type: string }
        secret:
          type: string
          format: password
          readOnly: true
          description: Plaintext credential returned only to the authenticated player over a no-store response.
    PresentationNetworkProvisioningResponse:
      type: object
      required: [data]
      properties:
        data:
          {
            $ref: "#/components/schemas/PresentationNetworkProvisioningMaterial",
          }
    PresentationNetworkError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    SubmitContentRequest:
      type: object
      additionalProperties: false
      properties:
        requestedPublicationAt: { type: string, format: date-time }
        expectedRevision: { type: integer, format: int64, minimum: 1 }
    ReviewDecisionRequest:
      type: object
      additionalProperties: false
      properties:
        note: { type: string, maxLength: 4000 }
    ChangesRequest:
      type: object
      additionalProperties: false
      required: [note]
      properties:
        note: { type: string, minLength: 1, maxLength: 4000 }
    SchedulePublicationRequest:
      type: object
      additionalProperties: false
      required: [requestedPublicationAt]
      properties:
        requestedPublicationAt: { type: string, format: date-time }
    ContentSubmission:
      type: object
      required:
        [
          id,
          contentType,
          contentId,
          workingRevision,
          snapshot,
          snapshotSha256,
          submittedAt,
          status,
          reviewRequired,
          allowSelfApproval,
        ]
      properties:
        id: { type: string, format: uuid }
        contentType: { type: string, enum: [playlist, layout, campaign] }
        contentId: { type: string, format: uuid }
        contentName: { type: string }
        workingRevision: { type: integer, format: int64, minimum: 1 }
        snapshot: { type: object, additionalProperties: true }
        snapshotSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        submittedBy: { type: string, format: uuid }
        submitterName: { type: string }
        submittedAt: { type: string, format: date-time }
        basedPublishedRevision: { type: integer, format: int64 }
        basedPublishedRevisionId: { type: string, format: uuid }
        status:
          type: string
          enum:
            [
              in_review,
              changes_requested,
              approved,
              scheduled,
              published,
              superseded,
              publication_failed,
            ]
        reviewRequired: { type: boolean }
        allowSelfApproval: { type: boolean }
        reviewNote: { type: string }
        reviewedBy: { type: string, format: uuid }
        reviewerName: { type: string }
        reviewedAt: { type: string, format: date-time }
        requestedPublicationAt: { type: string, format: date-time }
        publicationFailureReason: { type: string }
        publishedAt: { type: string, format: date-time }
        newerWorkingDraft: { type: boolean }
        currentPublishedRevision: { type: integer, format: int64 }
        affectedScreenCount: { type: integer, minimum: 0 }
        affectedLocationCount: { type: integer, minimum: 0 }
    ContentSubmissionList:
      type: object
      required: [policy, allowSelfApproval, autoPublishOnApproval, items]
      properties:
        policy: { type: string, enum: ["off", contributors, everyone] }
        allowSelfApproval: { type: boolean }
        autoPublishOnApproval: { type: boolean }
        items:
          type: array
          items: { $ref: "#/components/schemas/ContentSubmission" }
    PublicationHistoryItem:
      type: object
      required: [id, revision, publishedAt, method, affectedScreenCount]
      properties:
        id: { type: string, format: uuid }
        revision: { type: integer, format: int64, minimum: 1 }
        nativeRevisionId: { type: string, format: uuid }
        submissionId: { type: string, format: uuid }
        campaignReleaseId: { type: string, format: uuid }
        publishedBy: { type: string, format: uuid }
        publisherName: { type: string }
        publishedAt: { type: string, format: date-time }
        supersedesPublicationId: { type: string, format: uuid }
        method:
          {
            type: string,
            enum:
              [
                manual,
                automatic_after_approval,
                scheduled,
                rollback,
                migration,
                backfill,
              ],
          }
        affectedScreenCount: { type: integer, minimum: 0 }
        snapshotSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
    SemanticChange:
      type: object
      required: [kind, path, description]
      properties:
        kind: { type: string }
        path: { type: string }
        description: { type: string }
    CampaignDetailsRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 180 }
        description: { type: string, maxLength: 2000 }
        timezone: { type: string, minLength: 1, maxLength: 64 }
    CampaignDestination:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type: { type: string, enum: [screen, group] }
        id: { type: string, format: uuid }
    CampaignBlock:
      type: object
      additionalProperties: false
      required:
        [id, name, contentType, contentId, priority, type, timezone, enabled]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 180 }
        contentType: { type: string, enum: [playlist, layout] }
        contentId: { type: string, format: uuid }
        contentRevision: { type: integer, format: int64, minimum: 1 }
        priority: { type: integer, minimum: 0 }
        type: { type: string, enum: [one_time, weekly] }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        oneTimeStart: { type: string, format: date-time }
        oneTimeEnd: { type: string, format: date-time }
        dailyStart: { type: string, pattern: "^\\d{2}:\\d{2}$" }
        dailyEnd: { type: string, pattern: "^\\d{2}:\\d{2}$" }
        daysOfWeek:
          { type: array, items: { type: integer, minimum: 0, maximum: 6 } }
        enabled: { type: boolean }
    CampaignSnapshot:
      type: object
      additionalProperties: false
      required: [name, description, timezone, destinations, blocks]
      properties:
        name: { type: string, minLength: 1, maxLength: 180 }
        description: { type: string, maxLength: 2000 }
        ownerId: { type: string, format: uuid }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        campaignStart: { type: string, format: date-time }
        campaignEnd: { type: string, format: date-time }
        destinations:
          type: array
          items: { $ref: "#/components/schemas/CampaignDestination" }
        blocks:
          type: array
          items: { $ref: "#/components/schemas/CampaignBlock" }
    CampaignDraftRequest:
      type: object
      additionalProperties: false
      required: [expectedDraftRevision, draft]
      properties:
        expectedDraftRevision: { type: integer, format: int64, minimum: 1 }
        draft: { $ref: "#/components/schemas/CampaignSnapshot" }
    CampaignPreflight:
      type: object
      required:
        [
          valid,
          issues,
          blockCount,
          destinationCount,
          screenCount,
          locationCount,
          previewedScreenCount,
          previewScreenLimit,
        ]
      properties:
        valid: { type: boolean }
        issues:
          type: array
          items:
            type: object
            required: [severity, code, message]
            properties:
              severity: { type: string, enum: [warning, error] }
              code: { type: string }
              message: { type: string }
              blockId: { type: string, format: uuid }
        blockCount: { type: integer, minimum: 0 }
        destinationCount: { type: integer, minimum: 0 }
        screenCount: { type: integer, minimum: 0 }
        locationCount: { type: integer, minimum: 0 }
        previewedScreenCount: { type: integer, minimum: 0 }
        previewScreenLimit:
          {
            type: integer,
            minimum: 1,
            description: Maximum number of target screens used for scheduler-overlap previews.,
          }
    CampaignRelease:
      type: object
      required:
        [
          id,
          campaignId,
          releaseNumber,
          snapshot,
          snapshotSha256,
          status,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        campaignId: { type: string, format: uuid }
        releaseNumber: { type: integer, format: int64, minimum: 1 }
        submissionId: { type: string, format: uuid }
        snapshot: { $ref: "#/components/schemas/CampaignSnapshot" }
        snapshotSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        status:
          {
            type: string,
            enum:
              [
                in_review,
                changes_requested,
                approved,
                scheduled,
                published,
                superseded,
                cancelled,
                publication_failed,
              ],
          }
        basedReleaseId: { type: string, format: uuid }
        publishedBy: { type: string, format: uuid }
        publishedAt: { type: string, format: date-time }
        requestedPublicationAt: { type: string, format: date-time }
        failureReason: { type: string }
        createdAt: { type: string, format: date-time }
    Campaign:
      type: object
      required:
        [
          id,
          name,
          description,
          timezone,
          destinations,
          draft,
          draftRevision,
          status,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        ownerId: { type: string, format: uuid }
        timezone: { type: string }
        campaignStart: { type: string, format: date-time }
        campaignEnd: { type: string, format: date-time }
        destinations:
          type: array
          items: { $ref: "#/components/schemas/CampaignDestination" }
        draft: { $ref: "#/components/schemas/CampaignSnapshot" }
        draftRevision: { type: integer, format: int64, minimum: 1 }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DependencyGraph:
      type: object
      additionalProperties: false
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items: { $ref: "#/components/schemas/DependencyNode" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/DependencyEdge" }
    DependencyNode:
      type: object
      additionalProperties: false
      required: [id, type, name]
      properties:
        id: { type: string, format: uuid }
        type:
          enum:
            [
              data_source,
              asset,
              widget,
              layout,
              playlist,
              campaign,
              schedule,
              screen_group,
              screen,
            ]
        name: { type: string }
    DependencyEdge:
      type: object
      additionalProperties: false
      required: [fromType, fromId, toType, toId, relationship]
      properties:
        fromType:
          { $ref: "#/components/schemas/DependencyNode/properties/type" }
        fromId: { type: string, format: uuid }
        toType: { $ref: "#/components/schemas/DependencyNode/properties/type" }
        toId: { type: string, format: uuid }
        relationship: { type: string }
    PlayerFamily:
      enum: [android, electron-linux, edge]
      description: >-
        The Player release family. A deployment reaches only screens of its
        release's family, and for `edge` only screens of its architecture.
    PlayerUpdateMetadata:
      type: object
      required: [releaseId, platform, versionCode, versionName]
      properties:
        releaseId: { type: string, format: uuid }
        artifactId: { type: string, description: The artifact's asset name. }
        platform: { enum: [android, linux] }
        versionCode: { type: integer }
        versionName: { type: string }
        playerFamily: { $ref: "#/components/schemas/PlayerFamily" }
        architecture:
          enum: [x86_64, aarch64]
          description: Tilecast Edge only.
        artifactSizeBytes: { type: integer, description: Linux families. }
        artifactSha256:
          {
            type: string,
            pattern: "^[a-f0-9]{64}$",
            description: Linux families.,
          }
        artifactPath:
          type: string
          description: "`/api/v1/player/updates/{releaseId}/artifact` for the Linux families."
        signedManifest:
          type: string
          format: byte
          description: >-
            Tilecast Edge only: the exact bytes of the signed update envelope,
            base64. The screen verifies the signature and every field against
            this answer and its `install_player_update` command before it
            downloads.
        manifestSignature:
          type: string
          description: Tilecast Edge only. The envelope's base64 Ed25519 signature text.
        stateSchemaVersion:
          type: integer
          description: Tilecast Edge only. The state database schema the release migrates to.
        applicationId: { type: string, description: Android only. }
        minimumSdk: { type: integer, description: Android only. }
        apkSizeBytes: { type: integer, description: Android only. }
        apkSha256: { type: string, description: Android only. }
        signingCertificateSha256: { type: string, description: Android only. }
        apkPath: { type: string, description: Android only. }
    PlayerHeartbeat:
      type: object
      description: >-
        The Player status document. Only the release family fields are
        described here; the remaining fields are the existing heartbeat
        contract and are additive.
      properties:
        playerFamily:
          type: string
          description: >-
            `android`, `electron-linux` or `edge`. The server keeps only these
            values; another value is recorded as absent.
        playerArchitecture:
          type: string
          description: >-
            `x86_64` or `aarch64`, kept only with `playerFamily: edge`. An
            Edge screen without a known architecture is `incompatible` for
            Edge deployments.
    MultiFactorVerifyRequest:
      type: object
      additionalProperties: false
      required: [challengeToken, code]
      properties:
        challengeToken: { type: string }
        code:
          type: string
          description: >-
            An authenticator code or a recovery code. The server decides which
            by shape; six digits are never matched against recovery codes.
    ChallengeTokenRequest:
      type: object
      additionalProperties: false
      required: [challengeToken]
      properties:
        challengeToken: { type: string }
    AuthenticatorCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, description: The six-digit authenticator code. }
    PasswordConfirmation:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          description: >-
            The account password, reverified so a borrowed session cannot
            weaken sign-in security on its own.
    PasskeyRenameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, maxLength: 60 }
    WebAuthnCredential:
      type: object
      description: >-
        A PublicKeyCredential from navigator.credentials.create(), serialized
        with base64url binary fields. Parsed by the WebAuthn library rather
        than field by field.
      required: [id, rawId, type, response]
      properties:
        id: { type: string }
        rawId: { type: string, description: base64url }
        type: { type: string, enum: [public-key] }
        authenticatorAttachment:
          { type: string, enum: [platform, cross-platform] }
        clientExtensionResults: { type: object }
        response:
          type: object
          required: [clientDataJSON, attestationObject]
          properties:
            clientDataJSON: { type: string, description: base64url }
            attestationObject: { type: string, description: base64url }
            transports: { type: array, items: { type: string } }
    WebAuthnAssertion:
      type: object
      description: >-
        A PublicKeyCredential from navigator.credentials.get(), serialized with
        base64url binary fields.
      required: [id, rawId, type, response]
      properties:
        id: { type: string }
        rawId: { type: string, description: base64url }
        type: { type: string, enum: [public-key] }
        authenticatorAttachment:
          { type: string, enum: [platform, cross-platform] }
        clientExtensionResults: { type: object }
        response:
          type: object
          required: [clientDataJSON, authenticatorData, signature]
          properties:
            clientDataJSON: { type: string, description: base64url }
            authenticatorData: { type: string, description: base64url }
            signature: { type: string, description: base64url }
            userHandle: { type: string, description: base64url }
    PlaylistTagRuleInput:
      type: object
      additionalProperties: false
      required: [enabled, match, imageDurationMs, tagIds]
      properties:
        enabled: { type: boolean }
        match: { type: string, enum: [any, all] }
        imageDurationMs: { type: integer, minimum: 1000, maximum: 86400000 }
        tagIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, format: uuid }
    PlaylistItemInput:
      type: object
      additionalProperties: false
      oneOf:
        - required: [assetId]
          not: { required: [layoutId] }
        - required: [layoutId, durationMs]
          not: { required: [assetId] }
      properties:
        assetId: { type: string, format: uuid }
        layoutId:
          {
            type: string,
            format: uuid,
            description: Published Layout to play fullscreen for durationMs,
          }
        durationMs: { type: integer, minimum: 1 }
        fitMode:
          { type: string, enum: [contain, cover, stretch], default: contain }
        transition:
          { type: string, enum: [none, fade, crossfade], default: none }
        audioEnabled: { type: boolean, default: true }
        volume: { type: number, minimum: 0, maximum: 1, default: 1 }
        videoStartOffsetMs: { type: integer, minimum: 0 }
        videoEndOffsetMs: { type: integer, minimum: 1 }
        deliveryPolicy:
          {
            type: string,
            enum: [download, stream, automatic],
            default: download,
          }
        usePlayerDefaults:
          type: boolean
          default: false
          description: >-
            Resolve playback defaults from the effective Player configuration
            on Android and Linux at runtime.
    PlaylistBulkItemInput:
      type: object
      additionalProperties: false
      oneOf:
        - required: [transition]
          not: { required: [durationMs] }
        - required: [durationMs]
          not: { required: [transition] }
      properties:
        itemIds:
          type: array
          uniqueItems: true
          description: Omit or send an empty array to update every item in a static playlist.
          items: { type: string, format: uuid }
        transition: { type: string, enum: [none, fade, crossfade] }
        durationMs:
          {
            type: integer,
            minimum: 1,
            description: Fixed duration applied to image items.,
          }
    PresentationReference:
      type: object
      additionalProperties: false
      oneOf:
        - required: [playlistId]
          properties:
            playlistId: { type: string, format: uuid }
        - required: [layoutId]
          properties:
            layoutId: { type: string, format: uuid }
    DisplayControlAction:
      type: object
      additionalProperties: false
      required: [type]
      description: >-
        A bounded Display Control action. A schedule may contain one action
        instead of a playlist or Layout. The server validates that only the
        field belonging to the selected type is present.
      properties:
        type:
          type: string
          enum:
            [
              display_power_on,
              display_power_off,
              display_set_input,
              display_set_volume,
              display_mute,
              display_unmute,
              display_set_brightness,
            ]
        input:
          type: string
          pattern: "^[A-Za-z0-9._:-]{1,32}$"
        volume: { type: integer, minimum: 0, maximum: 100 }
        brightness: { type: integer, minimum: 0, maximum: 100 }
    ManifestSchedule:
      type: object
      additionalProperties: false
      required: [id, type, timezone, priority, specificity]
      properties:
        id: { type: string, format: uuid }
        playlistId: { type: string, format: uuid, nullable: true }
        layoutId: { type: string, format: uuid, nullable: true }
        displayAction:
          oneOf:
            - { type: "null" }
            - { $ref: "#/components/schemas/DisplayControlAction" }
        type: { type: string, enum: [weekly, one_time] }
        timezone: { type: string }
        priority: { type: integer, minimum: -999, maximum: 999 }
        specificity: { type: integer }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        oneTimeStart: { type: string, format: date-time, nullable: true }
        oneTimeEnd: { type: string, format: date-time, nullable: true }
        dailyStart: { type: string, nullable: true }
        dailyEnd: { type: string, nullable: true }
        daysOfWeek:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
    SpanPanel:
      type: object
      additionalProperties: false
      required: [screenId, order, x, y, width, height, rotation]
      properties:
        screenId: { type: string, format: uuid }
        screenName: { type: string }
        order: { type: integer, minimum: 0, maximum: 63 }
        x: { type: integer, minimum: 0 }
        y: { type: integer, minimum: 0 }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        rotation: { type: integer, enum: [0, 90, 180, 270] }
        bezelLeft: { type: integer, minimum: 0, maximum: 500 }
        bezelTop: { type: integer, minimum: 0, maximum: 500 }
        bezelRight: { type: integer, minimum: 0, maximum: 500 }
        bezelBottom: { type: integer, minimum: 0, maximum: 500 }
    SpanGeometryInput:
      type: object
      additionalProperties: false
      properties:
        displayMode: { type: string, enum: [mirror, span] }
        canvas:
          type: object
          required: [width, height]
          properties:
            width: { type: integer, minimum: 320, maximum: 16384 }
            height: { type: integer, minimum: 320, maximum: 16384 }
        panels:
          type: array
          items: { $ref: "#/components/schemas/SpanPanel" }
    SpanPreparation:
      type: object
      properties:
        id: { type: string, format: uuid }
        screenId: { type: string, format: uuid }
        sourceAssetId: { type: string, format: uuid }
        sourceVariantId: { type: string, format: uuid }
        status: { type: string, enum: [queued, processing, ready, failed] }
        progress: { type: number, minimum: 0, maximum: 1 }
        errorCode: { type: string }
        errorMessage: { type: string }
    SpanStatus:
      type: object
      properties:
        groupId: { type: string, format: uuid }
        displayMode: { type: string, enum: [mirror, span] }
        geometry: { type: object }
        preparations:
          type: array
          items: { $ref: "#/components/schemas/SpanPreparation" }
    PlayerManifest:
      type: object
      additionalProperties: false
      required:
        [
          schemaVersion,
          manifestVersion,
          screenId,
          generatedAt,
          mode,
          playlist,
          assets,
        ]
      properties:
        schemaVersion: { type: integer, enum: [11, 12, 13, 14, 15] }
        manifestVersion: { type: integer, format: int64, minimum: 1 }
        screenId: { type: string, format: uuid }
        generatedAt: { type: string, format: date-time }
        mode: { type: string, const: presentation }
        playlist: { oneOf: [{ type: "null" }, { type: object }] }
        layout: { oneOf: [{ type: "null" }, { type: object }] }
        layouts: { type: array, items: { type: object } }
        assets: { type: array, items: { type: object } }
        canvas:
          oneOf:
            - { type: "null" }
            - {
                type: object,
                required: [width, height],
                properties:
                  { width: { type: integer }, height: { type: integer } },
              }
        viewport:
          oneOf:
            - { type: "null" }
            - {
                type: object,
                required: [x, y, width, height, rotation, order],
                properties:
                  {
                    x: { type: integer },
                    y: { type: integer },
                    width: { type: integer },
                    height: { type: integer },
                    rotation: { type: integer },
                    order: { type: integer },
                  },
              }
        schedules:
          type: array
          items: { $ref: "#/components/schemas/ManifestSchedule" }
        widgets: { type: array, items: { type: object } }
        dataSources: { type: array, items: { type: object } }
        presentationOverride:
          {
            oneOf:
              [
                { type: "null" },
                { $ref: "#/components/schemas/PresentationOverride" },
              ],
          }
    PresentationOverride:
      type: object
      additionalProperties: false
      required:
        [id, contentType, contentId, contentName, startedAt, wakeDisplay]
      properties:
        id: { type: string, format: uuid }
        contentType: { type: string, enum: [playlist, layout, asset] }
        contentId: { type: string, format: uuid }
        contentName: { type: string }
        startedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
        playlistId: { type: string, format: uuid, nullable: true }
        layoutId: { type: string, format: uuid, nullable: true }
        wakeDisplay: { type: boolean }
    PresentationOverrideInput:
      type: object
      additionalProperties: false
      required:
        [
          targetType,
          targetId,
          contentType,
          contentId,
          durationMinutes,
          afterAction,
          wakeDisplay,
        ]
      properties:
        targetType: { type: string, enum: [screen, group] }
        targetId: { type: string, format: uuid }
        contentType: { type: string, enum: [playlist, layout, asset] }
        contentId: { type: string, format: uuid }
        durationMinutes: { type: integer, enum: [0, 5, 15, 30, 60] }
        afterAction: { type: string, enum: [resume] }
        wakeDisplay: { type: boolean }
    ManifestResponse:
      type: object
      required: [data]
      properties: { data: { $ref: "#/components/schemas/PlayerManifest" } }
    AssetType:
      type: string
      enum: [image, video, widget]
    WidgetProvider:
      type: string
      pattern: "^[a-z][a-z0-9_-]{0,79}$"
      description: Closed renderable Widget or App identifier from the release-owned content-definition catalog.
    DataSourceProvider:
      type: string
      description: Non-visual Data Source providers.
      enum:
        [
          calendar,
          rss,
          atom,
          json,
          csv,
          manual,
          weather,
          transit,
          cap_alerts,
          air_quality,
        ]
    Widget:
      type: object
      additionalProperties: false
      required: [provider, configVersion, configuration]
      properties:
        provider: { $ref: "#/components/schemas/WidgetProvider" }
        presetId:
          {
            type: string,
            enum:
              [
                leaderboard,
                status_board,
                queue_board,
                schedule_departures,
                opening_hours,
                directory,
              ],
            nullable: true,
          }
        configVersion: { type: integer, minimum: 1 }
        authorConfiguration:
          type: object
          description: Author-facing App settings before managed-resource IDs are injected.
        managedDataSourceId:
          type: string
          format: uuid
          description: Explicit ownership link for a catalog App's hidden managed Data Source.
        configuration:
          {
            type: object,
            description: "Provider-specific configuration. Native text Widgets omit textScale for automatic bounds-first sizing or use 25–500 percent; contentPadding defaults to 10 percent per edge and accepts 0–40.",
          }
    WidgetInput:
      type: object
      additionalProperties: false
      required: [provider, name, configuration]
      properties:
        provider: { $ref: "#/components/schemas/WidgetProvider" }
        presetId:
          {
            type: string,
            enum:
              [
                leaderboard,
                status_board,
                queue_board,
                schedule_departures,
                opening_hours,
                directory,
              ],
            nullable: true,
          }
        name: { type: string, minLength: 1, maxLength: 180 }
        description: { type: string, maxLength: 2000 }
        configuration:
          {
            type: object,
            description: "Provider-specific configuration. Native text Widgets omit textScale for automatic bounds-first sizing or use 25–500 percent; contentPadding defaults to 10 percent per edge and accepts 0–40.",
          }
    DataSource:
      type: object
      additionalProperties: false
      required: [id, provider, name, configVersion, configuration]
      properties:
        id: { type: string, format: uuid }
        provider: { $ref: "#/components/schemas/DataSourceProvider" }
        name: { type: string, minLength: 1, maxLength: 180 }
        description: { type: string, maxLength: 2000 }
        configVersion: { type: integer, minimum: 1 }
        configuration: { type: object }
    DataSourceInput:
      type: object
      additionalProperties: false
      required: [provider, name, configuration]
      properties:
        provider: { $ref: "#/components/schemas/DataSourceProvider" }
        name: { type: string, minLength: 1, maxLength: 180 }
        description: { type: string, maxLength: 2000 }
        configuration: { type: object }
    AssetStatus:
      type: string
      enum:
        [
          uploading,
          uploaded,
          queued,
          inspecting,
          processing,
          ready,
          failed,
          deleting,
          deleted,
        ]
    UploadStatus:
      type: string
      enum:
        [pending, uploading, finalizing, finalized, failed, expired, cancelled]
    VariantKind:
      type: string
      enum: [original, playback, thumbnail, poster]
    CreateUploadRequest:
      type: object
      additionalProperties: false
      required: [filename, mimeType, sizeBytes]
      properties:
        filename: { type: string, minLength: 1, maxLength: 255 }
        mimeType: { type: string }
        sizeBytes: { type: integer, format: int64, minimum: 1 }
    UploadSession:
      type: object
      required:
        [
          id,
          filename,
          mimeType,
          sizeBytes,
          offset,
          status,
          expiresAt,
          uploadEndpoint,
          maximumSizeBytes,
        ]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        offset: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/UploadStatus" }
        expiresAt: { type: string, format: date-time }
        assetId: { type: string, format: uuid }
        uploadEndpoint: { type: string }
        maximumSizeBytes: { type: integer, format: int64 }
    AssetVariant:
      type: object
      required:
        [id, kind, mimeType, fileSize, sha256, playerCompatible, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/VariantKind" }
        mimeType: { type: string }
        fileSize: { type: integer, format: int64 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        width: { type: integer }
        height: { type: integer }
        durationSeconds: { type: number }
        frameRate: { type: number }
        videoCodec: { type: string }
        audioCodec: { type: string }
        playerCompatible: { type: boolean }
        createdAt: { type: string, format: date-time }
    Asset:
      type: object
      required:
        [
          id,
          name,
          description,
          type,
          originalFilename,
          detectedMimeType,
          sha256,
          originalSize,
          metadata,
          processingStatus,
          createdAt,
          updatedAt,
          variants,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        type: { $ref: "#/components/schemas/AssetType" }
        originalFilename: { type: string }
        declaredMimeType: { type: string }
        detectedMimeType: { type: string }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        originalSize: { type: integer, format: int64 }
        width: { type: integer }
        height: { type: integer }
        durationSeconds: { type: number }
        frameRate: { type: number }
        videoCodec: { type: string }
        audioCodec: { type: string }
        audioChannels: { type: integer }
        metadata: { type: object, additionalProperties: true }
        processingStatus: { $ref: "#/components/schemas/AssetStatus" }
        processingProgress: { type: number, minimum: 0, maximum: 1 }
        errorCode: { type: string }
        errorMessage: { type: string }
        thumbnailUrl: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        availableFrom: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        archivedAt: { type: string, format: date-time }
        variants:
          type: array
          items: { $ref: "#/components/schemas/AssetVariant" }
        widget: { $ref: "#/components/schemas/Widget" }
        playlistUsage: { type: integer, minimum: 0 }
    SetupRequest:
      type: object
      additionalProperties: false
      required: [organizationName, ownerName, username, password]
      properties:
        organizationName: { type: string, minLength: 2, maxLength: 120 }
        ownerName: { type: string, minLength: 2, maxLength: 120 }
        username: { type: string, minLength: 3, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 1024 }
