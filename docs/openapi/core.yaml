openapi: 3.1.0
info:
  title: Tilecast API
  version: 0.10.0
  license:
    name: AGPL-3.0-only
  description: >-
    Management authentication accepts either an enrolled dashboard session
    cookie or a bearer user grant (an OAuth access token or a personal
    access token), and both produce the same user principal with the live
    role and screen scope. Grants additionally carry a scope ceiling of
    read, write, or admin (admin implies write implies read): reads take
    read, mutations take write, and user, token, grant, backup, and
    security administration take admin. CSRF is cookie-only: unsafe
    browser requests require X-CSRF-Token, bearer requests never send it.
    Browser security ceremonies (MFA, passkeys, logout, OAuth approval)
    stay session-only.
paths:
  /healthz:
    get:
      operationId: health
      responses:
        "200": { description: Server process is running }
  /install.sh:
    get:
      operationId: installLinuxPlayerScript
      description: Public. Rate-limited Linux Player provisioning script with this server's URL embedded.
      responses:
        "200": { description: Shell installer }
  /install-airplay.sh:
    get:
      operationId: installAirPlayScript
      description: Public. Rate-limited AirPlay provisioning script with this server's URL embedded.
      responses:
        "200": { description: Shell installer }
  /install/tilecast-player.service:
    get:
      operationId: installLinuxPlayerService
      responses:
        "200": { description: Managed systemd user-service template }
  /readyz:
    get:
      operationId: ready
      responses:
        "200": { description: Server and database are ready }
        "503": { description: Database is unavailable }
  /api/v1/install/linux:
    get:
      operationId: installableLinuxPlayerRelease
      responses:
        "200":
          { description: "Latest stable, verified, cached Linux Player release
              metadata" }
        "404": { description: No installable Linux Player release is cached }
  /api/v1/install/linux/artifact:
    get:
      operationId: installableLinuxPlayerArtifact
      responses:
        "200": { description: Verified Linux Player AppImage }
        "404": { description: No installable Linux Player release is cached }
    head:
      operationId: headInstallableLinuxPlayerArtifact
      responses:
        "200": { description: Verified Linux Player AppImage metadata }
        "404": { description: No installable Linux Player release is cached }
  /api/v1/install/airplay/uxplay:
    get:
      operationId: installableUxPlayArtifact
      description: Public. Rate-limited, pinned UxPlay 1.73.6 source archive embedded in Tilecast Server.
      responses:
        "200": { description: Verified UxPlay 1.73.6 source archive }
    head:
      operationId: headInstallableUxPlayArtifact
      responses:
        "200": { description: Verified UxPlay 1.73.6 source archive metadata }
  /api/v1/install/airplay/uxplay.sha256:
    get:
      operationId: installableUxPlayChecksum
      responses:
        "200":
          { description: Pinned lowercase SHA-256 of the UxPlay source archive }
  /api/v1/auth/status:
    get:
      operationId: authStatus
      description: >-
        Public. Reports whether one-time setup is still required and, when a
        valid dashboard session cookie is present, the current user, their
        role, the CSRF token for unsafe browser requests, the auth method,
        and whether MFA enrollment is still pending. This is the current-user
        read for Studio and for future API clients.
      responses:
        "200":
          description: Installation state and, when authenticated, the current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthStatus" }
  /api/v1/demo:
    get:
      operationId: demoState
      description: >-
        Registered only when TILECAST_ENV is demo. Returns the seeded scenario
        and the state of each simulated player.
      responses:
        "200": { description: Demo scenario and simulated player state }
        "401": { description: Authentication required }
  /api/v1/demo/reset:
    post:
      operationId: resetDemo
      description: >-
        Registered only when TILECAST_ENV is demo. Replaces all data with a
        scenario and returns once its simulated players have connected.
        Requires the Owner role and X-CSRF-Token.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                scenario: { type: string, enum: [basic, kitchen-sink] }
      responses:
        "200":
          { description: Scenario restored, with the new session CSRF token }
        "403": { description: Owner role or CSRF token missing }
        "422": { description: Unknown scenario }
  /api/v1/auth/setup:
    post:
      operationId: initialSetup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201": { description: Organization and owner created }
        "409": { description: Setup was already completed }
        "422": { description: Validation failed }
  /api/v1/auth/login:
    post:
      operationId: login
      responses:
        "200":
          description: >-
            Signed in, or a multi-factor challenge when the account has a
            confirmed second factor. A challenge sets no session cookie.
        "401": { description: Invalid credentials }
  /api/v1/auth/mfa/verify:
    post:
      operationId: verifyMultiFactor
      description: Completes a pending sign-in with an authenticator or recovery code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MultiFactorVerifyRequest"
      responses:
        "200": { description: Signed in }
        "401": { description: Incorrect code or expired challenge }
        "429": { description: Too many incorrect codes }
  /api/v1/auth/mfa/passkey/options:
    post:
      operationId: multiFactorPasskeyOptions
      description: Exchanges a pending challenge for a WebAuthn assertion request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeTokenRequest"
      responses:
        "200":
          { description: Assertion options and a replacement challenge token }
        "401": { description: Expired challenge }
        "404": { description: No passkey is enrolled }
        "409": { description: Passkeys are unavailable on this installation }
  /api/v1/auth/passkey/login/options:
    post:
      operationId: passkeyLoginOptions
      description: Public. Starts a discoverable, username-free WebAuthn ceremony.
      responses:
        "200": { description: Assertion options and a challenge token }
        "409": { description: Passkeys are unavailable on this installation }
  /api/v1/auth/passkey/login:
    post:
      operationId: passkeyLogin
      description: >-
        Posts the raw WebAuthn assertion. A verified passkey satisfies
        multi-factor authentication on its own.
      parameters:
        - in: header
          name: X-MFA-Challenge
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnAssertion"
      responses:
        "200": { description: Signed in }
        "401": { description: The passkey could not be verified }
  /api/v1/me/security:
    get:
      operationId: securityStatus
      responses:
        "200": { description: "Enrolled factors, passkeys, and policy state" }
        "401": { description: Authentication required }
  /api/v1/me/security/totp:
    post:
      operationId: beginAuthenticatorEnrollment
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        "200": { description: Provisioning URI and typed secret }
        "409": { description: An authenticator is already enrolled }
  /api/v1/me/security/totp/confirm:
    post:
      operationId: confirmAuthenticatorEnrollment
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthenticatorCodeRequest"
      responses:
        "200": { description: Updated security state }
        "401": { description: Incorrect code }
        "404": { description: No pending enrollment }
  /api/v1/me/security/totp/remove:
    post:
      operationId: removeAuthenticator
      description: Requires the account password in the body.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirmation"
      responses:
        "204": { description: Authenticator removed }
        "403": { description: The password was not correct }
        "409": { description: Policy requires a remaining factor }
  /api/v1/me/security/recovery-codes:
    post:
      operationId: generateRecoveryCodes
      description: >-
        Replaces every unused code. Requires the account password. The plain
        codes are returned exactly once.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirmation"
      responses:
        "201": { description: Ten new recovery codes }
        "403": { description: The password was not correct }
  /api/v1/me/security/passkeys/options:
    post:
      operationId: passkeyRegistrationOptions
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        "200": { description: Creation options and a challenge token }
        "409": { description: Passkeys are unavailable on this installation }
  /api/v1/me/security/passkeys:
    post:
      operationId: registerPasskey
      description: >-
        The passkey is named from the authenticator's AAGUID; no name is
        accepted here. Use the rename endpoint to change it.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
        - in: header
          name: X-MFA-Challenge
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnCredential"
      responses:
        "201": { description: Passkey enrolled }
        "401": { description: The passkey could not be verified }
  /api/v1/me/security/passkeys/{id}:
    patch:
      operationId: renamePasskey
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyRenameRequest"
      responses:
        "204": { description: Passkey renamed }
        "404": { description: Passkey not found }
  /api/v1/me/security/passkeys/{id}/remove:
    post:
      operationId: removePasskey
      description: Requires the account password in the body.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirmation"
      responses:
        "204": { description: Passkey removed }
        "403": { description: The password was not correct }
        "409": { description: Policy requires a remaining factor }
  /api/v1/oauth/authorize:
    get:
      operationId: describeOAuthApproval
      description: >-
        Requires an enrolled dashboard session. Describes one loopback
        authorization request (client, scopes, redirect) for the approval
        screen. Stores nothing; approval revalidates the same parameters.
      parameters:
        - {
            in: query,
            name: client_id,
            required: true,
            schema: { type: string },
          }
        - {
            in: query,
            name: redirect_uri,
            required: true,
            schema: { type: string, format: uri },
          }
        - { in: query, name: scope, required: true, schema: { type: string } }
        - { in: query, name: state, required: false, schema: { type: string } }
        - {
            in: query,
            name: code_challenge,
            required: true,
            schema: { type: string },
          }
        - {
            in: query,
            name: code_challenge_method,
            required: false,
            schema: { type: string, enum: [S256] },
          }
      responses:
        "200": { description: Approval description }
        "400": { description: Unknown client, redirect, scope, or challenge }
        "401": { description: Dashboard authentication required }
  /api/v1/oauth/approve:
    post:
      operationId: approveOAuthRequest
      description: >-
        Browser ceremony: requires an enrolled dashboard session and the
        X-CSRF-Token header, and refuses bearer grants. Records the grant
        and returns the loopback redirect carrying the single-use
        authorization code.
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OAuthDecision" }
      responses:
        "200": { description: Loopback redirect carrying the code }
        "400": { description: Unknown client, redirect, scope, or challenge }
        "401": { description: Dashboard authentication required }
        "403": { description: CSRF token required }
  /api/v1/oauth/deny:
    post:
      operationId: denyOAuthRequest
      description: >-
        Requires an enrolled dashboard session and the X-CSRF-Token header.
        Records nothing and returns the loopback redirect carrying
        access_denied.
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OAuthDecision" }
      responses:
        "200": { description: Loopback redirect carrying access_denied }
        "400": { description: The authorization request is not valid }
        "401": { description: Dashboard authentication required }
        "403": { description: CSRF token required }
  /api/v1/oauth/token:
    post:
      operationId: issueOAuthTokens
      description: >-
        Public and rate-limited. Exchanges a single-use code with its PKCE
        verifier, or rotates a refresh token. PKCE is the client
        authentication for loopback clients. Reusing a rotated refresh token
        revokes the whole grant.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OAuthTokenRequest" }
      responses:
        "200": { description: Opaque access and refresh tokens }
        "400": { description: Expired, used, mismatched, or revoked grant }
        "429": { description: Too many authentication attempts }
  /api/v1/oauth/revoke:
    post:
      operationId: revokeOAuthCredential
      description: >-
        Public. Rate-limited. Revokes the grant behind a presented access or
        refresh credential. The credential itself is the authorization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "204": { description: Grant revoked }
        "400": { description: Unknown token }
        "429": { description: Too many authentication attempts }
  /api/v1/me/security/grants:
    get:
      operationId: listOAuthGrants
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires an authenticated user with the admin scope. Lists the
        caller's authorization grants newest first, revoked included.
      responses:
        "200": { description: Grant list }
        "401": { description: Dashboard authentication required }
  /api/v1/me/security/grants/{id}:
    delete:
      operationId: revokeOAuthGrant
      description: >-
        Requires an authenticated user with the admin scope. Cookie
        requests additionally require the X-CSRF-Token header. Revokes
        one of the caller's grants and every token under it. Personal
        access tokens are revoked through this same endpoint.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "204": { description: Grant revoked }
        "401": { description: Dashboard authentication required }
        "403": { description: CSRF token required }
        "404": { description: Grant unknown }
  /api/v1/me/security/pats:
    get:
      operationId: listPersonalAccessTokens
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires an authenticated user with the admin scope. Lists the
        caller's personal access tokens newest first with display metadata
        only — never secrets. Expired and revoked tokens stay listed until
        explicitly revoked. An optional search query filters by name,
        case-insensitively.
      parameters:
        - in: query
          name: search
          required: false
          schema: { type: string }
      responses:
        "200": { description: PAT list }
        "401": { description: Dashboard authentication required }
    post:
      operationId: createPersonalAccessToken
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires an authenticated user with the admin scope. Cookie
        requests additionally require the X-CSRF-Token header. Creates
        a named personal access token with a fixed lifetime of 7, 30, 90,
        or 365 days; there is no permanent token. The plaintext secret
        (tcp_ prefix) is returned exactly once in this response and is
        never shown or listed again. Only SHA-256 hashes are stored.
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes, expiresInDays]
              properties:
                name: { type: string, maxLength: 100 }
                scopes:
                  type: array
                  items: { type: string, enum: [read, write, admin] }
                expiresInDays: { type: integer, enum: [7, 30, 90, 365] }
      responses:
        "201": { description: PAT created with one-time secret }
        "400": { description: Invalid name, scopes, or lifetime }
        "401": { description: Dashboard authentication required }
        "403": { description: CSRF token required }
  /api/v1/users/{id}/security/reset:
    post:
      operationId: resetUserSecurity
      description: >-
        Owner/Administrator recovery path. Clears every factor, revokes the
        account's sessions, and records an audit entry.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        "204": { description: Factors cleared }
        "403": { description: Insufficient role }
        "404": { description: User not found }
  /api/v1/users/{id}/permanent:
    delete:
      operationId: permanentlyDeleteUser
      description: >-
        Permanently removes an inactive user account. Account-owned preferences,
        sessions, grants, and security credentials are removed; retained records
        keep their history with user attribution cleared.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        "204": { description: User permanently deleted }
        "403": { description: Insufficient role }
        "404": { description: User not found }
        "409": { description: "User is active, is the current user, or changed
              state" }
  /api/v1/auth/logout:
    post:
      operationId: logout
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        "204": { description: Session revoked }
        "401": { description: Authentication required }
        "403": { description: CSRF verification failed }
  /api/v1/system/identity:
    get:
      operationId: installationIdentity
      description: >-
        Public. Safe installation identity for pairing and discovery: product,
        API version, installation ID, organization name, and whether pairing
        is enabled. Never includes secrets. Players read this before sending
        any stored credential.
      responses:
        "200":
          description: Safe Tilecast installation identity
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/InstallationIdentity" }
  /api/v1/content-folders:
    get:
      operationId: listContentFolders
      responses:
        "200": { description: Installation content folders with asset counts }
    post:
      operationId: createContentFolder
      responses:
        "201": { description: Folder created }
        "422": { description: Validation failed }
  /api/v1/content-collections:
    get:
      operationId: listContentCollections
      responses:
        "200": { description: Installation collections with asset counts }
    post:
      operationId: createContentCollection
      responses:
        "201": { description: Collection created }
  /api/v1/content-tags:
    get:
      operationId: listContentTags
      responses:
        "200": { description: Installation tags with asset counts }
    post:
      operationId: createContentTag
      responses:
        "201": { description: Tag created }
  /api/v1/assets/bulk-organize:
    post:
      operationId: bulkOrganizeAssets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetIds]
              properties:
                assetIds:
                  {
                    type: array,
                    minItems: 1,
                    maxItems: 250,
                    uniqueItems: true,
                    items: { type: string, format: uuid },
                  }
                setFolder: { type: boolean }
                folderId: { type: string, format: uuid }
                addTagIds:
                  { type: array, items: { type: string, format: uuid } }
                removeTagIds:
                  { type: array, items: { type: string, format: uuid } }
                addCollectionIds:
                  { type: array, items: { type: string, format: uuid } }
                removeCollectionIds:
                  { type: array, items: { type: string, format: uuid } }
      responses:
        "200": { description: All selected assets organized atomically }
        "404": { description: An asset or organization record was not found }
        "422": { description: Validation failed }
  /api/v1/player/pairing-sessions:
    post:
      operationId: createPairingSession
      responses:
        "201": { description: Pairing session created }
        "409": { description: Installation identity mismatch }
        "429": { description: Pairing requests are rate limited }
  /api/v1/player/pairing-sessions/{id}:
    get:
      operationId: pollPairingSession
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            in: header,
            name: Authorization,
            required: true,
            schema: { type: string, pattern: "^Pairing " },
          }
      responses:
        "200": { description: Pairing state or one-time enrollment result }
        "401": { description: Poll secret missing or invalid }
  /api/v1/player/enroll:
    post:
      operationId: enrollPlayer
      responses:
        "201": { description: Device credential returned exactly once }
        "409": { description: Enrollment token already used }
  /api/v1/player/heartbeat:
    post:
      operationId: playerHeartbeat
      security: [{ deviceBearer: [] }]
      description: >-
        Accepts the authenticated Player heartbeat. Optional Linux Display
        Control fields report detected providers, independent capabilities,
        display power observations, and policy state. They do not determine
        Player online status; command acknowledgement and display state
        confirmation remain separate.


        Players released with the retired Noise Meter plugin may still send a
        `noiseMeter` object. The server accepts it and ignores it, so the rest
        of the heartbeat is recorded.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlayerHeartbeat" }
      responses:
        "200":
          description:
            Heartbeat accepted. `data.ignoredFields` names optional playback
            identifiers that were malformed and therefore dropped.
        "400": { description: Heartbeat body rejected }
        "401": { description: Credential invalid or revoked }
        "403": { description: Screen disabled }
  /api/v1/player/liveness:
    post:
      operationId: playerLiveness
      security: [{ deviceBearer: [] }]
      description: >-
        Records authenticated Player contact for background liveness. This
        endpoint intentionally accepts no playback snapshot and cannot change
        the current manifest, content, version, cache policy, or playback
        state.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200": { description: Liveness contact accepted }
        "401": { description: Credential invalid or revoked }
        "403": { description: Screen disabled }
  /api/v1/player/socket:
    get:
      operationId: playerSocket
      security: [{ deviceBearer: [] }]
      responses:
        "101": { description: Player WebSocket connected }
        "401": { description: Credential invalid or revoked }
  /api/v1/activity/overview:
    get:
      operationId: getActivityOverview
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires an authenticated user with the read scope. Fleet activity
        overview for a time window: summary cards, fleet health, and the
        warning-and-error timeline. from and to are RFC 3339 timestamps
        defaulting to the last 24 hours; an unparsable range fails with
        422 activity_range_invalid.
      parameters:
        - {
            in: query,
            name: from,
            required: false,
            schema: { type: string, format: date-time },
          }
        - {
            in: query,
            name: to,
            required: false,
            schema: { type: string, format: date-time },
          }
      responses:
        "200": { description: Activity overview }
        "401": { description: Dashboard authentication required }
        "422": { description: activity_range_invalid }
  /api/v1/activity/uptime:
    get:
      operationId: getActivityUptime
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires an authenticated user with the read scope. Fleet uptime
        report with fleet totals, a bucketed series, and per-screen
        strips. window is one of 24h, 7d, or 30d and defaults to 24h; any
        other value fails with 422 uptime_window_invalid.
      parameters:
        - {
            in: query,
            name: window,
            required: false,
            schema: { type: string, enum: [24h, 7d, 30d] },
          }
      responses:
        "200": { description: Uptime report }
        "401": { description: Dashboard authentication required }
        "422": { description: uptime_window_invalid }
  /api/v1/activity/compliance:
    get:
      operationId: getPlaybackCompliance
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires an authenticated user with the read scope.
        Expected-versus-actual playback compliance for a time window, cut
        by dimension (screen, location, group, presentation, schedule,
        date, or reason; defaults to screen). from and to are RFC 3339
        timestamps defaulting to the last 24 hours.
      parameters:
        - {
            in: query,
            name: from,
            required: false,
            schema: { type: string, format: date-time },
          }
        - {
            in: query,
            name: to,
            required: false,
            schema: { type: string, format: date-time },
          }
        - {
            in: query,
            name: dimension,
            required: false,
            schema:
              {
                type: string,
                enum:
                  [
                    screen,
                    location,
                    group,
                    presentation,
                    schedule,
                    date,
                    reason,
                  ],
              },
          }
      responses:
        "200": { description: Playback compliance report }
        "401": { description: Dashboard authentication required }
        "422": { description: activity_range_invalid }
  /api/v1/activity/incidents:
    get:
      operationId: listIncidents
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires an authenticated user with the read scope. Incident list
        newest first, defaulting to active incidents. status accepts open,
        acknowledged, recovered, resolved, ignored, and all; severity
        accepts info, warning, error, and critical; type accepts
        connectivity, playback, storage, safe-mode, and update.
      parameters:
        - { in: query, name: status, required: false, schema: { type: string } }
        - {
            in: query,
            name: severity,
            required: false,
            schema: { type: string },
          }
        - { in: query, name: type, required: false, schema: { type: string } }
      responses:
        "200": { description: Incident list }
        "401": { description: Dashboard authentication required }
        "422": { description: incident_status_invalid }
  /api/v1/activity/incidents/{id}:
    get:
      operationId: getIncident
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires an authenticated user with the read scope. One incident
        with its timeline and affected screens.
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200": { description: Incident detail with timeline }
        "401": { description: Dashboard authentication required }
        "404": { description: incident_not_found }
  /api/v1/screens:
    get:
      operationId: listScreens
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires an authenticated user with the read scope. A scoped
        account sees only its own screens; the list and per-screen
        authorization use the same predicate. Status values are computed
        server-side, never stored.
      responses:
        "200": { description: Computed screen status list }
        "401": { description: Dashboard authentication required }
  /api/v1/screens/{id}:
    get:
      operationId: getScreen
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires an authenticated user with the read scope. A screen
        outside the caller's scope answers 404, indistinguishable from
        unknown.
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200": { description: Screen details }
        "401": { description: Dashboard authentication required }
        "404": { description: Screen unknown or outside caller scope }
    patch:
      operationId: updateScreen
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires the Owner or Administrator role with the write scope.
        Cookie requests additionally require the X-CSRF-Token header.
        Replaces a screen's details document.
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                locationId: { type: [string, "null"], format: uuid }
                roomName: { type: string, maxLength: 120 }
                roomNumber: { type: string, maxLength: 80 }
                description: { type: string, maxLength: 1000 }
      responses:
        "200": { description: Screen updated }
        "401": { description: Dashboard authentication required }
        "403": { description: Owner or Administrator required }
  /api/v1/screens/{id}/player-history:
    get:
      operationId: listScreenPlayerHistory
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200": { description: Current and retired physical player records }
        "404": { description: Screen not found }
  /api/v1/screens/pairing/pending:
    get:
      operationId: listPendingPairings
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: Requires the Owner or Administrator role and the read scope. Pending pairing sessions awaiting approval or rejection.
      responses:
        "200": { description: Pending pairing sessions }
        "401": { description: Dashboard authentication required }
        "403": { description: Owner or Administrator required }
  /api/v1/screens/pairing/resolve:
    post:
      operationId: resolvePairingCode
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires an authenticated user with the write scope. Resolves a
        visible six-character pairing code into its pending session.
        Unknown, expired, or consumed codes answer 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, minLength: 6, maxLength: 6 }
      responses:
        "200": { description: Pending player metadata }
        "401": { description: Dashboard authentication required }
        "404": { description: "Code invalid, missing, or expired" }
  /api/v1/screens/pairing/{id}/approve:
    post:
      operationId: approvePairing
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires the Owner or Administrator role with the admin scope.
        Cookie requests additionally require the X-CSRF-Token header.
        Approves a pending pairing session and creates the screen record.
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, roomName, roomNumber, description]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                locationId: { type: [string, "null"], format: uuid }
                roomName: { type: string, maxLength: 120 }
                roomNumber: { type: string, maxLength: 80 }
                description: { type: string, maxLength: 1000 }
                replaceExistingCredential:
                  type: boolean
                  default: false
                  description: Explicitly authorizes credential rotation after successful enrollment.
                replaceHardware:
                  type: boolean
                  default: false
                  description: Assigns the new player to an existing logical screen without changing its content or policy relationships.
                replacementScreenId:
                  {
                    type: [string, "null"],
                    format: uuid,
                    description: Required when replaceHardware is true.,
                  }
      responses:
        "200": { description: Screen approved }
        "409": { description: "Pairing recovery confirmation required, hardware
              replacement conflict, or pairing state conflict" }
  /api/v1/locations:
    get:
      operationId: listLocations
      responses:
        "200": { description: Reusable locations with assigned screen counts }
    post:
      operationId: createLocation
      responses:
        "201": { description: Location created }
        "403": { description: Owner or Administrator required }
        "409":
          { description: A case-insensitive matching location already exists }
  /api/v1/locations/{id}:
    patch:
      operationId: updateLocation
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200": { description: Location updated }
        "409":
          { description: A case-insensitive matching location already exists }
    delete:
      operationId: deleteLocation
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "204": { description: Location deleted }
        "409": { description: Location still has assigned screens }
  /api/v1/plugins:
    get:
      operationId: listPlugins
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: Every plugin the running release offers, joined with this installation's state. Readable by any signed-in account.
      responses:
        "200":
          description: Plugin catalog
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PluginCatalog" }
        "401": { description: Dashboard authentication required }
  /api/v1/plugins/{pluginId}/install:
    post:
      operationId: installPlugin
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: Requires the Owner or Administrator role and an authenticated user with the admin scope. Cookie requests also require CSRF. Records a release-owned plugin as installed. Idempotent. Never downloads or runs code.
      parameters:
        - { $ref: "#/components/parameters/PluginID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "201":
          description: Plugin installed by this request
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/CatalogPlugin" }
        "200":
          { description: Plugin was already installed; same representation }
        "403": { description: Owner or Administrator and CSRF token required }
        "404":
          {
            description: plugin_not_found — the release does not define this plugin,
          }
        "409": { description: plugin_not_installable }
  /api/v1/plugins/{pluginId}/installation:
    delete:
      operationId: removePlugin
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: Requires the Owner or Administrator role and an authenticated user with the admin scope. Cookie requests also require CSRF. Deletes the installation record. Never deletes plugin data; refuses while plugin-owned resources remain. Idempotent for a plugin that is not installed. An installation row for a plugin this release does not know may also be removed; only the row is deleted.
      parameters:
        - { $ref: "#/components/parameters/PluginID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "204": { description: Plugin removed, or was not installed }
        "403": { description: Owner or Administrator and CSRF token required }
        "404": { description: plugin_not_found }
        "409":
          description: plugin_in_use — remaining resources are listed in error.details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginInUseError" }
  /api/v1/plugins/{pluginId}/automation:
    get:
      operationId: getPluginAutomation
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: A known, installed plugin's resolved automation document. Readable by any signed-in account. Operator clients dispatch generic commands on it without naming the plugin. Unknown plugins answer plugin_not_found, known-but-uninstalled ones plugin_not_installed, and plugins with no automation mapping plugin_automation_not_found.
      parameters:
        - { $ref: "#/components/parameters/PluginID" }
      responses:
        "200":
          description: Resolved automation document
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PluginAutomation" }
        "401": { description: Dashboard authentication required }
        "404":
          {
            description: plugin_not_found — the release does not define this plugin — or plugin_automation_not_found — it maps no operations into automation,
          }
        "409": { description: plugin_not_installed }
  /api/v1/plugins/dependency-graph:
    get:
      operationId: getDependencyGraph
      description: Requires an authenticated dashboard session. Returns the current content and delivery topology. Directed edges run from a dependency to the record that consumes it. Dependency Graph is a Studio system tool, not an installable plugin.
      responses:
        "200":
          description: Typed dependency nodes and directed consumer edges
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DependencyGraph" }
  /api/v1/screens/pairing/{id}/reject:
    post:
      operationId: rejectPairing
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires the Owner or Administrator role with the admin scope.
        Cookie requests additionally require the X-CSRF-Token header.
        Rejects a pending pairing session with an optional reason.
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 1000 }
      responses:
        "204": { description: Pairing rejected }
  /api/v1/screens/{id}/disable:
    post:
      operationId: disableScreen
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires the Owner or Administrator role with the write scope.
        Cookie requests additionally require the X-CSRF-Token header.
        Disables a screen and disconnects its player.
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses: { "204": { description: Screen disabled and disconnected } }
  /api/v1/screens/{id}/enable:
    post:
      operationId: enableScreen
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires the Owner or Administrator role with the write scope.
        Cookie requests additionally require the X-CSRF-Token header.
        Re-enables a disabled screen.
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses: { "204": { description: Screen enabled } }
  /api/v1/screens/{id}/revoke:
    post:
      operationId: revokeScreenCredential
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires the Owner or Administrator role with the admin scope.
        Cookie requests additionally require the X-CSRF-Token header.
        Permanently revokes a screen's device credential.
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 1000 }
      responses:
        "204": { description: Credential permanently revoked }
        "401": { description: Dashboard authentication required }
        "403": { description: Owner or Administrator required }
  /api/v1/uploads:
    post:
      operationId: createUploadSession
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUploadRequest" }
      responses:
        "201": { description: Resumable upload session created }
        "413": { description: Upload exceeds the configured maximum }
        "507": { description: Reserved free storage would be violated }
  /api/v1/uploads/{id}:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    head:
      operationId: inspectUploadSession
      responses:
        "204":
          description: Current upload state
          headers:
            Upload-Offset: { schema: { type: integer, format: int64 } }
            Upload-Length: { schema: { type: integer, format: int64 } }
            Upload-Status:
              { schema: { $ref: "#/components/schemas/UploadStatus" } }
            Upload-Expires: { schema: { type: string, format: date-time } }
    patch:
      operationId: appendUploadBytes
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - {
            in: header,
            name: Upload-Offset,
            required: true,
            schema: { type: integer, format: int64, minimum: 0 },
          }
      requestBody:
        required: true
        content:
          application/offset+octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204": { description: Chunk persisted and synchronized }
        "409": { description: Offset mismatch }
    delete:
      operationId: cancelUpload
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        { "204": { description: Upload cancelled and temporary data removed } }
  /api/v1/uploads/{id}/complete:
    post:
      operationId: completeUpload
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200": { description: Upload finalized or idempotent result returned }
        "409": { description: Upload is incomplete }
        "415": { description: Detected media type is unsupported }
  /api/v1/assets:
    get:
      operationId: listAssets
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - {
            in: query,
            name: pageSize,
            schema: { type: integer, minimum: 1, maximum: 100 },
          }
        - { in: query, name: search, schema: { type: string } }
        - {
            in: query,
            name: type,
            schema: { $ref: "#/components/schemas/AssetType" },
          }
        - {
            in: query,
            name: status,
            schema: { $ref: "#/components/schemas/AssetStatus" },
          }
        - {
            in: query,
            name: sort,
            schema: { type: string, enum: [newest, oldest, updated, name] },
          }
        - {
            in: query,
            name: archived,
            schema: { type: boolean, default: false },
            description: Return manually archived and automatically expired library content instead of active content,
          }
      responses: { "200": { description: Stable paginated media library } }
  /api/v1/assets/archive:
    post:
      operationId: archiveAssets
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [assetIds]
              properties:
                assetIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses:
        {
          "200": { description: Selected unused assets archived atomically },
          "409": { description: At least one asset is still in use },
        }
  /api/v1/assets/restore:
    post:
      operationId: restoreAssets
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [assetIds]
              properties:
                assetIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses: { "200": { description: Selected assets restored atomically } }
  /api/v1/assets/{id}:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    get:
      operationId: getAsset
      responses: { "200": { description: Trusted metadata and variants } }
    patch:
      operationId: updateAsset
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 180 }
                description: { type: string, maxLength: 2000 }
                availabilitySet: { type: boolean }
                availableFrom: { type: string, format: date-time }
                expiresAt: { type: string, format: date-time }
      responses:
        {
          "200": { description: Asset metadata updated },
          "403": { description: Viewer is read-only },
        }
    delete:
      operationId: deleteAsset
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        {
          "204":
            { description: Asset permanently soft-deleted and cleanup queued },
        }
  /api/v1/assets/{id}/retry:
    post:
      operationId: retryAssetProcessing
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        {
          "200": { description: Failed asset returned to the persistent queue },
        }
  /api/v1/assets/{id}/thumbnail:
    get:
      operationId: getAssetThumbnail
      parameters: [{ $ref: "#/components/parameters/ResourceID" }]
      responses: { "200": { description: Authenticated thumbnail or poster } }
  /api/v1/assets/{id}/preview:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    get:
      operationId: getAssetPlaybackPreview
      responses:
        {
          "200": { description: Player-compatible image or video bytes },
          "206": { description: Partial image or video bytes },
        }
    head:
      operationId: headAssetPlaybackPreview
      responses: { "200": { description: Preview headers } }
  /api/v1/player/assets/{assetId}/variants/{variantId}:
    parameters:
      - {
          in: path,
          name: assetId,
          required: true,
          schema: { type: string, format: uuid },
        }
      - {
          in: path,
          name: variantId,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      operationId: downloadPlayerVariant
      security: [{ deviceBearer: [] }]
      parameters:
        - {
            in: header,
            name: Range,
            schema: { type: string, example: bytes=0-1048575 },
          }
        - { in: header, name: If-Range, schema: { type: string } }
        - { in: header, name: If-None-Match, schema: { type: string } }
      responses:
        "200": { description: Complete compatible variant }
        "206": { description: Requested byte range }
        "304": { description: ETag matched }
        "401": { description: Device credential invalid or revoked }
        "403": { description: Screen disabled }
        "416": { description: Range not satisfiable }
    head:
      operationId: inspectPlayerVariant
      security: [{ deviceBearer: [] }]
      responses:
        {
          "200":
            {
              description: "ETag, Content-Length, MIME type, and Accept-Ranges",
            },
        }
  /api/v1/playlists:
    get:
      operationId: listPlaylists
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - {
            in: query,
            name: pageSize,
            schema: { type: integer, minimum: 1, maximum: 100 },
          }
      responses: { "200": { description: Paginated playlist list } }
    post:
      operationId: createPlaylist
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, description, sourceType]
              properties:
                name: { type: string, minLength: 1, maxLength: 180 }
                description: { type: string, maxLength: 2000 }
                sourceType:
                  {
                    type: string,
                    enum: [static, tag],
                    description: static creates a manually ordered timeline; tag creates an initially empty tag-driven playlist,
                  }
      responses:
        {
          "201": { description: Playlist created },
          "403": { description: Viewer is read-only },
        }
  /api/v1/playlists/{id}:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    get:
      {
        operationId: getPlaylist,
        security: [{ sessionCookie: [] }, { userBearer: [] }],
        responses: { "200": { description: Playlist and ordered items } },
      }
    patch:
      operationId: updatePlaylist
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        { "200": { description: Playlist updated and revision incremented } }
    delete:
      operationId: deletePlaylist
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        {
          "204": { description: Playlist soft-deleted },
          "409": { description: Playlist is assigned },
        }
  /api/v1/playlists/{id}/publish:
    post:
      operationId: publishPlaylist
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires a content manager (Owner, Administrator, or Editor) with
        the write scope. Publishes the draft the CLI read first: the
        request carries the draft revision it saw, and a 409 means someone
        else published first. A playlist under editorial review answers 202
        with the submission instead of publishing.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedDraftRevision]
              properties:
                expectedDraftRevision: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Playlist published
          content:
            application/json:
              schema:
                type: object
                required: [data]
        "202":
          { description: Submitted for editorial review instead of publishing }
        "401": { description: Dashboard authentication required }
        "403": { description: A content manager is required }
        "409": { description: The draft moved since it was read; read it again }
  /api/v1/playlists/{id}/items:
    post:
      operationId: addPlaylistItem
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/PlaylistItemInput" } },
          }
      responses:
        {
          "201": { description: Ready asset added transactionally },
          "422": { description: Invalid or unavailable asset },
        }
  /api/v1/playlists/{id}/items/order:
    put:
      operationId: reorderPlaylistItems
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/CSRFToken"
