      responses:
        "201":
          description: Data Source created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DataSource" }
        "422": { description: Provider configuration rejected }
  /api/v1/data-sources/{id}:
    get:
      operationId: getDataSource
      description: >-
        Get data source. Requires an authenticated dashboard user.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
      responses:
        "200":
          description: "Data Source detail including status, diagnostics, cached record count, typed fields, date-selection policy, and Widget and Layout-binding usage"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DataSourceDetail" }
        "404": { description: Data Source not found }
    patch:
      operationId: updateDataSource
      description: >-
        Update data source. Requires an authenticated dashboard user.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DataSourceInput" }
      responses:
        "200":
          description: Data Source updated and dependent manifests revised
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DataSource" }
        "422": { description: Provider configuration rejected }
    delete:
      operationId: deleteDataSource
      description: >-
        Delete data source. Requires an authenticated dashboard user.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
      responses:
        "204": { description: Data Source deleted }
        "409":
          {
            description: Data Source is in use by a Widget or Layout binding and cannot be deleted,
          }
  /api/v1/data-sources/{id}/duplicate:
    post:
      operationId: duplicateDataSource
      description: >-
        Duplicate data source. Requires an authenticated dashboard user.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
      responses:
        "201":
          description: Data Source duplicated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DataSource" }
  /api/v1/data-sources/{id}/diagnostics:
    get:
      operationId: dataSourceRefreshDiagnostics
      description: >-
        Data source refresh diagnostics. Requires an authenticated dashboard user.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
      responses:
        "200":
          description: Current bounded Data Source refresh diagnostics
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DataSourceDiagnostics" }
        "404": { description: Data Source refresh diagnostics unavailable }
  /api/v1/data-sources/{provider}/preview:
    post:
      operationId: previewDataSource
      description: Requires an authenticated dashboard session. Fetches and parses a candidate Data Source configuration under the safe fetch policy without saving raw data. A previewDate exercises date-aware selection. The provider is a built-in provider or a definition-backed one, and the response shape depends on it.
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [configuration]
              properties:
                configuration: { type: object, additionalProperties: true }
                previewDate: { type: string, format: date }
      responses:
        "200":
          description: Sanitized real-data preview and typed diagnostics
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DataSourcePreviewResult" }
        "404": { description: Data Source provider not found }
        "422": { description: Validation or safe fetch failed }
  /api/v1/data-sources/{id}/inspect:
    get:
      operationId: inspectSavedDataSource
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
      description: Requires an authenticated dashboard session. Detects fields for a saved RSS, Atom, JSON, or CSV Source using its stored configuration, including uploaded CSV bytes that detail responses strip. Same response shape as the provider inspect route.
      responses:
        "200":
          description: Detected fields for the saved Data Source
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/StructuredInspection" }
        "404": { description: Data Source not found }
        "422":
          {
            description: "Provider does not support field detection, or the fetch failed",
          }
  /api/v1/data-sources/{provider}/inspect:
    post:
      operationId: inspectDataSource
      description: Requires an authenticated dashboard session. Reports the fields a candidate RSS, Atom, JSON, or CSV connection contains, with a few sample values per field, a suggested field mapping, and which record fields the Source can fill. Runs under the same safe fetch policy as preview and deliberately does not require a mapping, because the mapping is what it exists to produce.
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string, enum: [rss, atom, feed, json, csv] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [configuration]
              properties:
                configuration: { type: object, additionalProperties: true }
      responses:
        "200":
          description: "Detected fields, sample values, suggested mapping, and available record fields"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/StructuredInspection" }
        "404": { description: Provider does not support field detection }
        "422": { description: Validation or safe fetch failed }
  /api/v1/layouts:
    get:
      operationId: listLayouts
      description: Requires an authenticated dashboard session. Layout summaries include hasUnpublishedChanges, computed by comparing the current draft document with the published document rather than by comparing their independent revision counters.
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - {
            in: query,
            name: pageSize,
            schema: { type: integer, minimum: 1, maximum: 100 },
          }
      responses:
        "200":
          description: Paginated Layout summaries
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/LayoutList" }
        "401": { description: Dashboard authentication required }
    post:
      operationId: createLayout
      description: >-
        Create layout. Requires an authenticated dashboard user.
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, orientation, canvasWidth, canvasHeight]
              properties:
                name: { type: string, minLength: 1, maxLength: 180 }
                description: { type: string, maxLength: 2000 }
                orientation:
                  { type: string, enum: [landscape, portrait, custom] }
                canvasWidth: { type: integer, minimum: 320, maximum: 7680 }
                canvasHeight: { type: integer, minimum: 320, maximum: 7680 }
      responses:
        "201":
          description: Layout and initial draft created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Layout" }
        "422": { description: Layout details rejected }
  /api/v1/layouts/{id}:
    get:
      operationId: getLayout
      description: >-
        Get layout. Requires an authenticated dashboard user.
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
      responses:
        "200":
          description: "Layout metadata, editable draft, and published state"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Layout" }
        "404": { description: Layout not found }
    patch:
      operationId: updateLayout
      description: >-
        Update layout. Requires an authenticated dashboard user.
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 180 }
                description: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: Layout metadata updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Layout" }
        "401": { description: Dashboard authentication required }
    delete:
      operationId: deleteLayout
      description: >-
        Delete layout. Requires an authenticated dashboard user.
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "204": { description: Unused Layout deleted }
        "409": { description: Layout is assigned or scheduled }
  /api/v1/layouts/{id}/draft:
    put:
      operationId: saveLayoutDraft
      description: Requires an authenticated dashboard session. Saves a validated draft using expectedDraftRevision optimistic concurrency.
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedDraftRevision, document]
              properties:
                expectedDraftRevision: { type: integer, minimum: 1 }
                document: { $ref: "#/components/schemas/LayoutDocument" }
      responses:
        "200":
          description: Draft saved with a new revision and ETag
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Layout" }
        "409": { description: Draft revision conflict }
        "422": { description: Layout document or dependency rejected }
  /api/v1/layouts/{id}/preview-image:
    get:
      operationId: getLayoutPreviewImage
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
      description: Serves the authenticated, frozen JPEG captured from the real Layout editor canvas.
      responses:
        "200":
          description: Current Layout preview JPEG
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { description: Layout or preview image not found }
    put:
      operationId: updateLayoutPreviewImage
      description: Requires an authenticated dashboard session. Stores an aspect-preserving JPEG of at most 500 KB when draftRevision still matches the current Layout draft.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - name: draftRevision
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "204": { description: Preview image stored }
        "409": { description: Draft revision conflict }
        "413": { description: Preview exceeds 500 KB }
        "422": { description: Invalid JPEG dimensions or canvas aspect ratio }
  /api/v1/layouts/{id}/publish:
    post:
      operationId: publishLayout
      description: >-
        Publish layout. Requires an authenticated dashboard user.
        Publishes the draft the caller read first: the request carries the
        draft revision it saw, and a 409 means someone else published
        first. A layout under editorial review answers 202 with the
        submission instead of publishing.
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedDraftRevision]
              properties:
                expectedDraftRevision: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Immutable published revision created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - {
                          $ref: "#/components/schemas/ContentSubmissionPublication",
                        }
                      - { $ref: "#/components/schemas/LayoutRevision" }
        "202":
          description: Submitted for editorial review instead of publishing
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ContentSubmission" }
        "409": { description: Draft revision conflict }
  /api/v1/layouts/{id}/duplicate:
    post:
      operationId: duplicateLayout
      description: >-
        Duplicate layout. Requires an authenticated dashboard user.
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "201":
          description: Independent Layout draft created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Layout" }
        "401": { description: Dashboard authentication required }
  /api/v1/layouts/{id}/revisions:
    get:
      operationId: listLayoutRevisions
      description: >-
        List layout revisions. Requires an authenticated dashboard user.
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - {
            in: query,
            name: pageSize,
            schema: { type: integer, minimum: 1, maximum: 100 },
          }
      responses:
        "200":
          description: Paginated immutable revision history
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/LayoutRevisionList" }
        "401": { description: Dashboard authentication required }
  /api/v1/layouts/{id}/revisions/{revisionId}/restore:
    post:
      operationId: restoreLayoutRevision
      description: >-
        Restore layout revision. Requires an authenticated dashboard user.
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - in: path
          name: revisionId
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedDraftRevision]
              properties:
                expectedDraftRevision: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Revision copied into a new draft revision
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Layout" }
        "409": { description: Draft revision conflict }
  /api/v1/content-submissions:
    get:
      operationId: listContentSubmissions
      description: Requires an authenticated dashboard session. Lists immutable Playlist, Layout, and Campaign submissions. A submission snapshot is not changed by later draft edits.
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum:
              [
                in_review,
                changes_requested,
                approved,
                scheduled,
                published,
                publication_failed,
                superseded,
              ]
      responses:
        "200":
          description: Submission list and current review policy
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ContentSubmissionList" }
  /api/v1/content-submissions/{id}:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    get:
      operationId: getContentSubmission
      description: >-
        Get content submission. Requires an authenticated dashboard user.
      responses:
        "200":
          description: Exact immutable submission snapshot
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ContentSubmission" }
        "404": { description: Submission not found }
  /api/v1/content-submissions/{type}/{id}:
    parameters:
      - name: type
        in: path
        required: true
        schema: { type: string, enum: [playlist, layout, campaign] }
      - { $ref: "#/components/parameters/ResourceID" }
    post:
      operationId: submitContentDraft
      description: Freezes the current working draft. expectedRevision is optional optimistic concurrency protection.
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitContentRequest" }
      responses:
        "201":
          description: Immutable submission created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ContentSubmission" }
        "409": { description: Active submission or working-draft conflict }
        "422": { description: Snapshot/readiness validation failed }
  /api/v1/content-submissions/{id}/approve:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    post:
      operationId: approveContentSubmission
      description: >-
        Approve content submission. Requires an authenticated dashboard user.
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewDecisionRequest" }
      responses:
        "200":
          description: Submission approved or automatically published
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ContentSubmission" }
        "409": { description: Submission is no longer actionable }
        "422": { description: Self-approval or review validation failed }
  /api/v1/content-submissions/{id}/request-changes:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    post:
      operationId: requestContentChanges
      description: >-
        Request content changes. Requires an authenticated dashboard user.
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangesRequest" }
      responses:
        "200":
          description: Submission returned for changes
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ContentSubmission" }
        "422": { description: A non-empty note is required }
  /api/v1/content-submissions/{id}/publish:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    post:
      operationId: publishContentSubmission
      description: >-
        Publish content submission. Requires an authenticated dashboard user.
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "201":
          description: Exact submitted snapshot published and recorded in history
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    {
                      $ref: "#/components/schemas/ContentSubmissionPublication",
                    }
        "409": { description: Submission is not approved or is otherwise stale }
        "422": { description: Current readiness validation failed }
  /api/v1/content-submissions/{id}/schedule:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    post:
      operationId: scheduleContentPublication
      description: >-
        Schedule content publication. Requires an authenticated dashboard user.
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchedulePublicationRequest" }
      responses:
        "200":
          description: Approved submission scheduled in PostgreSQL
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ContentSubmission" }
        "422":
          {
            description: Publication time is invalid or submission is not approved,
          }
  /api/v1/content-submissions/{id}/cancel-schedule:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    post:
      operationId: cancelContentPublicationSchedule
      description: >-
        Cancel content publication schedule. Requires an authenticated dashboard user.
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "200":
          description: Schedule cancelled; submission is approved again
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ContentSubmission" }
  /api/v1/content-history/{type}/{id}/publications:
    parameters:
      - name: type
        in: path
        required: true
        schema: { type: string, enum: [playlist, layout, campaign] }
      - { $ref: "#/components/parameters/ResourceID" }
    get:
      operationId: listPublicationHistory
      description: >-
        List publication history. Requires an authenticated dashboard user.
      responses:
        "200":
          description: Immutable publication checkpoints, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          {
                            $ref: "#/components/schemas/PublicationHistoryItem",
                          }
  /api/v1/content-history/{type}/{id}/compare:
    parameters:
      - name: type
        in: path
        required: true
        schema: { type: string, enum: [playlist, layout, campaign] }
      - { $ref: "#/components/parameters/ResourceID" }
      - name: fromPublicationId
        in: query
        required: true
        schema: { type: string, format: uuid }
      - name: toPublicationId
        in: query
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: comparePublications
      description: >-
        Compare publications. Requires an authenticated dashboard user.
      responses:
        "200":
          description: Semantic publication differences
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required:
                      [fromPublicationId, toPublicationId, changed, changes]
                    properties:
                      fromPublicationId: { type: string, format: uuid }
                      toPublicationId: { type: string, format: uuid }
                      changed: { type: boolean }
                      changes:
                        type: array
                        items: { $ref: "#/components/schemas/SemanticChange" }
        "404": { description: Publication not found }
  /api/v1/content-history/{type}/{id}/publications/{publicationId}/restore-draft:
    parameters:
      - name: type
        in: path
        required: true
        schema: { type: string, enum: [playlist, layout, campaign] }
      - { $ref: "#/components/parameters/ResourceID" }
      - name: publicationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: restorePublicationAsDraft
      description: >-
        Restore publication as draft. Requires an authenticated dashboard user.
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "200":
          description: Historical snapshot copied to the working draft; live state is unchanged
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/EditorialSnapshot" }
        "422": { description: Historical snapshot no longer validates }
  /api/v1/content-history/{type}/{id}/publications/{publicationId}/rollback:
    parameters:
      - name: type
        in: path
        required: true
        schema: { type: string, enum: [playlist, layout, campaign] }
      - { $ref: "#/components/parameters/ResourceID" }
      - name: publicationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: rollbackPublication
      description: >-
        Rollback publication. Requires an authenticated dashboard user.
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "201":
          description: Historical snapshot published as a new publication
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    {
                      $ref: "#/components/schemas/ContentSubmissionPublication",
                    }
        "202":
          description: Rollback submitted for review
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    {
                      $ref: "#/components/schemas/ContentSubmissionPublication",
                    }
        "409": { description: Review or concurrency conflict }
  /api/v1/campaigns:
    get:
      operationId: listCampaigns
      description: >-
        List campaigns. Requires an authenticated dashboard user.
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - {
            in: query,
            name: pageSize,
            schema: { type: integer, minimum: 1, maximum: 100 },
          }
      responses:
        "200":
          description: Campaign library
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [items, total, page, pageSize]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Campaign" }
                      total: { type: integer, minimum: 0 }
                      page: { type: integer }
                      pageSize: { type: integer }
    post:
      operationId: createCampaign
      description: >-
        Create campaign. Requires an authenticated dashboard user.
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignDetailsRequest" }
      responses:
        "201":
          description: Campaign draft created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Campaign" }
  /api/v1/campaigns/{id}:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    get:
      operationId: getCampaign
      description: >-
        Get campaign. Requires an authenticated dashboard user.
      responses:
        "200":
          description: Campaign draft and lifecycle state
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Campaign" }
    delete:
      operationId: archiveCampaign
      description: >-
        Archive campaign. Requires an authenticated dashboard user.
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses: { "204": { description: Campaign archived } }
  /api/v1/campaigns/{id}/draft:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    patch:
      operationId: updateCampaignDraft
      description: >-
        Update campaign draft. Requires an authenticated dashboard user.
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignDraftRequest" }
      responses:
        "200":
          description: Campaign draft saved
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Campaign" }
        "409": { description: Draft revision conflict }
        "422": { description: Campaign shape invalid }
  /api/v1/campaigns/{id}/preflight:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    get:
      operationId: preflightCampaign
      description: >-
        Preflight campaign. Requires an authenticated dashboard user.
      responses:
        "200":
          description: Readiness, target, revision, and schedule preflight
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/CampaignPreflight" }
  /api/v1/campaigns/{id}/releases:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    get:
      operationId: listCampaignReleases
      description: >-
        List campaign releases. Requires an authenticated dashboard user.
      responses:
        "200":
          description: Immutable Campaign release history
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/CampaignRelease" }
  /api/v1/campaigns/{id}/releases/{releaseId}/restore:
    parameters:
      - { $ref: "#/components/parameters/ResourceID" }
      - name: releaseId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: restoreCampaignRelease
      description: >-
        Restore campaign release. Requires an authenticated dashboard user.
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "200":
          description: Release copied into the working Campaign draft
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Campaign" }
  /api/v1/campaigns/{id}/publish:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    post:
      operationId: publishCampaign
      description: Publishes one immutable Campaign release by atomically materializing ordinary scheduler rows; Players do not receive a Campaign type.
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedDraftRevision]
              properties:
                expectedDraftRevision:
                  { type: integer, format: int64, minimum: 1 }
      responses:
        "201":
          description: Campaign release published atomically
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    {
                      $ref: "#/components/schemas/ContentSubmissionPublication",
                    }
        "202":
          description: Campaign release submitted for review
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ContentSubmission" }
        "409": { description: Root revision or draft conflict }
        "422": { description: Preflight failed }
  /api/v1/takeovers:
    get:
      description: >-
        Requires an authenticated dashboard user.
      operationId: listTakeovers
      summary: List Takeovers
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      responses:
        "200":
          description: Takeover list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/TakeoverList" }
        "401": { description: Dashboard authentication required }
    post:
      description: >-
        Requires an authenticated dashboard user. Activating a takeover
        is immediate and disruptive; when the organization requires
        reauthentication, the current account password travels in the
        body and a wrong one answers 401.
      operationId: createTakeover
      summary: Activate a Takeover
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, playlistId, expiresAt]
              properties:
                name: { type: string, minLength: 1, maxLength: 180 }
                description: { type: string, maxLength: 2000 }
                playlistId: { type: string, format: uuid }
                screenIds:
                  type: array
                  items: { type: string, format: uuid }
                groupIds:
                  type: array
                  items: { type: string, format: uuid }
                expiresAt: { type: string, format: date-time }
                password:
                  type: string
                  description: >-
                    Current account password, only when the organization
                    requires reauthentication for takeovers.
      responses:
        "201":
          description: Takeover activated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/TakeoverActivation" }
        "401": { description: Dashboard authentication required }
        "422": { description: "Invalid targets, playlist, or expiration" }
  /api/v1/takeovers/{id}:
    get:
      description: >-
        Requires an authenticated dashboard user.
      operationId: getTakeover
      summary: Read Takeover and per-screen state
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          description: Takeover detail
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/TakeoverDetail" }
        "401": { description: Dashboard authentication required }
        "404": { description: Takeover not found }
  /api/v1/takeovers/{id}/cancel:
    post:
      description: >-
        Requires an authenticated dashboard user.
      operationId: cancelTakeover
      summary: Cancel an active Takeover
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: Takeover cancelled
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/TakeoverCancellation" }
        "401": { description: Dashboard authentication required }
        "409": { description: Takeover already ended }
  /api/v1/presentation-networks:
    get:
      operationId: listPresentationNetworks
      summary: List Presentation Networks
      description: >-
        Owner and Administrator read. Responses include only redacted network
        metadata and credentialSet; encrypted credentials and plaintext secrets
        are never returned to Studio.
      responses:
        "200":
          description: Presentation Networks and supported authentication types
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationNetworkListResponse"
        "403": { description: Owner or Administrator access is required }
    post:
      operationId: createPresentationNetwork
      summary: Create a Presentation Network
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresentationNetworkCreateInput"
      responses:
        "201":
          description: Network created; the credential is accepted but not returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationNetworkResponse"
        "403": { description: Insufficient role or CSRF failure }
        "409":
          {
            description: Encryption key unavailable or network name already exists,
          }
        "422":
          {
            description: "Network, authentication, or credential validation failed",
          }
  /api/v1/presentation-networks/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      description: >-
        Requires an authenticated dashboard user.
      operationId: getPresentationNetwork
      summary: Read a redacted Presentation Network and its assignments
      responses:
        "200":
          description: Network metadata and assigned Linux screens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationNetworkDetailResponse"
        "403": { description: Owner or Administrator access is required }
        "404": { description: Presentation Network not found }
    patch:
      operationId: updatePresentationNetwork
      summary: Update a Presentation Network
      description: >-
        The secret field is write-only. Omitting it retains the saved
        credential; providing a new value rotates it and increments
        configRevision. No response contains the secret or ciphertext.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresentationNetworkUpdateInput"
      responses:
        "200":
          description: Redacted network after the update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationNetworkResponse"
        "403": { description: Insufficient role or CSRF failure }
        "404": { description: Presentation Network not found }
        "409":
          {
            description: Encryption key unavailable or stored credential unreadable,
          }
        "422":
          {
            description: "Network, authentication, or credential validation failed",
          }
    delete:
      operationId: deletePresentationNetwork
      summary: Delete a Presentation Network
      description: Assignments cascade and affected screens receive a durable configuration bump.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: Deleted redacted network
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationNetworkResponse"
        "403": { description: Insufficient role or CSRF failure }
        "404": { description: Presentation Network not found }
  /api/v1/presentation-networks/{id}/screens:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    put:
      operationId: replacePresentationNetworkAssignments
      summary: Replace the Linux screen assignments for a Presentation Network
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresentationNetworkAssignmentsInput"
      responses:
        "200":
          description: Exact assignment set after replacement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationNetworkAssignmentsResponse"
        "403":
          {
            description: "Insufficient role, CSRF failure, or screen outside scope",
          }
        "404": { description: Presentation Network or screen not found }
        "422": { description: Screen is not Linux or assignment limit exceeded }
  /api/v1/presentation-networks/{id}/test:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    post:
      operationId: testPresentationNetwork
      summary: Queue a bounded Presentation Network connection test
      description: >-
        The selected assigned Linux player joins and leaves the network without
        starting AirPlay. The durable command contains only the network ID and
        timeout; credentials are fetched separately by the authenticated player.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresentationNetworkTestInput"
      responses:
        "202":
          description: Connection test command queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationNetworkTestResponse"
        "403":
          {
            description: "Insufficient role, CSRF failure, or screen outside scope",
          }
        "404": { description: Presentation Network or screen not found }
        "409":
          {
            description: Encryption key unavailable or AirPlay is active on the screen,
          }
        "422": { description: Screen is not the assigned Linux player }
  /api/v1/screens/{id}/presentation-network:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      operationId: getScreenPresentationNetwork
      summary: Read a Linux screen's Presentation Network readiness
      description: >-
        Requires an authenticated dashboard session. Readiness is server-derived from the assignment and the player's
        reported helper, NetworkManager, Wi-Fi, revision, and connection facts.
      responses:
        "200":
          description: Assignment and operator-facing readiness state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationNetworkReadinessResponse"
        "403": { description: Screen is outside the caller's scope }
        "404": { description: Screen not found }
    put:
      operationId: assignScreenPresentationNetwork
      summary: Assign one Presentation Network to a Linux screen
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreenPresentationNetworkInput"
      responses:
        "200":
          description: Assignment after replacement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationNetworkAssignmentResponse"
        "403":
          {
            description: "Insufficient role, CSRF failure, or screen outside scope",
          }
        "404": { description: Screen or Presentation Network not found }
        "422": { description: Screen is not Linux }
    delete:
      operationId: unassignScreenPresentationNetwork
      summary: Remove a screen's Presentation Network assignment
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: Screen assignment after removal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationNetworkAssignmentResponse"
        "403":
          {
            description: "Insufficient role, CSRF failure, or screen outside scope",
          }
        "404": { description: Screen not found }
  /api/v1/player/presentation-network:
    get:
      operationId: getPlayerPresentationNetwork
      summary: Fetch the assigned network provisioning material
      description: >-
        Device-authenticated only. The server derives the assignment from the
        authenticated screen and accepts no network ID. The response is marked
        Cache-Control: no-store and contains the plaintext credential only for
        the player to build its temporary NetworkManager profile.
      security:
        - deviceBearer: []
      responses:
        "200":
          description: Assigned network and credential; never log or persist this response
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Pragma:
              schema: { type: string, const: no-cache }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationNetworkProvisioningResponse"
        "401":
          {
            description: "Permanent player credential missing, invalid, or revoked",
          }
        "404": { description: Authenticated screen has no assignment }
        "409":
          {
            description: Stored credential cannot be decrypted with the configured key,
          }
        "503":
          { description: Presentation Network encryption key is not configured }
  /api/v1/presentation-overrides:
    get:
      description: >-
        Requires an authenticated dashboard user.
      operationId: listPresentationOverrides
      summary: List active Quick Present sessions
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      responses:
        "200":
          description: Active temporary presentation overrides
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [items, total]
                    properties:
                      items:
                        type: array
                        items:
                          { $ref: "#/components/schemas/PresentationOverride" }
                      total: { type: integer, minimum: 0 }
        "401": { description: Dashboard authentication required }
    post:
      description: >-
        Requires an authenticated dashboard user.
      operationId: createPresentationOverride
      summary: Start Quick Present
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresentationOverrideInput"
      responses:
        "201":
          description: Quick Present started
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PresentationOverride" }
        "401": { description: Dashboard authentication required }
        "409":
          {
            description: Destination conflicts with AirPlay or another temporary presentation,
          }
        "422": { description: Destination or content validation failed }
  /api/v1/presentation-overrides/{id}/stop:
    post:
      description: >-
        Requires an authenticated dashboard user.
      operationId: stopPresentationOverride
      summary: Stop Quick Present
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
                  description: >-
                    Defaults to "Stopped from Studio" when empty.
      responses:
        "200":
          description: Quick Present stopped
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PresentationOverride" }
        "401": { description: Dashboard authentication required }
        "404": { description: Quick Present is no longer active }
  /api/v1/screens/{id}/commands:
    parameters:
      - { $ref: "#/components/parameters/ResourceID" }
    get:
      description: >-
        Requires an authenticated dashboard user.
      operationId: listScreenCommands
      summary: List recent screen commands
      responses:
        "200":
          description: Command history
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PlayerCommandList" }
    post:
      operationId: sendScreenCommand
      summary: Queue a typed operational, Display Control, or bounded player-recovery command
      description: >-
        Display Control command types are display_power_on,
        display_power_off, display_set_input, display_set_volume,
        display_mute, display_unmute, display_set_brightness, and
        display_probe. They are capability-gated by the target Player.
        A Browser Player runs only `sync_now`, `reload_playback`,
        `identify_screen`, `retry_current_item` and `skip_current_item`; any
        other command type for a Browser Screen is refused with
        `command_not_supported_by_player`.
        Requires an Owner or Administrator with the write scope.
        Cookie-authenticated unsafe requests require X-CSRF-Token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlayerCommandRequest" }
      responses:
        "202":
          description: Command queued
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/QueuedPlayerCommand" }
        "422":
          description: >-
            The payload is invalid (`command_invalid_payload`), or the Screen's
            player cannot run this command type
            (`command_not_supported_by_player`).
        "429": { description: Pending command limit reached }
  /api/v1/player/commands:
    get:
      description: >-
        Requires an authenticated player credential.
      operationId: listPlayerCommands
      summary: Retrieve executable commands for the authenticated player
      responses:
        "200":
          description: Stable command list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DevicePlayerCommandList" }
  /api/v1/player/commands/{id}/acknowledge:
    parameters:
      - { $ref: "#/components/parameters/ResourceID" }
    post:
      description: >-
        Requires an authenticated player credential.
      operationId: acknowledgePlayerCommand
      summary: Acknowledge a player command
      responses:
        "200":
          description: Command acknowledged
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    { $ref: "#/components/schemas/PlayerCommandStateUpdate" }
  /api/v1/player/commands/{id}/result:
    parameters:
      - { $ref: "#/components/parameters/ResourceID" }
    post:
      description: >-
        Requires an authenticated player credential.
      operationId: reportPlayerCommandResult
      summary: Report a safe command result
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlayerCommandResultRequest" }
      responses:
        "200":
          description: Result accepted idempotently
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    { $ref: "#/components/schemas/PlayerCommandStateUpdate" }
        "409": { description: Command expired or cancelled }
  /api/v1/settings:
    get:
      operationId: getSettings
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires an authenticated user with the read scope. Reads the
        typed organization settings document with its registry and
        revision.
      responses:
        "200":
          description: Settings document and registry
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SettingsDocument" }
        "401": { description: Dashboard authentication required }
    patch:
      operationId: updateSettings
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires the Owner or Administrator role with the write scope.
        Cookie requests additionally require the X-CSRF-Token header;
        Bearer grants never send it. Applies only the given keys
        against the expected revision; a stale revision fails with 409 and
        changes nothing.
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsUpdate" }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SettingsDocument" }
        "401": { description: Dashboard authentication required }
        "403": { description: Owner or Administrator and CSRF token required }
        "409": { description: Settings revision conflict }
        "422": { description: "Unknown, invalid, or hard-limit setting" }
  /api/v1/me/preferences:
    get:
      operationId: getPreferences
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires an authenticated user with the read scope. Reads the calling
        user's own preferences.
      responses:
        "200":
          description: Preference document
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SettingsDocument" }
        "401": { description: Dashboard authentication required }
    patch:
      operationId: updatePreferences
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires an authenticated user with the write scope. Cookie requests
        additionally require the X-CSRF-Token header; Bearer grants never send
        it. Updates the calling user's own preferences against the expected
        revision.
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsUpdate" }
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SettingsDocument" }
        "401": { description: Dashboard authentication required }
        "403": { description: CSRF token required }
        "409": { description: Revision conflict }
  /api/v1/screen-groups/{id}/policy:
    get:
      operationId: getGroupPolicy
      description: "Requires an authenticated dashboard user."
      summary: Read group player policy
      parameters: [{ $ref: "#/components/parameters/ResourceID" }]
      responses:
        "200":
          description: Group policy
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PolicyDocument" }
    put:
      operationId: putGroupPolicy
      description: "Requires an authenticated dashboard user."
      summary: Replace typed group policy
      parameters: [{ $ref: "#/components/parameters/ResourceID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyUpdate" }
      responses:
        "200":
          description: Updated policy
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PolicyDocument" }
        "409": { description: Revision conflict }
    delete:
      {
        description: "Requires an authenticated dashboard user.",

        operationId: deleteGroupPolicy,

        summary: Reset group policy,
        parameters: [{ $ref: "#/components/parameters/ResourceID" }],
        responses: { "204": { description: Policy reset } },
      }
  /api/v1/screens/{id}/policy:
    parameters:
      - { $ref: "#/components/parameters/ResourceID" }
    get:
      operationId: getScreenPolicy
      description: "Requires an authenticated dashboard user."
      summary: Read screen player policy
      responses:
        "200":
          description: Screen policy
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PolicyDocument" }
    put:
      operationId: putScreenPolicy
      description: "Requires an authenticated dashboard user."
      summary: Replace typed screen policy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyUpdate" }
      responses:
        "200":
          description: Updated policy
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PolicyDocument" }
    delete:
      {
        description: "Requires an authenticated dashboard user.",

        operationId: deleteScreenPolicy,

        summary: Reset screen policy,
        responses: { "204": { description: Policy reset } },
      }
  /api/v1/screens/{id}/effective-policy:
    get:
      operationId: getEffectivePolicy
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires an authenticated user with the read scope. Reports the effective
        player policy for one screen with inheritance sources. A screen
        outside the caller's scope answers 404.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
      responses:
        "200":
          description: Effective policy
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/EffectivePolicy" }
        "401": { description: Dashboard authentication required }
        "404": { description: Screen unknown or outside caller scope }
  /api/v1/screens/{id}/reliability:
    get:
      description: "Requires an authenticated dashboard user."
      operationId: getScreenReliability
      summary: "Read commissioning, zero-touch readiness, Android reliability, and Power Assist state"
      parameters: [{ $ref: "#/components/parameters/ResourceID" }]
      responses:
        "200":
          description: Capability and effective-state diagnostics
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    additionalProperties: true
                    type: object
                    description: >-
                      Player-reported diagnostics bag. Fields vary by
                      player state and caller role (managers see package
                      details viewers do not); every field is optional.
                      A Browser Player's facts are under `browser`
                      (`BrowserPlayerStatus`), which is null for every
                      other player.
        "404": { description: Screen not found }
  /api/v1/screens/{id}/power-assist:
    put:
      description: "Requires an authenticated dashboard user."
      operationId: setScreenPowerAssist
      summary: "Store administrator-confirmed sleep, wake, CEC, input, and startup test results"
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PowerAssistInput" }
      responses:
        "200":
          description: Confirmation stored
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PowerAssistConfirmation" }
        "403": { description: Owner or Administrator required }
        "404": { description: Screen not found }
        "422": { description: Invalid result state }
  /api/v1/player/config:
    get:
      description: Requires an authenticated player credential.
      operationId: getPlayerConfig
      summary: Retrieve effective player configuration
      responses:
        "200":
          description: Versioned player config
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PlayerConfig" }
        "304": { description: Not modified }
  /api/v1/system/status:
    get:
      operationId: systemStatus
      description: >-
        Requires the Owner or Administrator role and an enrolled dashboard
        session. Secret-free system diagnostics: migration version,
        database, connectivity, and queue depths.
      responses:
        "200":
          description: Secret-free status
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SystemStatus" }
        "401": { description: Dashboard authentication required }
        "403": { description: Owner or Administrator required }
  /api/v1/system/maintenance/{action}:
    post:
      description: Requires an authenticated dashboard user.
      operationId: runSystemMaintenance
      summary: Run a fixed safe maintenance action
      parameters: [{ $ref: "#/components/parameters/MaintenanceAction" }]
      responses:
        "202":
          description: Action accepted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/MaintenanceResult" }
        "422": { description: Unsupported action }
  /api/v1/system/settings/export:
    get:
      description: Requires an authenticated dashboard user.
      operationId: exportSettings
      summary: Export non-secret settings
      responses:
        "200":
          description: Versioned settings export
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SettingsExport" }
  /api/v1/system/settings/import/preview:
    post:
      description: Requires an authenticated dashboard user.
      operationId: previewSettingsImport
      summary: Validate settings import without applying
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsExport" }
      responses:
        "200":
          description: Import preview
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SettingsImportPreview" }
        "422": { description: Invalid import }
  /api/v1/system/settings/import/apply:
    post:
      description: Requires an authenticated dashboard user.
      operationId: applySettingsImport
      summary: Apply confirmed settings import
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsExport" }
      responses:
        "200":
          description: Import applied
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SettingsDocument" }
        "409": { description: Revision conflict }
  /api/v1/player-releases:
    get:
      description: >-
        Requires an authenticated dashboard user.
      operationId: listPlayerReleases
      summary: List fixed-repository Tilecast Player releases and verification state
      responses:
        "200":
          description: Release list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PlayerReleaseList" }
  /api/v1/player-releases/check:
    post:
      description: >-
        Requires an authenticated dashboard user.
      operationId: checkPlayerRelease
      summary: Check Gibsonmb71/tilecast GitHub Releases
      responses:
        "200":
          description: Check completed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PlayerReleaseCheck" }
        "502": { description: GitHub or verification failure }
  /api/v1/player-releases/github/device:
    post:
      description: >-
        Requires an authenticated dashboard user.
      operationId: startGitHubDeviceFlow
      summary: Start Owner-authorized GitHub OAuth device flow
      responses:
        "201":
          description: One-time user code and verification URL
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/GitHubDeviceStart" }
        "503": { description: GitHub OAuth client ID is not configured }
  /api/v1/player-releases/github/device/poll:
    post:
      description: >-
        Requires an authenticated dashboard user.
      operationId: pollGitHubDeviceFlow
      summary: Poll an active GitHub OAuth device flow
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GitHubDevicePollRequest" }
      responses:
        "200":
          description: "Pending, connected, denied, or expired state"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/GitHubDevicePoll" }
        "410": { description: Device flow expired or was not found }
        "502": { description: GitHub authorization failure }
  /api/v1/player-releases/github:
    delete:
      description: >-
        Requires an authenticated dashboard user.
      operationId: disconnectGitHub
      summary: Remove a device-authorized GitHub credential from Tilecast Server
      responses:
        "204": { description: Local GitHub credential removed }
        "409": { description: Authentication is managed by environment token }
  /api/v1/player-releases/upload:
    post:
      operationId: uploadPlayerRelease
      summary: Upload and verify a signed Tilecast Player release bundle
      description: >-
        Accepts one release's three files as multipart files: the artifact, the
        signed update manifest and its signature. The file names select the
        family: `tilecast-player.apk` with `tilecast-player-update.json`
        (Android), `tilecast-player.AppImage` with
        `tilecast-player-update-linux.json` (Electron Linux), or
        `tilecast-edge-<version>-<arch>.tar.zst` with the signed envelope
        `tilecast-edge-update.json` (Tilecast Edge), or
        `tilecast-windows-<version>-<arch>.msix` with the signed envelope
        `tilecast-windows-update.json` (Windows Player). Owner session plus CSRF or
        a configured release-publishing bearer token is required.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 3
                  maxItems: 3
                  items: { type: string, format: binary }
      responses:
        "201":
          description: Release fully verified and cached
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      platform:
                        {
                          type: string,
                          x-extensible-enum: [android, linux, windows],
                        }
                      playerFamily:
                        { $ref: "#/components/schemas/PlayerFamily" }
                      architecture:
                        type: string
                        description: "`x86_64` or `aarch64` for Tilecast Edge and Windows Player; empty for the other families."
                      source: { enum: [upload, github] }
                      versionCode: { type: integer }
                      versionName: { type: string }
                      channel: { enum: [stable, beta] }
                      apkSizeBytes:
                        {
                          type: integer,
                          description: "The artifact size, for every family.",
                        }
                      duplicate: { type: boolean }
        "401": { description: Invalid publishing token }
        "413": { description: Upload exceeds configured limits }
        "422": { description: Missing file or verification failure }
  /api/v1/player-releases/{id}/cache:
    parameters:
      - { $ref: "#/components/parameters/ResourceID" }
    post:
      description: >-
        Requires an authenticated dashboard user.
      operationId: cachePlayerRelease
      summary: Download and verify a signed Player APK into private cache
      responses:
        "202":
          description: Verification started
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    { $ref: "#/components/schemas/PlayerReleaseCacheResult" }
        "409": { description: Release cannot be cached }
  /api/v1/update-deployments:
    get:
      description: >-
        Requires an authenticated dashboard user.
      operationId: listUpdateDeployments
      summary: List Player update deployments, narrowed to the caller's screen scope
      responses:
        "200":
          description: Deployment list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/UpdateDeploymentList" }
    post:
      description: >-
        Requires an authenticated dashboard user.
      operationId: createUpdateDeployment
      summary: Create a deduplicated screen and group deployment with an optional canary cohort
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDeploymentRequest" }
      responses:
        "201":
          description: Deployment created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/UpdateDeploymentCreated" }
        "403": { description: Targets outside the caller's screen scope }
        "422": { description: Invalid or unverified release/targets }
  /api/v1/update-deployments/{id}:
    parameters:
      - { $ref: "#/components/parameters/ResourceID" }
    get:
      description: >-
        Requires an authenticated dashboard user.
      operationId: getUpdateDeployment
      summary:
        Read the deployment header, release artifact size, and per-screen update
        state for the screens in the caller's scope
      responses:
        "200":
          description: Deployment detail
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/UpdateDeploymentDetail" }
        "404":
          description: "Scoped callers only - unknown or reaching no screen in scope"
  /api/v1/update-deployments/{id}/cancel:
    parameters:
      - { $ref: "#/components/parameters/ResourceID" }
    post:
      description: >-
        Requires an authenticated dashboard user.
      operationId: cancelUpdateDeployment
      summary: Cancel pending update work on every screen the deployment reaches
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    { $ref: "#/components/schemas/UpdateDeploymentCancelled" }
        "403": { description: Reaches screens outside the caller's scope }
        "404":
          description: "Scoped callers only - unknown or reaching no screen in scope"
        "409":
          description: "Already complete, or unknown to an unscoped caller"
  /api/v1/update-deployments/{id}/screens/{screenId}/retry:
    parameters:
      - { $ref: "#/components/parameters/ResourceID" }
      - in: path
        name: screenId
        required: true
        schema: { type: string, format: uuid }
    post:
      description: >-
        Requires an authenticated dashboard user.
      operationId: retryUpdateDeploymentScreen
      summary: Retry a failed screen update idempotently
      responses:
        "202":
          description: Retry queued
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/RetryUpdateQueued" }
        "404": { description: Screen outside the caller's scope }
        "409": { description: Retry not allowed }
  /api/v1/player/updates/{releaseId}:
    parameters:
      - in: path
        name: releaseId
        required: true
        schema: { type: string }
    get:
      description: >-
        Requires an authenticated player credential.
      operationId: getPlayerUpdate
      summary: Get targeted verified Player update metadata
      responses:
        "200":
          description: Update metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PlayerUpdateMetadata" }
        "404": { description: Not targeted }
  /api/v1/player/updates/{releaseId}/artifact:
    parameters:
      - in: path
        name: releaseId
        required: true
        schema: { type: string }
    get:
      operationId: downloadPlayerUpdateArtifact
      summary: Download or resume the authenticated cached release artifact
      security: [{ deviceBearer: [] }]
      description: >-
        The artifact of every family (the AppImage, the APK or the Tilecast
        Edge archive), with `Accept-Ranges: bytes`, a strong `ETag` of its
        SHA-256, and range requests. Only a screen targeted by an active
        deployment of the release may read it.
      responses:
        "200":
          description: Complete artifact
          content:
            application/vnd.android.package-archive:
              schema: { type: string, format: binary }
            application/octet-stream:
              schema: { type: string, format: binary }
            application/zstd:
              schema: { type: string, format: binary }
        "206":
          description: Artifact byte range
          content:
            application/vnd.android.package-archive:
              schema: { type: string, format: binary }
            application/octet-stream:
              schema: { type: string, format: binary }
            application/zstd:
              schema: { type: string, format: binary }
        "403": { description: Screen is not targeted }
        "404": { description: Verified artifact unavailable }
        "416": { description: Invalid range }
    head:
      operationId: headPlayerUpdateArtifact
      description: >-
        Inspect the authenticated cached release artifact without
        downloading it. Requires an authenticated player credential.
      security: [{ deviceBearer: [] }]
      parameters:
        - in: path
          name: releaseId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Artifact metadata }
        "401": { description: Credential invalid or revoked }
        "403": { description: Screen is not targeted }
  /api/v1/player/updates/{releaseId}/apk:
    parameters:
      - in: path
        name: releaseId
        required: true
        schema: { type: string }
    head:
      description: >-
        Requires an authenticated player credential.
      operationId: headPlayerUpdateApk
      summary: Inspect authenticated APK range metadata
      responses:
        {
          "200": { description: APK metadata },
          "403": { description: Screen is not targeted },
        }
    get:
      description: >-
        Requires an authenticated player credential.
      operationId: downloadPlayerUpdateApk
      summary: Download or resume authenticated cached APK
      responses:
        "200":
          description: Complete APK
          content:
            application/vnd.android.package-archive:
              schema: { type: string, format: binary }
            application/octet-stream:
              schema: { type: string, format: binary }
            application/zstd:
              schema: { type: string, format: binary }
        "206":
          description: APK byte range
          content:
            application/vnd.android.package-archive:
              schema: { type: string, format: binary }
            application/octet-stream:
              schema: { type: string, format: binary }
            application/zstd:
              schema: { type: string, format: binary }
        "416": { description: Invalid range }
  /api/v1/player/update-deployments/{deploymentId}/status:
    parameters:
      - in: path
        name: deploymentId
        required: true
        schema: { type: string, format: uuid }
    post:
      description: >-
        Requires an authenticated player credential.
      operationId: reportPlayerUpdateStatus
      summary: Report bounded Player update preparation and installer status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [state]
              properties:
                state:
                  enum:
                    [
                      downloading,
                      downloaded,
                      verifying,
                      ready,
                      waiting_for_permission,
                      waiting_for_user,
                      installing,
                      reconnecting,
                      failed,
                      succeeded,
                    ]
                  description: >-
                    `succeeded` is accepted only for a Tilecast Edge release: it
                    is the screen's explicit confirmation that the provisional
                    release passed its health checks, and the only way an Edge
                    target settles. Other families settle from the heartbeat.
                downloadedBytes: { type: integer, minimum: 0 }
                permissionStatus: { type: string, maxLength: 64 }
                installerStatus:
                  type: string
                  maxLength: 64
                  description: >-
                    Tilecast Edge sends `provisional` with `reconnecting`,
                    `confirmed` with `succeeded`, and `rolled_back` with a
                    `failed` report of a release that was activated and then
                    rolled back.
                error:
                  type: string
                  maxLength: 240
                  description: A bounded reason code, never free text from a server response.
      responses:
        "200":
          description: Status accepted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/UpdateStateReport" }
        "409": { description: Deployment cancelled or complete }
        "422":
          description: "Invalid status, or `succeeded` for a release that is not Tilecast Edge"
components:
  parameters:
    PluginID:
      in: path
      name: pluginId
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9_]{0,79}$" }
      description: Registry identifier such as countdown_bar.
    PackageID:
      in: path
      name: packageId
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9_.:-]{0,127}$" }
      description: Store package identifier such as countdown_bar.
    ResourceID:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    MaintenanceAction:
      in: path
      name: action
      required: true
      schema:
        type: string
        enum:
          - expired-upload-cleanup
          - completed-command-cleanup
          - retention-cleanup
          - reconcile-config
          - validate-media
      description: Fixed safe maintenance action accepted by the server.
    CSRFToken:
      in: header
      name: X-CSRF-Token
      required: false
      schema: { type: string }
      description: Cookie-backed browser requests only, and only on unsafe methods. Bearer grants never send it.
  securitySchemes:
    browserPlayerSession:
      type: apiKey
      in: cookie
      name: __Host-tilecast_player
      description: >-
        Independent Secure HttpOnly SameSite Strict Browser Player session.
        The cookie name has the prefix __Host-tilecast_player_ followed by
        the slot UUID. HTTP requests select the slot with
        X-Tilecast-Player-Slot. The WebSocket uses the non-secret browserSlot
        query parameter. Does not authorize Studio or native platform administration.
    deviceBearer:
      type: http
      scheme: bearer
      bearerFormat: Tilecast device credential
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: Tilecast user grant (tca_ OAuth access token or tcp_ personal access token)
    sessionCookie:
      type: apiKey
      in: cookie
      name: tilecast_session
      description: Enrolled dashboard session cookie
  schemas:
    BrowserPublicKey:
      type: object
      additionalProperties: false
      required: [kty, crv, x, y, ext, key_ops]
      properties:
        kty: { type: string, const: EC }
        crv: { type: string, const: P-256 }
        x: { type: string, minLength: 43, maxLength: 43 }
        y: { type: string, minLength: 43, maxLength: 43 }
        ext: { type: boolean }
        key_ops:
          type: array
          minItems: 1
          maxItems: 1
          items: { type: string, const: verify }
    BrowserRegistration:
      type: object
      additionalProperties: false
      required: [installationId, publicKey]
      properties:
        installationId: { type: string, format: uuid }
        publicKey: { $ref: "#/components/schemas/BrowserPublicKey" }
    BrowserRecoveryRequest:
      type: object
      additionalProperties: false
      required:
        [slotId, serverInstallationId, recoverySecret, registration, metadata]
      properties:
        slotId: { type: string, format: uuid }
        serverInstallationId: { type: string, format: uuid }
        recoverySecret:
          { type: string, minLength: 43, maxLength: 43, writeOnly: true }
        registration: { $ref: "#/components/schemas/BrowserRegistration" }
        metadata: { $ref: "#/components/schemas/DeviceMetadata" }
    BrowserEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [pairingSessionId, enrollmentToken, registration]
      properties:
        pairingSessionId: { type: string, format: uuid }
        enrollmentToken: { type: string, writeOnly: true }
        registration: { $ref: "#/components/schemas/BrowserRegistration" }
    BrowserBindingRequest:
      type: object
      additionalProperties: false
      required: [slotId, bindingId]
      properties:
        slotId: { type: string, format: uuid }
        bindingId: { type: string, format: uuid }
    BrowserRenewalRequest:
      type: object
      additionalProperties: false
      required: [slotId, bindingId, nonce, signature]
      properties:
        slotId: { type: string, format: uuid }
        bindingId: { type: string, format: uuid }
        nonce: { type: string, minLength: 43, maxLength: 43 }
        signature: { type: string, minLength: 86, maxLength: 86 }
    BrowserChallenge:
      type: object
      additionalProperties: false
      required: [nonce, message, expiresAt]
      properties:
        nonce: { type: string, minLength: 43, maxLength: 43 }
        message:
          type: string
          description: The complete text the device key signs, `tilecast-browser-player-v1:<slotId>:<bindingId>:<nonce>`. Signing the nonce alone is rejected.
        expiresAt: { type: string, format: date-time }
    BrowserSession:
      type: object
      additionalProperties: false
      required: [slotId, bindingId, screenId, screenName, epoch, expiresAt]
      properties:
        slotId: { type: string, format: uuid }
        bindingId: { type: string, format: uuid }
        screenId: { type: string, format: uuid }
        screenName: { type: string }
        epoch: { type: integer, format: int64, minimum: 1 }
        expiresAt: { type: string, format: date-time }
    BrowserSessionResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/BrowserSession" }
    BrowserSlot:
      type: object
      required: [id, screenId, recoveryEnabled]
      properties:
        id: { type: string, format: uuid }
        screenId: { type: string, format: uuid }
        recoveryEnabled: { type: boolean }
        lastRecoveredAt: { type: string, format: date-time }
    BrowserLaunchResponse:
      type: object
      required: [data]
      properties:
        data:
          allOf:
            - { $ref: "#/components/schemas/BrowserSlot" }
            - type: object
              required: [recoverySecret]
              properties:
                recoverySecret: { type: string, maxLength: 43 }
    BrowserScreenRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        locationId: { type: string, format: uuid }
        roomName: { type: string, maxLength: 120 }
        roomNumber: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 1000 }
    BrowserPlayerStatus:
      type: object
      additionalProperties: false
      description: >-
        Facts only a Browser Player can measure. A Browser Player also reports
        the generic reliability fields where their meaning matches:
        `foregroundState` (`foreground`, `background`, `frozen` or
        `recovering`), `immersiveModeActive` (the effective unattended
        presentation: fullscreen or an installed app), `keepScreenOn`,
        `activeHoursState` (`active` or `off_hours`) and
        `cachedFallbackAvailable`. Every value is a measurement. The server
        draws the health conclusions. The Browser Player sends no
        identifier that could single out one browser.
      properties:
        browserName:
          type: string
          enum: [chrome, edge, chromium, other]
        browserMajorVersion: { type: integer, minimum: 0, maximum: 9999 }
        displayMode:
          type: string
          description: >-
            `standalone_pwa` when the page runs as an installed app, otherwise
            `browser_tab`.
          enum: [browser_tab, standalone_pwa]
        fullscreenActive: { type: boolean }
        audioUnlocked:
          type: boolean
          description: Whether the browser allows audible playback now.
        wakeLock:
          type: string
          enum: [active, released, denied, unsupported]
        storagePersistence:
          type: string
          description: >-
            `persistent` only when the browser said so. `best_effort` means
            the browser may remove downloaded content under storage pressure.
          enum: [persistent, best_effort, unknown]
        storageUsageBytes: { type: integer, format: int64, minimum: 0 }
        storageQuotaBytes: { type: integer, format: int64, minimum: 0 }
        offlineContent:
          type: string
          enum: [ready, repairing, not_prepared]
        serviceWorker:
          type: string
          enum: [controlling, update_waiting, installing, unavailable]
        serviceWorkerVersion: { type: string, maxLength: 64 }
        wasDiscarded:
          type: boolean
          description: >-
            True when the browser discarded this page and the Player
            restarted it.
    AirplaySessionScreenState:
      type: object
