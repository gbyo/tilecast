  /api/v1/airplay/sessions:
    post:
      operationId: createAirplaySession
      description: >-
        Start a temporary AirPlay Present session on a screen or screen
        group. Requires an Owner or Administrator with the write scope.
        Cookie-authenticated unsafe requests require X-CSRF-Token.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetType, targetId]
              properties:
                targetType: { type: string, enum: [screen, group] }
                targetId: { type: string, format: uuid }
                durationMinutes: { type: integer, enum: [15, 30, 60] }
                transport: { type: string, enum: [auto, unicast, multicast] }
                audioMode: { type: string, enum: [gateway_only, none] }
      responses:
        "202": { description: AirPlay session accepted }
        "400": { description: Invalid request body }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role or screen scope }
        "409": { description: Selected displays already have an active session }
        "422":
          { description: "Target, duration, transport, or readiness invalid" }
  /api/v1/airplay/sessions/{id}:
    get:
      operationId: getAirplaySession
      description: >-
        Get an AirPlay Present session. Requires an authenticated dashboard
