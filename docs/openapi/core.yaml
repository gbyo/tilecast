  /api/v1/playlists/{id}:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    get:
      operationId: getPlaylist
      description: "Get playlist. Requires an authenticated dashboard user."
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      responses:
        "200":
          description: Playlist and ordered items
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Playlist" }
