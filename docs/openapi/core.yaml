  /api/v1/screens/{id}/playback-plan:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    get:
      operationId: getScreenPlaybackPlan
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Inspect expected presentation selection for one Screen. Requires the
        read scope and access to the Screen. Omit at to use captured server time.
        Instants before captured server time use recorded expected playback
        windows. Historical gaps do not use current configuration. Current and
        future instants evaluate current configuration in one read-only snapshot.
        Reported capability and synchronization evidence describes current state,
        including for future predictions. This endpoint does not prove actual play.
      parameters:
        - in: query
          name: at
          description: One RFC 3339 instant with a time zone. Duplicate, empty, invalid, and unknown query parameters are rejected.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Expected selection or explicit historical evidence gap
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PlaybackPlan" }
        "400":
          description: invalid_playback_plan_instant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackPlanError" }
        "401": { description: Management authentication required }
        "403": { description: Grant lacks the read scope }
        "404":
          {
            description: "Invalid Screen ID, screen_not_found, or Screen outside account scope",
          }
        "409":
          description: playback_expectation_ambiguous; recorded windows overlap
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackPlanError" }
  /api/v1/screens/{id}/playlist-assignment:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
