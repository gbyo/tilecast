          backgroundColor,
          failureBehavior,
          createdAt,
          updatedAt,
        ]
      properties:
        url: { type: string }
        displayUrl: { type: string }
        allowedHosts:
          type: array
          items: { type: string }
        javascriptEnabled: { type: boolean }
        domStorageEnabled: { type: boolean }
        cookiePolicy:
          { type: string, enum: [disabled, first_party, first_and_third_party] }
        reloadPolicy:
          { type: string, enum: [load_once, on_each_activation, interval] }
        refreshIntervalSeconds: { type: integer, minimum: 1 }
        loadTimeoutSeconds: { type: integer }
        zoomPercent: { type: integer }
        scrollX: { type: integer }
        scrollY: { type: integer }
        customUserAgent: { type: string }
        backgroundColor: { type: string }
        failureBehavior:
          {
            type: string,
            enum: [last_success, placeholder, fallback_image, skip],
          }
        fallbackImageAssetId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AssetList:
      type: object
      additionalProperties: false
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Asset" }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
    BulkAssetResult:
      type: object
      additionalProperties: false
      required: [updated]
      properties:
        updated: { type: integer, minimum: 0 }
    SetupRequest:
      type: object
      additionalProperties: false
      required: [organizationName, ownerName, username, password]
      properties:
        organizationName: { type: string, minLength: 2, maxLength: 120 }
        ownerName: { type: string, minLength: 2, maxLength: 120 }
        username: { type: string, minLength: 3, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 1024 }
    OAuthDecision:
      type: object
      additionalProperties: false
      required: [client, redirectUri, scope, challenge]
      properties:
        client: { type: string }
        redirectUri: { type: string, format: uri }
        scope: { type: string }
        state: { type: string }
        challenge: { type: string }
        method:
          type: string
          description: S256, or omitted. The Server rejects any other value.
    OAuthTokenRequest:
      type: object
      additionalProperties: false
      required: [grant_type]
      properties:
        grant_type: { type: string, enum: [authorization_code, refresh_token] }
        client_id: { type: string }
        code: { type: string }
        redirect_uri: { type: string, format: uri }
        code_verifier: { type: string }
        refresh_token: { type: string }
    IOSSessionRequest:
      type: object
      additionalProperties: false
      required: [grant_type, client_id]
      properties:
        grant_type: { type: string, enum: [authorization_code, refresh_token] }
        client_id: { type: string, enum: [tilecast-ios] }
        code: { type: string, description: "authorization_code only." }
        redirect_uri:
          {
            type: string,
            format: uri,
            description: "authorization_code only: tilecast-ios://oauth/callback.",
          }
        code_verifier: { type: string, description: "authorization_code only." }
        refresh_token: { type: string, description: "refresh_token only." }
        studio_session:
          type: boolean
          default: false
          description: >-
            refresh_token only. Also start a new Studio session and set its
            cookie, replacing the grant's earlier session. An
            authorization_code exchange always sets the cookie.
    IOSSession:
      # Open, like OAuthTokens: the app decodes this bootstrap before it
      # knows the server's version, so a later server may add properties
      # without breaking installed apps.
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
          description: Whether the response set a Studio session cookie.
        credential:
          $ref: "#/components/schemas/OAuthTokens"
          description: >-
            The grant's native credential. A server released before native
            API access omits it, and the app then uses Studio only.
    OAuthApprovalClient:
      type: object
      additionalProperties: false
      required: [name, clientId]
      properties:
        name: { type: string }
        clientId: { type: string }
    OAuthApprovalScope:
      type: object
      additionalProperties: false
      required: [scope, description]
      properties:
        scope: { type: string, enum: [read, write, admin] }
        description: { type: string }
    OAuthApproval:
      type: object
      additionalProperties: false
      required: [client, scopes, redirectUri, state]
      properties:
        client: { $ref: "#/components/schemas/OAuthApprovalClient" }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/OAuthApprovalScope" }
        redirectUri: { type: string, format: uri }
        state: { type: string }
    OAuthRedirect:
      type: object
      additionalProperties: false
      required: [redirectUri]
      properties:
        redirectUri: { type: string, format: uri }
    OAuthTokens:
      # Open: native clients decode it, and a later server may add
      # properties to a token issuance.
      type: object
      required: [access_token, refresh_token, token_type, expires_at]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_at: { type: string, format: date-time }
    PasskeyRegistrationOptions:
      type: object
      additionalProperties: false
      required: [challengeToken, options]
      properties:
        challengeToken: { type: string }
        options:
          additionalProperties: true
          type: object
          description: >-
            WebAuthn public-key credential creation options for
            navigator.credentials.create(), serialized with base64url binary
            fields. Consumed by the platform authenticator rather than field
            by field.
    OAuthGrant:
      type: object
      additionalProperties: false
      required: [id, client, scopes, createdAt, lastUsedAt, revokedAt]
      properties:
        id: { type: string, format: uuid }
        client: { type: string }
        scopes:
          type: array
          items: { type: string, enum: [read, write, admin] }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
    OAuthGrantList:
      type: object
      additionalProperties: false
      required: [grants]
      properties:
        grants:
          type: array
          items: { $ref: "#/components/schemas/OAuthGrant" }
    PersonalAccessToken:
      type: object
      additionalProperties: false
      required: [id, name, scopes, createdAt, expiresAt, lastUsedAt, revokedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scopes:
          type: array
          items: { type: string, enum: [read, write, admin] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
    PersonalAccessTokenList:
      type: object
      additionalProperties: false
      required: [pats]
      properties:
        pats:
          type: array
          items: { $ref: "#/components/schemas/PersonalAccessToken" }
    PersonalAccessTokenCreated:
      type: object
      additionalProperties: false
      required: [token, pat]
      properties:
        token:
          type: string
          description: Plaintext secret returned exactly once; never listed again.
        pat: { $ref: "#/components/schemas/PersonalAccessToken" }
    InstallationIdentity:
      type: object
      additionalProperties: false
      required:
        [product, apiVersion, installationId, organizationName, pairingEnabled]
      properties:
        product: { type: string, example: tilecast }
        apiVersion: { type: string, example: v1 }
        installationId: { type: string, format: uuid }
        organizationName: { type: string }
        pairingEnabled: { type: boolean }
    DeviceMetadata:
      type: object
      additionalProperties: false
      required:
        [
          playerInstallationId,
          platform,
          manufacturer,
          model,
          androidVersion,
          playerVersion,
          screenWidth,
          screenHeight,
          density,
          locale,
          timezone,
        ]
      properties:
        playerInstallationId: { type: string, format: uuid }
        platform: { type: string, minLength: 1, maxLength: 120 }
        manufacturer: { type: string, minLength: 1, maxLength: 120 }
        model: { type: string, minLength: 1, maxLength: 120 }
        androidVersion: { type: string, minLength: 1, maxLength: 120 }
        playerVersion: { type: string, minLength: 1, maxLength: 120 }
        screenWidth: { type: integer, minimum: 1, maximum: 16384 }
        screenHeight: { type: integer, minimum: 1, maximum: 16384 }
        density: { type: number, minimum: 0.5, maximum: 10 }
        locale: { type: string, minLength: 1, maxLength: 120 }
        timezone: { type: string, minLength: 1, maxLength: 120 }
        approximateAddress: { type: string }
    PairingSessionCreated:
      type: object
      additionalProperties: false
      required:
        [
          id,
          code,
          pollSecret,
          expiresAt,
          serverTime,
          pollingIntervalSeconds,
          approvalUrl,
          organizationName,
        ]
      properties:
        id: { type: string, format: uuid }
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: "^[2-9A-HJ-KM-NP-Z]{6}$"
          description: Visible six-character pairing code shown to the installer.
        pollSecret:
          type: string
          description: Private poll secret for Authorization Pairing polling. Never use the visible code to poll.
        expiresAt: { type: string, format: date-time }
        serverTime: { type: string, format: date-time }
        pollingIntervalSeconds: { type: integer, minimum: 1 }
        approvalUrl: { type: string }
        organizationName: { type: string }
    PairingSessionPoll:
      type: object
      additionalProperties: false
      required: [status, expiresAt]
      properties:
        status: { type: string, enum: [pending, claimed, expired, rejected] }
        expiresAt: { type: string, format: date-time }
        screenId: { type: string, format: uuid }
        enrollmentToken:
          type: string
          description: One-time enrollment token, present only on the first approved poll.
        failureReason: { type: string }
    EnrollmentResult:
      type: object
      additionalProperties: false
      required: [screenId, screenName, deviceCredential]
      properties:
        screenId: { type: string, format: uuid }
        screenName: { type: string }
        deviceCredential:
          type: string
          description: Permanent device credential, returned exactly once.
    HeartbeatAccepted:
      type: object
      additionalProperties: false
      required: [accepted]
      properties:
        accepted: { type: boolean }
        ignoredFields:
          type: array
          items: { type: string }
          description: Optional playback identifiers that were malformed and therefore dropped.
    LivenessAccepted:
      type: object
      additionalProperties: false
      required: [accepted]
      properties:
        accepted: { type: boolean }
    PairingRequest:
      type: object
      additionalProperties: false
      required:
        [
          id,
          status,
          metadata,
          createdAt,
          expiresAt,
          previouslyPaired,
          hasActiveCredential,
          credentialReplacementAuthorized,
          pairingMode,
        ]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, approved, rejected] }
        metadata: { $ref: "#/components/schemas/DeviceMetadata" }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        previouslyPaired: { type: boolean }
        existingScreenId: { type: string, format: uuid }
        existingScreenName: { type: string }
        hasActiveCredential: { type: boolean }
        credentialReplacementAuthorized: { type: boolean }
        pairingMode:
          type: string
          enum: [new_screen, hardware_replacement, credential_repair]
    PendingPairingList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PairingRequest" }
        total: { type: integer, minimum: 0 }
    ScreenStatus:
      type: string
      x-extensible-enum:
        [online, recent, stale, offline, disabled, revoked, awaiting_player]
      description: >-
        The Server-computed Screen status. `awaiting_player` is a Browser
        Player Screen whose managed launch link has not been used yet. The set
        grows with new Player kinds; clients must tolerate values they do not
        recognize.
    ScreenLocation:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          addressLine1,
          addressLine2,
          city,
          state,
          postalCode,
          country,
          screenCount,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        addressLine1: { type: string }
        addressLine2: { type: string }
        city: { type: string }
        state: { type: string }
        postalCode: { type: string }
        country: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        screenCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MapCoordinates:
      type: object
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    ScreenMapPosition:
      type: object
      additionalProperties: false
      required: [latitude, longitude, source]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        source: { type: string, enum: [screen, location] }
    Screen:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          description,
          location,
          roomName,
          roomNumber,
          platform,
          deviceManufacturer,
          deviceModel,
          androidVersion,
          playerVersion,
          screenWidth,
          screenHeight,
          density,
          locale,
          timezone,
          enabled,
          pairedAt,
          status,
          hasActiveCredential,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        location: { type: string }
        locationId: { type: string, format: uuid }
        locationDetails: { $ref: "#/components/schemas/ScreenLocation" }
        roomName: { type: string }
        roomNumber: { type: string }
        mapPositionOverride: { $ref: "#/components/schemas/MapCoordinates" }
        mapPosition: { $ref: "#/components/schemas/ScreenMapPosition" }
        syncGroupId: { type: string, format: uuid }
        syncGroupName: { type: string }
        nowPlayingName: { type: string }
        nowPlayingType: { type: string }
        platform: { type: string }
        deviceManufacturer: { type: string }
        deviceModel: { type: string }
        androidVersion: { type: string }
        playerVersion: { type: string }
        playerVersionCode: { type: integer, format: int64 }
        androidSdk: { type: integer }
        installerSource: { type: string }
        installPermissionStatus: { type: string }
        currentUpdateDeploymentId: { type: string, format: uuid }
        updateState: { type: string }
        updateDownloadedBytes: { type: integer, format: int64 }
        updateExpectedBytes: { type: integer, format: int64 }
        updateError: { type: string }
        playerFamily: { type: string }
        playerArchitecture: { type: string }
        screenWidth: { type: integer }
        screenHeight: { type: integer }
        density: { type: number, format: float }
        locale: { type: string }
        timezone: { type: string }
        availableStorageBytes: { type: integer, format: int64 }
        uptimeSeconds: { type: integer, format: int64 }
        enabled: { type: boolean }
        pairedAt: { type: string, format: date-time }
        lastConnectedAt: { type: string, format: date-time }
        lastDisconnectedAt: { type: string, format: date-time }
        lastHeartbeatAt: { type: string, format: date-time }
        lastKnownIp: { type: string }
        lastContactAt: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/ScreenStatus" }
        hasActiveCredential: { type: boolean }
        archivedAt: { type: string, format: date-time }
        archivedReason: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ScreenList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Screen" }
        total: { type: integer, minimum: 0 }
    Location:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          addressLine1,
          addressLine2,
          city,
          state,
          postalCode,
          country,
          screenCount,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        addressLine1: { type: string }
        addressLine2: { type: string }
        city: { type: string }
        state: { type: string }
        postalCode: { type: string }
        country: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        screenCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LocationList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Location" }
        total: { type: integer, minimum: 0 }
    User:
      type: object
      additionalProperties: false
      required: [id, name, username, role, active, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        username: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: string, format: date-time }
    UserRole:
      type: string
      enum: [owner, administrator, editor, contributor, viewer]
    ManagedUser:
      type: object
      additionalProperties: false
      required:
        [id, name, username, role, active, createdAt, mfaEnrolled, mfaRequired]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        username: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: [string, "null"], format: date-time }
        mfaEnrolled: { type: boolean }
        mfaRequired: { type: boolean }
    ManagedUserList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ManagedUser" }
        total: { type: integer, minimum: 0 }
    ScreenScope:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type: { type: string, enum: [location, group] }
        id: { type: string, format: uuid }
        name: { type: string }
    ScreenScopeList:
      type: object
      additionalProperties: false
      required: [scopes, wholeFleet]
      properties:
        scopes:
          type: array
          items: { $ref: "#/components/schemas/ScreenScope" }
        wholeFleet: { type: boolean }
    AuthStatus:
      type: object
      additionalProperties: false
      required: [setupRequired, authenticated, passkeysAvailable]
      properties:
        setupRequired: { type: boolean }
        authenticated: { type: boolean }
        passkeysAvailable: { type: boolean }
        passkeysUnavailableReason: { type: string }
        demoMode: { type: boolean }
        user: { $ref: "#/components/schemas/User" }
        csrfToken: { type: string }
        authMethod:
          type: string
          enum: [password, totp, passkey, recovery_code, demo, pat, oauth]
          description: >-
            The factor that completed the session sign-in, or pat or oauth
            when the caller authenticated with a bearer grant.
        mfaEnrollmentRequired: { type: boolean }
    SettingsUpdate:
      type: object
      additionalProperties: false
      required: [revision, values]
      properties:
        revision: { type: integer, format: int64, minimum: 0 }
        values: { type: object, additionalProperties: true }
    SettingDefinition:
      type: object
      additionalProperties: false
      required:
        [
          key,
          category,
          type,
          title,
          default,
          scope,
          sensitive,
          restartRequired,
          immediate,
          futureOnly,
        ]
      properties:
        key: { type: string }
        category: { type: string }
        type: { type: string }
        title: { type: string }
        description: { type: string }
        documentation: { type: string }
        default: {}
        min: { type: number }
        max: { type: number }
        allowed:
          type: array
          items: { type: string }
        scope: { type: string, enum: [organization, policy, preference] }
        sensitive: { type: boolean }
        restartRequired: { type: boolean }
        immediate: { type: boolean }
        futureOnly: { type: boolean }
    SettingsDocument:
      type: object
      additionalProperties: false
      description: >-
        Versioned organization or preference document. Definitions always
        ride along; callers never merge a second read to render titles.
      required: [schemaVersion, revision, values, definitions, updatedAt]
      properties:
        schemaVersion: { type: integer, minimum: 1 }
        revision: { type: integer, format: int64, minimum: 0 }
        values: { type: object, additionalProperties: true }
        definitions:
          type: array
          items: { $ref: "#/components/schemas/SettingDefinition" }
        updatedAt: { type: string, format: date-time }
    PolicyDocument:
      type: object
      additionalProperties: false
      required: [schemaVersion, revision, values, updatedAt]
      properties:
        schemaVersion: { type: integer, minimum: 1 }
        revision: { type: integer, format: int64, minimum: 0 }
        priority: { type: integer, minimum: 0 }
        values: { type: object, additionalProperties: true }
        updatedAt: { type: string, format: date-time }
    EffectivePolicyValue:
      type: object
      additionalProperties: false
      required: [value, source]
      properties:
        value: {}
        source: { type: string }
        sourceId: { type: string, format: uuid }
    EffectivePolicy:
      type: object
      additionalProperties: false
      description: >-
        Effective player policy for one screen with inheritance sources.
      required:
        [
          values,
          organizationRevision,
          groupRevisions,
          screenRevision,
          configRevision,
          hash,
        ]
      properties:
        values:
          type: object
          additionalProperties:
            { $ref: "#/components/schemas/EffectivePolicyValue" }
        organizationRevision: { type: integer, format: int64, minimum: 0 }
        groupRevisions:
          type: object
          additionalProperties: { type: integer, format: int64 }
        screenRevision: { type: integer, format: int64, minimum: 0 }
        configRevision: { type: integer, format: int64, minimum: 0 }
        hash: { type: string }
    LoginBackground:
      type: object
      additionalProperties: false
      required: [imageUrl]
      properties:
        assetId:
          type: [string, "null"]
          format: uuid
          description: >-
            Chosen image asset, or null when no background is set and the
            login page falls back to its default artwork.
        imageUrl: { type: string }
