        "201":
          description: Resumable upload session created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/UploadSession" }
        "413": { description: Upload exceeds the configured maximum }
        "507": { description: Reserved free storage would be violated }
  /api/v1/uploads/{id}:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
