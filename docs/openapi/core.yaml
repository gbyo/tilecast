    post:
      operationId: stopAirplaySession
      description: >-
        Stop an AirPlay Present session. Requires an Owner or Administrator
        with the write scope. Cookie-authenticated unsafe requests require
        X-CSRF-Token.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 120 }
      responses:
        "200": { description: AirPlay session stopped }
        "400": { description: Invalid request body }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role or screen scope }
        "404": { description: AirPlay session not found }
        "422": { description: Stop reason too long }
  /api/v1/users:
    get:
      operationId: listUsers
      description: >-
        List dashboard user accounts. Requires an Owner or Administrator
        with the admin scope.
      responses:
        "200": { description: User accounts with MFA enrollment state }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
    post:
      operationId: createUser
      description: >-
        Create a dashboard user account. Requires an Owner or Administrator
        with the admin scope. Only an Owner may create Owner or
        Administrator accounts. Cookie-authenticated unsafe requests require
        X-CSRF-Token.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, username, password, role]
              properties:
                name: { type: string }
                username: { type: string }
                password: { type: string }
                role:
                  type: string
                  enum: [owner, administrator, editor, contributor, viewer]
                active: { type: boolean }
      responses:
        "201": { description: User account created }
        "400": { description: Invalid request body }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
        "409": { description: Username already in use }
        "422":
          description: >-
            Name, username, password, or role invalid
  /api/v1/users/{id}:
    patch:
      operationId: updateUser
      description: >-
        Update a dashboard user account. Requires an Owner or Administrator
        with the admin scope. Cookie-authenticated unsafe requests require
        X-CSRF-Token.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                username: { type: string }
                password: { type: string }
                role:
                  type: string
                  enum: [owner, administrator, editor, contributor, viewer]
                active: { type: boolean }
      responses:
        "200": { description: User account updated }
        "400": { description: Invalid request body }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
        "404": { description: User not found }
        "409":
          { description: "Username in use, self-deactivation, or last Owner" }
        "422":
          description: >-
            Name, username, password, or role invalid
    delete:
      operationId: deleteUser
      description: >-
        Deactivate a dashboard user account. Requires an Owner or
        Administrator with the admin scope. Cookie-authenticated unsafe
        requests require X-CSRF-Token.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        "204": { description: User account deactivated }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
        "404": { description: User not found }
        "409": { description: Cannot deactivate self or the last Owner }
