openapi: 3.1.0
info:
  title: Tilecast API
  version: 0.10.0
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
  description: >-
    Management authentication accepts either an enrolled dashboard session
    cookie or a bearer user grant (an OAuth access token or a personal
    access token), and both produce the same user principal with the live
    role and screen scope. Grants additionally carry a scope ceiling of
    read, write, or admin (admin implies write implies read): reads take
    read, mutations take write, and user, token, grant, backup, and
    security administration take admin. CSRF is cookie-only: unsafe
    browser requests require X-CSRF-Token, bearer requests never send it.
    Browser security ceremonies (MFA, passkeys, logout, OAuth approval)
    stay session-only.
paths:
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          description: Server process is running
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [status, service]
                    properties:
                      status: { type: string, enum: [ok] }
                      service: { type: string, enum: [tilecast-server] }
  /install.sh:
    get:
      operationId: installLinuxPlayerScript
      description: Public. Rate-limited Linux Player provisioning script with this server's URL embedded.
      responses:
        "200":
          description: Shell installer
          content:
            text/x-shellscript:
              schema: { type: string }
  /install-airplay.sh:
    get:
      operationId: installAirPlayScript
      description: Public. Rate-limited AirPlay provisioning script with this server's URL embedded.
      responses:
        "200":
          description: Shell installer
          content:
            text/x-shellscript:
              schema: { type: string }
  /install/tilecast-player.service:
    get:
      operationId: installLinuxPlayerService
      responses:
        "200":
          description: Managed systemd user-service template
          content:
            text/plain:
              schema: { type: string }
  /readyz:
    get:
      operationId: ready
      responses:
        "200":
          description: Server and database are ready
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [status]
                    properties:
                      status: { type: string, enum: [ready] }
        "503": { description: Database is unavailable }
  /api/v1/install/linux:
    get:
      operationId: installableLinuxPlayerRelease
      description: >-
        Public. Read the cached Linux player release metadata.
      responses:
        "200":
          description: Latest stable, verified, cached Linux Player release metadata
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    {
                      $ref: "#/components/schemas/InstallableLinuxPlayerRelease",
                    }
        "404": { description: No installable Linux Player release is cached }
  /api/v1/install/linux/artifact:
    get:
      operationId: installableLinuxPlayerArtifact
      description: >-
        Public. Download the verified Linux player AppImage.
      responses:
        "200":
          description: Verified Linux Player AppImage
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { description: No installable Linux Player release is cached }
    head:
      operationId: headInstallableLinuxPlayerArtifact
      description: >-
        Public. Inspect the verified Linux player AppImage without downloading it.
      responses:
        "200": { description: Verified Linux Player AppImage metadata }
        "404": { description: No installable Linux Player release is cached }
  /api/v1/install/airplay/uxplay:
    get:
      operationId: installableUxPlayArtifact
      description: Public. Rate-limited, pinned UxPlay 1.73.6 source archive embedded in Tilecast Server.
      responses:
        "200":
          description: Verified UxPlay 1.73.6 source archive
          content:
            application/gzip:
              schema: { type: string, format: binary }
    head:
      operationId: headInstallableUxPlayArtifact
      description: >-
        Public. Inspect the pinned UxPlay artifact without downloading it.
      responses:
        "200": { description: Verified UxPlay 1.73.6 source archive metadata }
  /api/v1/install/airplay/uxplay.sha256:
    get:
      operationId: installableUxPlayChecksum
      description: >-
        Public. Read the pinned UxPlay artifact checksum.
      responses:
        "200":
          description: Pinned lowercase SHA-256 of the UxPlay source archive
          content:
            text/plain:
              schema: { type: string }
  /api/v1/auth/status:
    get:
      operationId: authStatus
      description: >-
        Public. Reports whether one-time setup is still required and, when a
        valid dashboard session cookie is present, the current user, their
        role, the CSRF token for unsafe browser requests, the auth method,
        and whether MFA enrollment is still pending. This is the current-user
        read for Studio and for future API clients.
      responses:
        "200":
          description: Installation state and, when authenticated, the current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthStatus" }
  /api/v1/demo:
    get:
      operationId: demoState
      description: >-
        Registered only when TILECAST_ENV is demo. Returns the seeded scenario
        and the state of each simulated player.
      responses:
        "200":
          description: Demo scenario and simulated player state
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DemoState" }
        "401": { description: Authentication required }
  /api/v1/demo/reset:
    post:
      operationId: resetDemo
      description: >-
        Registered only when TILECAST_ENV is demo. Replaces all data with a
        scenario and returns once its simulated players have connected.
        Requires the Owner role and X-CSRF-Token.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                scenario: { type: string, enum: [basic, kitchen-sink] }
      responses:
        "200":
          description: Scenario restored, with the new session CSRF token
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [state]
                    properties:
                      state: { $ref: "#/components/schemas/DemoState" }
                      csrfToken: { type: string }
        "403": { description: Owner role or CSRF token missing }
        "422": { description: Unknown scenario }
  /api/v1/auth/setup:
    post:
      operationId: initialSetup
      description: >-
        Public. Create the organization and initial Owner account during first-run setup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: Organization and owner created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SessionCreated" }
        "409": { description: Setup was already completed }
        "422": { description: Validation failed }
  /api/v1/auth/login:
    post:
      operationId: login
      description: >-
        Rate-limited. Exchange an enrolled account's credentials for a dashboard session.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: >-
            Signed in, or a multi-factor challenge when the account has a
            confirmed second factor. A challenge sets no session cookie.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/LoginResult" }
        "401": { description: Invalid credentials }
  /api/v1/auth/mfa/verify:
    post:
      operationId: verifyMultiFactor
      description: Completes a pending sign-in with an authenticator or recovery code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MultiFactorVerifyRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SessionCreated" }
        "401": { description: Incorrect code or expired challenge }
        "429": { description: Too many incorrect codes }
  /api/v1/auth/mfa/passkey/options:
    post:
      operationId: multiFactorPasskeyOptions
      description: Exchanges a pending challenge for a WebAuthn assertion request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeTokenRequest"
      responses:
        "200":
          description: Assertion options and a replacement challenge token
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    { $ref: "#/components/schemas/PasskeyAssertionChallenge" }
        "401": { description: Expired challenge }
        "404": { description: No passkey is enrolled }
        "409": { description: Passkeys are unavailable on this installation }
  /api/v1/auth/passkey/login/options:
    post:
      operationId: passkeyLoginOptions
      description: Public. Starts a discoverable, username-free WebAuthn ceremony.
      responses:
        "200":
          description: Assertion options and a challenge token
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    { $ref: "#/components/schemas/PasskeyAssertionChallenge" }
        "409": { description: Passkeys are unavailable on this installation }
  /api/v1/auth/passkey/login:
    post:
      operationId: passkeyLogin
      description: >-
        Posts the raw WebAuthn assertion. A verified passkey satisfies
        multi-factor authentication on its own.
      parameters:
        - in: header
          name: X-MFA-Challenge
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnAssertion"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SessionCreated" }
        "401": { description: The passkey could not be verified }
  /api/v1/me/security:
    get:
      operationId: securityStatus
      description: >-
        Security status. Requires an enrolled dashboard session.
      responses:
        "200":
          description: "Enrolled factors, passkeys, and policy state"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SecurityStatus" }
        "401": { description: Authentication required }
  /api/v1/me/security/totp:
    post:
      operationId: beginAuthenticatorEnrollment
      description: >-
        Begin authenticator enrollment. Requires an enrolled dashboard session.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Provisioning URI and typed secret
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/TOTPEnrollment" }
        "409": { description: An authenticator is already enrolled }
  /api/v1/me/security/totp/confirm:
    post:
      operationId: confirmAuthenticatorEnrollment
      description: >-
        Confirm authenticator enrollment. Requires an enrolled dashboard session.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthenticatorCodeRequest"
      responses:
        "200":
          description: Updated security state
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SecurityStatus" }
        "401": { description: Incorrect code }
        "404": { description: No pending enrollment }
  /api/v1/me/security/totp/remove:
    post:
      operationId: removeAuthenticator
      description: Requires the account password in the body.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirmation"
      responses:
        "204": { description: Authenticator removed }
        "403": { description: The password was not correct }
        "409": { description: Policy requires a remaining factor }
  /api/v1/me/security/recovery-codes:
    post:
      operationId: generateRecoveryCodes
      description: >-
        Replaces every unused code. Requires the account password. The plain
        codes are returned exactly once.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirmation"
      responses:
        "201":
          description: Ten new recovery codes
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/RecoveryCodes" }
        "403": { description: The password was not correct }
  /api/v1/me/security/passkeys/options:
    post:
      operationId: passkeyRegistrationOptions
      description: >-
        Passkey registration options. Requires an enrolled dashboard session.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Creation options and a challenge token
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    { $ref: "#/components/schemas/PasskeyRegistrationOptions" }
        "409": { description: Passkeys are unavailable on this installation }
  /api/v1/me/security/passkeys:
    post:
      operationId: registerPasskey
      description: >-
        The passkey is named from the authenticator's AAGUID; no name is
        accepted here. Use the rename endpoint to change it.
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
        - in: header
          name: X-MFA-Challenge
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnCredential"
      responses:
        "201":
          description: Passkey enrolled
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PasskeySummary" }
        "401": { description: The passkey could not be verified }
  /api/v1/me/security/passkeys/{id}:
    patch:
      operationId: renamePasskey
      description: >-
        Rename passkey. Requires an enrolled dashboard session.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyRenameRequest"
      responses:
        "204": { description: Passkey renamed }
        "404": { description: Passkey not found }
  /api/v1/me/security/passkeys/{id}/remove:
    post:
      operationId: removePasskey
      description: Requires the account password in the body.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirmation"
      responses:
        "204": { description: Passkey removed }
        "403": { description: The password was not correct }
        "409": { description: Policy requires a remaining factor }
  /api/v1/oauth/authorize:
    get:
      operationId: describeOAuthApproval
      description: >-
        Requires an enrolled dashboard session. Describes one first-party
        authorization request (client, scopes, redirect) for the approval
        screen. Stores nothing; approval revalidates the same parameters.
      parameters:
        - {
            in: query,
            name: client_id,
            required: true,
            schema: { type: string },
          }
        - {
            in: query,
            name: redirect_uri,
            required: true,
            schema: { type: string, format: uri },
          }
        - { in: query, name: scope, required: true, schema: { type: string } }
        - { in: query, name: state, required: false, schema: { type: string } }
        - {
            in: query,
            name: code_challenge,
            required: true,
            schema: { type: string },
          }
        - {
            in: query,
            name: code_challenge_method,
            required: false,
            description: "S256, or omitted. The Server rejects any other value.",
            schema: { type: string },
          }
      responses:
        "200":
          description: Approval description
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/OAuthApproval" }
        "400":
          description: >-
            Unknown client, redirect, scope, or challenge
        "401": { description: Dashboard authentication required }
  /api/v1/oauth/approve:
    post:
      operationId: approveOAuthRequest
      description: >-
        Browser ceremony: requires an enrolled dashboard session and the
        X-CSRF-Token header, and refuses bearer grants. Records the grant
        and returns the validated redirect carrying the single-use
        authorization code, the state, and iss (RFC 9207): the origin of the
        approval page as the browser reports it in Origin. A tilecast-ios
        approval without a usable Origin is refused instead of returning a
        redirect without iss.
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OAuthDecision" }
      responses:
        "200":
          description: Validated redirect carrying the code
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/OAuthRedirect" }
        "400":
          description: >-
            Unknown client, redirect, scope, or challenge
        "401": { description: Dashboard authentication required }
        "403": { description: CSRF token required }
  /api/v1/oauth/deny:
    post:
      operationId: denyOAuthRequest
      description: >-
        Requires an enrolled dashboard session and the X-CSRF-Token header.
        Records nothing and returns the redirect carrying access_denied, the
        state, and iss. A tilecast-ios denial without a usable Origin is
        refused instead of returning a redirect without iss.
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OAuthDecision" }
      responses:
        "200":
          description: Validated redirect carrying access_denied
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/OAuthRedirect" }
        "400": { description: The authorization request is not valid }
        "401": { description: Dashboard authentication required }
        "403": { description: CSRF token required }
  /api/v1/oauth/token:
    post:
      operationId: issueOAuthTokens
      description: >-
        Public and rate-limited. Exchanges a single-use code with its PKCE
        verifier, or rotates a refresh token. PKCE is the client
        authentication for loopback clients. Reusing a rotated refresh token
        revokes the whole grant.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OAuthTokenRequest" }
      responses:
        "200":
          description: Opaque access and refresh tokens
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/OAuthTokens" }
        "400":
          description: >-
            Expired, used, mismatched, or revoked grant
        "429": { description: Too many authentication attempts }
  /api/v1/oauth/ios-session:
    post:
      operationId: createIOSStudioSession
      description: >-
        Public and rate-limited. The Tilecast for iOS bootstrap. With
        authorization_code, exchanges a single-use code issued to
        tilecast-ios with its PKCE verifier and the callback
        tilecast-ios://oauth/callback, sets a normal HttpOnly Studio session
        cookie, and returns the grant's native credential. With
        refresh_token, rotates a tilecast-ios refresh token and sets a new
        Studio session cookie only when studio_session is true. When the
        session cannot start during a refresh, the rotated credential is
        still returned with authenticated false and no cookie. A refresh
        token of any other client is refused before it is consumed. The
        Studio session belongs to the grant: revoking the grant ends the
        session, and signing the session out revokes the grant. The app
        imports the cookie into the configured server's isolated WebKit data
        store and keeps the credential out of the web view.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IOSSessionRequest" }
      responses:
        "200":
          description: >-
            The native credential, and a Studio session cookie when
            authenticated is true
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/IOSSession" }
        "400":
          description: >-
            Invalid, expired, used, mismatched, or revoked code or refresh
            token, or a refresh token of another client
        "401": { description: The account is no longer active }
        "429": { description: Too many authentication attempts }
  /api/v1/oauth/revoke:
    post:
      operationId: revokeOAuthCredential
      description: >-
        Public. Rate-limited. Revokes the grant behind a presented access or
        refresh credential. The credential itself is the authorization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "204": { description: Grant revoked }
        "400": { description: Unknown token }
        "429": { description: Too many authentication attempts }
  /api/v1/me/security/grants:
    get:
      operationId: listOAuthGrants
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires an authenticated user with the admin scope. Lists the
        caller's authorization grants newest first, revoked included.
      responses:
        "200":
          description: Grant list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/OAuthGrantList" }
        "401": { description: Dashboard authentication required }
  /api/v1/me/security/grants/{id}:
    delete:
      operationId: revokeOAuthGrant
      description: >-
        Requires an authenticated user with the admin scope. Cookie
        requests additionally require the X-CSRF-Token header. Revokes
        one of the caller's grants and every token under it. Personal
        access tokens are revoked through this same endpoint.
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "204": { description: Grant revoked }
        "401": { description: Dashboard authentication required }
        "403": { description: CSRF token required }
        "404": { description: Grant unknown }
  /api/v1/me/security/pats:
    get:
      operationId: listPersonalAccessTokens
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires an authenticated user with the admin scope. Lists the
        caller's personal access tokens newest first with display metadata
        only — never secrets. Expired and revoked tokens stay listed until
        explicitly revoked. An optional search query filters by name,
        case-insensitively.
      parameters:
        - in: query
          name: search
          required: false
          schema: { type: string }
      responses:
        "200":
          description: PAT list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PersonalAccessTokenList" }
        "401": { description: Dashboard authentication required }
    post:
      operationId: createPersonalAccessToken
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      description: >-
        Requires an authenticated user with the admin scope. Cookie
        requests additionally require the X-CSRF-Token header. Creates
        a named personal access token with a fixed lifetime of 7, 30, 90,
        or 365 days; there is no permanent token. The plaintext secret
        (tcp_ prefix) is returned exactly once in this response and is
        never shown or listed again. Only SHA-256 hashes are stored.
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes, expiresInDays]
              properties:
                name: { type: string, maxLength: 100 }
                scopes:
                  type: array
                  items: { type: string, enum: [read, write, admin] }
                expiresInDays: { type: integer, enum: [7, 30, 90, 365] }
      responses:
        "201":
          description: PAT created with one-time secret
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    { $ref: "#/components/schemas/PersonalAccessTokenCreated" }
        "400":
          description: >-
            Invalid name, scopes, or lifetime
        "401": { description: Dashboard authentication required }
        "403": { description: CSRF token required }
