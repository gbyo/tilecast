          description: Set for kind component (docs/widgets-v2.md).
          required: [type, version, config, dataSources, media]
          properties:
            type: { type: string }
            version: { type: integer, minimum: 1 }
            config: { type: object, additionalProperties: true }
            dataSources:
              type: array
              items: { type: string }
            media:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [assetId, variantId]
                properties:
                  assetId: { type: string }
