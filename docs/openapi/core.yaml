        type: { type: string }
        version: { type: integer, minimum: 1 }
        tagName: { type: string }
        entrypoint: { type: string }
        configTemplate:
          additionalProperties: true
          type: object
          description: Release-owned component configuration template.
        dataSourceFields: { type: array, items: { type: string } }
        empty: { type: string, enum: [render, skip-eligible] }
    ContentDefinitionCompatibility:
      type: object
      additionalProperties: false
      required: [fallback]
      properties:
        fallback: { type: string, enum: [legacy, template, none] }
    ContentDefinitionAppRecipe:
      type: object
      additionalProperties: false
      required: [dataSource]
      properties:
        dataSource:
          type: object
          additionalProperties: false
          required: [provider, name, configurationTemplate]
          properties:
            provider: { type: string }
            name: { type: string }
            description: { type: string }
            configurationTemplate:
              additionalProperties: true
              type: object
              description: Release-owned Data Source configuration template.
    ContentDefinitionWebIntegration:
      type: object
      additionalProperties: false
      required: [urlField, transform]
      properties:
        urlField: { type: string }
        allowedHosts: { type: array, items: { type: string } }
        allowAnyHttpsHost: { type: boolean }
        requiredPathPrefix: { type: string }
        transform: { type: string }
        reloadIntervalField: { type: string }
        loadTimeoutSeconds: { type: integer, minimum: 0 }
        lifecycle: { type: string }
        warmSeconds: { type: integer, minimum: 0 }
        fallbackBehavior: { type: string }
    ContentWidgetDefinition:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          name,
          description,
          category,
          icon,
          runtime,
          configurationSchema,
          defaultConfiguration,
          presentationSchemaVersion,
          requiredCapabilities,
          emptyStateBehavior,
          deprecation,
        ]
      properties:
        id: { type: string }
        version: { type: integer, minimum: 1 }
        configVersion:
          type: integer
          minimum: 1
          description: Version of the persisted Widget configuration; omission means version 1.
        apiVersion: { type: integer, minimum: 1 }
        source: { $ref: "#/components/schemas/ContentExtensionSource" }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        icon: { type: string }
        thumbnail: { type: string }
        kind: { type: string, enum: [widget, app] }
        featured: { type: boolean }
        keywords: { type: array, items: { type: string } }
        availability:
          { $ref: "#/components/schemas/ContentDefinitionAvailability" }
        runtime: { type: string, enum: [native, web] }
        configurationSchema:
          { $ref: "#/components/schemas/ContentDefinitionConfigurationSchema" }
        defaultConfiguration:
          additionalProperties: true
          type: [object, "null"]
          description: Release-owned default Widget configuration.
        acceptedDataSourceKinds: { type: array, items: { type: string } }
        requiredFieldTypes:
          type: object
          additionalProperties: { type: string }
        presentationSchemaVersion: { type: integer, minimum: 1 }
        presentationTemplate:
          additionalProperties: true
          type: object
          description: Release-owned presentation template.
        presentationBase: { type: string }
        requiredCapabilities:
          type: object
          additionalProperties: { type: integer, minimum: 1 }
        emptyStateBehavior: { type: string }
        legacyEditor: { type: boolean }
        requiresManifestV13: { type: boolean }
        setup: { $ref: "#/components/schemas/ContentDefinitionSetup" }
        recipe: { $ref: "#/components/schemas/ContentDefinitionAppRecipe" }
        webIntegration:
          { $ref: "#/components/schemas/ContentDefinitionWebIntegration" }
        deprecation:
          { $ref: "#/components/schemas/ContentDefinitionDeprecation" }
        authoring: { $ref: "#/components/schemas/ContentDefinitionAuthoring" }
        component: { $ref: "#/components/schemas/ContentDefinitionComponent" }
        compatibility:
          { $ref: "#/components/schemas/ContentDefinitionCompatibility" }
    ContentDataSourceDefinition:
      type: object
      additionalProperties: false
      required:
        [
          id,
          version,
          name,
          description,
          category,
          icon,
          configurationSchema,
          defaultConfiguration,
          outputSchema,
          adapterId,
          refreshBehavior,
          deprecation,
        ]
      properties:
        id: { type: string }
        version: { type: integer, minimum: 1 }
        source: { $ref: "#/components/schemas/ContentExtensionSource" }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        icon: { type: string }
        configurationSchema:
          { $ref: "#/components/schemas/ContentDefinitionConfigurationSchema" }
        defaultConfiguration:
          additionalProperties: true
          type: [object, "null"]
          description: Release-owned default Data Source configuration.
        outputSchema:
          { $ref: "#/components/schemas/ContentDefinitionOutputSchema" }
        fetch: { $ref: "#/components/schemas/ContentDefinitionFetchSpec" }
        adapterId: { type: string }
        refreshBehavior: { type: string }
        attribution: { type: string }
        legacyEditor: { type: boolean }
        requiresManifestV13: { type: boolean }
        setup: { $ref: "#/components/schemas/ContentDefinitionSetup" }
        deprecation:
          { $ref: "#/components/schemas/ContentDefinitionDeprecation" }
    ContentDefinitionCatalog:
      type: object
      additionalProperties: false
