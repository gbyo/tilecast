      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: AirPlay session }
        "401": { description: Dashboard authentication required }
        "403": { description: Screen scope forbids this session }
        "404": { description: AirPlay session not found }
