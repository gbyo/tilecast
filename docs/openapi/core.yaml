  /api/v1/activity/retention:
    get:
      operationId: getActivityRetention
      description: >-
        Read the activity retention policy. Requires an Owner or
        Administrator with the read scope.
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      responses:
        "200": { description: Activity retention policy }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
    patch:
      operationId: updateActivityRetention
      description: >-
        Update the activity retention policy within deployment hard limits.
        Requires an Owner or Administrator with the write scope.
        Cookie-authenticated unsafe requests require X-CSRF-Token.
      security: [{ sessionCookie: [] }, { userBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rawEventDays: { type: integer, minimum: 7, maximum: 365 }
                playbackSessionDays:
                  { type: integer, minimum: 30, maximum: 2555 }
                screenStateDays: { type: integer, minimum: 30, maximum: 2555 }
                auditLogDays: { type: integer, minimum: 90, maximum: 3650 }
                diagnosticMetadataDays:
                  { type: integer, minimum: 7, maximum: 180 }
                telemetryRollupDays: { type: integer, minimum: 7, maximum: 400 }
      responses:
        "200": { description: Activity retention policy updated }
        "400": { description: Retention values invalid }
        "401": { description: Dashboard authentication required }
        "403": { description: Insufficient role }
        "422": { description: Retention values exceed hard limits }
